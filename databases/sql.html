<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>SQL Lab</title>
<meta name="description" content="An in-browser SQL IDE backed by SQLite compiled to WebAssembly." />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/hint/show-hint.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/sql/sql.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/hint/show-hint.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/hint/sql-hint.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/comment/comment.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/edit/matchbrackets.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/edit/closebrackets.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/selection/active-line.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/runmode/runmode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.10.3/sql-wasm.js"></script>
<style>
:root{
  --bg-0:#07070e;
  --bg-1:#0c0c18;
  --panel:#0f0f1d;
  --panel-2:#14142a;
  --surface:rgba(255,255,255,0.04);
  --surface-2:rgba(255,255,255,0.08);
  --border:rgba(255,255,255,0.09);
  --border-strong:rgba(255,255,255,0.18);
  --text:#eaeaf5;
  --text-dim:#9a9ab0;
  --text-faint:#666680;
  --accent:#7c5cff;
  --accent-2:#35d0ff;
  --sql:#4ce0a3;
  --warn:#ffb547;
  --err:#ff6b7a;
  --mono:'JetBrains Mono',ui-monospace,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{
  font-family:'Inter',system-ui,sans-serif;color:var(--text);background:var(--bg-0);
  display:flex;flex-direction:column;overflow:hidden;font-size:13.5px;
}
a{color:inherit;text-decoration:none}
button,select,input{font-family:inherit;color:inherit}
button{cursor:pointer}

/* ---------- top bar ---------- */
.topbar{
  display:flex;align-items:center;gap:10px;padding:10px 16px;flex-wrap:wrap;
  background:linear-gradient(180deg,#0e0e1c,#0a0a15);border-bottom:1px solid var(--border);
}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;margin-right:6px;white-space:nowrap}
.brand .dot{width:10px;height:10px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--sql));box-shadow:0 0 14px var(--sql)}
.brand small{font-family:var(--mono);font-weight:500;font-size:11px;color:var(--text-faint)}
.spacer{flex:1}
.btn{
  display:inline-flex;align-items:center;gap:7px;padding:7px 12px;border-radius:9px;font-size:12.5px;font-weight:600;
  background:var(--surface);border:1px solid var(--border);transition:background .15s,border-color .15s,transform .15s;white-space:nowrap;
}
.btn:hover{background:var(--surface-2);border-color:var(--border-strong)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:linear-gradient(135deg,#2bbf86,#1f9d6b);border-color:rgba(76,224,163,0.5);color:#04140d}
.btn.primary:hover{background:linear-gradient(135deg,#4ce0a3,#25b07a)}
.btn kbd{font-family:var(--mono);font-size:10px;opacity:.75;padding:1px 5px;border-radius:4px;background:rgba(0,0,0,0.18)}
.btn.icon{padding:7px 9px}
.sel{padding:7px 10px;border-radius:9px;background:var(--panel-2);border:1px solid var(--border);font-size:12.5px}
.sep{width:1px;height:22px;background:var(--border)}
#sidebarToggle{display:none}

/* ---------- layout ---------- */
.main{flex:1;display:flex;min-height:0}
.sidebar{
  width:290px;flex:none;display:flex;flex-direction:column;background:var(--panel);border-right:1px solid var(--border);min-height:0;
}
.stabs{display:flex;border-bottom:1px solid var(--border)}
.stabs button{flex:1;padding:10px 4px;background:none;border:none;border-bottom:2px solid transparent;color:var(--text-dim);font-size:12px;font-weight:600;letter-spacing:.04em}
.stabs button.on{color:var(--text);border-bottom-color:var(--sql)}
.spane{flex:1;overflow:auto;padding:10px 8px 20px;display:none}
.spane.on{display:block}
.spane h4{margin:14px 8px 6px;font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--text-faint);font-weight:700}
.spane h4:first-child{margin-top:4px}
.empty{color:var(--text-faint);font-size:12.5px;padding:8px}

.tbl{border-radius:8px;margin-bottom:2px}
.tbl-head{display:flex;align-items:center;gap:6px;padding:6px 8px;border-radius:8px;cursor:pointer;user-select:none}
.tbl-head:hover{background:var(--surface)}
.tbl-head .chev{width:12px;color:var(--text-faint);font-size:10px;transition:transform .15s}
.tbl.open .chev{transform:rotate(90deg)}
.tbl-head .ico{font-size:12px;color:var(--sql)}
.tbl-head .ico.view{color:var(--accent-2)}
.tbl-head .nm{font-family:var(--mono);font-size:12.5px;font-weight:600;flex:1;overflow:hidden;text-overflow:ellipsis}
.tbl-head .cnt{font-family:var(--mono);font-size:10.5px;color:var(--text-faint)}
.tbl-head .peek{opacity:0;border:none;background:var(--surface-2);border-radius:6px;padding:2px 7px;font-size:10px;color:var(--sql)}
.tbl-head:hover .peek{opacity:1}
.cols{display:none;padding:2px 0 6px 26px}
.tbl.open .cols{display:block}
.col{display:flex;align-items:center;gap:6px;padding:3px 8px;border-radius:6px;font-family:var(--mono);font-size:11.5px;cursor:pointer}
.col:hover{background:var(--surface)}
.col .cn{flex:1;color:#d6d6ea}
.col .ct{color:var(--text-faint);font-size:10.5px}
.col .k{font-size:9px;font-weight:700;padding:0 4px;border-radius:3px}
.col .k.pk{color:#ffd166;border:1px solid rgba(255,209,102,0.4)}
.col .k.fk{color:var(--accent-2);border:1px solid rgba(53,208,255,0.4)}
.misc{font-family:var(--mono);font-size:11.5px;color:var(--text-dim);padding:3px 10px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.ex-group{margin-bottom:6px}
.about-ds{margin:2px 4px 10px;padding:9px 11px;border-radius:9px;background:rgba(76,224,163,0.07);border:1px solid rgba(76,224,163,0.22);font-size:12px;line-height:1.5;color:var(--text-dim)}
.about-ds b{display:block;color:var(--text);font-size:12.5px;margin-bottom:2px}
.ex{display:block;width:100%;text-align:left;background:none;border:1px solid transparent;border-radius:8px;padding:7px 10px;margin:1px 0}
.ex:hover{background:var(--surface);border-color:var(--border)}
.ex b{display:block;font-size:12.5px;font-weight:600}
.ex span{display:block;font-size:11.5px;color:var(--text-faint);margin-top:2px;line-height:1.4}

.hist{display:block;width:100%;text-align:left;background:none;border:1px solid transparent;border-radius:8px;padding:7px 10px;margin:1px 0}
.hist:hover{background:var(--surface);border-color:var(--border)}
.hist code{display:block;font-family:var(--mono);font-size:11.5px;color:#d6d6ea;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hist small{display:flex;gap:8px;font-size:10.5px;color:var(--text-faint);margin-top:3px;font-family:var(--mono)}
.hist small .ok{color:var(--sql)} .hist small .bad{color:var(--err)}

/* ---------- work area ---------- */
.work{flex:1;display:flex;flex-direction:column;min-width:0;min-height:0}
.ebar{display:flex;align-items:stretch;background:var(--bg-1);border-bottom:1px solid var(--border);min-width:0}
.etabs{display:flex;align-items:stretch;flex:1;min-width:0;overflow-x:auto;scrollbar-width:thin}
.eacts{display:flex;align-items:center;gap:6px;padding:4px 8px;flex:none;border-left:1px solid var(--border)}
.eacts .btn{padding:5px 10px;font-size:12px}
.etab{display:flex;align-items:center;gap:8px;padding:8px 10px 8px 14px;border-right:1px solid var(--border);color:var(--text-dim);font-size:12.5px;cursor:pointer;white-space:nowrap;user-select:none;border-top:2px solid transparent}
.etab.on{background:var(--panel);color:var(--text);border-top-color:var(--sql)}
.etab .x{border:none;background:none;color:var(--text-faint);font-size:14px;line-height:1;padding:0 3px;border-radius:4px}
.etab .x:hover{background:var(--surface-2);color:var(--text)}
.etab-add{border:none;background:none;color:var(--text-dim);padding:0 14px;font-size:17px}
.etab-add:hover{color:var(--text)}
.editor{flex:0 0 46%;min-height:90px;position:relative;background:var(--panel)}
.editor .CodeMirror{position:absolute;inset:0;height:auto}

.splitter{flex:none;height:7px;cursor:row-resize;background:var(--bg-1);border-top:1px solid var(--border);border-bottom:1px solid var(--border);position:relative;touch-action:none}
.splitter::after{content:"";position:absolute;left:50%;top:2px;width:40px;height:2px;margin-left:-20px;border-radius:2px;background:var(--border-strong)}
.splitter:hover::after,.splitter.drag::after{background:var(--sql)}

.results{flex:1;display:flex;flex-direction:column;min-height:70px;background:var(--bg-0)}
.rtabs{display:flex;align-items:center;gap:4px;padding:6px 10px;border-bottom:1px solid var(--border);overflow-x:auto;scrollbar-width:thin}
.rtab{padding:5px 11px;border-radius:7px;border:1px solid transparent;background:none;color:var(--text-dim);font-size:12px;font-weight:600;white-space:nowrap}
.rtab:hover{background:var(--surface)}
.rtab.on{background:var(--surface-2);border-color:var(--border-strong);color:var(--text)}
.rtab.err{color:var(--err)}
.rtab .n{font-family:var(--mono);font-weight:500;color:var(--text-faint);margin-left:5px}
.rtools{margin-left:auto;display:flex;gap:6px;align-items:center}
.rbody{flex:1;overflow:auto;position:relative}
.rfoot{display:flex;gap:16px;padding:5px 12px;border-top:1px solid var(--border);font-family:var(--mono);font-size:11px;color:var(--text-faint);background:var(--bg-1);flex-wrap:wrap}
.rfoot .ok{color:var(--sql)} .rfoot .bad{color:var(--err)}

table.grid{border-collapse:separate;border-spacing:0;font-family:var(--mono);font-size:12px;min-width:100%}
table.grid th{
  position:sticky;top:0;z-index:1;background:#13132a;text-align:left;font-weight:600;color:#cfd3ff;
  padding:7px 12px;border-bottom:1px solid var(--border-strong);border-right:1px solid var(--border);white-space:nowrap;cursor:pointer;user-select:none
}
table.grid th:hover{background:#1a1a36}
table.grid th .ar{color:var(--sql);margin-left:4px}
table.grid td{padding:5px 12px;border-bottom:1px solid rgba(255,255,255,0.05);border-right:1px solid rgba(255,255,255,0.04);white-space:nowrap;max-width:420px;overflow:hidden;text-overflow:ellipsis}
table.grid tr:hover td{background:rgba(124,92,255,0.07)}
table.grid td.rn,table.grid th.rn{color:var(--text-faint);text-align:right;background:var(--bg-1);cursor:default;position:sticky;left:0}
table.grid th.rn{z-index:2;background:#13132a}
table.grid td.num{text-align:right;color:#f7b267}
table.grid td.null{color:var(--text-faint);font-style:italic}
table.grid td.blob{color:#c792ea}
.trunc{padding:8px 12px;color:var(--warn);font-size:12px;font-family:var(--mono)}

.msgs{padding:10px 14px;font-family:var(--mono);font-size:12px;line-height:1.6}
.msg{display:flex;gap:10px;padding:4px 0;border-bottom:1px dashed rgba(255,255,255,0.05)}
.msg .t{color:var(--text-faint);flex:none}
.msg .b{white-space:pre-wrap;word-break:break-word}
.msg.ok .b{color:var(--sql)}
.msg.err .b{color:var(--err)}
.msg.info .b{color:var(--text-dim)}
.msg .q{color:var(--text-faint)}

.welcome{padding:26px 22px;color:var(--text-dim);max-width:760px;line-height:1.65}
.welcome h2{color:var(--text);margin:0 0 8px;font-size:18px}
.welcome kbd{font-family:var(--mono);font-size:11px;padding:2px 6px;border-radius:5px;background:var(--surface-2);border:1px solid var(--border)}
.welcome ul{padding-left:18px;margin:10px 0}

.statusbar{display:flex;gap:16px;align-items:center;padding:4px 14px;background:#0a0a15;border-top:1px solid var(--border);font-family:var(--mono);font-size:11px;color:var(--text-faint);white-space:nowrap;overflow:hidden}
.statusbar .live{color:var(--sql)}
.statusbar .live::before{content:"●";margin-right:6px}
.statusbar .right{margin-left:auto;display:flex;gap:16px}

.loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(7,7,14,0.9);z-index:50;font-family:var(--mono);color:var(--text-dim);flex-direction:column;gap:14px}
.loading .spin{width:28px;height:28px;border-radius:50%;border:3px solid var(--border-strong);border-top-color:var(--sql);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ---------- CodeMirror theme ---------- */
.CodeMirror{background:var(--panel);color:#e4e4f4;font-family:var(--mono);font-size:13.5px;line-height:1.6}
.CodeMirror-gutters{background:var(--panel);border-right:1px solid var(--border)}
.CodeMirror-linenumber{color:#4a4a66}
.CodeMirror-cursor{border-left:2px solid var(--sql)}
.CodeMirror-selected{background:rgba(124,92,255,0.28)!important}
.CodeMirror-focused .CodeMirror-selected{background:rgba(124,92,255,0.34)!important}
.CodeMirror-activeline-background{background:rgba(255,255,255,0.035)}
.CodeMirror-matchingbracket{color:var(--sql)!important;text-decoration:underline}
.cm-keyword{color:#c792ea;font-weight:600}
.cm-builtin{color:#82aaff}
.cm-type{color:#82aaff}
.cm-atom{color:#f78c6c}
.cm-number{color:#f78c6c}
.cm-string,.cm-string-2{color:#c3e88d}
.cm-comment{color:#5d6285;font-style:italic}
.cm-operator{color:#89ddff}
.cm-variable-2{color:#ffcb6b}
.cm-bracket{color:#a6accd}
.cm-err-line{background:rgba(255,107,122,0.14)}
.cm-run-flash{background:rgba(76,224,163,0.22);transition:background .6s}
.CodeMirror-hints{background:#14142a;border:1px solid var(--border-strong);border-radius:8px;box-shadow:0 14px 40px -10px rgba(0,0,0,0.7);font-family:var(--mono);font-size:12.5px;padding:4px;z-index:60}
.CodeMirror-hint{color:#d6d6ea;border-radius:5px;padding:3px 8px}
li.CodeMirror-hint-active{background:rgba(76,224,163,0.22);color:#fff}

/* ---------- step-by-step ---------- */
.btn.step{border-color:rgba(255,181,71,0.45);color:#ffd79a}
.btn.step:hover{background:rgba(255,181,71,0.12)}
.steps{position:absolute;inset:0;display:flex;flex-direction:column;min-height:0}
.steps-bar{display:flex;align-items:center;gap:12px;padding:8px 12px;border-bottom:1px solid var(--border);background:var(--bg-1);flex-wrap:wrap}
.sctl{display:flex;align-items:center;gap:4px;flex:none}
.sbtn{width:32px;height:30px;border-radius:8px;border:1px solid var(--border);background:var(--surface);font-size:12px;display:inline-flex;align-items:center;justify-content:center}
.sbtn:hover:not([disabled]){background:var(--surface-2);border-color:var(--border-strong)}
.sbtn[disabled]{opacity:.35;cursor:default}
.sbtn.play{color:var(--sql);border-color:rgba(76,224,163,0.4)}
.sbtn:focus-visible{outline:2px solid var(--sql);outline-offset:1px}
.scount{font-family:var(--mono);font-size:12px;color:var(--text-dim);min-width:54px;text-align:center}
.pipe{display:flex;align-items:center;gap:3px;overflow-x:auto;flex:1;min-width:0;scrollbar-width:thin;padding:2px 0}
.chip{font-family:var(--mono);font-size:10.5px;font-weight:600;letter-spacing:.04em;padding:4px 9px;border-radius:999px;border:1px solid var(--border);background:none;color:var(--text-faint);white-space:nowrap}
.chip:hover{border-color:var(--border-strong);color:var(--text)}
.chip.done{color:var(--sql);border-color:rgba(76,224,163,0.3)}
.chip.on{background:var(--warn);color:#1a1000;border-color:var(--warn)}
.parr{color:var(--text-faint);font-size:12px}
.step-info{padding:12px 16px;border-bottom:1px solid var(--border);display:grid;gap:7px;background:linear-gradient(180deg,rgba(255,181,71,0.05),transparent)}
.step-title{display:flex;align-items:center;gap:10px;font-weight:700;font-size:14.5px}
.step-title .clause{font-family:var(--mono);font-size:11px;padding:3px 8px;border-radius:6px;background:rgba(255,181,71,0.16);border:1px solid rgba(255,181,71,0.45);color:#ffd79a;white-space:nowrap}
.step-info p{margin:0;color:var(--text-dim);line-height:1.6;max-width:980px}
.step-info code{font-family:var(--mono);font-size:12px;background:var(--surface-2);padding:1px 6px;border-radius:5px;color:#e4e4f4}
.step-meta{display:flex;gap:14px;font-family:var(--mono);font-size:11.5px;color:var(--text-faint);flex-wrap:wrap;align-items:center}
.step-meta b{color:var(--text)}
.step-meta .scode{color:#c9b6ff;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.legend{display:inline-flex;gap:12px;flex-wrap:wrap}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
.step-table{flex:1;overflow:auto;min-height:0}
.step-err{padding:14px 16px;color:var(--err);font-family:var(--mono);font-size:12px}
table.grid tr.s-drop td:not(.rn){opacity:.4;text-decoration:line-through;text-decoration-color:rgba(255,107,122,0.8)}
table.grid tr.s-drop td.rn:first-child{box-shadow:inset 3px 0 0 var(--err)}
table.grid tr.s-pad td.rn:first-child{box-shadow:inset 3px 0 0 var(--warn)}
table.grid tr.s-pad td.null{color:var(--warn)}
table.grid tr.s-new td{background:rgba(76,224,163,0.10)}
table.grid tr.s-new td.rn:first-child{box-shadow:inset 3px 0 0 var(--sql)}
table.grid tr.s-hit td{background:rgba(53,208,255,0.08)}
table.grid tr.s-hit td.rn:first-child{box-shadow:inset 3px 0 0 var(--accent-2)}
table.grid tr.grp td{background:hsla(var(--gh),70%,60%,0.09)}
table.grid td.gcell{color:hsl(var(--gh),80%,72%);font-weight:600;box-shadow:inset 3px 0 0 hsl(var(--gh),70%,60%);position:static}
table.grid td.chg{background:rgba(255,181,71,0.22)!important;color:#ffe2b0}
.cm-step-mark{background:rgba(255,181,71,0.20);border-bottom:2px solid var(--warn)}

.btn svg{flex:none}
@media (max-width:1500px){ .topbar .btn kbd{display:none} }
@media (max-width:1280px){ .eacts .btn kbd{display:none} }
@media (max-width:1150px){ .topbar .btn.icon .lbl{display:none} }
@media (max-width:1180px){ .topbar .brand small{display:none} }
@media (max-width:700px){
  .steps{position:static}
  .step-table{overflow:visible}
  .steps-bar{gap:8px}
  .pipe{flex-basis:100%}
}
@media (max-width:900px){
  #sidebarToggle{display:inline-flex}
  .sidebar{position:fixed;top:0;bottom:0;left:0;z-index:40;width:min(300px,86vw);transform:translateX(-100%);transition:transform .2s ease;box-shadow:20px 0 50px rgba(0,0,0,0.6)}
  body.side-open .sidebar{transform:none}
  .brand small,.btn .lbl,.statusbar .hide-sm{display:none}
  .topbar{padding:8px 16px}
}

/* ---------- 📖 Commands reference ---------- */
.btn.ref-open{border-color:rgba(53,208,255,0.45);color:#bfefff}
.ref-back{position:fixed;inset:0;background:rgba(3,3,8,0.55);z-index:70;opacity:0;pointer-events:none;transition:opacity .2s}
.ref-back.on{opacity:1;pointer-events:auto}
.ref{position:fixed;top:0;right:0;bottom:0;width:min(620px,100vw);background:var(--panel);border-left:1px solid var(--border-strong);z-index:71;
  transform:translateX(100%);transition:transform .22s ease;display:flex;flex-direction:column;box-shadow:-30px 0 60px rgba(0,0,0,0.5);visibility:hidden}
.ref.on{transform:none;visibility:visible}
.ref-head{padding:14px 16px 10px;border-bottom:1px solid var(--border);display:flex;flex-direction:column;gap:10px;flex:none}
.ref-title{display:flex;align-items:center;gap:10px}
.ref-title h2{margin:0;font-size:16px}

function shopSQL(){
  // Deterministic pseudo-random generator so the dataset is identical every reset.
  let s = 20260101;
  const rnd = () => (s = (s * 1103515245 + 12345) % 2147483648) / 2147483648;
  const pick = a => a[Math.floor(rnd() * a.length)];

  const customers = [
    ['Alice Morgan','alice@mail.com','Boston','USA','2023-01-14'],
    ['Ben Carter','ben.c@mail.com','Chicago','USA','2023-02-03'],
    ['Chloe Martin','chloe@mail.fr','Paris','France','2023-03-22'],
    ['David Rosen','drosen@mail.co.il','Haifa','Israel','2023-04-10'],
    ['Elena Rossi','elena.r@mail.it','Milan','Italy','2023-05-01'],
    ['Felix Wagner','felix@mail.de','Berlin','Germany','2023-06-18'],
    ['Grace Lee','grace.lee@mail.com','Seattle','USA','2023-08-09'],
    ['Hana Sato','hana@mail.jp','Tokyo','Japan','2023-09-30'],
    ['Itai Shalom','itai@mail.co.il','Tel Aviv','Israel','2024-01-12'],
    ['Julia Novak','julia.n@mail.cz','Prague','Czechia','2024-02-27'],
    ['Kevin Brooks','kbrooks@mail.com','Austin','USA','2024-05-05'],
    ['Lena Fischer','lena.f@mail.de','Munich','Germany','2024-07-19']
  ];
  const products = [
    ['Mechanical Keyboard','Peripherals',119.0,42],['Wireless Mouse','Peripherals',39.9,120],
    ['27" Monitor','Displays',289.0,18],['34" Ultrawide','Displays',499.0,7],
    ['USB-C Hub','Accessories',49.5,85],['Laptop Stand','Accessories',34.0,60],
    ['Noise-Cancelling Headphones','Audio',229.0,25],['USB Microphone','Audio',89.0,30],
    ['1TB NVMe SSD','Storage',79.0,64],['4TB External HDD','Storage',109.0,22],
    ['Webcam 1080p','Peripherals',59.0,0],['Desk Lamp','Accessories',27.5,48]
  ];
  const statuses = ['delivered','delivered','delivered','shipped','processing','cancelled'];
  const q = v => v === null ? 'NULL' : typeof v === 'number' ? String(v) : "'" + String(v).replace(/'/g,"''") + "'";

  let out = `
CREATE TABLE customers (
  customer_id INTEGER PRIMARY KEY,
  name        TEXT NOT NULL,
  email       TEXT NOT NULL UNIQUE,
  city        TEXT,
  country     TEXT NOT NULL,
  joined      TEXT NOT NULL
);

CREATE TABLE products (
  product_id INTEGER PRIMARY KEY,
  name       TEXT NOT NULL,
  category   TEXT NOT NULL,
  price      REAL NOT NULL CHECK (price > 0),
  stock      INTEGER NOT NULL DEFAULT 0
);

CREATE TABLE orders (
  order_id    INTEGER PRIMARY KEY,
  customer_id INTEGER NOT NULL REFERENCES customers(customer_id),
  order_date  TEXT NOT NULL,
  status      TEXT NOT NULL CHECK (status IN ('processing','shipped','delivered','cancelled'))
);

CREATE TABLE order_items (
  order_id   INTEGER NOT NULL REFERENCES orders(order_id),
  product_id INTEGER NOT NULL REFERENCES products(product_id),
  quantity   INTEGER NOT NULL CHECK (quantity > 0),
  unit_price REAL    NOT NULL,
  PRIMARY KEY (order_id, product_id)
);
`;
  out += 'INSERT INTO customers VALUES\n' + customers.map((c,i) => '  (' + [i+1, ...c].map(q).join(',') + ')').join(',\n') + ';\n';
  out += 'INSERT INTO products VALUES\n' + products.map((p,i) => '  (' + [i+1, ...p].map(q).join(',') + ')').join(',\n') + ';\n';

  const orders = [], items = [];
  for (let id = 1; id <= 40; id++){
    // Customers 10-12 never order much; customer 12 never orders at all.
    const cust = 1 + Math.floor(rnd() * 11);
    const month = 1 + Math.floor(rnd() * 12);
    const day = 1 + Math.floor(rnd() * 28);
    const date = '2024-' + String(month).padStart(2,'0') + '-' + String(day).padStart(2,'0');
    orders.push([id, cust, date, month >= 11 ? pick(['processing','shipped']) : pick(statuses)]);
    const n = 1 + Math.floor(rnd() * 3), used = new Set();
    for (let k = 0; k < n; k++){
      const pid = 1 + Math.floor(rnd() * products.length);
      if (used.has(pid)) continue;
      used.add(pid);
      items.push([id, pid, 1 + Math.floor(rnd() * 3), products[pid-1][2]]);
    }
  }
  orders.sort((a,b) => a[2] < b[2] ? -1 : a[2] > b[2] ? 1 : 0).forEach((o,i) => { o.old = o[0]; o[0] = i + 1; });
  const remap = new Map(orders.map(o => [o.old, o[0]]));
  items.forEach(it => { it[0] = remap.get(it[0]); });
  items.sort((a,b) => a[0] - b[0] || a[1] - b[1]);
  out += 'INSERT INTO orders VALUES\n' + orders.map(o => '  (' + o.slice(0,4).map(q).join(',') + ')').join(',\n') + ';\n';
  out += 'INSERT INTO order_items VALUES\n' + items.map(it => '  (' + it.map(q).join(',') + ')').join(',\n') + ';\n';
  return out;
}

// The company and shop examples share one list; split it by the tables each example uses.
const SHOP_TABLES = /\b(customers|products|orders|order_items|reviews)\b/i;
function pickExamples(list, keep){
  return list.map(g => ({group: g.group, items: g.items.filter(it => keep(SHOP_TABLES.test(it[2])))})).filter(g => g.items.length);
}

const fmtBytes = b => b < 1024 ? b + ' B' : b < 1048576 ? (b/1024).toFixed(1) + ' KB' : (b/1048576).toFixed(2) + ' MB';
function u8ToB64(u8){ let s = ''; for (let i = 0; i < u8.length; i += 0x8000) s += String.fromCharCode.apply(null, u8.subarray(i, i + 0x8000)); return btoa(s); }

/* Split SQL into statement ranges, respecting quotes, comments and CREATE TRIGGER ... END bodies. */
function splitStatements(sql){
  const out = [];
  let start = 0, i = 0;
  const n = sql.length;
  while (i < n){
    const c = sql[i], c2 = sql[i+1];
    if (c === '-' && c2 === '-'){ while (i < n && sql[i] !== '\n') i++; continue; }
    if (c === '/' && c2 === '*'){ const e = sql.indexOf('*/', i + 2); i = e < 0 ? n : e + 2; continue; }
    if (c === "'" || c === '"' || c === '`' || c === '['){
      const close = c === '[' ? ']' : c; i++;
      while (i < n){ if (sql[i] === close){ if (sql[i+1] === close && close !== ']'){ i += 2; continue; } break; } i++; }
      i++; continue;
    }
    if (c === ';'){
      const text = sql.slice(start, i);
      const isTrigger = /^\s*(?:--[^\n]*\n\s*|\/\*[\s\S]*?\*\/\s*)*CREATE\s+(?:TEMP(?:ORARY)?\s+)?TRIGGER\b/i.test(text);
      if (!isTrigger || /\bEND\s*$/i.test(text)){ out.push({from:start, to:i + 1}); start = i + 1; }
    }
    i++;
  }
  if (sql.slice(start).trim()) out.push({from:start, to:n});
  return out.filter(r => stripComments(sql.slice(r.from, r.to)).trim().replace(/;$/, '').trim());
}
function stripComments(s){ return s.replace(/--[^\n]*/g, '').replace(/\/\*[\s\S]*?\*\//g, ''); }

function loadDataset(kind){
  if (db) db.close();
  db = new SQL.Database();
  const sql = DATASETS[kind] ? DATASETS[kind].sql() : '';

// sql.js export() closes and reopens the connection, which would roll back an open BEGIN.
function inTransaction(){
  try { db.exec('BEGIN; ROLLBACK;'); return false; }
  catch(e){ return /within a transaction/i.test(e.message); }
}
function persistDb(){
  if (inTransaction()){ setSaved('transaction open · not saved until COMMIT', true); return; }
  try {
    const data = db.export();
    // sql.js export() resets foreign_keys; turn it back on.
    db.exec('PRAGMA foreign_keys = ON;');
    if (data.length > 3 * 1048576){ LS.del('db'); setSaved('too large to autosave', true); return; }
    const ok = LS.set('db', u8ToB64(data));
    setSaved(ok ? 'saved in this browser' : 'not saved (storage unavailable)', !ok);
    $('#sbSize').textContent = fmtBytes(data.length);
  } catch(e){ setSaved('not saved', true); }
}

/* ================================================================
   Execution
   ================================================================ */
const MAX_ROWS = 5000;

function cellOut(v){
  if (v === null || v === undefined) return {cls:'null', text:'NULL'};
  if (v instanceof Uint8Array){
    const hex = Array.from(v.slice(0, 24), b => b.toString(16).padStart(2,'0')).join('');
    return {cls:'blob', text:"x'" + hex + (v.length > 24 ? '…' : '') + "' (" + v.length + ' B)'};
  }
  if (typeof v === 'number') return {cls:'num', text:String(v)};
  return {cls:'', text:String(v)};
}

function execute(sql, baseOffset, label){
  clearErrorMark();
  const runResults = [];
  const runMsgs = [];
  const t0all = performance.now();
  let failed = false, wrote = false, count = 0;
  let pos = 0;
  const it = db.iterateStatements(sql);
  try {
    for (;;){
      pos = sql.length - it.getRemainingSQL().length;
      const step = it.next();
      if (step.done) break;
      const stmt = step.value;
      const text = stripComments(stmt.getSQL()).trim();
      const t0 = performance.now();
      const cols = stmt.getColumnNames();
      const rows = [];
      let total = 0;
      while (stmt.step()){ total++; if (rows.length < MAX_ROWS) rows.push(stmt.get()); }
      const ms = performance.now() - t0;
      count++;
      if (cols.length){
        runResults.push({kind:'rows', cols, rows, total, ms, sql:text, plan:/^\s*EXPLAIN\s+QUERY\s+PLAN/i.test(text)});
        runMsgs.push({t:now(), kind:'ok', text:`${total} row${total === 1 ? '' : 's'} returned in ${fmtMs(ms)}`, q:text});
      } else {
        const changed = db.getRowsModified();
        const isDml = /^\s*(INSERT|UPDATE|DELETE|REPLACE|UPSERT|WITH)\b/i.test(text);
        if (!/^\s*(SELECT|PRAGMA|EXPLAIN)\b/i.test(text)) wrote = true;
        runMsgs.push({t:now(), kind:'ok', text: isDml ? `${changed} row${changed === 1 ? '' : 's'} affected (${fmtMs(ms)})` : `OK (${fmtMs(ms)})`, q:text});
      }
    }
  } catch(err){
    failed = true;
    wrote = true; // earlier statements in the batch may have changed data
    // Skip whitespace and comments so the error points at the statement itself.
    let p = pos;
    for (;;){
      while (p < sql.length && /\s/.test(sql[p])) p++;
      if (sql.startsWith('--', p)){ const e = sql.indexOf('\n', p); p = e < 0 ? sql.length : e + 1; continue; }
      if (sql.startsWith('/*', p)){ const e = sql.indexOf('*/', p + 2); p = e < 0 ? sql.length : e + 2; continue; }
      break;
    }
    const line = cm.posFromIndex(baseOffset + p).line;
    markErrorLine(line);
    runMsgs.push({t:now(), kind:'err', text:`Error at line ${line + 1}: ${err.message}`, q:sql.slice(p).split(/;\s*/)[0].slice(0, 200)});
    if (inTransaction()) runMsgs.push({t:now(), kind:'info', text:'A transaction is still open. Run COMMIT to keep its changes or ROLLBACK to undo them.'});
  }
  const totalMs = performance.now() - t0all;
  if (!count && !failed) runMsgs.push({t:now(), kind:'info', text:'Nothing to run.'});

  messages = runMsgs.concat(messages).slice(0, 300);
  results = runResults;
  activeResult = failed || !runResults.length ? -1 : runResults.length - 1;
  if (runResults.length > 1 && !failed) activeResult = 0;
  sortState = {col:-1, dir:1};
  renderResults({count, failed, totalMs});

  const trimmed = sql.trim();
  if (trimmed){
    if (history.length && history[0].sql === trimmed) history.shift();
    history.unshift({sql:trimmed, ts:Date.now(), ok:!failed, ms:Math.round(totalMs), label});
    history = history.slice(0, 100);
    LS.set('history', history);
    renderHistory();
  }
  if (wrote){ refreshSchema(); persistDb(); }
}

function runAll(){
  const sel = cm.getSelection();
  if (sel.trim()){
    const from = cm.indexFromPos(cm.getCursor('from'));
    execute(sel, from, 'selection');
  } else {
    execute(cm.getValue(), 0, 'all');
  }
}
function currentStatement(){
  const sql = cm.getValue();
  const idx = cm.indexFromPos(cm.getCursor());
  const ranges = splitStatements(sql);
  if (!ranges.length) return null;
  let r = ranges.find(r => idx >= r.from && idx <= r.to);
  if (!r){ // cursor in whitespace between statements: use the nearest one before it
    r = ranges.filter(r => r.to <= idx).pop() || ranges[0];
  }
  return {sql:sql.slice(r.from, r.to), from:r.from, to:r.to};
}
function flash(from, to){
  const m = cm.markText(cm.posFromIndex(from), cm.posFromIndex(to), {className:'cm-run-flash'});
  setTimeout(() => m.clear(), 450);
}
function runCurrent(){
  const st = currentStatement();
  if (!st) return;
  flash(st.from, st.to);
  execute(st.sql, st.from, 'statement');
}
function explainCurrent(){
  const st = currentStatement();
  if (!st) return;
  const body = st.sql.replace(/^\s*EXPLAIN\s+(QUERY\s+PLAN\s+)?/i, '');
  const lead = st.sql.length - st.sql.replace(/^\s+/, '').length;
  flash(st.from, st.to);
  const prefix = 'EXPLAIN QUERY PLAN ';
  execute(prefix + body.trim(), Math.max(0, st.from + lead - prefix.length), 'explain');
}

      `<span>${lastRun.count} statement${lastRun.count === 1 ? '' : 's'}</span>` +
      `<span>${fmtMs(lastRun.totalMs)}</span>` +
      (r && r.cols ? `<span>${r.total} row${r.total === 1 ? '' : 's'} × ${r.cols.length} col${r.cols.length === 1 ? '' : 's'}</span>` : '');
  } else foot.innerHTML = '<span>ready</span>';
}
function renderGrid(r){
  let rows = r.rows;
  if (sortState.col >= 0){
    const c = sortState.col, d = sortState.dir;
    rows = rows.slice().sort((a, b) => {
      const x = a[c], y = b[c];
      if (x === y) return 0;
      if (x === null) return -d; if (y === null) return d;
      if (typeof x === 'number' && typeof y === 'number') return (x - y) * d;
      return String(x).localeCompare(String(y), undefined, {numeric:true}) * d;
    });
  }
  let h = '<table class="grid"><thead><tr><th class="rn">#</th>' + r.cols.map((c, i) =>
    `<th data-c="${i}" title="Sort by ${esc(c)}">${esc(c)}${sortState.col === i ? '<span class="ar">' + (sortState.dir > 0 ? '▲' : '▼') + '</span>' : ''}</th>`
  ).join('') + '</tr></thead><tbody>';
  for (let i = 0; i < rows.length; i++){
    h += '<tr><td class="rn">' + (i + 1) + '</td>';
    for (const v of rows[i]){ const o = cellOut(v); h += `<td class="${o.cls}" title="${esc(o.text)}">${esc(o.text)}</td>`; }
    h += '</tr>';
  }
  h += '</tbody></table>';
  if (!rows.length) h += '<div class="trunc" style="color:var(--text-faint)">(no rows)</div>';
  if (r.total > r.rows.length) h += `<div class="trunc">Showing the first ${r.rows.length.toLocaleString()} of ${r.total.toLocaleString()} rows. Add a LIMIT to see the rest.</div>`;
  return h;
}
function renderPlan(r){
  // EXPLAIN QUERY PLAN columns: id, parent, notused, detail
  const ci = r.cols.indexOf('id'), cp = r.cols.indexOf('parent'), cd = r.cols.indexOf('detail');
  if (ci < 0 || cp < 0 || cd < 0) return renderGrid(r);
  const kids = new Map();
  r.rows.forEach(row => { const p = row[cp]; if (!kids.has(p)) kids.set(p, []); kids.get(p).push(row); });
  let out = '';
  const walk = (pid, depth) => (kids.get(pid) || []).forEach(row => {
    const d = String(row[cd]);
    const color = /^SCAN/.test(d) ? 'var(--warn)' : /^SEARCH/.test(d) ? 'var(--sql)' : '#cfd3ff';
    out += `<div style="padding:3px 0 3px ${depth * 22}px;color:${color}">${depth ? '└─ ' : ''}${esc(d)}</div>`;
    walk(row[ci], depth + 1);
  });
  walk(0, 0);
  return `<div class="msgs"><div style="color:var(--text-faint);margin-bottom:8px">-- ${esc(r.sql.replace(/\s+/g, ' ').slice(0, 140))}</div>${out}
    <div style="margin-top:12px;color:var(--text-faint)"><span style="color:var(--warn)">SCAN</span> = reads the whole table · <span style="color:var(--sql)">SEARCH</span> = uses an index or key to jump straight to rows</div></div>`;
}
function welcomeHtml(){
  return `<div class="welcome"><h2>Run a query to see results here</h2>
  <ul>
    <li><kbd>Ctrl</kbd> + <kbd>Enter</kbd> runs the selection, or the whole editor if nothing is selected.</li>
    <li><kbd>Shift</kbd> + <kbd>Ctrl</kbd> + <kbd>Enter</kbd> runs just the statement under the cursor.</li>
    <li><b>Step-by-step</b> (<kbd>Alt</kbd> + <kbd>Enter</kbd>) walks through how the statement under the cursor is executed: FROM → JOIN → WHERE → GROUP BY → HAVING → SELECT → ORDER BY → LIMIT, with the table after each clause. Use ◀ ▶ or the arrow keys.</li>
    <li><kbd>Ctrl</kbd> + <kbd>Space</kbd> autocompletes keywords, tables and columns. <kbd>Ctrl</kbd> + <kbd>/</kbd> toggles a comment.</li>
    <li>The <b>Schema</b> panel lists every table; click a column to insert its name, or <b>▶ rows</b> to preview a table.</li>
    <li>Your database and tabs are kept in this browser. <b>Reset DB</b> brings back the sample data.</li>
  </ul></div>`;
}

function exportCsv(){

        `<div class="col" data-ins="${esc(c[1])}" title="Click to insert"><span class="cn">${esc(c[1])}</span>` +
        (c[5] ? '<span class="k pk">PK</span>' : '') + (fks.includes(c[1]) ? '<span class="k fk">FK</span>' : '') +
        `<span class="ct">${esc((c[2] || 'ANY').toLowerCase())}${c[3] ? ' !' : ''}</span></div>`).join('')}</div></div>`;
  };

  let h = aboutDataset() + '<h4>Tables · ' + tables.length + '</h4>';
  h += tables.length ? tables.map(t => tblHtml(t[1], false)).join('') : '<div class="empty">No tables yet. Try a CREATE TABLE.</div>';

  $('#p-schema').innerHTML = h;

/* ================================================================
   Step-by-step execution
   Breaks a statement into its logical processing order and asks
   SQLite for the intermediate table after each clause.
   ================================================================ */
const AGG_FNS = new Set(['COUNT','SUM','AVG','MIN','MAX','TOTAL','GROUP_CONCAT','STRING_AGG','JSON_GROUP_ARRAY','JSON_GROUP_OBJECT']);
const JOIN_W = new Set(['NATURAL','LEFT','RIGHT','FULL','OUTER','INNER','CROSS']);
const SRC_STOP = new Set(['ON','USING','JOIN','LEFT','RIGHT','FULL','INNER','OUTER','CROSS','NATURAL','WHERE','GROUP','HAVING','ORDER','LIMIT','WINDOW','UNION','INTERSECT','EXCEPT','INDEXED','NOT']);
const ALIAS_BLOCK = new Set(['AND','OR','NOT','IS','IN','LIKE','GLOB','REGEXP','MATCH','BETWEEN','THEN','ELSE','WHEN','CASE','ESCAPE','COLLATE','DISTINCT','SELECT','CAST','AS','ALL']);
const NOT_ALIAS = new Set(['END','NULL','TRUE','FALSE','CURRENT_DATE','CURRENT_TIME','CURRENT_TIMESTAMP','ISNULL','NOTNULL','ASC','DESC']);

function tokenize(sql){
  const toks = [];
  let i = 0, depth = 0;
  const n = sql.length;
  while (i < n){
    const c = sql[i], c2 = sql[i+1];
    if (/\s/.test(c)){ i++; continue; }
    if (c === '-' && c2 === '-'){ while (i < n && sql[i] !== '\n') i++; continue; }
    if (c === '/' && c2 === '*'){ const e = sql.indexOf('*/', i + 2); i = e < 0 ? n : e + 2; continue; }
    const s = i;
    let t;
    if (c === "'" || c === '"' || c === '`'){
      i++;
      while (i < n){ if (sql[i] === c){ if (sql[i+1] === c){ i += 2; continue; } break; } i++; }
      i++; t = c === "'" ? 's' : 'q';
    } else if (c === '['){ const e = sql.indexOf(']', i); i = e < 0 ? n : e + 1; t = 'q'; }
    else if (/[A-Za-z_]/.test(c)){ while (i < n && /[A-Za-z0-9_$]/.test(sql[i])) i++; t = 'w'; }
    else if (/[0-9]/.test(c) || (c === '.' && /[0-9]/.test(c2))){
      const m = /^(?:0x[0-9a-f]+|(?:\d+\.?\d*|\.\d+)(?:e[+-]?\d+)?)/i.exec(sql.slice(i));
      i += m ? m[0].length : 1; t = 'n';
    } else {
      const m = /^(?:\|\||<<|>>|<=|>=|==|!=|<>|->>|->)/.exec(sql.slice(i, i + 3));
      i += m ? m[0].length : 1; t = 'p';
    }
    const v = sql.slice(s, i);
    if (v === ')') depth--;
    toks.push({t, v, u: t === 'w' ? v.toUpperCase() : v, s, e: i, d: depth});
    if (v === '(') depth++;
  }
  return toks;
}
const isKw = (t, ...w) => !!t && t.t === 'w' && w.includes(t.u);
function unq(v){
  const c = v[0];
  if (c === '"' || c === '`') return v.slice(1, -1).split(c + c).join(c);
  if (c === '[') return v.slice(1, -1);
  if (c === "'") return v.slice(1, -1).replace(/''/g, "'");
  return v;
}
function matchParen(T, i){
  for (let j = i + 1; j < T.length; j++) if (T[j].v === ')' && T[j].d === T[i].d) return j;
  throw new Error('Unbalanced parentheses');
}
const qi = s => '"' + String(s).replace(/"/g, '""') + '"';
const short = (t, n = 140) => { const s = String(t).replace(/\s+/g, ' ').trim(); return s.length > n ? s.slice(0, n) + '…' : s; };
const code = (t, n) => '<code>' + esc(short(t, n)) + '</code>';
const plural = (n, w) => `<b>${n}</b> ${w}${n === 1 ? '' : 's'}`;
const keyOf = row => row.map(v => v instanceof Uint8Array ? 'b:' + Array.from(v).join(',') : typeof v + ':' + v).join('\u0001');

function runQ(sql, cap = 1000){
  const st = db.prepare(sql);
  try {
    const cols = st.getColumnNames(), rows = [];
    let total = 0;
    while (st.step()){ total++; if (rows.length < cap) rows.push(st.get()); if (total >= 200000) break; }
    return {cols, rows, total};
  } finally { st.free(); }
}
function mkStep(res){
  const st = {cols: res.cols.slice(), rows: res.rows, total: res.total, ranges: []};
  const ki = st.cols.indexOf('__keep'), gi = st.cols.indexOf('__grp');
  if (ki >= 0) st.status = st.rows.map(r => r[ki] ? 'keep' : 'drop');
  if (gi >= 0) st.group = st.rows.map(r => r[gi]);
  return st;
}
function safeStep(fn){
  try { return fn(); }
  catch(e){ return {cols: [], rows: [], total: 0, ranges: [], error: e.message}; }
}
const kept = st => st.status ? st.status.filter(s => s === 'keep' || s === 'pad').length : st.total;
const visRows = st => {
  const vi = st.cols.map((c, i) => i).filter(i => !st.cols[i].startsWith('__'));
  return st.rows.filter((r, j) => !st.status || st.status[j] !== 'drop').map(r => vi.map(i => r[i]));
};
const visCols = st => st.cols.filter(c => !c.startsWith('__'));

/* ---------- parsing ---------- */
function analyzeSql(sql){
  let T = tokenize(sql);
  const semi = T.findIndex(t => t.v === ';' && t.d === 0);
  if (semi >= 0) T = T.slice(0, semi);
  if (!T.length) throw new Error('Nothing to step through.');
  const A = {sql, toks: T, withText: '', ctes: [], recursive: false};
  let i = 0;
  if (isKw(T[0], 'WITH')){
    i = 1;
    if (isKw(T[i], 'RECURSIVE')){ A.recursive = true; i++; }
    for (;;){
      const nameTok = T[i];
      if (!nameTok) throw new Error('Could not read the WITH clause.');
      let j = i + 1;
      if (T[j] && T[j].v === '(') j = matchParen(T, j) + 1;
      if (!isKw(T[j], 'AS')) throw new Error('Could not read the WITH clause.');
      j++;
      if (isKw(T[j], 'NOT')) j++;
      if (isKw(T[j], 'MATERIALIZED')) j++;
      if (!T[j] || T[j].v !== '(') throw new Error('Could not read the WITH clause.');
      const close = matchParen(T, j);
      A.ctes.push({name: unq(nameTok.v), s: nameTok.s, e: T[close].e, body: sql.slice(T[j].e, T[close].s)});
      i = close + 1;
      if (T[i] && T[i].v === ','){ i++; continue; }
      break;
    }
    A.withText = sql.slice(T[0].s, T[i - 1].e);
  }
  A.mainStart = i;
  const head = T[i];
  if (!head) throw new Error('Expected a statement after WITH.');
  A.kind = isKw(head, 'SELECT') ? 'select' : isKw(head, 'INSERT', 'REPLACE', 'UPDATE', 'DELETE') ? 'dml' : 'other';
  return A;
}

function splitTop(T, a, b){
  const out = [];
  let s = a;
  for (let k = a; k < b; k++) if (T[k].v === ',' && T[k].d === 0){ out.push([s, k]); s = k + 1; }
  if (s < b) out.push([s, b]);
  return out;
}

function parseCore(A, a, b){
  const T = A.toks, sql = A.sql;
  const C = {start: T[a].s, end: T[b - 1].e};
  const marks = [];
  for (let k = a; k < b; k++){
    const t = T[k];
    if (t.d !== 0 || t.t !== 'w') continue;
    if (k === a && t.u === 'SELECT') marks.push({n: 'select', k, body: k + 1});
    else if (['FROM','WHERE','HAVING','WINDOW','LIMIT'].includes(t.u)) marks.push({n: t.u.toLowerCase(), k, body: k + 1});
    else if ((t.u === 'GROUP' || t.u === 'ORDER') && isKw(T[k + 1], 'BY')) marks.push({n: t.u === 'GROUP' ? 'groupBy' : 'orderBy', k, body: k + 2});
  }
  if (!marks.length || marks[0].n !== 'select') throw new Error('Expected SELECT.');
  marks.forEach((m, j) => {
    const endK = j + 1 < marks.length ? marks[j + 1].k : b;
    let body = m.body;
    if (m.n === 'select' && isKw(T[body], 'DISTINCT', 'ALL')){ C.distinct = T[body].u === 'DISTINCT'; body++; }
    if (body >= endK) throw new Error('Empty ' + m.n.toUpperCase() + ' clause.');
    C[m.n] = {a: body, b: endK, text: sql.slice(T[body].s, T[endK - 1].e), textS: T[body].s, end: T[endK - 1].e, range: [T[m.k].s, T[endK - 1].e]};
  });
  C.select.items = splitTop(T, C.select.a, C.select.b).map(([x, y]) => {
    const text = sql.slice(T[x].s, T[y - 1].e);
    const last = T[y - 1], prev = y - 2 >= x ? T[y - 2] : null;
    if (prev && isKw(prev, 'AS')) return {text, alias: unq(last.v), expr: sql.slice(T[x].s, prev.s).trim()};
    if (prev && (last.t === 'q' || (last.t === 'w' && !NOT_ALIAS.has(last.u))) && prev.v !== '.' &&
        (prev.t !== 'p' || prev.v === ')') && !(prev.t === 'w' && ALIAS_BLOCK.has(prev.u)))
      return {text, alias: unq(last.v), expr: sql.slice(T[x].s, prev.e).trim()};
    return {text, alias: null, expr: text};
  });
  if (C.groupBy) C.groupBy.items = splitTop(T, C.groupBy.a, C.groupBy.b).map(([x, y]) => sql.slice(T[x].s, T[y - 1].e));
  if (C.limit) Object.assign(C.limit, parseLimit(A, C.limit.a, C.limit.b));
  return C;
}
function parseLimit(A, a, b){
  const T = A.toks, sql = A.sql, sl = (x, y) => sql.slice(T[x].s, T[y - 1].e);
  for (let k = a; k < b; k++){
    if (T[k].d !== 0) continue;
    if (isKw(T[k], 'OFFSET')) return {lim: sl(a, k), off: sl(k + 1, b)};
    if (T[k].v === ',') return {lim: sl(k + 1, b), off: sl(a, k)};
  }
  return {lim: sl(a, b), off: null};
}

function parseFrom(A, a, b){
  const T = A.toks, sql = A.sql, segs = [];
  let k = a;
  while (k < b){
    const segS = T[k].s;
    let op = 'FROM';
    if (segs.length){
      if (T[k].v === ','){ op = ','; k++; }
      else {
        const s0 = k;
        while (k < b && T[k].t === 'w' && JOIN_W.has(T[k].u)) k++;
        if (!isKw(T[k], 'JOIN')) throw new Error('Unsupported FROM clause');
        k++;
        op = T.slice(s0, k).map(t => t.u).filter(u => u !== 'OUTER').join(' ');
        if (op === 'INNER JOIN') op = 'JOIN';
      }
    }
    const srcS = k;
    let ref = null, isSub = false;
    if (T[k].v === '('){ k = matchParen(T, k) + 1; isSub = true; }
    else {
      k++;
      while (k < b && T[k].v === '.') k += 2;
      if (k < b && T[k].v === '('){ ref = unq(T[k - 1].v); k = matchParen(T, k) + 1; }
      else ref = unq(T[k - 1].v);
    }
    const srcE = k;
    let alias = null;
    if (isKw(T[k], 'AS')){ alias = unq(T[k + 1].v); k += 2; }
    else if (k < b && (T[k].t === 'q' || (T[k].t === 'w' && !SRC_STOP.has(T[k].u)))){ alias = unq(T[k].v); k++; }
    if (isKw(T[k], 'INDEXED')) k += 3;
    else if (isKw(T[k], 'NOT') && isKw(T[k + 1], 'INDEXED')) k += 2;
    let on = null, using = null;
    if (isKw(T[k], 'ON')){
      const s = ++k;
      while (k < b && !(T[k].d === 0 && (T[k].v === ',' || (T[k].t === 'w' && (JOIN_W.has(T[k].u) || T[k].u === 'JOIN'))))) k++;
      on = sql.slice(T[s].s, T[k - 1].e);
    } else if (isKw(T[k], 'USING')){
      const close = matchParen(T, k + 1);
      using = sql.slice(T[k + 2].s, T[close].s).trim();
      k = close + 1;
    }
    segs.push({op, src: sql.slice(T[srcS].s, T[srcE - 1].e), srcText: sql.slice(T[srcS].s, T[k - 1].e).split(/\s+(?:ON|USING)\b/i)[0],
      ref: alias || (isSub ? null : ref), alias, isSub, on, using, end: T[k - 1].e, range: [segS, T[k - 1].e]});
  }
  return segs;
}

function aggCalls(A, a, b){
  const T = A.toks, out = [], subs = [];
  for (let k = a; k < b; k++) if (T[k].v === '(' && isKw(T[k + 1], 'SELECT', 'WITH', 'VALUES')) subs.push([k, matchParen(T, k)]);
  for (let k = a; k < b; k++){
    const t = T[k];
    if (t.t !== 'w' || !AGG_FNS.has(t.u) || !T[k + 1] || T[k + 1].v !== '(') continue;
    if (subs.some(([x, y]) => k > x && k < y)) continue;
    const close = matchParen(T, k + 1);
    let end = close;
    if (isKw(T[close + 1], 'FILTER') && T[close + 2] && T[close + 2].v === '(') end = matchParen(T, close + 2);
    if (isKw(T[end + 1], 'OVER')) continue;
    if ((t.u === 'MIN' || t.u === 'MAX') && T.slice(k + 2, close).some(x => x.v === ',' && x.d === T[k + 1].d + 1)) continue;
    out.push(A.sql.slice(t.s, T[end].e));
    k = end;
  }
  return out;
}

/* ---------- step builders ---------- */
function orderStep(W, querySql, prevRows, orderText, range){
  const st = safeStep(() => {
    const res = runQ(W + querySql);
    const pos = new Map();
    (prevRows || []).forEach((r, i) => { const k = keyOf(r); if (!pos.has(k)) pos.set(k, []); pos.get(k).push(i + 1); });
    const s = mkStep(res);
    s.cols = ['was #'].concat(res.cols);
    s.rows = res.rows.map(r => { const q = pos.get(keyOf(r)); return [q && q.length ? q.shift() : null].concat(r); });
    s.plain = res.rows;
    s.plainCols = res.cols;
    return s;
  });
  return Object.assign(st, {label: 'ORDER BY', title: 'Sort the rows', code: 'ORDER BY ' + orderText, ranges: [range],
    before: st.total, after: st.total,
    html: `Sort the ${plural(st.total, 'row')} by ${code(orderText)}. <code>ASC</code> (the default) puts the smallest first, <code>DESC</code> the largest; in SQLite NULLs come first when ascending. The <b>was #</b> column shows each row's position before sorting.`});
}
function limitStep(cols, rows, L, hasOrder){
  const st = safeStep(() => {
    const v = runQ('SELECT (' + L.lim + ')' + (L.off ? ', (' + L.off + ')' : '')).rows[0];
    const lim = Number(v[0]), off = Math.max(0, Number(v[1] || 0));
    return {cols, rows, total: rows.length, lim, off,
      status: rows.map((r, i) => i < off || (lim >= 0 && i >= off + lim) ? 'drop' : 'keep')};
  });
  const k = kept(st);
  return Object.assign(st, {label: 'LIMIT', title: 'Keep only some rows', code: 'LIMIT ' + L.lim + (L.off ? ' OFFSET ' + L.off : ''), ranges: [L.range],
    before: st.total, after: k,
    html: (st.off ? `Skip the first <b>${st.off}</b> rows (OFFSET), then keep` : 'Keep') + ` at most <b>${st.lim}</b> rows; the rest are thrown away. ${plural(k, 'row')} remain.` +
      (hasOrder ? '' : ' <span style="color:var(--warn)">Without ORDER BY the database may return any rows it likes.</span>')});
}

function buildCore(A, W, a, b, steps){
  const T = A.toks, sql = A.sql;
  const C = parseCore(A, a, b);
  const fromSql = C.from ? ' FROM ' + C.from.text : '';
  const whereSql = C.where ? ' WHERE ' + C.where.text : '';
  let proj = '*';
  const srcCols = new Set();

  /* FROM + JOINs */
  if (C.from){
    let segs = null;
    try { segs = parseFrom(A, C.from.a, C.from.b); } catch(e){ segs = null; }
    if (segs){
      let qualify = segs.every(g => g.ref);
      const all = [];
      let prev = 0;
      segs.forEach((g, idx) => {
        let cols = [];
        try { cols = runQ(W + 'SELECT * FROM ' + g.src + ' LIMIT 0').cols; } catch(e){ qualify = false; }
        cols.forEach(c => srcCols.add(c.toLowerCase()));
        const startCol = all.length;
        cols.forEach(c => all.push({ref: g.ref, col: c}));
        const p = qualify ? all.map(x => qi(x.ref) + '.' + qi(x.col) + ' AS ' + qi(x.ref + '.' + x.col)).join(', ') : '*';
        let n = null;
        try { n = runQ(W + 'SELECT COUNT(*) FROM ' + g.src).rows[0][0]; } catch(e){}
        const st = safeStep(() => {
          const res = runQ(W + 'SELECT ' + p + ' FROM ' + sql.slice(C.from.textS, g.end));
          const s = mkStep(res);
          if (idx > 0 && qualify && /LEFT|RIGHT|FULL/.test(g.op)){
            const nullIn = (row, x, y) => y > x && row.slice(x, y).every(v => v === null);
            s.status = res.rows.map(row =>
              (/LEFT|FULL/.test(g.op) && nullIn(row, startCol, all.length)) || (/RIGHT|FULL/.test(g.op) && nullIn(row, 0, startCol)) ? 'pad' : 'keep');
          }
          return s;
        });
        const name = g.isSub ? 'the subquery' : '<b>' + esc(g.src) + '</b>';
        const nick = g.alias ? ` (nicknamed <b>${esc(g.alias)}</b>)` : '';
        const pads = st.status ? st.status.filter(s => s === 'pad').length : 0;
        let html;
        if (idx === 0){
          html = (g.isSub ? 'Run the subquery in FROM and use its result as a table' : 'Everything starts with FROM: read every row of ' + name) +
            `${nick}: ${plural(st.total, 'row')}. Nothing is filtered or chosen yet; that comes later.`;
        } else if (g.op === ',' || g.op === 'CROSS JOIN'){
          html = `Combine every row so far (${prev}) with every row of ${name}${nick} (${n ?? '?'}): ${prev} × ${n ?? '?'} = ${plural(st.total, 'row')}. ` +
            (g.op === ',' ? 'A comma in FROM is a cross join; the matching condition is usually applied later in WHERE.' : '');
        } else {
          const cond = g.on ? 'the condition ' + code(g.on) + ' is true' : g.using ? 'the columns ' + code(g.using) + ' are equal' : 'all same-named columns are equal';
          html = `Pair each of the ${prev} rows so far with each of the ${n ?? '?'} rows of ${name}${nick}${n != null ? ` (${prev * n} combinations)` : ''} and keep only the pairs where ${cond}: ${plural(st.total, 'row')}.`;
          if (/LEFT/.test(g.op)) html += ` A <b>LEFT</b> join also keeps left rows that found no partner, filling the right side with NULL (<span style="color:var(--warn)">amber</span>): ${pads} such row${pads === 1 ? '' : 's'}.`;
          if (/RIGHT/.test(g.op)) html += ` A <b>RIGHT</b> join also keeps unmatched rows from ${name}, with NULL on the left (<span style="color:var(--warn)">amber</span>): ${pads}.`;
          if (/FULL/.test(g.op)) html += ` A <b>FULL</b> join keeps unmatched rows from both sides, NULL-padded (<span style="color:var(--warn)">amber</span>): ${pads}.`;
          if (g.op === 'JOIN') html += ' Rows without a partner disappear.';
        }
        Object.assign(st, {label: idx === 0 ? 'FROM' : g.op === ',' ? 'CROSS JOIN' : g.op,
          title: idx === 0 ? 'Read the source table' : 'Join ' + (g.isSub ? 'a subquery' : g.src),
          code: idx === 0 ? 'FROM ' + g.srcText : sql.slice(g.range[0], g.range[1]),
          ranges: [idx === 0 ? [C.from.range[0], g.range[1]] : g.range],
          before: idx === 0 ? null : prev, after: st.total, html});
        steps.push(st);
        prev = st.total || 0;
      });
      proj = qualify ? all.map(x => qi(x.ref) + '.' + qi(x.col) + ' AS ' + qi(x.ref + '.' + x.col)).join(', ') : '*';
    } else {
      const st = safeStep(() => mkStep(runQ(W + 'SELECT *' + fromSql)));
      steps.push(Object.assign(st, {label: 'FROM', title: 'Build the source rows', code: 'FROM ' + C.from.text, ranges: [C.from.range], after: st.total,
        html: `FROM produces the rows everything else works on: ${plural(st.total, 'row')}.`}));
    }
  }

  /* WHERE */
  if (C.where){
    const st = safeStep(() => mkStep(runQ(W + `SELECT ${proj}, CASE WHEN (${C.where.text}) THEN 1 ELSE 0 END AS __keep${fromSql}`)));
    const k = kept(st);
    steps.push(Object.assign(st, {label: 'WHERE', title: 'Filter rows', code: 'WHERE ' + C.where.text, ranges: [C.where.range], before: st.total, after: k,
      html: `Test ${code(C.where.text)} on each of the ${plural(st.total, 'row')}. A row stays only if the condition is <b>true</b>; false or NULL removes it (struck through). ${plural(k, 'row')} remain.`}));
  }

  /* GROUP BY / implicit aggregate / HAVING */
  const aggs = aggCalls(A, C.select.a, C.select.b);
  const grouped = !!C.groupBy || aggs.length > 0 || !!C.having;
  let gbItems = [];
  if (grouped){
    const aliasMap = {};
    C.select.items.forEach(it => { if (it.alias) aliasMap[it.alias.toLowerCase()] = it.expr; });
    gbItems = C.groupBy ? C.groupBy.items.map(g => {
      const t = g.trim();
      if (/^\d+$/.test(t) && C.select.items[+t - 1]) return C.select.items[+t - 1].expr;
      const k = unq(t).toLowerCase();
      return aliasMap[k] && !srcCols.has(k) ? aliasMap[k] : t;
    }) : [];
    const keys = gbItems.join(', ');
    const keyCols = gbItems.map(g => `(${g}) AS ${qi('⟨' + short(g, 30) + '⟩')}`);
    const st = safeStep(() => gbItems.length
      ? mkStep(runQ(W + `SELECT dense_rank() OVER (ORDER BY ${keys}) AS __grp, ${keyCols.join(', ')}, ${proj}${fromSql}${whereSql} ORDER BY ${keys}`))
      : mkStep(runQ(W + `SELECT 1 AS __grp, ${proj}${fromSql}${whereSql}`)));
    const g = st.group && st.group.length ? Math.max(...st.group) : (gbItems.length ? 0 : 1);
    if (gbItems.length){
      steps.push(Object.assign(st, {label: 'GROUP BY', title: 'Group rows', code: 'GROUP BY ' + C.groupBy.text, ranges: [C.groupBy.range], before: st.total, after: g,
        html: `Put rows that share the same ${gbItems.map(x => code(x, 40)).join(', ')} into one group. Each colored band is a group (the ⟨key⟩ column${gbItems.length > 1 ? 's show' : ' shows'} what they share): ${plural(g, 'group')}. From here on, each group will become <b>one</b> output row.`}));
    } else {
      steps.push(Object.assign(st, {label: 'AGGREGATE', title: 'All rows form one group', code: aggs.join(', ') || 'HAVING', ranges: [C.select.range], before: st.total, after: 1,
        html: `The query uses aggregate functions (${aggs.map(x => code(x, 40)).join(', ') || 'in HAVING'}) but has no GROUP BY, so all ${plural(st.total, 'row')} are treated as <b>a single group</b> and the result will be exactly one row.`}));
    }
    if (C.having){
      const hAggs = [...new Set(aggCalls(A, C.having.a, C.having.b))];
      const cols = keyCols.concat(hAggs.map(x => `${x} AS ${qi(short(x, 40))}`));
      cols.push(`CASE WHEN (${C.having.text}) THEN 1 ELSE 0 END AS __keep`);
      const gb = gbItems.length ? ` GROUP BY ${keys} ORDER BY ${keys}` : '';
      const hs = safeStep(() => {
        const s = mkStep(runQ(W + `SELECT ${cols.join(', ')}${fromSql}${whereSql}${gb}`));
        s.group = s.rows.map((r, i) => i + 1);
        return s;
      });
      const k = kept(hs);
      steps.push(Object.assign(hs, {label: 'HAVING', title: 'Filter groups', code: 'HAVING ' + C.having.text, ranges: [C.having.range], before: hs.total, after: k,
        html: `Now that rows are grouped, test ${code(C.having.text)} on each group (one row per group here). HAVING filters <b>groups</b>, just like WHERE filtered <b>rows</b>. ${plural(k, 'group')} remain.`}));
    }
  }

  /* SELECT list */
  const stop = C.orderBy ? C.orderBy.range[0] : C.limit ? C.limit.range[0] : C.end;
  const selSql = 'SELECT ' + C.select.text + ' ' + sql.slice(C.select.end, stop);
  const ss = safeStep(() => mkStep(runQ(W + selSql)));
  const items = C.select.items.slice(0, 8).map(it => code(it.text, 50)).join(', ') + (C.select.items.length > 8 ? ', …' : '');
  const hasWindow = /\bOVER\b/i.test(C.select.text);
  steps.push(Object.assign(ss, {label: 'SELECT', title: 'Choose and compute the output columns', code: 'SELECT ' + C.select.text, ranges: [C.select.range], after: ss.total,
    html: grouped
      ? `Build the output columns: ${items}. This runs <b>once per group</b>: plain columns come from the group's shared values and the aggregates summarize the rows inside each group. Result: ${plural(ss.total, 'row')} × ${visCols(ss).length} columns.`
      : `Build the output columns: ${items}. Columns that are not listed are dropped, expressions are calculated, and <code>AS</code> gives them a name. Note that SELECT runs <b>after</b> FROM and WHERE, even though it is written first.` +
        (hasWindow ? ' Window functions (<code>OVER …</code>) are computed here, looking across the rows that survived WHERE.' : '')}));
  let curCols = ss.cols, curRows = ss.rows;

  /* DISTINCT */
  if (C.distinct){
    const seen = new Set();
    const status = curRows.map(r => { const k = keyOf(r); if (seen.has(k)) return 'drop'; seen.add(k); return 'keep'; });
    const st = {cols: curCols, rows: curRows, total: curRows.length, status};
    const k = kept(st);
    steps.push(Object.assign(st, {label: 'DISTINCT', title: 'Remove duplicate rows', code: 'SELECT DISTINCT', ranges: [C.select.range], before: st.total, after: k,
      html: `DISTINCT keeps only the first copy of rows that are identical in <b>every</b> output column; the duplicates are struck through. ${plural(k, 'row')} remain.`}));
    curRows = visRows(st);
  }

  /* ORDER BY */
  if (C.orderBy){
    const st = orderStep(W, sql.slice(C.start, C.limit ? C.limit.range[0] : C.end), curRows, C.orderBy.text, C.orderBy.range);
    steps.push(st);
    if (!st.error){ curCols = st.plainCols; curRows = st.plain; }
  }

  /* LIMIT / OFFSET */
  if (C.limit){
    C.limit.range = C.limit.range || [0, 0];
    steps.push(limitStep(curCols, curRows, C.limit, !!C.orderBy));
  }
}

function buildCompound(A, W, parts, ops, steps){
  const T = A.toks, sql = A.sql;
  const [la, lb] = parts[parts.length - 1];
  let tailK = lb;
  for (let k = la; k < lb; k++){
    const t = T[k];
    if (t.d === 0 && t.t === 'w' && ((t.u === 'ORDER' && isKw(T[k + 1], 'BY')) || t.u === 'LIMIT')){ tailK = k; break; }
  }
  parts[parts.length - 1] = [la, tailK];
  const partRes = [];
  parts.forEach(([a, b], i) => {
    const text = sql.slice(T[a].s, T[b - 1].e);
    const st = safeStep(() => mkStep(runQ(W + text)));
    steps.push(Object.assign(st, {label: 'PART ' + (i + 1), title: `Run SELECT #${i + 1} on its own`, code: text, ranges: [[T[a].s, T[b - 1].e]], after: st.total,
      html: `A compound query first runs each SELECT separately. Part ${i + 1} returns ${plural(st.total, 'row')}.`}));
    partRes.push(st);
  });
  const cols = partRes[0].cols;
  let acc = (partRes[0].rows || []).map(r => ({r, from: 1}));
  ops.forEach((o, i) => {
    const right = (partRes[i + 1].rows || []).map(r => ({r, from: i + 2}));
    const rset = new Set(right.map(x => keyOf(x.r)));
    const seen = new Set();
    let rows, status, html;
    const once = x => { const k = keyOf(x.r); if (seen.has(k)) return false; seen.add(k); return true; };
    if (o.op === 'UNION ALL'){ rows = acc.concat(right); status = rows.map(() => 'keep'); html = 'UNION ALL simply stacks the rows of both sides, keeping duplicates.'; }
    else if (o.op === 'UNION'){ rows = acc.concat(right); status = rows.map(x => once(x) ? 'keep' : 'drop'); html = 'UNION stacks both sides and removes duplicate rows (struck through).'; }
    else if (o.op === 'INTERSECT'){ rows = acc; status = rows.map(x => rset.has(keyOf(x.r)) && once(x) ? 'keep' : 'drop'); html = `INTERSECT keeps only rows that also appear in part ${i + 2}.`; }
    else { rows = acc; status = rows.map(x => !rset.has(keyOf(x.r)) && once(x) ? 'keep' : 'drop'); html = `EXCEPT removes every row that also appears in part ${i + 2}.`; }
    const st = {cols: ['from part'].concat(cols), rows: rows.map(x => [x.from].concat(x.r)), total: rows.length, status, ranges: [[o.s, o.e]], label: o.op, title: 'Combine the parts', code: o.op};
    st.before = st.total; st.after = kept(st);
    st.html = html + ` ${plural(st.after, 'row')} remain.`;
    steps.push(st);
    acc = rows.filter((x, j) => status[j] === 'keep');
  });
  let curCols = cols, curRows = acc.map(x => x.r);
  if (tailK < lb){
    let limK = lb, hasOrder = false;
    for (let k = tailK; k < lb; k++) if (T[k].d === 0 && isKw(T[k], 'LIMIT')){ limK = k; break; }
    if (isKw(T[tailK], 'ORDER')){
      hasOrder = true;
      const ordText = sql.slice(T[tailK + 2].s, T[limK - 1].e);
      const st = orderStep(W, sql.slice(T[A.mainStart].s, T[limK - 1].e), curRows, ordText, [T[tailK].s, T[limK - 1].e]);
      steps.push(st);
      if (!st.error){ curCols = st.plainCols; curRows = st.plain; }
    }
    if (limK < lb){
      const L = parseLimit(A, limK + 1, lb);
      L.range = [T[limK].s, T[lb - 1].e];
      steps.push(limitStep(curCols, curRows, L, hasOrder));
    }
  }
}

function buildDml(A, W, steps){
  const T = A.toks, sql = A.sql;
  let k = A.mainStart;
  const verb = T[k].u;
  k++;
  if ((verb === 'INSERT' || verb === 'UPDATE') && isKw(T[k], 'OR')) k += 2;
  if ((verb === 'INSERT' || verb === 'REPLACE') && isKw(T[k], 'INTO')) k++;
  if (verb === 'DELETE' && isKw(T[k], 'FROM')) k++;
  const nameS = k;
  k++;
  if (T[k] && T[k].v === '.') k += 2;
  const tbl = sql.slice(T[nameS].s, T[k - 1].e);
  const tblRange = [T[A.mainStart].s, T[k - 1].e];

  let where = null, set = null, hasFrom = false, srcK = -1;
  const endAt = (j, words) => { let e = j; while (e < T.length && !(T[e].d === 0 && T[e].t === 'w' && words.includes(T[e].u))) e++; return e; };
  for (let j = k; j < T.length; j++){
    const t = T[j];
    if (t.d !== 0 || t.t !== 'w') continue;
    if (verb === 'UPDATE' && t.u === 'SET' && !set){ const e = endAt(j + 1, ['FROM','WHERE','RETURNING','ORDER','LIMIT']); set = {text: sql.slice(T[j + 1].s, T[e - 1].e), range: [t.s, T[e - 1].e]}; }
    if (verb === 'UPDATE' && t.u === 'FROM') hasFrom = true;
    if ((verb === 'UPDATE' || verb === 'DELETE') && t.u === 'WHERE'){ const e = endAt(j + 1, ['RETURNING','ORDER','LIMIT']); where = {text: sql.slice(T[j + 1].s, T[e - 1].e), range: [t.s, T[e - 1].e]}; break; }
    if ((verb === 'INSERT' || verb === 'REPLACE') && srcK < 0 && ['SELECT','VALUES','WITH'].includes(t.u)) srcK = j;
  }

  let before;
  try { before = runQ(W + `SELECT rowid AS __rid, * FROM ${tbl}`, 5000); }
  catch(e){ throw new Error(`Step-by-step needs to read ${tbl}: ${e.message}`); }
  const ridIdx = 0;

  // Simulate inside a savepoint, then roll back: the preview never changes data.
  let after, changes, err = null;
  db.exec('SAVEPOINT __sqllab_step');
  try {
    db.run(sql);
    changes = db.getRowsModified();
    after = runQ(`SELECT rowid AS __rid, * FROM ${tbl}`, 5000);
  } catch(e){ err = e; }
  finally { db.exec('ROLLBACK TO __sqllab_step; RELEASE __sqllab_step'); }
  if (err) throw err;

  const bMap = new Map(before.rows.map(r => [r[ridIdx], r]));
  const aMap = new Map(after.rows.map(r => [r[ridIdx], r]));

  steps.push({label: 'TABLE', title: 'The target table, before', cols: before.cols, rows: before.rows, total: before.total, ranges: [tblRange], code: tbl, after: before.total,
    html: `${verb} changes one table, <b>${esc(tbl)}</b>. This is what it looks like right now: ${plural(before.total, 'row')}.`});

  if (verb === 'UPDATE' || verb === 'DELETE'){
    let match;
    if (where && !hasFrom){
      try { match = new Set(runQ(W + `SELECT rowid FROM ${tbl} WHERE ${where.text}`, 1e6).rows.map(r => r[0])); } catch(e){ match = null; }
    } else if (!where) match = new Set(before.rows.map(r => r[ridIdx]));
    if (!match){
      match = new Set(before.rows.filter(r => verb === 'DELETE' ? !aMap.has(r[ridIdx]) : keyOf(r) !== keyOf(aMap.get(r[ridIdx]) || [])).map(r => r[ridIdx]));
    }
    steps.push({label: 'WHERE', title: `Find the rows to ${verb === 'DELETE' ? 'delete' : 'update'}`, cols: before.cols, rows: before.rows, total: before.total,
      status: before.rows.map(r => match.has(r[ridIdx]) ? 'hit' : 'drop'), ranges: where ? [where.range] : [tblRange], code: where ? 'WHERE ' + where.text : '(no WHERE)',
      before: before.total, after: match.size,
      html: where
        ? `Test ${code(where.text)} on every row. ${plural(match.size, 'row')} match (<span style="color:var(--accent-2)">highlighted</span>); the others will not be touched.`
        : `<span style="color:var(--warn)">There is no WHERE clause, so <b>every</b> row (${before.total}) is affected!</span>`});
  }

  const note = ` <b>${changes}</b> row${changes === 1 ? '' : 's'} affected. <span style="color:var(--warn)">This is only a preview; nothing was changed. Press <b>Run</b> to apply it.</span>`;
  if (verb === 'UPDATE'){
    const changed = new Set();
    after.rows.forEach((r, i) => { const b = bMap.get(r[ridIdx]); if (!b) return; r.forEach((v, c) => { if (keyOf([v]) !== keyOf([b[c]])) changed.add(i + ':' + c); }); });
    const rowsHit = new Set([...changed].map(x => +x.split(':')[0]));
    steps.push({label: 'SET', title: 'Write the new values', cols: after.cols, rows: after.rows, total: after.total, changed,
      status: after.rows.map((r, i) => rowsHit.has(i) ? 'hit' : 'keep'), ranges: set ? [set.range] : [], code: set ? 'SET ' + set.text : 'SET',
      html: `For each matched row, compute ${set ? code(set.text) : 'the SET expressions'} and store the result. Changed cells are highlighted.` + note});
  } else if (verb === 'DELETE'){
    steps.push({label: 'DELETE', title: 'Remove the matched rows', cols: before.cols, rows: before.rows, total: before.total,
      status: before.rows.map(r => aMap.has(r[ridIdx]) ? 'keep' : 'drop'), ranges: [[T[A.mainStart].s, sql.length]], code: 'DELETE',
      before: before.total, after: after.total,
      html: `The matched rows are removed (struck through). ${plural(after.total, 'row')} are left in the table.` + note});
  } else {
    if (srcK >= 0){
      let e = srcK;
      while (e < T.length && !(T[e].d === 0 && (isKw(T[e], 'RETURNING') || (isKw(T[e], 'ON') && isKw(T[e + 1], 'CONFLICT'))))) e++;
      const srcText = sql.slice(T[srcK].s, T[e - 1].e);
      const st = safeStep(() => mkStep(runQ((T[srcK].u === 'WITH' ? '' : W) + srcText)));
      if (!st.error) steps.push(Object.assign(st, {label: T[srcK].u === 'VALUES' ? 'VALUES' : 'SELECT', title: 'Produce the new rows', code: srcText, ranges: [[T[srcK].s, T[e - 1].e]], after: st.total,
        html: `First the ${T[srcK].u === 'VALUES' ? 'VALUES list' : 'query'} produces the rows to insert: ${plural(st.total, 'row')}.`}));
    }
    const removed = before.rows.filter(r => !aMap.has(r[ridIdx]));
    const rows = after.rows.concat(removed);
    const status = after.rows.map(r => bMap.has(r[ridIdx]) ? (keyOf(r) === keyOf(bMap.get(r[ridIdx])) ? 'keep' : 'hit') : 'new').concat(removed.map(() => 'drop'));
    const added = status.filter(s => s === 'new').length;
    steps.push({label: verb, title: 'Add the rows to the table', cols: after.cols, rows, total: rows.length, status, ranges: [[T[A.mainStart].s, sql.length]], code: verb,
      before: before.total, after: after.total,
      html: `${plural(added, 'new row')} are added (<span style="color:var(--sql)">green</span>)` +
        (removed.length ? `; ${removed.length} conflicting row${removed.length === 1 ? ' was' : 's were'} replaced (struck through)` : '') + '.' + note});
  }
}

function buildSteps(text){
  const A = analyzeSql(text);
  const W = A.withText ? A.withText + ' ' : '';
  const steps = [];
  if (A.kind === 'other') throw new Error('Step-by-step works on SELECT, INSERT, UPDATE and DELETE statements.');
  A.ctes.forEach(c => {
    const st = safeStep(() => mkStep(runQ(A.withText + ' SELECT * FROM ' + qi(c.name))));
    const rec = A.recursive && new RegExp('\\b' + c.name.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '\\b', 'i').test(c.body);
    steps.push(Object.assign(st, {label: 'WITH ' + c.name, title: `Build the temporary table ${c.name}`, code: c.name + ' AS (…)', ranges: [[c.s, c.e]], after: st.total,
      html: `WITH defines a named, temporary result that the rest of the query can use like a table. <b>${esc(c.name)}</b> has ${plural(st.total, 'row')}.` +
        (rec ? ' It is <b>recursive</b>: the first SELECT (the anchor) produces the starting rows, then the part after UNION runs again and again on the rows from the previous round until no new rows appear.' : '')}));
  });
  if (A.kind === 'dml'){ buildDml(A, W, steps); return steps; }

  const T = A.toks, parts = [], ops = [];
  let ps = A.mainStart;
  for (let k = A.mainStart; k < T.length; k++){
    const t = T[k];
    if (t.d !== 0 || !isKw(t, 'UNION', 'INTERSECT', 'EXCEPT')) continue;
    parts.push([ps, k]);
    let op = t.u;
    if (t.u === 'UNION' && isKw(T[k + 1], 'ALL')){ op = 'UNION ALL'; k++; }
    ops.push({op, s: t.s, e: T[k].e});
    ps = k + 1;
  }
  parts.push([ps, T.length]);
  if (parts.length === 1) buildCore(A, W, A.mainStart, T.length, steps);
  else buildCompound(A, W, parts, ops, steps);

  const fin = safeStep(() => mkStep(runQ(text)));
  steps.push(Object.assign(fin, {label: 'RESULT', title: 'Final result', code: short(text, 80), ranges: [], after: fin.total,
    html: `This is exactly what <b>Run</b> returns: ${plural(fin.total, 'row')}.`}));
  return steps;
}

/* ---------- stepper UI ---------- */
let stepper = null, stepMarks = [], stepTimer = null;
function clearStepMarks(){ stepMarks.forEach(m => m.clear()); stepMarks = []; }
function stopPlay(){ if (stepTimer){ clearInterval(stepTimer); stepTimer = null; } }
const stepsShown = () => !!(results[activeResult] && results[activeResult].kind === 'steps');

function stepThrough(){
  let text, from;
  const sel = cm.getSelection();
  if (sel.trim()){ text = sel; from = cm.indexFromPos(cm.getCursor('from')); }
  else { const st = currentStatement(); if (!st) return; text = st.sql; from = st.from; }
  const rs = splitStatements(text);
  if (!rs.length) return;
  from += rs[0].from;
  text = text.slice(rs[0].from, rs[0].to);
  clearErrorMark();
  stopPlay();
  const t0 = performance.now();
  let steps;
  try {
    db.prepare(text).free();            // surfaces syntax / schema errors first
    steps = buildSteps(text);
  } catch(err){
    const lead = text.length - text.replace(/^(\s|--[^\n]*\n|\/\*[\s\S]*?\*\/)*/, '').length;
    const line = cm.posFromIndex(from + lead).line;
    markErrorLine(line);
    messages.unshift({t: now(), kind: 'err', text: `Step-by-step, line ${line + 1}: ${err.message}`, q: short(text, 200)});
    results = []; activeResult = -1;
    renderResults({count: 1, failed: true, totalMs: performance.now() - t0});
    return;
  }
  flash(from, from + text.length);
  stepper = {steps, i: 0, from, len: text.length, stale: false};
  results = [{kind: 'steps', total: steps.length, cols: []}];
  activeResult = 0;
  messages.unshift({t: now(), kind: 'ok', text: `Step-by-step: ${steps.length} steps.`, q: short(text, 200)});
  const trimmed = text.trim();
  if (history.length && history[0].sql === trimmed) history.shift();
  history.unshift({sql: trimmed, ts: Date.now(), ok: true, ms: Math.round(performance.now() - t0), label: 'steps'});
  history = history.slice(0, 100); LS.set('history', history); renderHistory();
  // Give the step view room if the editor is taking most of the height.
  const ed = $('#editorWrap'), work = document.querySelector('.work');
  if (ed.getBoundingClientRect().height > work.getBoundingClientRect().height * 0.5){ ed.style.flexBasis = '38%'; cm.refresh(); }
  renderResults({count: 1, failed: false, totalMs: performance.now() - t0});
}
function stepGo(j){
  if (!stepper) return;
  stepper.i = Math.max(0, Math.min(stepper.steps.length - 1, j));
  if (stepper.i === stepper.steps.length - 1) stopPlay();
  renderResults();
}
function togglePlay(){
  if (stepTimer){ stopPlay(); renderResults(); return; }
  if (stepper.i >= stepper.steps.length - 1) stepper.i = 0;
  stepTimer = setInterval(() => stepGo(stepper.i + 1), 2200);
  renderResults();
}
function markStep(){
  clearStepMarks();
  if (!stepper || stepper.stale) return;
  const st = stepper.steps[stepper.i];
  st.ranges.forEach(([s, e]) => {
    if (e <= s) return;
    stepMarks.push(cm.markText(cm.posFromIndex(stepper.from + s), cm.posFromIndex(stepper.from + e), {className: 'cm-step-mark'}));
  });
  if (st.ranges[0]) cm.scrollIntoView(cm.posFromIndex(stepper.from + st.ranges[0][0]), 40);
}
function renderStepTable(st){
  const vi = st.cols.map((c, i) => i).filter(i => !st.cols[i].startsWith('__'));
  const n = Math.min(st.rows.length, 1000);
  let h = '<table class="grid"><thead><tr><th class="rn">#</th>' + (st.group ? '<th class="rn">grp</th>' : '') +
    vi.map(i => `<th style="cursor:default">${esc(st.cols[i])}</th>`).join('') + '</tr></thead><tbody>';
  for (let r = 0; r < n; r++){
    const row = st.rows[r], s = st.status ? st.status[r] : 'keep';
    const g = st.group ? st.group[r] : null;
    h += `<tr class="s-${s}${g != null ? ' grp' : ''}"${g != null ? ` style="--gh:${(g * 67) % 360}"` : ''}><td class="rn">${r + 1}</td>` +
      (g != null ? `<td class="rn gcell">${g}</td>` : '');
    for (const i of vi){
      const o = cellOut(row[i]);
      const chg = st.changed && st.changed.has(r + ':' + i) ? ' chg' : '';
      h += `<td class="${o.cls}${chg}" title="${esc(o.text)}">${esc(o.text)}</td>`;
    }
    h += '</tr>';
  }
  h += '</tbody></table>';
  if (!st.rows.length) h += '<div class="trunc" style="color:var(--text-faint)">(no rows)</div>';
  if (st.total > n) h += `<div class="trunc">Showing the first ${n.toLocaleString()} of ${st.total.toLocaleString()} rows.</div>`;
  return h;
}
function renderSteps(){
  const S = stepper, st = S.steps[S.i], last = S.steps.length - 1;
  const chips = S.steps.map((s, j) => `<button class="chip${j === S.i ? ' on' : j < S.i ? ' done' : ''}" data-sj="${j}" title="${esc(s.title || '')}">${esc(s.label)}</button>`).join('<span class="parr">›</span>');
  const statuses = new Set(st.status || []);
  const legend = [
    statuses.has('drop') && '<span><i style="background:var(--err)"></i>removed</span>',
    statuses.has('pad') && '<span><i style="background:var(--warn)"></i>no match → NULLs</span>',
    statuses.has('hit') && '<span><i style="background:var(--accent-2)"></i>affected</span>',
    statuses.has('new') && '<span><i style="background:var(--sql)"></i>new</span>',
    st.group && '<span><i style="background:linear-gradient(90deg,#e66,#6e6,#66e)"></i>one color per group</span>',
    st.changed && st.changed.size && '<span><i style="background:#ffb547"></i>changed value</span>'
  ].filter(Boolean).join('');
  const counts = st.before != null && st.after != null && st.before !== st.after
    ? `<span><b>${st.before}</b> → <b>${st.after}</b> rows</span>` : st.after != null ? `<span><b>${st.after}</b> rows</span>` : '';
  return `<div class="steps">
    <div class="steps-bar">
      <div class="sctl">
        <button class="sbtn" data-sx="first" title="First step (Home)" ${S.i === 0 ? 'disabled' : ''}><svg viewBox="0 0 16 16" width="13" height="13" fill="currentColor" aria-hidden="true"><rect x="2" y="3" width="2" height="10" rx=".5"/><path d="M14 3v10L5 8z"/></svg></button>
        <button class="sbtn" data-sx="prev" title="Previous step (←)" ${S.i === 0 ? 'disabled' : ''}><svg viewBox="0 0 16 16" width="13" height="13" fill="currentColor" aria-hidden="true"><path d="M12 3v10L3 8z"/></svg></button>
        <span class="scount">${S.i + 1} / ${S.steps.length}</span>
        <button class="sbtn" data-sx="next" title="Next step (→)" ${S.i === last ? 'disabled' : ''}><svg viewBox="0 0 16 16" width="13" height="13" fill="currentColor" aria-hidden="true"><path d="M4 3v10l9-5z"/></svg></button>
        <button class="sbtn" data-sx="last" title="Last step (End)" ${S.i === last ? 'disabled' : ''}><svg viewBox="0 0 16 16" width="13" height="13" fill="currentColor" aria-hidden="true"><rect x="12" y="3" width="2" height="10" rx=".5"/><path d="M2 3v10l9-5z"/></svg></button>
        <button class="sbtn play" data-sx="play" title="Play / pause (Space)">${stepTimer ? '<svg viewBox="0 0 16 16" width="13" height="13" fill="currentColor" aria-hidden="true"><rect x="3" y="3" width="3.5" height="10" rx=".8"/><rect x="9.5" y="3" width="3.5" height="10" rx=".8"/></svg>' : '<svg viewBox="0 0 16 16" width="13" height="13" fill="currentColor" aria-hidden="true"><path d="M3 2.5v11L13.5 8z"/></svg>'}</button>
      </div>
      <div class="pipe" id="pipe">${chips}</div>
    </div>
    <div class="step-info">
      <div class="step-title"><span class="clause">${esc(st.label)}</span>${esc(st.title || '')}</div>
      <p>${st.html || ''}</p>
      <div class="step-meta">${counts}${st.code ? `<span class="scode">${esc(short(st.code, 160))}</span>` : ''}${legend ? `<span class="legend">${legend}</span>` : ''}</div>
    </div>
    <div class="step-table">${st.error ? `<div class="step-err">Could not build this intermediate table: ${esc(st.error)}</div>` : renderStepTable(st)}</div>
  </div>`;
}
$('#rbody').addEventListener('click', e => {
  const b = e.target.closest('[data-sx]');
  if (b){
    const a = b.dataset.sx;
    if (a === 'play') togglePlay();
    else { stopPlay(); stepGo(a === 'first' ? 0 : a === 'last' ? Infinity : stepper.i + (a === 'next' ? 1 : -1)); }
    const again = document.querySelector(`[data-sx="${a}"]`);
    if (again && !again.disabled) again.focus(); else { const nb = document.querySelector('.steps-bar .sbtn:not([disabled])'); if (nb) nb.focus(); }
    return;
  }
  const c = e.target.closest('[data-sj]');
  if (c){ stopPlay(); stepGo(+c.dataset.sj); }
});
document.addEventListener('keydown', e => {
  if (!stepsShown() || !stepper) return;
  if (e.target.closest && (e.target.closest('.CodeMirror') || /^(INPUT|SELECT|TEXTAREA)$/.test(e.target.tagName))) return;
  const k = e.key;
  if (k === 'ArrowRight'){ stopPlay(); stepGo(stepper.i + 1); }
  else if (k === 'ArrowLeft'){ stopPlay(); stepGo(stepper.i - 1); }
  else if (k === 'Home'){ stopPlay(); stepGo(0); }
  else if (k === 'End'){ stopPlay(); stepGo(Infinity); }
  else if (k === ' ' && e.target.tagName !== 'BUTTON'){ togglePlay(); }
  else return;
  e.preventDefault();
});
