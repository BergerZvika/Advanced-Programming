     'CREATE VIEW IF NOT EXISTS honor_roll AS\nSELECT s.name, e.grade FROM students s JOIN enrollments e USING (student_id) WHERE e.grade >= 90;\nSELECT * FROM honor_roll;', true],
    ['CREATE TRIGGER', 'Run statements automatically when rows change.', 'CREATE TRIGGER name AFTER INSERT ON t BEGIN … END;',
     "CREATE TABLE IF NOT EXISTS signups (name TEXT, at TEXT);\nCREATE TRIGGER IF NOT EXISTS log_signup AFTER INSERT ON students\nBEGIN\n  INSERT INTO signups VALUES (NEW.name, DATETIME('now'));\nEND;\nINSERT INTO students (name, age, city) VALUES ('Lior', 21, 'Haifa');\nSELECT * FROM signups;", true]
  ]},
  {cat:'Transactions', items:[
    ['BEGIN · COMMIT · ROLLBACK', 'Group changes so they all happen, or none do. ROLLBACK undoes them.', 'BEGIN; … COMMIT;  or  BEGIN; … ROLLBACK;',
     'BEGIN;\nDELETE FROM enrollments;\nSELECT COUNT(*) AS during FROM enrollments;\nROLLBACK;\nSELECT COUNT(*) AS after_rollback FROM enrollments;']
  ]}
];

let refCat = 'All';
const REF_FLAT = SQL_REF.flatMap((g, gi) => g.items.map((it, ii) => ({cat:g.cat, gi, ii, name:it[0], desc:it[1], syn:it[2], ex:it[3], mod:!!it[4]})));
function hlCode(code){
  const el = document.createElement('div');
  if (window.CodeMirror && CodeMirror.runMode) CodeMirror.runMode(code, 'text/x-sqlite', el); else el.textContent = code;
  return el.innerHTML;
}
function renderRefNote(){
  const ds = currentDataset();
  $('#refNote').innerHTML = ds === 'school'
    ? 'Examples use the <b>School</b> database (students, courses, enrollments). <b>Run</b> opens them in a <b>Reference</b> tab.'
    : 'Examples use the <b>School</b> database (students, courses, enrollments). <button id="refSchool">Load School database</button>';
  const b = $('#refSchool');
  if (b) b.onclick = () => {
    if (!confirm('Switch to the School database? The current database and your changes to it will be replaced.')) return;
    switchDataset('school', 'Loaded'); renderRefNote();
  };
}
function renderRef(){
  const q = $('#refSearch').value.trim().toLowerCase();
  const words = q.split(/\s+/).filter(Boolean);
  const match = r => (refCat === 'All' || r.cat === refCat) &&
    words.every(w => (r.name + ' ' + r.desc + ' ' + r.syn + ' ' + r.ex + ' ' + r.cat).toLowerCase().includes(w));
  const list = REF_FLAT.filter(match);
  $('#refCats').innerHTML = ['All', ...SQL_REF.map(g => g.cat)].map(c =>
    `<button data-cat="${esc(c)}" class="${c === refCat ? 'on' : ''}">${esc(c)}</button>`).join('');
  $('#refCount').textContent = list.length === REF_FLAT.length ? `${REF_FLAT.length} commands` : `${list.length} of ${REF_FLAT.length}`;
  const mark = s => { let h = esc(s); for (const w of words) h = h.replace(new RegExp(w.replace(/[.*+?^${}()|[\]\\]/g, '\\$&').replace(/&/g, '&amp;').replace(/</g, '&lt;'), 'gi'), m => `<mark>${m}</mark>`); return h; };
  let html = '', last = null;
  for (const r of list){
    if (r.cat !== last){ html += `<div class="ref-cat">${esc(r.cat)}</div>`; last = r.cat; }
    html += `<div class="ref-card"><h3>${mark(r.name)}${r.mod ? '<span class="mod" title="Changes the database. Reset DB restores the original data.">changes data</span>' : ''}</h3>` +
      `<p>${mark(r.desc)}</p><div class="ref-syn">${esc(r.syn)}</div><pre class="ref-ex cm-s-default">${hlCode(r.ex)}</pre>` +
      `<div class="ref-acts"><button class="run" data-run="${r.gi}.${r.ii}">▶ Run</button><button data-ins="${r.gi}.${r.ii}">Insert at cursor</button><button data-copy="${r.gi}.${r.ii}">Copy</button></div></div>`;
  }
  $('#refBody').innerHTML = html || '<div class="ref-empty">No command matches that search.</div>';
}
function openRef(){
  renderRefNote(); renderRef();
  $('#ref').classList.add('on'); $('#refBack').classList.add('on'); $('#ref').setAttribute('aria-hidden', 'false');
  setTimeout(() => $('#refSearch').focus(), 60);
}
function closeRef(){
  $('#ref').classList.remove('on'); $('#refBack').classList.remove('on'); $('#ref').setAttribute('aria-hidden', 'true');
  cm.focus();
}
const refItem = key => { const [gi, ii] = key.split('.').map(Number); return REF_FLAT.find(r => r.gi === gi && r.ii === ii); };
$('#refBtn').addEventListener('click', () => $('#ref').classList.contains('on') ? closeRef() : openRef());
$('#refClose').addEventListener('click', closeRef);
$('#refBack').addEventListener('click', closeRef);
$('#refSearch').addEventListener('input', renderRef);
$('#refSearch').addEventListener('keydown', e => { if (e.key === 'Escape'){ e.stopPropagation(); if (e.target.value){ e.target.value = ''; renderRef(); } else closeRef(); } });
$('#refCats').addEventListener('click', e => { const b = e.target.closest('[data-cat]'); if (!b) return; refCat = b.dataset.cat; renderRef(); });
$('#refBody').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.run){
    const r = refItem(b.dataset.run), text = `-- ${r.name}: ${r.desc}\n${r.ex}\n`;
    const ri = tabs.findIndex(t => t.name === 'Reference');
    if (ri >= 0){ if (ri !== activeTab) switchTab(ri); cm.setValue(text); cm.clearHistory(); saveTabs(); }
    else addTab('Reference', text);
    closeRef();
    runAll();
  } else if (b.dataset.ins){
    const r = refItem(b.dataset.ins);
    closeRef();
    cm.replaceSelection(r.ex + '\n');
    cm.focus();
  } else if (b.dataset.copy){
    const r = refItem(b.dataset.copy);
    navigator.clipboard.writeText(r.ex).then(() => { b.textContent = 'Copied ✓'; setTimeout(() => b.textContent = 'Copy', 1200); });
  }
});
document.addEventListener('keydown', e => {
  if (e.key === 'F1'){ e.preventDefault(); $('#ref').classList.contains('on') ? closeRef() : openRef(); }
  else if (e.key === 'Escape' && $('#ref').classList.contains('on')) closeRef();
});

/* ================================================================
   Toolbar
   ================================================================ */
$('#runBtn').addEventListener('click', () => { runAll(); cm.focus(); });
$('#runCurBtn').addEventListener('click', () => { runCurrent(); cm.focus(); });
$('#explainBtn').addEventListener('click', () => { explainCurrent(); cm.focus(); });
$('#stepBtn').addEventListener('click', () => stepThrough());
function switchDataset(kind, verb){
  loadDataset(kind);
  datasetOptions(); refreshSchema(); renderExamples(); persistDb();
  const d = DATASETS[kind];
  messages.unshift({t:now(), kind:'info', text: kind === 'empty' ? 'Started a new empty database.' : `${verb} the ${d.name} database: ${d.tables}.`});
  results = []; activeResult = -1; renderResults();
}
$('#dataset').addEventListener('change', () => {
  const kind = $('#dataset').value, d = DATASETS[kind];
  if (!d) return;
  if (!confirm(`Switch to the ${d.name} database? The current database and your changes to it will be replaced.`)){ datasetOptions(); return; }
  switchDataset(kind, 'Loaded');
});
$('#resetBtn').addEventListener('click', () => {
  const kind = currentDataset();
  if (!DATASETS[kind]){ alert('This database was opened from a file. Pick a built-in database from the menu to start over.'); return; }
  if (!confirm(`Reset the ${DATASETS[kind].name} database to its original data? Your changes will be lost.`)) return;
  switchDataset(kind, 'Reset');
});
$('#exportBtn').addEventListener('click', () => {
  if (inTransaction()){ alert('A transaction is open. Run COMMIT or ROLLBACK first.'); return; }
  const data = db.export();
  db.exec('PRAGMA foreign_keys = ON;');
  download('sql-lab.sqlite', data, 'application/vnd.sqlite3');
});
$('#importBtn').addEventListener('click', () => $('#fileIn').click());
$('#fileIn').addEventListener('change', async e => {
  const f = e.target.files[0]; e.target.value = '';
  if (!f) return;
  try {
    const u8 = new Uint8Array(await f.arrayBuffer());
    const next = new SQL.Database(u8);
    next.exec('SELECT COUNT(*) FROM sqlite_schema'); // throws if not a SQLite file
    db.close(); db = next;
    db.exec('PRAGMA foreign_keys = ON;');
    LS.set('dataset', 'custom');
    datasetOptions(); refreshSchema(); renderExamples(); persistDb();
    messages.unshift({t:now(), kind:'ok', text:`Opened ${f.name} (${fmtBytes(u8.length)}).`});
  } catch(err){
    messages.unshift({t:now(), kind:'err', text:`Could not open ${f.name}: ${err.message}`});
  }
  results = []; activeResult = -1; renderResults();
});

/* ================================================================
   Splitter
   ================================================================ */
(function(){
  const sp = $('#splitter'), ed = $('#editorWrap'), work = document.querySelector('.work');
  const saved = LS.get('split', null);
  if (saved) ed.style.flexBasis = saved;
  sp.addEventListener('pointerdown', e => {
    sp.setPointerCapture(e.pointerId); sp.classList.add('drag');
    const top = ed.getBoundingClientRect().top, totalH = work.getBoundingClientRect().bottom - top;
    const move = ev => {
      const pct = Math.min(85, Math.max(15, (ev.clientY - top) / totalH * 100));
      ed.style.flexBasis = pct + '%'; cm && cm.refresh();
    };
    const up = () => {
      sp.classList.remove('drag'); sp.removeEventListener('pointermove', move); sp.removeEventListener('pointerup', up);
      LS.set('split', ed.style.flexBasis);
    };
    sp.addEventListener('pointermove', move); sp.addEventListener('pointerup', up);
  });
})();

/* ================================================================
   Boot
   ================================================================ */
function initEditor(){
  const mac = /Mac|iPhone|iPad/.test(navigator.platform);
  const extra = {
    'Ctrl-Enter': runAll, 'Cmd-Enter': runAll,
    'Shift-Ctrl-Enter': runCurrent, 'Shift-Cmd-Enter': runCurrent,
    'Alt-Enter': () => stepThrough(),
    'Ctrl-Space': 'autocomplete',
    'Ctrl-/': 'toggleComment', 'Cmd-/': 'toggleComment',
    'Ctrl-S': () => saveTabs(), 'Cmd-S': () => saveTabs(),
    'Tab': c => c.somethingSelected() ? c.indentSelection('add') : c.replaceSelection('  ')
  };
  cm = CodeMirror($('#editorWrap'), {
    value: tabs[activeTab].sql,
    mode: 'text/x-sqlite',
    lineNumbers: true,
    indentUnit: 2, tabSize: 2,
    matchBrackets: true,
    autoCloseBrackets: true,
    styleActiveLine: true,
    extraKeys: extra,
    hintOptions: {tables: {}, completeSingle: false}
  });
  if (mac){
    document.querySelectorAll('.btn kbd').forEach(k => { k.textContent = k.textContent.replace('Ctrl', '⌘'); });
  }
  let saveT;
  cm.on('change', () => { clearErrorMark(); if (stepper && !stepper.stale){ stepper.stale = true; clearStepMarks(); } clearTimeout(saveT); saveT = setTimeout(saveTabs, 400); });
  cm.on('cursorActivity', () => { const p = cm.getCursor(); $('#sbPos').textContent = `Ln ${p.line + 1}, Col ${p.ch + 1}`; });
  cm.on('inputRead', (c, change) => {
    if (c.state.completionActive || change.origin !== '+input') return;
    const ch = change.text[0];
    if (ch === '.') { c.showHint({completeSingle:false}); return; }
    if (!/^\w$/.test(ch)) return;
    const tok = c.getTokenAt(c.getCursor());
    if (tok.type === 'comment' || tok.type === 'string') return;
    if (/^\w{2,}$/.test(tok.string)) c.showHint({completeSingle:false});
  });
}

async function boot(){
  try {
    SQL = await initSqlJs({locateFile: f => 'https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.10.3/' + f});
  } catch(err){
    $('#loadingMsg').innerHTML = 'Could not load SQLite: ' + esc(err.message) + '<br>Check your internet connection and reload.';
    $('#loading .spin').style.display = 'none';
    return;
  }
  initEditor();

  let ds = LS.get('dataset', DEFAULT_DATASET);
  if (ds === 'sample') ds = 'company';             // older versions had one combined sample
  const saved = LS.get('db', null);
  let restored = false;
  if (saved){
    try { db = new SQL.Database(b64ToU8(saved)); db.exec('SELECT 1 FROM sqlite_schema LIMIT 1; PRAGMA foreign_keys = ON;'); restored = true; }
    catch(e){ db = null; }
  }
  // the new welcome query reads the School tables; switch a restored database that has no students table to School
  if (restored && welcomeReset && !db.exec("SELECT 1 FROM sqlite_schema WHERE type = 'table' AND name = 'students'").length){
    db.close(); db = null; restored = false; ds = DEFAULT_DATASET;
  }
  if (!restored) loadDataset(DATASETS[ds] ? ds : DEFAULT_DATASET);
  else LS.set('dataset', ds);
  datasetOptions();

  $('#sbEngine').textContent = 'SQLite ' + q1('SELECT sqlite_version()')[0][0];
  refreshSchema();
  renderTabs();
  renderExamples();
  renderHistory();
  const pane = LS.get('pane', 'schema');
  const pb = document.querySelector(`.stabs [data-p="${pane}"]`); if (pb) pb.click();
  messages.push({t:now(), kind:'info', text: restored ? 'Restored your database from the last session.' : `Loaded the ${DATASETS[currentDataset()].name} database: ${DATASETS[currentDataset()].tables}. Pick another one from the menu at the top.`});
  // The Relational Algebra lab hands over its SQL translation through localStorage.
  const handoff = LS.get('handoff', null);
  if (handoff && handoff.sql){
    LS.del('handoff');
    addTab(String(handoff.name || 'From RA').slice(0, 40), String(handoff.sql));
    messages.push({t:now(), kind:'info', text: handoff.note ? String(handoff.note) :
      'Opened the SQL translated from the Relational Algebra lab in a new tab. Press Run: its relations are inlined with WITH, so your tables are not changed.'});
  }
  activeResult = -1;
  renderResults();
  persistDb();
  $('#loading').remove();
  cm.refresh(); cm.focus();
  cm.setCursor(CodeMirror.Pos(cm.lastLine()));
}
boot();
})();
</script>
