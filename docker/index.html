        print('PostgreSQL init process complete; ready for start up.');
        print('LOG:  database system is ready to accept connections'); return;
      case 'missing':
        return crash([`python: can't open file '${this.abs(c, p.file)}': [Errno 2] No such file or directory`], 2);
      case 'python': {
        const A = p.app, img = this.imgs[c.image];
        const fileLine = (n, code) => [`Traceback (most recent call last):`, `  File "${this.abs(c, p.file)}", line ${n}, in <module>`, `    ${A.lines[n - 1].trim()}`, code];
        for(const mod of ['flask', 'redis', 'requests', 'psycopg2']){
          if(A.imports.has(mod) && !img.pkgs.has(mod)){
            const n = A.lines.findIndex(l => new RegExp(`^(from|import)\\s+${mod}\\b`).test(l.trim())) + 1;
            return crash(fileLine(n, `ModuleNotFoundError: No module named '${mod}'`), 1);
          }
        }
        for(const [, e] of Object.entries(A.env)) if(e.required && c.env[e.key] === undefined) return crash(fileLine(e.line, `KeyError: '${e.key}'`), 1);
        const vars = this.pyVars(c, A);
        for(const pr of A.prints) print(this.fill(pr, vars, c));
        if(A.exit !== null && !A.server) return this.exit(c, A.exit, out);
        if(!A.server) return this.exit(c, 0, out);
        print(` * Serving Flask app 'app'`);
        print(` * Running on http://0.0.0.0:${p.server.port}`);
        return;
      }
      case 'repl':
        if(interactive){ out.say('Python 3.12.7 (main) [GCC 12.2.0] on linux\n>>> (the simulator does not run a real Python REPL; type exit)', 'dim'); }
        return this.exit(c, 0, out);
      case 'sleep': return;
      case 'shell':
        if(interactive){ this.shell = {cid: c.id, viaExec: false}; return; }
        return this.exit(c, 0, out);
      case 'cmd': {
        const res = this.shellRun(c, p.argv, true);
        res.forEach(l => print(l.text));
        return this.exit(c, res.code ?? 0, out);
      }
      case 'notfound':
        c.status = 'created'; c.exitCode = 127;
        out.err(`docker: Error response from daemon: failed to create task for container: exec: "${p.bin}": executable file not found in $PATH: unknown.`);
        return;
    }
  }
  exit(c, code, out){
    c.status = 'exited'; c.exitCode = code; c.finished = this.clock; c.health = null;
    this.touch('ctr:' + c.id);
    if(c.manualStop) return;
    const pol = c.restart || 'no';
    const again = pol === 'always' || pol === 'unless-stopped' || (pol.startsWith('on-failure') && code !== 0);
    if(again && c.restartCount < 50){
      c.restartCount++; c.status = 'restarting';
      c.logs.push(`(Docker: main process exited with code ${code}; restart policy "${pol}" restarts it, #${c.restartCount})`);
      if(out && out.say) out.say(`↻ ${c.name} exited (code ${code}) → restart policy "${pol}" will restart it (#${c.restartCount})`, 'warn');
      this.events.push({type: 'restart', id: c.id});
    }
  }

  /* ---------- mini shell inside a container ---------- */
  shellRun(c, argv, fromMain){
    const out = []; const say = (t, cls) => out.push({text: t, cls}); let code = 0;
    const img = this.imgs[c.image];
    if(argv[0] === 'sh' || argv[0] === '/bin/sh' || argv[0] === 'bash'){
      if(argv[1] === '-c'){
        const r = []; let last = 0;
        for(const part of splitChain(argv.slice(2).join(' '))){ const x = this.shellRun(c, tokenize(part), fromMain); r.push(...x); last = x.code; if(x.code) break; }
        r.code = last; return r;
      }
      out.code = 0; return out;
    }
    let redir = null;
    const ri = argv.findIndex(a => a === '>' || a === '>>');
    if(ri >= 0){ redir = {mode: argv[ri], file: argv[ri + 1]}; argv = argv.slice(0, ri); }
    const [cmd, ...a] = argv;
    const has = t => img.tools.has(t) || (c.installed || []).includes(t);
    if(!has(cmd) && !['exit', 'cd', 'pwd', 'echo', 'kill', 'true'].includes(cmd)){
      say(`sh: ${cmd}: not found`, 'err'); out.code = 127; return out;
    }
    const text = [];
    switch(cmd){
      case 'echo': text.push(a.join(' ')); break;
      case 'cat': for(const f of a){ const v = this.readFile(c, this.abs(c, f)); if(v === undefined){ say(`cat: can't open '${f}': No such file or directory`, 'err'); out.code = 1; return out; } text.push(...String(v).replace(/\n$/, '').split('\n')); } break;
      case 'ls': { const d = this.abs(c, a.filter(x => !x.startsWith('-'))[0] || '.').replace(/\/\.$/, ''); const items = this.listDir(c, d); if(!items.length && this.readFile(c, d) !== undefined) text.push(d.split('/').pop()); else text.push(items.join('  ')); break; }
      case 'pwd': text.push(c.cwd || c.workdir); break;
      case 'cd': c.cwd = this.abs(c, a[0] || '/'); break;
      case 'mkdir': case 'chmod': case 'chown': case 'true': break;
      case 'touch': for(const f of a){ const p = this.abs(c, f); if(this.readFile(c, p) === undefined){ const e = this.writeFile(c, p, ''); if(e){ say(`touch: ${f}: ${e}`, 'err'); out.code = 1; return out; } } } break;
      case 'rm': for(const f of a.filter(x => !x.startsWith('-'))){ const p = this.abs(c, f); c.rw[p] = null; this.touch('ctr:' + c.id); } break;
      case 'whoami': text.push(c.user || 'root'); break;
      case 'id': text.push(c.user && c.user !== 'root' ? `uid=1000(${c.user}) gid=1000(${c.user}) groups=1000(${c.user})` : 'uid=0(root) gid=0(root) groups=0(root)'); break;
      case 'hostname': text.push(c.hostname); break;
      case 'uname': text.push(a.includes('-a') ? `Linux ${c.hostname} 6.10.0-linuxkit #1 SMP aarch64 Linux` : 'Linux'); break;
      case 'env': case 'printenv': for(const [k, v] of Object.entries({HOSTNAME: c.hostname, HOME: c.user && c.user !== 'root' ? '/home/' + c.user : '/root', ...c.env})) text.push(`${k}=${v}`); break;
      case 'sleep': break;
      case 'ps': text.push('PID   USER     COMMAND', `    1 ${pad(c.user || 'root', 8)} ${this.argvOf(c).join(' ')}`, `   ${fromMain ? '' : '7'} ${pad(c.user || 'root', 8)} ps`); break;
      case 'kill':
        if(a.includes('1')){ out.kill = true; say('(PID 1, the main process, was killed: the container stops)', 'warn'); }
        break;
      case 'exit': out.exit = true; break;
      case 'ping': {
        const host = a.filter(x => !x.startsWith('-') && !/^\d+$/.test(x))[0];
        const r = this.resolveName(c, host);
        if(!Array.isArray(r) || !r.length){ say(`ping: bad address '${host}'`, 'err'); out.code = 1; return out; }
        const t = r[0], ip = this.ip(t, Object.keys(t.ips).find(n => c.ips[n])) || '127.0.0.1';
        text.push(`PING ${host} (${ip}): 56 data bytes`);
        for(let k = 0; k < 3; k++) text.push(`64 bytes from ${ip}: seq=${k} ttl=64 time=0.0${7 + k} ms`);
        text.push(`--- ${host} ping statistics ---`, '3 packets transmitted, 3 packets received, 0% packet loss');
        break;
      }
      case 'curl': case 'wget': {
        const url = a.filter(x => !x.startsWith('-'))[0];
        if(!url){ if(a.includes('--version') || a.includes('-V')){ text.push(cmd === 'curl' ? 'curl 8.10.1 (x86_64-alpine-linux-musl) libcurl/8.10.1' : 'GNU Wget 1.24.5'); break; } say(`${cmd}: try '${cmd} --help' for more information`, 'err'); out.code = 2; return out; }
        const r = this.http(c, url);
        if(r.error){ say(cmd === 'wget' ? `wget: ${r.error.replace(/^curl: \(\d+\) /, '')}` : r.error, 'err'); out.code = cmd === 'curl' ? 7 : 1; return out; }
        if(a.includes('-f') && r.status >= 400){ say(`curl: (22) The requested URL returned error: ${r.status}`, 'err'); out.code = 22; return out; }
        text.push(...String(r.body).split('\n'));
        break;
      }
      case 'apk': case 'apt-get': {
        const pk = a.filter(x => !x.startsWith('-') && !['add', 'install', 'update'].includes(x));
        if(a[0] === 'update'){ text.push(cmd === 'apk' ? 'fetch https://dl-cdn.alpinelinux.org/alpine/v3.20/main' : 'Get:1 http://deb.debian.org/debian bookworm InRelease', 'Reading package lists... Done'); break; }
        if(cmd === 'apt-get' && !c.aptUpdated){ say(`E: Unable to locate package ${pk[0]}\n(hint: run apt-get update first)`, 'err'); out.code = 100; return out; }
        c.installed = [...(c.installed || []), ...pk];
        for(const p of pk) this.writeFile(c, `/usr/bin/${p}`, '(binary)');
        text.push(...pk.map(p => cmd === 'apk' ? `(1/1) Installing ${p} (8.10.1-r0)` : `Setting up ${p} (7.88.1-10) ...`), cmd === 'apk' ? 'OK: 13 MiB in 21 packages' : '');
        break;
      }
      case 'redis-cli': { const r = this.redis(c, a); text.push(String(r)); break; }
      case 'psql': {
        const q = (a[a.indexOf('-c') + 1] || '').toLowerCase();
        if(q.includes('version')) text.push(' version', '---------------------------------------------------------------', ' PostgreSQL 16.4 (Debian 16.4-1.pgdg120+2) on x86_64-pc-linux-gnu', '(1 row)');
        else if(q) text.push(' ?column? ', '----------', '        1', '(1 row)');
        else text.push('psql (16.4)\nType "help" for help.\n(the simulator supports: psql -U postgres -c "SELECT version();")');
        break;
      }
      case 'pg_isready': text.push(c.status === 'running' ? '/var/run/postgresql:5432 - accepting connections' : 'no response'); out.code = c.status === 'running' ? 0 : 2; break;
      case 'python': case 'python3': text.push(a[0] === '--version' || a[0] === '-V' ? 'Python 3.12.7' : '(the simulator only runs Python apps as a container\'s main process)'); break;
      case 'node': text.push(a[0] === '--version' || a[0] === '-v' ? 'v20.18.0' : '(not simulated)'); break;
      case 'pip': text.push(...[...img.pkgs].map(p => `${pad(p, 12)} installed`)); break;
      default: text.push(`(${cmd}: not simulated)`);
    }
    if(redir){
      const p = this.abs(c, redir.file);
      const prev = redir.mode === '>>' ? (this.readFile(c, p) || '') : '';
      const e = this.writeFile(c, p, prev + text.join('\n') + '\n');
      if(e){ say(`sh: can't create ${redir.file}: ${e}`, 'err'); out.code = 1; return out; }
    } else text.forEach(t => say(t));
    out.code = code;
    return out;
  }

  /* ---------- healthchecks & time ---------- */
  check(c){
    if(c.status !== 'running') return false;
    const t = tokenize(c.healthcheck.test);
    const res = this.shellRun(c, t.slice(0, t.indexOf('||') >= 0 ? t.indexOf('||') : t.length), false);
    return !res.code;
  }
  advance(sec, out){
    const step = 5;
    for(let s = 0; s < sec; s += step){
      this.clock += Math.min(step, sec - s);
      for(const c of this.containers){
        if(c.status === 'restarting' && this.clock - (c.finished || 0) >= 2){
          this.start(c, {say(){}, err(){}}, false);
          this.touch('ctr:' + c.id);
          if(out && c.status === 'running') out.say(`↻ ${c.name} restarted and is running again (restart count ${c.restartCount})`, 'warn');
        }
        if(!c.healthcheck || c.status !== 'running') continue;
        if(this.clock - c.healthAt < c.healthcheck.interval) continue;
        c.healthAt = this.clock;
        const ok = this.check(c);
        const before = c.health;
        if(ok){ c.health = 'healthy'; c.healthFails = 0; }
        else { c.healthFails++; if(c.healthFails >= c.healthcheck.retries) c.health = 'unhealthy'; }
        if(before !== c.health){ this.touch('ctr:' + c.id); if(out) out.say(`♥ ${c.name} is now ${c.health}`, c.health === 'healthy' ? 'ok' : 'err'); }
      }
    }
  }

  /* =================================================================
     Command entry point
     ================================================================= */
  run(line){
    const out = {lines: [], ok: true, clear: false, view: null};
    this.changed = new Set(); this.events = [];
    const src = line.replace(/\r/g, '');
    // heredoc: cat > file <<EOF ... EOF  (multi-line)
    const hd = src.match(/^cat\s+>\s*(\S+)\s+<<\s*'?(\w+)'?\n([\s\S]*?)\n\2\s*$/);
    const parts = hd ? [src] : (this.shell ? [src.trim()] : splitChain(src));
    for(const p of parts){
      let res;
      try { res = hd ? this.heredoc(hd) : this.shell ? this.inShell(p) : this.exec(p); }
      catch(e){ res = {lines: T('simulator: that command hit an unsupported case (' + e.message + ')', 'err'), err: true}; this.crashed = e; }
      if(res.clear){ out.clear = true; out.lines.length = 0; }
      out.lines.push(...res.lines);
      if(res.view) out.view = res.view;
      if(res.err){ out.ok = false; break; }
    }
    if(!this.shell) this.advance(3, null);
    return out;
  }
  heredoc(hd){
    this.files[hd[1]] = hd[3] + '\n';
    this.touch('files', 'file:' + hd[1]);
    return {lines: [], err: false, view: 'files', file: hd[1]};
  }
  inShell(src){
    const res = {lines: [], err: false};
    const c = this.containers.find(x => x.id === this.shell.cid);
    if(!c || c.status !== 'running'){ this.shell = null; return res; }
    const r = this.shellRun(c, tokenize(src), !this.shell.viaExec);
    for(const l of r) res.lines.push(...T(l.text, l.cls || ''));
    if(r.exit || r.kill){
      const via = this.shell.viaExec;
      this.shell = null;
      if(!via || r.kill){
        this.exit(c, r.kill ? 137 : 0, {say: (t, k) => res.lines.push(...T(t, k)), err(){}});
        res.lines.push(...T(`(left the container; its main process ended, so ${c.name} is now ${c.status === 'restarting' ? 'restarting' : 'Exited'})`, 'dim'));
        if(c.rmOnExit && c.status === 'exited'){ this.removeCtr(c); res.lines.push(...T('(--rm: the container was removed)', 'dim')); }
      }
      else res.lines.push(...T(`(left the exec shell; ${c.name} keeps running)`, 'dim'));
      res.view = 'host';
    }
    return res;
  }

  exec(src){
    const res = {lines: [], err: false, view: null};
    const out = {
      say: (t, cls) => res.lines.push(...T(t, cls)),
      err: (t) => { res.lines.push(...T(t, 'err')); res.err = true; },
    };
    const fail = t => { out.err(t); return res; };
    const expanded = src.replace(/\$\(pwd\)|\$PWD/g, this.home);
    const argv = tokenize(expanded);
    const [cmd, ...a] = argv;
    switch(cmd){
      case undefined: return res;
      case 'help': return this.help(res);
      case 'clear': res.clear = true; return res;
      case 'pwd': out.say(this.home); return res;
      case 'ls': {
        const dir = (a.filter(x => !x.startsWith('-'))[0] || '').replace(/^\.\/?/, '').replace(/\/$/, '');
        const all = a.some(x => /^-.*a/.test(x));
        const names = new Set();
        for(const f of Object.keys(this.files)){
          if(dir && !f.startsWith(dir + '/')) continue;
          const rest = dir ? f.slice(dir.length + 1) : f;
          const n = rest.split('/')[0] + (rest.includes('/') ? '/' : '');
          if(all || !n.startsWith('.')) names.add(n);
        }
        if(names.size) res.lines.push(L(...[...names].sort().flatMap((n, i) => [[n, n.endsWith('/') ? 'info' : ''], '  '])));
        return res;
      }
      case 'cat': {
        if(!a.length) return fail('cat: missing file operand');
        for(const f of a){ const k = f.replace(/^\.\//, ''); if(this.files[k] === undefined) return fail(`cat: ${f}: No such file or directory`); out.say(this.files[k].replace(/\n$/, '')); }
        return res;
      }
      case 'echo': {
        const ri = a.findIndex(x => x === '>' || x === '>>');
        const text = (ri >= 0 ? a.slice(0, ri) : a).filter(x => x !== '-e').join(' ').replace(/\\n/g, '\n');
        if(ri < 0){ out.say(text); return res; }
        const f = a[ri + 1].replace(/^\.\//, '');
        this.files[f] = (a[ri] === '>>' ? (this.files[f] || '') : '') + text + '\n';
        this.touch('files', 'file:' + f);
        return res;
      }
      case 'rm': for(const f of a.filter(x => !x.startsWith('-'))) delete this.files[f.replace(/^\.\//, '')]; this.touch('files'); return res;
      case 'mkdir': case 'cd': if(cmd === 'cd') return fail('cd: the simulator keeps you in ~/project'); return res;
      case 'touch': for(const f of a){ const k = f.replace(/^\.\//, ''); if(this.files[k] === undefined) this.files[k] = ''; } this.touch('files'); return res;
      case 'sleep': {
        const n = parseInt(a[0], 10) || 1;
        const lines = [];
        this.advance(n, {say: (t, k) => lines.push(...T(t, k))});
        out.say(`(⏱ ${n} seconds pass…)`, 'dim'); res.lines.push(...lines);
        return res;
      }
      case 'curl': case 'open': {
        const url = a.filter(x => !x.startsWith('-'))[0];
        if(!url) return fail(`usage: ${cmd} http://localhost:8080`);
        const r = this.http(null, url);
        this.browser = {url: url.startsWith('http') ? url : 'http://' + url, ...r};
        if(cmd === 'open'){ res.view = 'browser'; if(r.error) out.say(r.error.replace(/^curl: \(\d+\) /, 'Browser: '), 'err'); else out.say(`(opened ${this.browser.url} in the Browser tab: HTTP ${r.status})`, 'dim'); return res; }
        if(r.error) return fail(r.error);
        if(a.includes('-i')) out.say(`HTTP/1.1 ${r.status} ${r.status === 200 ? 'OK' : r.status === 404 ? 'Not Found' : 'Error'}\nContent-Type: ${r.type === 'html' ? 'text/html' : 'text/plain'}\n`, 'dim');
        if(a.includes('-f') && r.status >= 400) return fail(`curl: (22) The requested URL returned error: ${r.status}`);
        out.say(r.body);
        return res;
      }
      case 'docker': return this.docker(a, res, out, fail);
      default: return fail(`bash: ${cmd}: command not found  (type "help")`);
    }
  }

  help(res){
    const rows = [
      ['Images', 'docker pull nginx · docker images · docker rmi IMG · docker history IMG · docker image inspect IMG'],
      ['Build', 'docker build -t name:tag [--no-cache] [--build-arg K=V] [--target stage] [--secret id=x,src=f] .'],
      ['Run', 'docker run [-d] [-it] [--rm] [--name n] [-p 8080:80] [-e K=V] [-v vol:/path] [--network net] [--restart always] IMG [cmd]'],
      ['Manage', 'docker ps [-a] · logs NAME · stop/start/restart/kill/rm [-f] NAME · exec [-it] NAME cmd · inspect · stats · diff NAME'],
      ['Storage', 'docker volume create|ls|inspect|rm · -v data:/data (volume) · -v ./site:/usr/share/nginx/html (bind mount)'],
      ['Network', 'docker network create|ls|inspect|rm|connect · ping/curl between containers'],
      ['Compose', 'docker compose up [-d] [--build] [--scale web=3] · ps · logs [svc] · exec svc cmd · down [-v]'],
      ['Registry', 'docker login -u you · docker tag app you/app:1.0 · docker push you/app:1.0'],
      ['Clean up', 'docker system df · docker image prune · docker container prune · docker system prune -a'],
      ['Host', 'ls · cat f · echo "x" > f · cat > f <<EOF … EOF · curl localhost:8080 · open http://localhost:8080 · sleep 30'],
    ];
    for(const [k, v] of rows) res.lines.push(L([pad(k, 10), 'info'], v));
    return res;
  }

  /* ---------- the docker CLI ---------- */
  docker(a, res, out, fail){
    const [sub, ...rest] = a;
    const subsub = rest[0];
    const map = {'image': {ls: 'images', rm: 'rmi', inspect: 'inspect', history: 'history', prune: 'image-prune', pull: 'pull', push: 'push', tag: 'tag', build: 'build'}, 'container': {ls: 'ps', rm: 'rm', inspect: 'inspect', prune: 'container-prune', run: 'run', stop: 'stop', start: 'start', logs: 'logs', exec: 'exec'}};
    if(map[sub] && map[sub][subsub]) return this.docker([map[sub][subsub], ...rest.slice(1)], res, out, fail);
    switch(sub){
      case undefined: case 'help': case '--help': return this.help(res);
      case '--version': case 'version': out.say('Docker version 27.3.1, build ce12230 (simulated in your browser)'); return res;
      case 'info': out.say(`Containers: ${this.containers.length}\n Running: ${this.containers.filter(c => c.status === 'running').length}\nImages: ${this.refs.length}\nServer Version: 27.3.1\nStorage Driver: overlay2\nOperating System: Docker Desktop (simulated)`); return res;
      case 'pull': { if(!rest[0]) return fail('"docker pull" requires exactly 1 argument.'); this.pull(rest[0], out); res.view = 'host'; return res; }
      case 'images': return this.cmdImages(rest, res, out);
      case 'rmi': return this.cmdRmi(rest, res, out, fail);
      case 'tag': {
        const img = this.image(rest[0]); if(!img) return fail(`Error response from daemon: No such image: ${rest[0]}`);
        if(!rest[1]) return fail('"docker tag" requires exactly 2 arguments.');
        this.tag(img.id, rest[1]); res.view = 'host'; return res;
      }
      case 'history': return this.cmdHistory(rest, res, out, fail);
      case 'build': return this.cmdBuild(rest, res, out, fail);
      case 'run': return this.cmdRun(rest, res, out, fail);
      case 'create': return this.cmdRun(['--create-only', ...rest], res, out, fail);
      case 'ps': return this.cmdPs(rest, res, out);
      case 'logs': {
        const c = this.ctr(rest.filter(x => !x.startsWith('-')).pop() || ''); if(!c) return fail(`Error response from daemon: No such container: ${rest[rest.length - 1] || ''}`);
        const ti = rest.indexOf('--tail'); const n = ti >= 0 ? +rest[ti + 1] : Infinity;
        c.logs.slice(-n).forEach(l => out.say(l));
        return res;
      }
      case 'stop': case 'kill': case 'start': case 'restart': case 'pause': case 'unpause': {
        const names = rest.filter(x => !x.startsWith('-') && !/^\d+$/.test(x));
        if(!names.length) return fail(`"docker ${sub}" requires at least 1 argument.`);
        for(const n of names){
          const c = this.ctr(n); if(!c) return fail(`Error response from daemon: No such container: ${n}`);
          if(sub === 'stop' || sub === 'kill'){ if(c.status === 'running' || c.status === 'paused' || c.status === 'restarting'){ c.manualStop = true; c.status = 'exited'; c.exitCode = sub === 'kill' ? 137 : (this.proc(c).kind === 'nginx' ? 0 : 137); c.finished = this.clock; c.health = null; if(this.proc(c).kind === 'nginx') c.logs.push('[notice] 1#1: signal 3 (SIGQUIT) received, shutting down'); } }
          else if(sub === 'start' || sub === 'restart'){ c.manualStop = false; if(c.status === 'running' && sub === 'start'){ out.say(n); continue; } const tmp = []; this.start(c, {say: t => tmp.push(t), err: t => out.err(t)}, false); }
          else if(sub === 'pause'){ if(c.status !== 'running') return fail(`Error response from daemon: container ${n} is not running`); c.status = 'paused'; }
          else if(sub === 'unpause'){ c.status = 'running'; }
          this.touch('ctr:' + c.id);
          out.say(n);
        }
        res.view = 'host'; return res;
      }
      case 'rm': {
        const force = rest.includes('-f') || rest.includes('--force');
        const withVol = rest.includes('-v');
        for(const n of rest.filter(x => !x.startsWith('-'))){
          const c = this.ctr(n); if(!c) return fail(`Error response from daemon: No such container: ${n}`);
          if(c.status === 'running' && !force) return fail(`Error response from daemon: cannot remove container "/${c.name}": container is running: stop the container before removing or force remove`);
          this.removeCtr(c, withVol);
          out.say(n);
        }
        res.view = 'host'; return res;
      }
      case 'rename': { const c = this.ctr(rest[0]); if(!c) return fail(`No such container: ${rest[0]}`); c.name = rest[1]; this.touch('ctr:' + c.id); return res; }
      case 'exec': return this.cmdExec(rest, res, out, fail);
      case 'inspect': return this.cmdInspect(rest, res, out, fail);
      case 'diff': {
        const c = this.ctr(rest[0]); if(!c) return fail(`Error response from daemon: No such container: ${rest[0] || ''}`);
        const img = this.imgs[c.image];
        const ch = Object.entries(c.rw);
        if(!ch.length) out.say('(no changes: the writable layer is empty)', 'dim');
        for(const [p, v] of ch) res.lines.push(L([v === null ? 'D ' : img.fs[p] !== undefined ? 'C ' : 'A ', v === null ? 'err' : img.fs[p] !== undefined ? 'warn' : 'ok'], p));
        return res;
      }
      case 'stats': {
        const run = this.containers.filter(c => c.status === 'running');
        res.lines.push(L(['CONTAINER ID   NAME              CPU %     MEM USAGE / LIMIT     MEM %', 'bold']));
        for(const c of run){
          const k = this.proc(c).kind;
          const mem = (MEM[k] || MEM.sh) + (this.imgs[c.image].pkgs.size * 2.1);
          const lim = c.memory || 7.67 * 1024;
          res.lines.push(L(c.id.slice(0, 12) + '   ' + pad(c.name, 17) + ' ' + pad(((c.reqs || 0) * 0.8 + (k === 'postgres' ? 0.6 : 0.1)).toFixed(2) + '%', 9) + ' ' + pad(`${mem.toFixed(1)}MiB / ${c.memory ? c.memory + 'MiB' : '7.67GiB'}`, 21) + ' ' + (100 * mem / lim).toFixed(2) + '%'));

      }
      case 'volume': return this.cmdVolume(rest, res, out, fail);
      case 'network': return this.cmdNetwork(rest, res, out, fail);
      case 'compose': return this.cmdCompose(rest, res, out, fail);
      case 'login': {
        const ui = rest.indexOf('-u'); const user = ui >= 0 ? rest[ui + 1] : 'you';

        for(const k of Object.keys(this.hub).filter(k => !rest[0] || k.includes(rest[0]))) res.lines.push(L(pad(k.split(':')[0], 20) + ' ' + pad('(your repository)', 47)));

      }
      case 'system': {
        if(rest[0] === 'df'){

          const isz = ids.reduce((s, id) => s + this.imgSize(this.imgs[id]), 0);
          const reclaimI = ids.filter(id => !used.has(id)).reduce((s, id) => s + this.imgSize(this.imgs[id]), 0);
          const csz = this.containers.reduce((s, c) => s + this.ctrSize(c), 0);
          const vsz = Object.values(this.volumes).reduce((s, v) => s + JSON.stringify(v.data).length, 0);
          const bsz = Object.values(this.cache).reduce((s, l) => s + l.size, 0);
          res.lines.push(L(['TYPE            TOTAL     ACTIVE    SIZE      RECLAIMABLE', 'bold']));
          res.lines.push(L(`Images          ${pad(ids.length, 9)} ${pad(used.size, 9)} ${pad(fmtSize(isz), 9)} ${fmtSize(reclaimI)}`));
          res.lines.push(L(`Containers      ${pad(this.containers.length, 9)} ${pad(this.containers.filter(c => c.status === 'running').length, 9)} ${pad(fmtSize(csz), 9)} ${fmtSize(this.containers.filter(c => c.status !== 'running').reduce((s, c) => s + this.ctrSize(c), 0))}`));
          res.lines.push(L(`Local Volumes   ${pad(Object.keys(this.volumes).length, 9)} ${pad(Object.values(this.volumes).filter(v => this.volUsers(v.name).length).length, 9)} ${pad(fmtSize(vsz), 9)} ${fmtSize(0)}`));
          res.lines.push(L(`Build Cache     ${pad(Object.keys(this.cache).length, 9)} 0         ${pad(fmtSize(bsz), 9)} ${fmtSize(bsz)}`));

          const all = rest.includes('-a') || rest.includes('--all');

  }

  removeCtr(c, withVol){
    this.containers = this.containers.filter(x => x !== c);

  }
  volUsers(name){ return this.containers.filter(c => c.mounts.some(m => m.type === 'volume' && m.src === name)); }
  pruneImages(all, out){
    let freed = 0;
    const used = new Set(this.containers.map(c => c.image));
    const before = this.refs.length;
    this.refs = this.refs.filter(r => {
      const drop = !used.has(r.id) && (r.repo === '<none>' || all);
      if(drop){ out.say(`deleted: sha256:${r.id.slice(0, 12)}${r.repo !== '<none>' ? ` (${r.repo}:${r.tag})` : ''}`, 'dim'); freed += this.imgSize(this.imgs[r.id]); }

    });
    if(before === this.refs.length) out.say('(nothing to prune)', 'dim');
    return freed;
  }

  cmdImages(rest, res, out){
    const q = rest.includes('-q');
    if(!q) res.lines.push(L(['REPOSITORY           TAG          IMAGE ID       CREATED          SIZE', 'bold']));
    const filt = rest.filter(x => !x.startsWith('-'))[0];
    for(const r of [...this.refs].sort((x, y) => this.imgs[y.id].created - this.imgs[x.id].created)){
      if(filt && !(r.repo === filt || `${r.repo}:${r.tag}` === filt)) continue;
      const img = this.imgs[r.id];
      if(q){ out.say(r.id.slice(0, 12)); continue; }
      res.lines.push(L([pad(r.repo, 20), r.repo === '<none>' ? 'dim' : ''], ' ' + pad(r.tag, 12) + ' ', [r.id.slice(0, 12), 'hash'], '   ' + pad(img.stock ? '2 weeks ago' : this.ago(img.created), 16) + ' ' + fmtSize(this.imgSize(img))));
    }
    res.view = 'host';
    return res;
  }
  cmdRmi(rest, res, out, fail){
    const force = rest.includes('-f');
    for(const n of rest.filter(x => !x.startsWith('-'))){
      const r = this.ref(n) || this.refs.find(x => x.id.startsWith(n));
      if(!r) return fail(`Error response from daemon: No such image: ${n}`);
      const users = this.containers.filter(c => c.image === r.id);
      if(users.length && !force) return fail(`Error response from daemon: conflict: unable to remove repository reference "${n}" (must force) - container ${users[0].id.slice(0, 12)} is using its referenced image ${r.id.slice(0, 12)}`);
      this.refs = this.refs.filter(x => x !== r);
      out.say(`Untagged: ${r.repo}:${r.tag}`);
      if(!this.refs.some(x => x.id === r.id)) out.say(`Deleted: sha256:${r.id.slice(0, 64)}`, 'dim');
    }
    res.view = 'host';
    return res;
  }
  cmdHistory(rest, res, out, fail){
    const img = this.image(rest.filter(x => !x.startsWith('-'))[0] || '');
    if(!img) return fail(`Error response from daemon: No such image: ${rest[0] || ''}`);
    res.lines.push(L(['IMAGE          CREATED BY                                      SIZE', 'bold']));
    for(const l of [...img.layers].reverse()) res.lines.push(L([l.base ? '<missing>     ' : l.id.slice(0, 12) + '  ', l.base ? 'dim' : 'hash'], ' ' + pad(l.instr.length > 46 ? l.instr.slice(0, 45) + '…' : l.instr, 47) + ' ' + fmtSize(l.size)));
    this.selectedImage = img.id; res.view = 'layers';
    return res;
  }

  /* ---------- docker build ---------- */
  cmdBuild(rest, res, out, fail){

    let ctx = null;
    for(let i = 0; i < rest.length; i++){
      const x = rest[i];
      if(x === '-t' || x === '--tag') opt.tags.push(rest[++i]);
      else if(x === '-f' || x === '--file') opt.file = rest[++i];
      else if(x === '--build-arg'){ const [k, ...v] = rest[++i].split('='); opt.args[k] = v.join('='); }

    const df = this.files[opt.file.replace(/^\.\//, '')];
    if(df === undefined) return fail(`ERROR: failed to solve: failed to read dockerfile: open ${opt.file}: no such file or directory`);
    const b = this.build(df, opt, out);
    res.view = 'layers';
    if(!b){ res.err = true; return res; }
    return res;

  contextFiles(){
    const ign = (this.files['.dockerignore'] || '').split('\n').map(s => s.trim()).filter(s => s && !s.startsWith('#'));

      const re = new RegExp('^' + p.replace(/\/$/, '').replace(/[.+^${}()|[\]\\]/g, '\\$&').replace(/\*\*/g, '.*').replace(/\*/g, '[^/]*') + '(/.*)?$');

    const out = {};

  build(df, opt, out){

          if(!base){

            if(sp === '.' || sp === ''){ Object.assign(picked, ctxFiles); dir = true; continue; }
            if(Object.keys(ctxFiles).some(f => f.startsWith(sp.replace(/\/$/, '') + '/'))) dir = true;
            const hits = Object.entries(ctxFiles).filter(([f]) => f === sp || f.startsWith(sp.replace(/\/$/, '') + '/') || (sp.includes('*') && new RegExp('^' + sp.replace(/\./g, '\\.').replace(/\*/g, '[^/]*') + '$').test(f)));

      const label = `${ins.op} ${text}`.replace(/\s+/g, ' ');
      const cached = !opt.noCache && this.cache[key] && !st.broken;
      let layer, time = 0, effects;
      if(cached){
        layer = this.cache[key];

        log.push([`CACHED [${st.name ? st.name + ' ' : ''}${++k}/${nInstr}] ${label}`, '0.0s', 'ok']);
        steps.push({line: ins.line, op: ins.op, status: 'cached', time: 0, layer: layer.id});
      } else {
        const r = this.applyInstr(st, ins, text, opt, ctxFiles);
        if(r.error){
          log.push([`ERROR [${st.name ? st.name + ' ' : ''}${++k}/${nInstr}] ${label}`, '', 'err']);
          for(const e of r.output || []) log.push(['  > ' + e, '', 'err']);

        effects = r.effects;
        layer = {id: key, instr: label.length > 90 ? label.slice(0, 89) + '…' : label, size: r.size, effects, meta: r.meta};
        if(!opt.noCache) this.cache[key] = layer;
        log.push([`[${st.name ? st.name + ' ' : ''}${++k}/${nInstr}] ${label}`, time.toFixed(1) + 's', '']);
        for(const o of (r.output || []).slice(0, 3)) log.push(['  ' + o, '', 'dim']);
        steps.push({line: ins.line, op: ins.op, status: 'built', time, layer: layer.id, size: r.size});

      if(cached) this.replayEffects(st, effects);
      st.layers.push({id: layer.id, instr: layer.instr, size: layer.size, meta: layer.meta});

    // build each stage's image object (so later stages and --target can use it)
    for(const s of stages){

    }
    const final = (stopAfterStage || stages[stages.length - 1]).img;
    final.stage = false;
    final.built = {multi: stages.length > 1, stages: stages.map(s => ({name: s.name, base: s.base, size: this.imgSize(s.img)}))};
    log.push(['exporting to image', '0.1s', 'dim']);
    for(const t of opt.tags) log.push([`=> naming to docker.io/library/${splitRef(t).full}`, '', 'dim']);
    finish(true);
    this.printBuild(out, report, lines);
    if(!opt.tags.length){ this.refs.push({repo: '<none>', tag: '<none>', id: final.id}); out.say('(no -t given: the image has no name, only an ID. Use docker build -t myapp .)', 'warn'); }

    report.image = final.id;
    this.selectedImage = final.id;
    this.touch('img:' + final.id);
    return final;
  }
  printBuild(out, report, lines){
    out.say(`[+] Building ${Math.max(report.total, 0.4).toFixed(1)}s (${report.steps.length}/${report.steps.length}) ${report.ok ? 'FINISHED' : 'ERROR'}`, report.ok ? 'bold' : 'err');
    for(const [t, time, cls] of lines) out.say(` => ${pad(t.length > 70 ? t.slice(0, 69) + '…' : t, 71)}${time}`, cls);
  }
  replayEffects(st, ef){
    if(!ef) return;
    Object.assign(st.fs, ef.fs || {});
    for(const p of ef.pkgs || []) st.pkgs.add(p);
    for(const t of ef.tools || []) st.tools.add(t);
    for(const u of ef.users || []) st.users.add(u);
    if(ef.cfg) Object.assign(st.cfg, JSON.parse(JSON.stringify(ef.cfg)));
    if(ef.env) Object.assign(st.cfg.env, ef.env);
    if(ef.args) Object.assign(st.args, ef.args);
    if(ef.apt) st.aptUpdated = true;
  }
  applyInstr(st, ins, text, opt, ctxFiles){
    const ef = {fs: {}, pkgs: [], tools: [], users: [], cfg: null, env: null, args: null};
    const meta = (cfg) => { Object.assign(st.cfg, cfg); ef.cfg = cfg; return {time: 0, size: 0, effects: ef, meta: true}; };
    const parseCmd = s => s.trim().startsWith('[') ? JSON.parse(s) : ['/bin/sh', '-c', s];
    const wd = st.cfg.workdir || '/';

          if(!this.volumes[name]) return fail(`Error response from daemon: get ${name}: no such volume`);
          const u = this.volUsers(name);
          if(u.length) return fail(`Error response from daemon: remove ${name}: volume is in use - [${u.map(c => c.id.slice(0, 12)).join(', ')}]`);
          delete this.volumes[name]; out.say(name);
        }
        res.view = 'host'; return res;
      }
      case 'prune': { const del = Object.keys(this.volumes).filter(v => !this.volUsers(v).length && (this.volumes[v].anon || rest.includes('-a'))); del.forEach(v => { delete this.volumes[v]; out.say('Deleted Volumes:\n' + v); }); if(!del.length) out.say('Total reclaimed space: 0B'); res.view = 'host'; return res; }
    }
    return fail('usage: docker volume create|ls|inspect|rm|prune');
  }

  cmdNetwork(rest, res, out, fail){
    const [a, n, n2] = rest;
    switch(a){
      case 'create': {
        if(!n) return fail('"docker network create" requires exactly 1 argument.');
        if(this.networks[n]) return fail(`Error response from daemon: network with name ${n} already exists`);
        this.networks[n] = {name: n, driver: 'bridge', builtin: false, subnet: `172.${this.netSeq++}.0`, dns: true, id: hash('net' + n).slice(0, 12)};
        this.touch('net:' + n); out.say(this.networks[n].id + hash(n).slice(0, 52), 'hash'); res.view = 'host'; return res;
      }
      case 'ls': case undefined: res.lines.push(L(['NETWORK ID     NAME              DRIVER    SCOPE', 'bold'])); for(const x of Object.values(this.networks)) out.say(`${x.id}   ${pad(x.name, 17)} ${pad(x.driver, 9)} local`); res.view = 'host'; return res;
      case 'inspect': return this.cmdInspect([n], res, out, fail);
      case 'rm': {
        if(!this.networks[n]) return fail(`Error response from daemon: network ${n} not found`);
        if(this.networks[n].builtin) return fail(`Error response from daemon: ${n} is a pre-defined network and cannot be removed`);
        if(this.containers.some(c => n in c.ips)) return fail(`Error response from daemon: error while removing network: network ${n} has active endpoints`);
        delete this.networks[n]; out.say(n); res.view = 'host'; return res;
      }
      case 'connect': case 'disconnect': {
        const c = this.ctr(n2 || ''); if(!this.networks[n] || !c) return fail(`usage: docker network ${a} NETWORK CONTAINER`);
        if(a === 'connect'){ const net = this.networks[n]; net.next = (net.next || 1) + 1; c.ips[n] = `${net.subnet}.${net.next}`; }
        else delete c.ips[n];
        this.touch('ctr:' + c.id); res.view = 'host'; return res;
      }
    }
    return fail('usage: docker network create|ls|inspect|rm|connect|disconnect');
  }

  cmdPush(rest, res, out, fail){
    const name = rest[0];
    const img = name && this.image(name);
    if(!img) return fail(`An image does not exist locally with the tag: ${name || ''}`);
    const r = splitRef(name);
    out.say(`The push refers to repository [docker.io/${r.repo.includes('/') ? r.repo : 'library/' + r.repo}]`);
    if(!r.repo.includes('/')) return fail('denied: requested access to the resource is denied\n(hint: you can only push to your own namespace: docker tag myapp you/myapp:1.0)');
    if(!this.loggedIn) return fail('denied: requested access to the resource is denied\n(hint: docker login first)');
    if(r.repo.split('/')[0] !== this.loggedIn) return fail(`denied: requested access to the resource is denied (you are logged in as "${this.loggedIn}")`);
    for(const l of [...img.layers].reverse()) out.say(`${l.id.slice(0, 12)}: ${l.base ? 'Mounted from library/' + (img.from || 'base').split(':')[0] : this.hubLayers && this.hubLayers.has(l.id) ? 'Layer already exists' : 'Pushed'}`, l.base ? 'dim' : '');
    this.hubLayers = new Set([...(this.hubLayers || []), ...img.layers.map(l => l.id)]);
    this.hub[r.full] = img.id;
    out.say(`${r.tag}: digest: sha256:${hash('push' + img.id).slice(0, 64)} size: ${1500 + img.layers.length * 300}`);
    out.say(`(now anyone can run: docker pull ${r.full})`, 'dim');
    this.events.push({type: 'push', name: r.full});
    res.view = 'host';
    return res;
  }

  /* ---------- docker compose ---------- */
  cmdCompose(rest, res, out, fail){
    const fi = rest.indexOf('-f');
    const file = fi >= 0 ? rest[fi + 1] : (this.files['compose.yaml'] !== undefined ? 'compose.yaml' : 'docker-compose.yml');
    const args = rest.filter((x, i) => !(x === '-f' || rest[i - 1] === '-f'));
    const action = args[0];
    const project = 'project';
    const src = this.files[file];
    if(src === undefined) return fail(`no configuration file provided: not found (create ${file} first)`);
    let doc;
    try { doc = parseYaml(src); } catch(e){ return fail(`validating ${file}: ${e.message}`); }
    const services = doc.services || {};
    if(!Object.keys(services).length) return fail(`${file}: no services defined`);
    const order = [];
    const visit = (s, stack = []) => { if(order.includes(s)) return; if(stack.includes(s)) throw new Error('dependency cycle'); const d = services[s].depends_on; const deps = Array.isArray(d) ? d : d ? Object.keys(d) : []; for(const x of deps){ if(!services[x]) throw new Error(`service "${s}" depends on undefined service "${x}"`); visit(x, [...stack, s]); } order.push(s); };
    try { Object.keys(services).forEach(s => visit(s)); } catch(e){ return fail(e.message); }
    const netName = `${project}_default`;
    const ctrsOf = s => this.containers.filter(c => c.project === project && c.service === s);
    res.view = 'host';
    switch(action){
      case 'config': out.say(JSON.stringify(doc, null, 2)); return res;
      case 'up': case 'build': case 'create': {
        const scale = {};
        args.forEach((x, i) => { if(x === '--scale'){ const [s, n] = args[i + 1].split('='); scale[s] = +n; } });
        const forceBuild = args.includes('--build') || action === 'build';
        const lines = [];
        // build images first
        for(const s of order){
          const sv = services[s];
          if(!sv.build) continue;
          const tag = sv.image || `${project}-${s}`;
          if(this.image(tag) && !forceBuild) continue;
          const ctx = typeof sv.build === 'string' ? sv.build : (sv.build.context || '.');
          const dfile = (typeof sv.build === 'object' && sv.build.dockerfile) || 'Dockerfile';
          const df = this.files[(ctx === '.' ? '' : ctx.replace(/^\.\//, '') + '/') + dfile] ?? this.files[dfile];
          if(df === undefined) return fail(`failed to solve: failed to read dockerfile: open ${dfile}: no such file or directory`);
          out.say(`[+] Building ${s}`, 'info');
          const quiet = {say: (t, k) => { if(k === 'err' || /CACHED|\[\d|FINISHED|ERROR/.test(t)) res.lines.push(...T('  ' + t, k)); }, err: out.err};
          if(!this.build(df, {tags: [tag], args: {}, noCache: false, secrets: {}}, quiet)) { res.err = true; return res; }
        }
        if(action === 'build'){ out.say('✔ Images built', 'ok'); return res; }
        if(!this.networks[netName]){ this.networks[netName] = {name: netName, driver: 'bridge', builtin: false, subnet: `172.${this.netSeq++}.0`, dns: true, id: hash('net' + netName).slice(0, 12), project}; lines.push([`Network ${netName}`, 'Created']); }
        for(const [vn] of Object.entries(doc.volumes || {})){ const full = `${project}_${vn}`; if(!this.volumes[full]){ this.volumes[full] = {name: full, data: {}, created: this.clock, project}; lines.push([`Volume "${full}"`, 'Created']); } }
        for(const s of order){
          const sv = services[s];
          const want = scale[s] ?? sv.deploy?.replicas ?? 1;
          // wait for dependencies that must be healthy
          const d = sv.depends_on;
          if(d && !Array.isArray(d)) for(const [dep, cond] of Object.entries(d)){
            if(cond && cond.condition === 'service_healthy'){
              for(const dc of ctrsOf(dep)){
                if(!dc.healthcheck){ return fail(`dependency failed to start: container ${dc.name} has no healthcheck configured`); }
                let waited = 0;
                while(dc.health !== 'healthy' && waited < 120){ this.advance(5, null); waited += 5; }
                lines.push([`Container ${dc.name}`, dc.health === 'healthy' ? `Healthy (after ~${waited}s)` : 'Unhealthy']);
                if(dc.health !== 'healthy') { lines.forEach(([n, st]) => out.say(` ✔ ${pad(n, 34)} ${st}`, 'ok')); return fail(`dependency failed to start: container ${dc.name} is unhealthy`); }
              }
            }
          }
          const existing = ctrsOf(s);
          for(let k = existing.length; k > want; k--){ const c = existing[k - 1]; this.removeCtr(c); lines.push([`Container ${c.name}`, 'Removed']); }
          for(let k = 1; k <= want; k++){
            const cname = sv.container_name || `${project}-${s}-${k}`;
            let c = this.containers.find(x => x.name === cname);
            const imgName = sv.build ? (sv.image || `${project}-${s}`) : sv.image;
            if(!imgName) return fail(`service "${s}" has neither an image nor a build context specified`);
            let img = this.image(imgName);
            if(!img){ const sink = {say(){}, err: out.err}; img = this.pull(imgName, sink); if(!img){ res.err = true; return res; } lines.push([`${s} Pulled`, '']); }
            if(c && c.image !== img.id){ this.removeCtr(c); lines.push([`Container ${cname}`, 'Recreate']); c = null; }
            if(c){ if(c.status !== 'running'){ c.manualStop = false; this.start(c, {say(){}, err(){}}, false); lines.push([`Container ${cname}`, 'Started']); } else lines.push([`Container ${cname}`, 'Running']); continue; }
            const env = {};
            const e = sv.environment;
            if(Array.isArray(e)) e.forEach(x => { const [kk, ...v] = String(x).split('='); env[kk] = v.join('='); });
            else if(e) Object.entries(e).forEach(([kk, v]) => env[kk] = String(v));
            const ports = (sv.ports || []).map(p => { const q = String(p).split(':'); return q.length === 1 ? `${32768 + this.seq}:${q[0]}` : String(p); });
            const vols = (sv.volumes || []).map(v => { const [a1, b1, c1] = String(v).split(':'); return (doc.volumes && a1 in doc.volumes ? `${project}_${a1}` : a1) + ':' + b1 + (c1 ? ':' + c1 : ''); });
            const o = {name: cname, ports: ports.map(p => { const q = p.split(':'); return {host: +q[0], cont: +q[1]}; }), env, vols, net: netName, restart: sv.restart || 'no', cmd: sv.command ? (Array.isArray(sv.command) ? sv.command : tokenize(String(sv.command))) : [], entrypoint: null, memory: null, workdir: null, user: null, hostname: null, readOnly: false, envFile: sv.env_file || null, health: null, image: imgName};
            const sink = {say(){}, err: (t) => { out.err(t); }};
            c = this.createContainer(o, img, sink, {aliases: [s], project, service: s});
            if(!c){ lines.forEach(([n, st]) => out.say(` ✔ ${pad(n, 34)} ${st}`, 'ok')); res.err = true; return res; }
            if(sv.healthcheck && sv.healthcheck.test){ const t = sv.healthcheck.test; c.healthcheck = {test: Array.isArray(t) ? t.slice(1).join(' ') : String(t), interval: parseInt(sv.healthcheck.interval || '10', 10), retries: +(sv.healthcheck.retries || 3)}; }
            lines.push([`Container ${cname}`, 'Created']);
            this.start(c, {say(){}, err: (t) => out.err(t)}, false);
            lines.push([`Container ${cname}`, c.status === 'running' ? 'Started' : `Exited (${c.exitCode})`]);
          }
        }
        out.say(`[+] Running ${lines.length}/${lines.length}`, 'bold');
        for(const [n, st] of lines) out.say(` ✔ ${pad(n, 34)} ${st}`, /Exited|Unhealthy/.test(st) ? 'err' : 'ok');
        if(!args.includes('-d')) out.say('(attached mode would stream the logs here; use -d to run in the background)', 'dim');
        return res;
      }
      case 'down': {
        const vols = args.includes('-v') || args.includes('--volumes');
        const lines = [];
        for(const s of [...order].reverse()) for(const c of ctrsOf(s)){ this.removeCtr(c); lines.push(`Container ${c.name}  Removed`); }
        if(this.networks[netName]){ delete this.networks[netName]; lines.push(`Network ${netName}  Removed`); }
        if(vols) for(const v of Object.keys(this.volumes)) if(this.volumes[v].project === project){ delete this.volumes[v]; lines.push(`Volume ${v}  Removed`); }
        out.say(`[+] Running ${lines.length}/${lines.length}`, 'bold');
        lines.forEach(l => out.say(' ✔ ' + l, 'ok'));
        if(!vols && Object.values(this.volumes).some(v => v.project === project)) out.say('(named volumes were kept: your data survives. Add -v to delete them too.)', 'dim');
        return res;
      }
      case 'ps': {
        res.lines.push(L(['NAME                 SERVICE    STATUS                     PORTS', 'bold']));
        for(const c of this.containers.filter(c => c.project === project)) res.lines.push(L(pad(c.name, 20) + ' ' + pad(c.service, 10) + ' ', [pad(c.status === 'running' ? this.up(c.started) + (c.health ? ` (${c.health})` : '') : `Exited (${c.exitCode})`, 26), c.status === 'running' ? 'ok' : 'dim'], ' ' + c.ports.map(p => `0.0.0.0:${p.host}->${p.cont}/tcp`).join(', ')));
        return res;
      }
      case 'logs': {
        const s = args.filter(x => !x.startsWith('-'))[1];
        for(const c of this.containers.filter(c => c.project === project && (!s || c.service === s))) for(const l of c.logs.slice(-8)) res.lines.push(L([pad(c.name, 18) + ' | ', 'info'], l));
        return res;
      }
      case 'exec': {
        const s = args[1]; const c = ctrsOf(s)[0];
        if(!c) return fail(`service "${s}" is not running`);
        return this.cmdExec([c.name, ...args.slice(2)], res, out, fail);
      }
      case 'stop': case 'start': case 'restart': {
        const only = args.slice(1).filter(x => !x.startsWith('-'));
        for(const c of this.containers.filter(c => c.project === project && (!only.length || only.includes(c.service)))) this.docker([action, c.name], {lines: [], err: false}, {say(){}, err(){}}, () => {});
        out.say(`✔ ${action === 'stop' ? 'Stopped' : action === 'start' ? 'Started' : 'Restarted'}`, 'ok');
        return res;
      }
    }
    return fail('usage: docker compose up [-d] [--build] [--scale svc=N] | down [-v] | ps | logs [svc] | exec svc cmd | build | stop | restart | config');
  }
}

<p class="lead"><b>Docker</b> packages an application <b>together with everything it needs</b> (runtime, libraries, config) into a single unit that runs the same way on any machine.</p>
<div class="analogy"><span class="ico">📦</span><div><b>Analogy — shipping containers.</b> Before standard containers, every cargo was loaded differently. A standard box fits any ship, train or truck. A Docker container is a standard box for software: "it works on my machine" becomes "it works on every machine".</div></div>
<h4>The three words that matter</h4>
<dl class="terms">
  <dt>Image</dt><dd>A read-only <b>template</b>: files + settings. Like a recipe, or a class in programming.</dd>
  <dt>Container</dt><dd>A <b>running instance</b> of an image: isolated process(es) with its own files. Like a dish cooked from the recipe, or an object.</dd>
  <dt>Registry</dt><dd>A store for images. <b>Docker Hub</b> is the public one.</dd>

<table class="tbl">

<div class="warn"><code>latest</code> is just a tag name, not "the newest". Pin real versions (<code>nginx:1.27</code>) in production so builds are repeatable.</div>
<p>An image is made of stacked <b>layers</b>. Images that share a base share those layers on disk ("Already exists" when pulling).</p>`,
  setup: [],
  steps: [
    {cmd: 'docker pull nginx', note: 'Download the official <b>nginx</b> web server image. No tag means <code>:latest</code>. Each line is one <b>layer</b>.'},
    {cmd: 'docker pull nginx:alpine', note: 'A different <b>tag</b> of the same image, built on tiny Alpine Linux.'},
    {cmd: 'docker images', note: 'Same software, very different sizes: 188MB vs 48MB.'},
    {cmd: 'docker pull python:3.12-slim', note: 'Look for <b>"Already exists"</b>: python-slim and nginx share the same Debian base layer, so it isn\'t downloaded twice.'},
    {cmd: 'docker history nginx', note: 'The <b>layers</b> that make up the image, newest on top. The <b>Layers</b> tab draws them as a stack.'},
    {cmd: 'docker rmi nginx:alpine', note: 'Remove an image you don\'t need any more.'},
    {cmd: 'docker images', note: 'Gone.'},
  ],
  quiz: {q: 'What does "docker pull redis" download?', options: ['redis:latest', 'The newest redis release, guaranteed', 'Every redis tag'], answer: 0, why: 'No tag means the tag literally named "latest", which is whatever the publisher pointed it at.'}
},

{
  id: 'containers', level: 'Beginner', view: 'host',
  title: 'Running containers',
  sub: 'run -d, ports, logs, stop, start, rm',
  html: `
<p class="lead">Most containers run <b>long-lived services</b>: a web server, a database. You start them in the background and connect through <b>published ports</b>.</p>
<pre class="code">docker run -d --name web -p 8080:80 nginx
           │   │          │
           │   │          └─ publish: host port 8080 → container port 80
           │   └─ a name you choose (instead of a random one)
           └─ detached: run in the background</pre>
<div class="analogy"><span class="ico">🏢</span><div><b>Ports — an office building.</b> The container is an office with an internal phone extension (80). <code>-p 8080:80</code> gives it an outside phone number (8080) that forwards to that extension. Without <code>-p</code>, nobody outside can call in.</div></div>
<h4>The container lifecycle</h4>
<div class="flow"><span>created</span><i>→</i><span class="ok">running</span><i>⇄</i><span>exited (stopped)</span><i>→</i><span>removed</span></div>
<p>A stopped container keeps its files until you <code>docker rm</code> it.</p>`,
  setup: ['docker pull nginx'],
  steps: [
    {cmd: 'docker run -d --name web -p 8080:80 nginx', note: 'Start nginx in the background. Docker prints the new container\'s full ID. In the Host panel, a green card shows the port mapping <b>localhost:8080 → 80</b>.'},
    {cmd: 'docker ps', note: 'Running, with <b>0.0.0.0:8080->80/tcp</b>.'},
    {cmd: 'curl localhost:8080', note: 'Talk to the container through the published port: nginx\'s welcome page.'},
    {cmd: 'open http://localhost:8080', note: 'Same thing in the <b>Browser</b> tab.'},
    {cmd: 'docker logs web', note: 'Everything the app wrote to its output, including one access line per request.'},
    {cmd: 'docker stop web', note: 'Stop it: the process ends, but the container (and its files) still exist.'},
    {cmd: 'curl localhost:8080', note: 'Nothing is listening any more: connection refused.', expectError: true},
    {cmd: 'docker ps -a', note: 'The container is <b>Exited</b>, not gone.'},
    {cmd: 'docker start web && curl localhost:8080', note: 'Start the same container again and it serves pages again.'},
    {cmd: 'docker rm -f web', note: '<code>rm -f</code> stops and removes it in one go.'},
  ],
  quiz: {q: 'In "-p 3000:80", which number is the port on YOUR machine?', options: ['3000', '80', 'Both'], answer: 0, why: 'The format is HOST:CONTAINER. You browse to localhost:3000, and Docker forwards it to port 80 inside.'}
},

{
  id: 'inside', level: 'Beginner', view: 'host',
  title: 'Getting inside: -it & exec',
  sub: 'Interactive shells and the main process',
  html: `
<p class="lead">A container lives exactly as long as its <b>main process</b> (PID 1). When that process ends, the container stops.</p>
<table class="tbl">
  <tr><td><code>docker run -it alpine sh</code></td><td>start a <b>new</b> container whose main process is an interactive shell. <code>exit</code> ends the shell, so the container stops.</td></tr>
  <tr><td><code>docker exec -it NAME sh</code></td><td>open an <b>extra</b> shell inside an <b>already running</b> container. <code>exit</code> only closes that shell.</td></tr>
  <tr><td><code>docker exec NAME cmd</code></td><td>run one command inside and print the result</td></tr>
</table>
<p><code>-i</code> keeps input open; <code>-t</code> gives you a terminal. Together: <code>-it</code>.</p>
<div class="analogy"><span class="ico">🚪</span><div><b>run -it</b> is moving into a new apartment: leave and it's handed back. <b>exec</b> is visiting a friend's apartment: you leave, they're still living there.</div></div>
<div class="tip">Changes you make inside a container (new files, installed packages) live in its <b>writable layer</b>. They disappear when the container is removed. To keep changes, put them in a Dockerfile (or a volume for data).</div>`,
  setup: ['docker pull alpine'],
  steps: [
    {cmd: 'docker run -it --name box alpine sh', note: 'You\'re now <b>inside</b> a fresh Alpine Linux container. Look at the prompt: <code>root@…:/#</code>.'},
    {cmd: 'cat /etc/os-release', note: 'A different Linux than your laptop\'s, with its own files.'},
    {cmd: 'echo "written inside the container" > /root/note.txt', note: 'Create a file. It goes into this container\'s writable layer.'},
    {cmd: 'ls /root', note: 'There it is.'},
    {cmd: 'exit', note: 'Leave the shell. The shell was the <b>main process</b>, so the container <b>stops</b>.'},
    {cmd: 'docker diff box', note: '<code>docker diff</code> lists what changed in the container\'s writable layer compared with the image: <b>A</b> = added.'},
    {cmd: 'docker run -d --name sleeper alpine sleep 600', note: 'A container whose main process (sleep) keeps running.'},
    {cmd: 'docker exec sleeper hostname', note: 'Run one command inside a running container.'},
    {cmd: 'docker exec -it sleeper sh', note: 'Open an <b>extra</b> shell inside it.'},
    {cmd: 'ps', note: 'PID 1 is <code>sleep 600</code>, the main process. Your shell is just a visitor.'},
    {cmd: 'exit', note: 'Leave: <b>sleeper keeps running</b>, because you only closed the extra shell.'},
  ],
  quiz: {q: 'You "docker exec -it web sh" and then type exit. What happens to web?', options: ['It stops', 'It keeps running', 'It is deleted'], answer: 1, why: 'exec starts an extra process. Only the end of the main process (PID 1) stops a container.'}
},

{
  id: 'first-dockerfile', level: 'Beginner', view: 'layers',
  title: 'Your first Dockerfile',
  sub: 'FROM, WORKDIR, COPY, CMD and docker build',
  html: `
<p class="lead">A <b>Dockerfile</b> is a recipe for building your own image: start from a base image, add your files, say how to run it.</p>
<pre class="code">FROM python:3.12-slim      # start from an existing image
WORKDIR /app               # cd into /app (created if missing)
COPY app.py .              # copy a file from your project into the image
CMD ["python", "app.py"]   # the default command when a container starts</pre>
<p>Build it with <code>docker build -t NAME .</code>. The <b>dot</b> is the <b>build context</b>: the folder whose files <code>COPY</code> can see.</p>
<table class="tbl">
  <tr><td><code>RUN</code></td><td>runs a command <b>at build time</b> (install packages…)</td></tr>
  <tr><td><code>CMD</code></td><td>the default command <b>at run time</b>; overridden by args after the image name</td></tr>
  <tr><td><code>ENV</code> / <code>EXPOSE</code></td><td>default env vars / document the port the app listens on</td></tr>
</table>
<p>The <b>Files</b> tab shows the project; you can edit files there and rebuild.</p>`,
  setup: [FILES({'app.py': APP_HELLO, 'Dockerfile': DF_HELLO})],
  steps: [
    {cmd: 'ls', note: 'The project: a tiny Python app and a Dockerfile.'},
    {cmd: 'cat Dockerfile', note: 'Four instructions: base image, working directory, copy the app, default command.'},
    {cmd: 'docker build -t hello-py .', note: 'Build! Each instruction is a step. Watch the <b>Layers</b> panel: your two new layers sit on top of python:3.12-slim\'s layers.'},
    {cmd: 'docker images hello-py', note: 'Your own image, ready to run anywhere.'},
    {cmd: 'docker run hello-py', note: 'Run it: Python executes <b>inside</b> the container (you don\'t even need Python on your laptop).'},
    {cmd: 'docker run -e NAME=Ada hello-py', note: '<code>-e</code> sets an environment variable; the app reads it.'},
    {cmd: 'docker run hello-py python --version', note: 'Arguments after the image name <b>replace CMD</b>.'},
    {cmd: 'docker history hello-py', note: 'Layer history: WORKDIR and CMD are metadata (0B), and COPY added the app\'s bytes.'},
  ],
  quiz: {q: 'What does the "." at the end of "docker build -t app ." mean?', options: ['Build the current image again', 'The build context: send this folder\'s files to the build', 'Nothing, it\'s optional'], answer: 1, why: 'COPY can only see files inside the build context folder.'}
},

{
  id: 'cleanup', level: 'Beginner', view: 'host',
  title: 'Housekeeping: cleaning up',
  sub: 'Stopped containers, dangling images, disk usage',
  html: `
<p class="lead">Docker keeps everything until you delete it: stopped containers, old images, unused volumes and build cache. Over weeks that adds up to many gigabytes.</p>
<table class="tbl">
  <tr><td><code>docker system df</code></td><td>how much disk each kind of object uses</td></tr>
  <tr><td><code>docker container prune</code></td><td>delete all <b>stopped</b> containers</td></tr>
  <tr><td><code>docker image prune</code></td><td>delete <b>dangling</b> images (<code>&lt;none&gt;</code>: old builds that lost their tag)</td></tr>
  <tr><td><code>docker system prune -a</code></td><td>everything unused, including images no container uses ⚠</td></tr>
  <tr><td><code>docker run --rm …</code></td><td>auto-delete the container when it exits; great for one-off commands</td></tr>
</table>
<div class="warn">Prune commands don't delete <b>named volumes</b> unless you explicitly ask. That's on purpose: volumes hold your data.</div>`,
  setup: [FILES({'app.py': APP_HELLO, 'Dockerfile': DF_HELLO}), 'docker run hello-world', 'docker run hello-world', 'docker run alpine echo one-off', 'docker build -t hello-py .', 'echo "print(\'v2\')" >> app.py', 'docker build -t hello-py .', 'docker run -d --name keep alpine sleep 900'],
  steps: [
    {cmd: 'docker ps -a', note: 'Leftovers: several exited containers from earlier experiments, plus one running.'},
    {cmd: 'docker images', note: 'See the <b>&lt;none&gt;</b> image? It\'s the <i>old</i> hello-py: rebuilding moved the tag to the new image and left the old one <b>dangling</b>.'},
    {cmd: 'docker system df', note: 'Disk usage summary, with how much is <b>reclaimable</b>.'},
    {cmd: 'docker container prune', note: 'Delete all stopped containers. The running "keep" is untouched.'},
    {cmd: 'docker image prune', note: 'Delete dangling images.'},
    {cmd: 'docker run --rm alpine echo "I clean up after myself"', note: '<code>--rm</code>: the container deletes itself when it exits, so nothing is left behind.'},
    {cmd: 'docker ps -a', note: 'Tidy.'},
  ],
  quiz: {q: 'What is a "dangling" image?', options: ['An image currently running', 'An image with no name, usually an old build whose tag moved to a newer build', 'An image on Docker Hub'], answer: 1, why: 'Rebuilding with the same tag moves the tag; the previous image becomes <none>:<none>.'}
},

{
  id: 'layers-cache', level: 'Intermediate', view: 'layers',
  title: 'Layers & the build cache',
  sub: 'Why instruction order makes builds 100× faster',
  html: `
<p class="lead">Every Dockerfile instruction creates a <b>layer</b>. Docker <b>caches</b> layers: if an instruction <i>and everything before it</i> is unchanged, the old layer is reused (<b>CACHED</b>).</p>
<p>The rule: <b>once one step changes, every step after it is rebuilt.</b> For <code>COPY</code>, "changed" means any copied file changed.</p>
<div class="two-col">
  <div class="mini bad"><b>❌ Slow</b><pre>COPY . .
RUN pip install -r requirements.txt</pre>Editing <i>any</i> file reinstalls every dependency.</div>
  <div class="mini good"><b>✅ Fast</b><pre>COPY requirements.txt .
RUN pip install -r requirements.txt
COPY . .</pre>Dependencies reinstall only when requirements.txt changes.</div>
</div>
<p><b>Order instructions from least to most frequently changing.</b> Dependencies first, your code last.</p>
<p>The <b>Layers</b> panel colors each Dockerfile line: <span class="badge cached">CACHED</span> reused, <span class="badge built">BUILT</span> rebuilt (with the time it took).</p>`,
  setup: [FILES({'app.py': APP_WEB, 'requirements.txt': 'flask==3.0.3\n', 'Dockerfile': DF_BAD}), 'docker pull python:3.12-slim'],
  steps: [
    {cmd: 'cat Dockerfile', note: 'This Dockerfile copies <b>all</b> files before installing dependencies. Let\'s see why that hurts.'},
    {cmd: 'docker build -t web .', note: 'First build: everything is built. Note the time of the <code>pip install</code> step.'},
    {cmd: 'echo "# small change" >> app.py', note: 'Make a one-line change to the app, like you will hundreds of times a day.'},
    {cmd: 'docker build -t web .', note: '<b>pip install ran again!</b> app.py changed, so <code>COPY . .</code> changed, and every later step is rebuilt.'},
    {cmd: 'cat > Dockerfile <<EOF\n' + DF_GOOD + 'EOF', note: 'Fix it: copy <b>requirements.txt</b> first, install, <i>then</i> copy the rest. (The Files tab shows the new Dockerfile.)'},
    {cmd: 'docker build -t web .', note: 'The order changed, so this build runs everything once more…'},
    {cmd: 'echo "# another change" >> app.py', note: '…now edit the app again…'},
    {cmd: 'docker build -t web .', note: '…and the dependency layer is <b>CACHED</b>. Only the final <code>COPY . .</code> reruns: about 0.1s instead of ~10s.'},
    {cmd: 'docker images', note: 'Every rebuild left the previous image <b>dangling</b> (&lt;none&gt;). That\'s normal, and <code>docker image prune</code> cleans it up.'},
  ],
  quiz: {q: 'You change app.py. Which steps rebuild with the ✅ fast Dockerfile?', options: ['All of them', 'Only COPY . . and anything after it', 'Only pip install'], answer: 1, why: 'Everything up to the changed COPY is reused from cache.'}
},

{
  id: 'web-app', level: 'Intermediate', view: 'host',
  title: 'Containerizing a web app',
  sub: 'Dependencies, ports and several instances',
  html: `
<p class="lead">A real app needs its <b>dependencies</b> installed in the image and its <b>port published</b> so you can reach it.</p>
<pre class="code">requirements.txt   →   RUN pip install -r requirements.txt
app.run(port=5000) →   EXPOSE 5000   +   docker run -p 5000:5000</pre>
<div class="warn">Inside a container, a server must listen on <code>0.0.0.0</code>, not <code>127.0.0.1</code>. Localhost <i>inside</i> the container is only the container itself.</div>
<p>You can run <b>many containers from one image</b>, each on a different host port. A host port can only be used by one container at a time.</p>`,
  setup: [FILES({'app.py': APP_WEB, 'requirements.txt': 'flask==3.0.3\n', 'Dockerfile': DF_GOOD}), 'docker pull python:3.12-slim'],
  steps: [
    {cmd: 'cat app.py', note: 'A small Flask web app. It greets with the container\'s hostname, so we can tell instances apart.'},
    {cmd: 'docker build -t web .', note: 'Build the image (Flask gets installed into it).'},
    {cmd: 'docker run -d --name web1 -p 5000:5000 web', note: 'Run it, publishing port 5000.'},
    {cmd: 'curl localhost:5000', note: 'It answers with the container\'s hostname (its short ID).'},
    {cmd: 'docker run -d --name web2 -p 5000:5000 web', note: 'A second instance on the <b>same host port</b> fails: port already allocated.', expectError: true},
    {cmd: 'docker run -d --name web2 -p 5001:5000 -e GREETING=Hola web', note: 'Use host port <b>5001</b>, and change the greeting with an env var.'},
    {cmd: 'curl localhost:5001', note: 'Two independent containers from <b>one image</b>.'},
    {cmd: 'open http://localhost:5001', note: 'In the Browser tab.'},
  ],
  quiz: {q: 'Two containers both listen on port 5000 inside. Can they run at the same time?', options: ['No, the port is taken', 'Yes, as long as they publish different HOST ports', 'Only with --network host'], answer: 1, why: 'Each container has its own network namespace; only host ports must be unique.'}
},
