{
  id: 'volumes', level: 'Intermediate', view: 'host',
  title: 'Volumes: data that survives',
  sub: 'Containers are disposable; data shouldn\'t be',
  html: `
<p class="lead">A container's writable layer is <b>deleted with the container</b>. For data that must survive (databases, uploads), use a <b>volume</b>: storage managed by Docker, living outside any container.</p>
<pre class="code">docker run -v notes:/data alpine …
              │     │
              │     └─ path inside the container
              └─ volume name (created automatically if missing)</pre>
<div class="analogy"><span class="ico">💾</span><div><b>Analogy — a USB stick.</b> Containers are cheap laptops you throw away. A volume is the USB stick you plug into the next laptop: the files are still there.</div></div>
<table class="tbl">
  <tr><td><code>docker volume create / ls / inspect / rm</code></td><td>manage volumes</td></tr>
  <tr><td>several containers, one volume</td><td>they share the data</td></tr>
</table>
<div class="tip">Official database images (postgres, redis, mysql) declare a <code>VOLUME</code>. Always mount a <b>named</b> volume there, or your data ends up in an anonymous volume that's easy to lose.</div>`,
  setup: ['docker pull alpine', 'docker pull redis:7'],
  steps: [
    {cmd: 'docker run --name temp alpine sh -c "echo important > /data.txt && cat /data.txt"', note: 'Write a file into a container\'s writable layer…'},
    {cmd: 'docker rm temp', note: '…remove the container…'},
    {cmd: 'docker run --rm alpine cat /data.txt', note: '…and the data is <b>gone</b>. A new container starts clean from the image.'},
    {cmd: 'docker volume create notes', note: 'Create a <b>volume</b>. It appears in the Volumes row of the Host panel.'},
    {cmd: 'docker run --rm -v notes:/data alpine sh -c "echo first note >> /data/notes.txt"', note: 'A throwaway container writes into the volume…'},
    {cmd: 'docker run --rm -v notes:/data alpine sh -c "echo second note >> /data/notes.txt"', note: '…another one adds a line…'},
    {cmd: 'docker run --rm -v notes:/data alpine cat /data/notes.txt', note: '…and a third reads <b>both</b>. Containers come and go; the volume keeps the data.'},
    {cmd: 'docker run -d --name cache -v redis-data:/data redis:7', note: 'Now a real database: Redis with its data directory on a volume.'},
    {cmd: 'docker exec cache redis-cli INCR visits && docker exec cache redis-cli INCR visits', note: 'Store something: a counter at 2.'},
    {cmd: 'docker rm -f cache', note: 'Destroy the database container.'},
    {cmd: 'docker run -d --name cache2 -v redis-data:/data redis:7', note: 'Start a <b>brand-new</b> container on the same volume…'},
    {cmd: 'docker exec cache2 redis-cli GET visits', note: '…and the data is still there: <b>"2"</b>.'},
  ],
  quiz: {q: 'You run "docker rm -f db" on a postgres container that used "-v pgdata:/var/lib/postgresql/data". Is the data lost?', options: ['Yes', 'No, it is in the pgdata volume', 'Only the tables are lost'], answer: 1, why: 'Removing a container never removes named volumes. Run a new container with the same -v to get the data back.'}
},
/* ------------------------------------------------------------------ */
{
  id: 'bind-mounts', level: 'Intermediate', view: 'browser',
  title: 'Bind mounts: live development',
  sub: 'Share a folder from your laptop',
  html: `
<p class="lead">A <b>bind mount</b> maps a folder (or file) from your machine directly into a container. Edit on your laptop, and the container sees the change <b>instantly</b>, with no rebuild.</p>
<table class="tbl">
  <tr><th></th><th>Volume</th><th>Bind mount</th></tr>
  <tr><td>Syntax</td><td><code>-v mydata:/data</code></td><td><code>-v ./site:/usr/share/nginx/html</code></td></tr>
  <tr><td>Lives in</td><td>Docker's storage</td><td>your project folder</td></tr>
  <tr><td>Best for</td><td>database data, persistence</td><td>source code during development, config files</td></tr>
</table>
<p>Add <code>:ro</code> to make the mount <b>read-only</b> inside the container, so the app can read the files but never modify them.</p>
<div class="warn">Bind mounts are for development. In production, <code>COPY</code> your code into the image so it's immutable and the same everywhere.</div>`,
  setup: [FILES({'site/index.html': SITE}), 'docker pull nginx'],
  steps: [
    {cmd: 'cat site/index.html', note: 'A web page on your laptop.'},
    {cmd: 'docker run -d --name site -p 8080:80 -v ./site:/usr/share/nginx/html nginx', note: 'Mount the <b>./site</b> folder over nginx\'s web root.'},
    {cmd: 'open http://localhost:8080', note: 'nginx serves <b>your</b> file instead of its welcome page.'},
    {cmd: 'echo "<p><b>Edited on my laptop, no rebuild, no restart!</b></p>" >> site/index.html', note: 'Edit the file on the host. (You can also edit it in the <b>Files</b> tab.)'},
    {cmd: 'open http://localhost:8080', note: 'Refresh: the change is live immediately.'},
    {cmd: 'docker exec site ls /usr/share/nginx/html', note: 'From inside, the folder <i>is</i> your project folder.'},
    {cmd: 'docker run -d --name ro-site -p 8081:80 -v ./site:/usr/share/nginx/html:ro nginx', note: 'The same mount, read-only.'},
    {cmd: 'docker exec ro-site sh -c "echo hacked > /usr/share/nginx/html/index.html"', note: 'The container cannot modify a <code>:ro</code> mount.', expectError: true},
  ],
  quiz: {q: 'Best choice for a database\'s data files in production?', options: ['Bind mount to my source folder', 'A named volume', 'The container\'s writable layer'], answer: 1, why: 'Named volumes are managed by Docker, portable, and survive container removal.'}
},
/* ------------------------------------------------------------------ */
{
  id: 'networking', level: 'Intermediate', view: 'host',
  title: 'Networking between containers',
  sub: 'User-defined networks and DNS by name',
  html: `
<p class="lead">Containers on the <b>same user-defined network</b> can reach each other <b>by container name</b>. Docker runs a small DNS server for them.</p>
<pre class="code">docker network create app-net
docker run --network app-net --name redis redis
docker run --network app-net --name app   my-app   # app can connect to "redis:6379"</pre>
<div class="warn">The <b>default "bridge" network has no DNS</b>. Containers there can't find each other by name. Always create your own network (Compose does this for you).</div>
<div class="analogy"><span class="ico">🏘️</span><div><b>Analogy — a private office network.</b> Inside the office, people call each other by first name ("redis"). The outside world can only reach whoever has a published phone number (<code>-p</code>).</div></div>
<p>Only the app needs <code>-p</code>. Redis stays private on the network, which is safer.</p>`,
  setup: [FILES({'app.py': APP_COUNTER, 'requirements.txt': 'flask==3.0.3\nredis==5.0.8\n', 'Dockerfile': DF_GOOD}), 'docker build -t counter .', 'docker pull redis:7', 'docker pull alpine'],
  steps: [
    {cmd: 'docker run -d --name redis redis:7', note: 'Start Redis on the default bridge network.'},
    {cmd: 'docker run -d --name app -p 5000:5000 counter', note: 'Start the visit-counter app, which connects to the host <b>"redis"</b>.'},
    {cmd: 'curl localhost:5000', note: '<b>Error</b>: "Name or service not known". On the default bridge, the name "redis" means nothing.'},
    {cmd: 'docker network create app-net', note: 'Create a user-defined network (it gets DNS).'},
    {cmd: 'docker network connect app-net redis', note: 'Attach the running Redis to it.'},
    {cmd: 'docker rm -f app && docker run -d --name app --network app-net -p 5000:5000 counter', note: 'Recreate the app <b>on app-net</b>. In the Host panel both containers are now inside the app-net box.'},
    {cmd: 'curl localhost:5000 && curl localhost:5000', note: 'It works, and the counter increments in Redis.'},
    {cmd: 'docker run --rm --network app-net alpine ping -c 2 redis', note: 'Any container on app-net can resolve "redis" to its IP address.'},
    {cmd: 'docker network inspect app-net', note: 'The network, with its containers and their IPs.'},
  ],
  quiz: {q: 'Why does "redis" resolve on app-net but not on the default bridge?', options: ['Redis blocks the bridge', 'User-defined networks have built-in DNS; the default bridge does not', 'You must publish redis with -p'], answer: 1, why: 'Docker\'s embedded DNS only serves user-defined networks.'}
},
/* ------------------------------------------------------------------ */
{
  id: 'env-config', level: 'Intermediate', view: 'host',
  title: 'Configuration: env vars & build args',
  sub: '-e, --env-file, ENV, ARG',
  html: `
<p class="lead">The same image should run in dev, test and production. Only the <b>configuration</b> changes, and it comes from <b>environment variables</b>.</p>
<table class="tbl">
  <tr><th>When</th><th>How</th></tr>
  <tr><td>run time</td><td><code>docker run -e KEY=value</code> or <code>--env-file app.env</code></td></tr>
  <tr><td>default in the image</td><td><code>ENV KEY=value</code> in the Dockerfile</td></tr>
  <tr><td>build time only</td><td><code>ARG KEY=default</code> + <code>docker build --build-arg KEY=…</code></td></tr>
</table>
<div class="warn">Never bake secrets (passwords, API keys) into an image with ENV or ARG. Anyone with the image can read them (<code>docker history</code>, <code>docker inspect</code>). Pass them at run time.</div>
<p>Many official images <b>require</b> configuration. Postgres refuses to start without a password, as you'll see.</p>`,
  setup: [FILES({'app.env': 'APP_MODE=staging\nLOG_LEVEL=debug\nFEATURE_X=on\n', 'Dockerfile': 'FROM alpine:3.20\nARG APP_VERSION=1.0\nENV APP_VERSION=$APP_VERSION\nCMD ["printenv", "APP_VERSION"]\n'}), 'docker pull postgres:16', 'docker pull alpine'],
  steps: [
    {cmd: 'docker run --name db postgres:16', note: 'Postgres exits immediately with a clear error: <b>POSTGRES_PASSWORD</b> is required.'},
    {cmd: 'docker ps -a', note: 'Exited with code 1.'},
    {cmd: 'docker rm db && docker run -d --name db -e POSTGRES_PASSWORD=secret postgres:16', note: 'Pass the password with <code>-e</code> and it starts.'},
    {cmd: 'docker logs db', note: '"ready to accept connections".'},
    {cmd: 'docker exec db psql -U postgres -c "SELECT version();"', note: 'Query the running database.'},
    {cmd: 'cat app.env', note: 'Many settings at once: an env file.'},
    {cmd: 'docker run --rm --env-file app.env alpine env', note: '<code>--env-file</code> loads every line as an environment variable.'},
    {cmd: 'docker build --build-arg APP_VERSION=2.5 -t versioned .', note: '<b>ARG</b> exists only during the build; here we copy it into an ENV so the app can see it.'},
    {cmd: 'docker run --rm versioned', note: 'The value baked in at build time: 2.5.'},
  ],
  quiz: {q: 'Where should a database password come from?', options: ['ENV in the Dockerfile', 'An env var or secret supplied at run time', 'A comment in the Dockerfile'], answer: 1, why: 'Anything in the image can be read by anyone who has the image.'}
},
/* ------------------------------------------------------------------ */
{
  id: 'compose-basics', level: 'Intermediate', view: 'host',
  title: 'Docker Compose',
  sub: 'A whole app stack in one file',
  html: `
<p class="lead">Typing long <code>docker run</code> commands for every container gets old fast. <b>Docker Compose</b> describes the whole stack (services, networks, volumes) in one YAML file.</p>
<pre class="code">services:
  web:                   # a service = a container (or several)
    build: .             # build from the Dockerfile here
    ports: ["8000:5000"]
    depends_on: [redis]  # start redis first
  redis:
    image: redis:7
    volumes: [redis-data:/data]
volumes:
  redis-data:</pre>
<table class="tbl">
  <tr><td><code>docker compose up -d</code></td><td>build/pull, create the network and volumes, start everything</td></tr>
  <tr><td><code>docker compose ps / logs</code></td><td>status and combined logs</td></tr>
  <tr><td><code>docker compose down</code></td><td>stop and remove containers + network (volumes are kept)</td></tr>
  <tr><td><code>docker compose down -v</code></td><td>…and delete the volumes too ⚠</td></tr>
</table>
<div class="tip">Compose automatically creates a network for the project, and every <b>service name is a DNS name</b>. That's why the app can simply connect to "redis".</div>`,
  setup: [FILES({'app.py': APP_COUNTER, 'requirements.txt': 'flask==3.0.3\nredis==5.0.8\n', 'Dockerfile': DF_GOOD, 'docker-compose.yml': COMPOSE_BASIC}), 'docker pull python:3.12-slim'],
  steps: [
    {cmd: 'cat docker-compose.yml', note: 'Two services, one named volume: the same app as the networking lesson, in a single file.'},
    {cmd: 'docker compose up -d', note: 'One command: build the web image, create network <code>project_default</code> and the volume, start redis, then web.'},
    {cmd: 'docker compose ps', note: 'Both services running. Container names are <code>project-SERVICE-1</code>.'},
    {cmd: 'curl localhost:8000 && curl localhost:8000', note: 'The app reaches redis by its <b>service name</b>.'},
    {cmd: 'docker compose logs web', note: 'Logs per service.'},
    {cmd: 'docker compose down', note: 'Tear everything down: containers and network. The <b>volume is kept</b>.'},
    {cmd: 'docker compose up -d && curl localhost:8000', note: 'Back up: the counter <b>continues at 3</b>, because the data lived in the volume.'},
    {cmd: 'docker compose down -v', note: '<code>-v</code> also deletes the volumes, for a truly fresh start.'},
  ],
  quiz: {q: 'In Compose, how does the web service find the database?', options: ['By its IP address', 'By its service name, e.g. "db"', 'Through a published port on localhost'], answer: 1, why: 'Compose puts all services on one network where service names resolve through DNS.'}
},
/* ------------------------------------------------------------------ */
{
  id: 'compose-advanced', level: 'Intermediate', view: 'host',
  title: 'Compose: healthchecks, scaling & a load balancer',
  sub: 'depends_on conditions and --scale',
  html: `
<p class="lead">"Started" is not "ready". A database container can be running for seconds before it accepts connections. Compose can wait for a <b>healthcheck</b>:</p>
<pre class="code">web:
  depends_on:
    db:
      condition: service_healthy   # wait until db's healthcheck passes
db:
  healthcheck:
    test: ["CMD", "pg_isready", "-U", "postgres"]
    interval: 5s</pre>
<h4>Scaling</h4>
<p><code>docker compose up -d --scale web=3</code> runs three identical web containers. They can't all publish the same host port, so put a <b>load balancer</b> (nginx) in front. It forwards to <code>web:5000</code>, and Docker DNS spreads the requests over all replicas.</p>
<div class="flow"><span>you</span><i>→</i><span>lb (nginx) :8080</span><i>→</i><span>web-1 · web-2 · web-3</span><i>→</i><span>db</span></div>`,
  setup: [FILES({'app.py': APP_WEB, 'requirements.txt': 'flask==3.0.3\n', 'Dockerfile': DF_GOOD, 'docker-compose.yml': COMPOSE_SCALE, 'nginx.conf': NGINX_LB}), 'docker pull python:3.12-slim', 'docker pull nginx:alpine', 'docker pull postgres:16'],
  steps: [
    {cmd: 'cat docker-compose.yml', note: 'Three services: a load balancer, the web app (no published port!), and a database with a healthcheck.'},
    {cmd: 'cat nginx.conf', note: 'nginx forwards every request to <code>http://web:5000</code>.'},
    {cmd: 'docker compose up -d --scale web=3', note: 'Compose starts db, <b>waits until it is healthy</b>, then starts 3 web replicas, then the load balancer.'},
    {cmd: 'docker compose ps', note: 'db is (healthy) and web runs ×3.'},
    {cmd: 'curl localhost:8080 && curl localhost:8080 && curl localhost:8080', note: 'Three requests, answered by <b>three different containers</b>: round-robin load balancing.'},
    {cmd: 'docker compose logs lb', note: 'nginx\'s access log shows each request being proxied.'},
    {cmd: 'docker compose up -d --scale web=1', note: 'Scale back down to one replica.'},
    {cmd: 'docker compose down', note: 'Clean up (the db volume is kept).'},
  ],
  quiz: {q: 'Why not publish "5000:5000" on a service scaled to 3?', options: ['Compose forbids ports', 'Only one container can bind a given host port', 'Port 5000 is reserved'], answer: 1, why: 'Use a load balancer (or no host port) when you scale a service.'}
},
/* ------------------------------------------------------------------ */
{
  id: 'multistage', level: 'Advanced', view: 'layers',
  title: 'Multi-stage builds',
  sub: 'Build with a big toolchain, ship a tiny image',
  html: `
<p class="lead">Compilers, SDKs and dev dependencies are needed to <b>build</b> your app, but not to <b>run</b> it. A <b>multi-stage</b> Dockerfile builds in one stage and copies only the result into a small final image.</p>
<pre class="code">FROM node:20 AS build          # stage 1: ~1.1 GB of tools
RUN npm ci && npm run build

FROM nginx:alpine              # stage 2: ~48 MB
COPY --from=build /app/dist /usr/share/nginx/html</pre>
<ul>
  <li><b>Smaller</b> images download and start faster.</li>
  <li><b>Safer</b>: fewer packages means fewer vulnerabilities, and no compilers for an attacker to use.</li>
  <li><code>docker build --target build</code> stops at a named stage (handy for running tests).</li>
</ul>`,
  setup: [FILES({'package.json': PKG, 'package-lock.json': '{"lockfileVersion": 3}\n', 'src/index.html': SRC_HTML, 'Dockerfile.single': DF_SINGLE, 'Dockerfile': DF_MULTI}), 'docker pull node:20', 'docker pull nginx:alpine'],
  steps: [
    {cmd: 'cat Dockerfile.single', note: 'The naive way: build and run in the same Node image.'},
    {cmd: 'docker build -f Dockerfile.single -t site:fat .', note: 'It works, but the image contains Node, npm and 300 packages of node_modules.'},
    {cmd: 'cat Dockerfile', note: 'The multi-stage version: stage <b>build</b> uses Node; the final stage is just nginx + the built files.'},
    {cmd: 'docker build -t site:slim .', note: 'Note the <b>CACHED</b> steps: stage 1 is identical to the single-stage file, so it\'s reused.'},
    {cmd: 'docker images site', note: '<b>~1.3 GB vs ~49 MB</b>. Same website.'},
    {cmd: 'docker run -d --name site -p 8080:80 site:slim', note: 'Run the slim one…'},
    {cmd: 'open http://localhost:8080', note: '…the built page, served by nginx. No Node.js in this image at all.'},
    {cmd: 'docker build --target build -t site:builder .', note: '<code>--target</code> builds only up to a stage, e.g. to run tests in it.'},
  ],
  quiz: {q: 'What ends up in the final image of a multi-stage build?', options: ['All stages', 'Only the last stage, plus whatever you COPY --from earlier stages', 'Only the first stage'], answer: 1, why: 'Earlier stages are build-time helpers; they are not shipped.'}
},
/* ------------------------------------------------------------------ */
{
  id: 'health-restart', level: 'Advanced', view: 'host',
  title: 'Healthchecks & restart policies',
  sub: 'Self-healing containers',
  html: `
<p class="lead">A process can be <b>running</b> but <b>broken</b> (deadlocked, out of connections). A <b>HEALTHCHECK</b> lets Docker test the app itself, and a <b>restart policy</b> brings crashed containers back.</p>
<pre class="code">HEALTHCHECK --interval=10s --retries=3 \\
  CMD curl -f http://localhost:5000/health || exit 1</pre>
<p>Health states: <span class="pill starting">starting</span> → <span class="pill healthy">healthy</span> or, after <i>retries</i> failures, <span class="pill unhealthy">unhealthy</span>.</p>
<table class="tbl">
  <tr><th>--restart</th><th>Restarts when…</th></tr>
  <tr><td><code>no</code> (default)</td><td>never</td></tr>
  <tr><td><code>on-failure</code></td><td>it exits with an error code</td></tr>
  <tr><td><code>always</code></td><td>it stops for any reason (also after a daemon restart)</td></tr>
  <tr><td><code>unless-stopped</code></td><td>like always, but not if <i>you</i> stopped it</td></tr>
</table>
<div class="note">Plain Docker only <i>reports</i> unhealthy; orchestrators (Swarm, Kubernetes) replace unhealthy containers automatically. The image needs <code>curl</code> for this check, which is why the Dockerfile installs it.</div>`,
  setup: [FILES({'app.py': APP_WEB, 'requirements.txt': 'flask==3.0.3\n', 'Dockerfile': DF_HEALTH}), 'docker build -t api .'],
  steps: [
    {cmd: 'cat Dockerfile', note: 'Installs curl (one RUN, cleaning apt lists in the same layer), and adds a HEALTHCHECK on <code>/health</code>.'},
    {cmd: 'docker run -d --name api -p 5000:5000 --restart unless-stopped api', note: 'Run with a restart policy.'},
    {cmd: 'docker ps', note: 'Status: <b>(health: starting)</b>. No check has run yet.'},
    {cmd: 'sleep 10', note: 'Wait for the first check…'},
    {cmd: 'docker ps', note: '…<b>(healthy)</b>.'},
    {cmd: 'docker exec api touch /tmp/broken', note: '<b>Simulate a bug</b>: this simulator\'s app answers 500 on /health while /tmp/broken exists.'},
    {cmd: 'sleep 30', note: 'Three failed checks in a row…'},
    {cmd: 'docker ps', note: '…<b>(unhealthy)</b>. The process is up, but Docker knows it\'s broken. Monitoring and orchestrators act on this.'},
    {cmd: 'docker exec api rm /tmp/broken && sleep 10', note: 'Fix it: healthy again after the next check.'},
    {cmd: 'docker exec api kill 1', note: 'Now <b>crash</b> the main process (PID 1)…'},
    {cmd: 'sleep 5 && docker ps', note: '…the restart policy brought it back automatically.'},
    {cmd: 'docker inspect --format "{{.RestartCount}}" api', note: 'Docker counts restarts. A rising count means a crash loop to investigate with <code>docker logs</code>.'},
  ],
  quiz: {q: 'A container shows "Up 2 hours (unhealthy)". What does that mean?', options: ['The process stopped', 'The process runs, but its healthcheck keeps failing', 'Docker is restarting it'], answer: 1, why: 'Health is about the app answering correctly, not just the process existing.'}
},
/* ------------------------------------------------------------------ */
{
  id: 'entrypoint', level: 'Advanced', view: 'host',
  title: 'ENTRYPOINT vs CMD',
  sub: 'Fixed executables, default arguments, wrapper scripts',
  html: `
<p class="lead">What a container runs is <code>ENTRYPOINT</code> + <code>CMD</code> joined together.</p>
<table class="tbl">
  <tr><th></th><th>ENTRYPOINT</th><th>CMD</th></tr>
  <tr><td>Role</td><td>the fixed program</td><td>default arguments (or default command)</td></tr>
  <tr><td>Override with</td><td><code>--entrypoint</code></td><td>args after the image name</td></tr>
</table>
<pre class="code">ENTRYPOINT ["echo", "Hello"]
CMD ["World"]
docker run greet          → echo Hello World
docker run greet Docker   → echo Hello Docker</pre>
<h4>The wrapper-script pattern</h4>
<p>Real images often use an <code>entrypoint.sh</code> that does setup (wait for the DB, run migrations, render config) and then hands over to the CMD with <code>exec "$@"</code>, so your app becomes PID 1 and receives stop signals.</p>
<div class="tip">Prefer the <b>exec form</b> <code>["python", "app.py"]</code> over the shell form <code>python app.py</code>. The shell form wraps your app in <code>/bin/sh -c</code>, so signals like <code>docker stop</code> reach the shell, not your app.</div>`,
  setup: [FILES({'Dockerfile': DF_GREET, 'Dockerfile.app': DF_ENTRY, 'entrypoint.sh': ENTRY_SH, 'app.py': APP_HELLO}), 'docker pull alpine:3.20', 'docker pull python:3.12-slim'],
  steps: [
    {cmd: 'cat Dockerfile', note: 'ENTRYPOINT is the program, and CMD supplies a default argument.'},
    {cmd: 'docker build -t greet .', note: 'Build it.'},
    {cmd: 'docker run --rm greet', note: '<code>echo Hello World</code>'},
    {cmd: 'docker run --rm greet Docker', note: 'Arguments replace <b>only CMD</b>: <code>echo Hello Docker</code>.'},
    {cmd: 'docker run --rm --entrypoint printenv greet HOSTNAME', note: '<code>--entrypoint</code> replaces the program itself.'},
    {cmd: 'cat entrypoint.sh', note: 'A wrapper script: setup steps, then <code>exec "$@"</code> runs the CMD.'},
    {cmd: 'docker build -f Dockerfile.app -t app-entry .', note: 'ENTRYPOINT = the script, CMD = the app.'},
    {cmd: 'docker run --rm app-entry', note: 'The setup lines run first, then the app.'},
    {cmd: 'docker run --rm -e APP_ENV=staging -e NAME=Docker app-entry', note: 'The same image, configured differently at run time.'},
  ],
  quiz: {q: 'ENTRYPOINT ["python"] and CMD ["app.py"]. What does "docker run img test.py" run?', options: ['python app.py', 'python test.py', 'test.py'], answer: 1, why: 'Run arguments replace CMD; ENTRYPOINT stays.'}
},
/* ------------------------------------------------------------------ */
{
  id: 'security', level: 'Advanced', view: 'layers',
  title: 'Image security basics',
  sub: '.dockerignore, secrets, non-root users',
  html: `
<p class="lead">Everything in the build context can end up in your image, and everyone who can pull the image can read it.</p>
<h4>1. .dockerignore</h4>
<p>Like .gitignore, but for the build context: keep out <code>.env</code>, <code>.git</code>, <code>node_modules</code>, logs and keys.</p>
<h4>2. Never bake secrets into layers</h4>
<p>Deleting a file in a later layer does <b>not</b> remove it from earlier layers. For secrets needed <i>during</i> a build, use BuildKit secret mounts:</p>
<pre class="code">RUN --mount=type=secret,id=token  cat /run/secrets/token
docker build --secret id=token,src=token.txt .</pre>
<h4>3. Don't run as root</h4>
<p>By default the process inside runs as <b>root</b>. If the app is compromised, the attacker is root inside the container. Create a user and switch with <code>USER</code>.</p>
<div class="tip">Also: use small official base images, pin versions, scan images (<code>docker scout cves</code>), and rebuild regularly for security patches.</div>`,
  setup: [FILES({'app.py': APP_HELLO, '.env': 'DB_PASSWORD=super-secret-123\nSTRIPE_KEY=sk_live_abc\n', 'Dockerfile': 'FROM python:3.12-slim\nWORKDIR /app\nCOPY . .\nCMD ["python", "app.py"]\n'}), 'docker pull python:3.12-slim'],
  steps: [
    {cmd: 'ls -a', note: 'The project has a <code>.env</code> file with real secrets, and the Dockerfile does <code>COPY . .</code>.'},
    {cmd: 'docker build -t myapp .', note: 'Build…'},
    {cmd: 'docker run --rm myapp cat /app/.env', note: '😱 The secrets are <b>inside the image</b>. Push it and they\'re public.'},
    {cmd: 'echo ".env" > .dockerignore && echo ".git" >> .dockerignore', note: 'Exclude them from the build context.'},
    {cmd: 'docker build -t myapp .', note: 'Rebuild: the Layers panel lists .env under "excluded by .dockerignore".'},
    {cmd: 'docker run --rm myapp cat /app/.env', note: 'Not there any more.'},
    {cmd: 'docker run --rm myapp whoami', note: 'The app runs as <b>root</b>.'},
    {cmd: 'cat > Dockerfile <<EOF\nFROM python:3.12-slim\nRUN useradd --create-home appuser\nWORKDIR /app\nCOPY --chown=appuser . .\nUSER appuser\nCMD ["python", "app.py"]\nEOF', note: 'Create an unprivileged user and switch to it with <code>USER</code>.'},
    {cmd: 'docker build -t myapp . && docker run --rm myapp whoami', note: 'Now the process runs as <b>appuser</b>.'},
  ],
  quiz: {q: 'A Dockerfile copies .env, then a later "RUN rm .env". Is the secret gone from the image?', options: ['Yes', 'No, it still exists in the earlier layer'], answer: 1, why: 'Layers are additive: a later layer only hides the file. Keep it out with .dockerignore.'}
},
/* ------------------------------------------------------------------ */
{
  id: 'registry', level: 'Advanced', view: 'host',
  title: 'Sharing images: registries',
  sub: 'tag, login, push, pull',
  html: `
<p class="lead">To run your image on a server or share it with your team, <b>push</b> it to a registry: Docker Hub, GitHub Container Registry, AWS ECR…</p>
<pre class="code">docker tag  web  you/web:1.0      # name it  [registry/]USER/REPO:TAG
docker login                      # authenticate
docker push you/web:1.0           # upload
docker pull you/web:1.0           # on any other machine</pre>
<ul>
  <li>The name must include <b>your namespace</b> (your username or org).</li>
  <li>Only <b>new</b> layers are uploaded. Base layers are "Mounted from library/python".</li>
  <li>Use meaningful tags (<code>1.0</code>, <code>1.0.3</code>, git SHA). Avoid relying only on <code>latest</code>.</li>
</ul>`,
  setup: [FILES({'app.py': APP_WEB, 'requirements.txt': 'flask==3.0.3\n', 'Dockerfile': DF_GOOD}), 'docker build -t web .'],
  steps: [
    {cmd: 'docker push web', note: 'Pushing an un-namespaced image is <b>denied</b>: "web" would mean the official library/web.', expectError: true},
    {cmd: 'docker login -u you', note: 'Log in to Docker Hub (simulated).'},
    {cmd: 'docker tag web you/web:1.0', note: 'Give the image a second name in your namespace. Same image ID, two names.'},
    {cmd: 'docker push you/web:1.0', note: 'Upload: only your app\'s layers are pushed; the Python base is mounted from the official repo.'},
    {cmd: 'docker rmi web you/web:1.0', note: 'Pretend you\'re on a fresh server: delete the local copies.'},
    {cmd: 'docker run -d --name prod -p 5000:5000 you/web:1.0', note: 'Not found locally, so Docker <b>pulls it from your repository</b> and runs it.'},
    {cmd: 'curl localhost:5000', note: 'Your app, delivered through the registry.'},
  ],
  quiz: {q: 'Which name can user "ada" push to Docker Hub?', options: ['web:1.0', 'ada/web:1.0', 'library/web:1.0'], answer: 1, why: 'You can only push to your own namespace (or an org you belong to).'}
},
/* ------------------------------------------------------------------ */
{
  id: 'production', level: 'Advanced', view: 'host',
  title: 'Production checklist',
  sub: 'Small images, resource limits, read-only, cleanup',
  html: `
<p class="lead">A container that works on your laptop isn't production-ready yet. The usual checklist:</p>
<ol>
  <li><b>Small, pinned base images</b>: <code>-slim</code> or <code>-alpine</code>, exact versions.</li>
  <li><b>Multi-stage builds</b>: no compilers in the final image.</li>
  <li><b>Non-root USER</b> and <b>.dockerignore</b>.</li>
  <li><b>HEALTHCHECK</b> + <b>restart policy</b>.</li>
  <li><b>Resource limits</b>: <code>--memory</code>, <code>--cpus</code>, so one container can't starve the server.</li>
  <li><b>Read-only filesystem</b> (<code>--read-only</code>) where possible.</li>
  <li><b>Logs to stdout/stderr</b>, configuration via env vars, data in volumes.</li>
</ol>
<div class="tip">For many servers you'd hand containers to an <b>orchestrator</b> (Kubernetes, Docker Swarm, ECS). It places containers, replaces unhealthy ones, scales, and does rolling updates. Everything in this lab carries over.</div>`,
  setup: [FILES({'app.py': APP_WEB, 'requirements.txt': 'flask==3.0.3\n', 'Dockerfile': DF_GOOD}), 'docker build -t web .', 'docker run hello-world', 'docker run alpine echo bye'],
  steps: [
    {cmd: 'docker pull python:3.12 && docker pull python:3.12-alpine', note: 'Compare base images…'},
    {cmd: 'docker images python', note: '…1.02GB vs 130MB vs 52MB. The base image dominates your image size.'},
    {cmd: 'docker run -d --name api -m 256m --cpus 0.5 --restart unless-stopped -p 5000:5000 web', note: 'Run with a memory limit, a CPU limit and a restart policy.'},
    {cmd: 'curl localhost:5000 && docker stats', note: '<code>docker stats</code> shows usage against the <b>limit</b>.'},
    {cmd: 'docker run --rm --read-only alpine touch /test', note: '<code>--read-only</code>: the container can\'t write to its own filesystem. Attackers can\'t drop files, and your app can\'t accidentally keep state there.'},
    {cmd: 'docker system df', note: 'What\'s using disk on this host.'},
    {cmd: 'docker system prune -a', note: 'Remove everything unused: stopped containers, unused networks, images not used by a container, and build cache.'},
    {cmd: 'docker images', note: 'Only the image the running "api" container uses remains.'},
  ],
  quiz: {q: 'Why set --memory on production containers?', options: ['To make them faster', 'So a leaking container can\'t take down the whole server', 'It\'s required by Docker'], answer: 1, why: 'Limits contain the blast radius of one misbehaving container.'}
},
/* ------------------------------------------------------------------ */
{
  id: 'cheatsheet', level: 'Reference', view: 'host',
  title: 'Cheat sheet & sandbox',
  sub: 'Every command on one page, plus a free playground',
  html: `
<p class="lead">A free sandbox with a sample web app in the project folder. Type <code>help</code> in the terminal for everything it supports.</p>
<table class="tbl cheat">
  <tr><th colspan="2">Images</th></tr>
  <tr><td><code>docker pull nginx:1.27</code></td><td>download</td></tr>
  <tr><td><code>docker build -t app:1.0 .</code></td><td>build from ./Dockerfile</td></tr>
  <tr><td><code>docker images</code> · <code>docker rmi IMG</code></td><td>list · remove</td></tr>

/* =====================================================================
   UI: host map, layers, files, browser, terminal, lesson runner
   ===================================================================== */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c]));
const sleep = ms => new Promise(r => setTimeout(r, ms));

const VIEWS = {
  host: {title: 'Docker host', hint: 'registry → images → containers · click an image for its layers'},
  layers: {title: 'Image layers & build', hint: 'Dockerfile steps → layers · CACHED vs BUILT'},
  files: {title: 'Project files (build context)', hint: 'edit and save, then rebuild'},
  browser: {title: 'Browser', hint: 'requests go to published ports on localhost'},
};

/* ---------- host map ---------- */
function renderHost(d){
  const hl = k => d.changed.has(k) ? ' hl' : '';
  const flashRepos = new Set(d.events.filter(e => e.type === 'pull' || e.type === 'push').map(e => e.name.split(':')[0]));
  // registry
  const official = [...new Set(d.refs.filter(r => r.repo !== '<none>' && !r.repo.includes('/') && Object.keys(TAGS).some(t => t.startsWith(r.repo + ':'))).map(r => r.repo))];
  const mine = [...new Set(Object.keys(d.hub).map(k => k.split(':')[0]))];
  const hub = `<div class="hub"><div class="cloud">☁️</div><div class="hn">Docker Hub</div>
    ${official.map(r => `<div class="repo${flashRepos.has(r) ? ' flash' : ''}" title="library/${esc(r)}">library/${esc(r)}</div>`).join('')}
    ${mine.map(r => `<div class="repo mine${flashRepos.has(r) ? ' flash' : ''}">${esc(r)}</div>`).join('')}
    ${!official.length && !mine.length ? '<div class="repo" style="opacity:.6">nginx, redis, python, …</div>' : ''}</div>`;
  // images
  const ids = [...new Set(d.refs.map(r => r.id))];
  const max = Math.max(...ids.map(id => d.imgSize(d.imgs[id])), 1);
  const imgs = ids.sort((a, b) => d.imgs[b].created - d.imgs[a].created).map(id => {
    const img = d.imgs[id];
    const names = d.refs.filter(r => r.id === id && r.repo !== '<none>').map(r => `${r.repo}:${r.tag}`);
    const users = d.containers.filter(c => c.image === id).length;
    const size = d.imgSize(img);
    return `<div class="imgcard${names.length ? '' : ' dangling'}${users ? ' inuse' : ''}${hl('img:' + id)}" data-key="img-${id.slice(0, 12)}" data-img="${id}" title="${esc(names.join(', ') || '<none>:<none> (dangling)')}">
      <div class="nm">${esc(names[0] || '<none>:<none>')}</div>${names.length > 1 ? `<div class="sub" style="justify-content:flex-start"><span>also: ${esc(names.slice(1).join(', '))}</span></div>` : ''}
      <div class="sub"><span>${id.slice(0, 12)}</span><span>${fmtSize(size)}</span></div>
      <div class="bar"><i style="width:${Math.max(3, Math.sqrt(size / max) * 100)}%"></i></div>
      <div class="sub"><span>${users ? `▶ ${users} container${users > 1 ? 's' : ''}` : 'unused'}</span><span>${img.layers.length} layers</span></div></div>`;
  }).join('') || '<div class="empty-state" style="padding:14px 4px">No images yet<br><b>docker pull</b> or <b>docker build</b></div>';
  // networks with containers
  const shellCid = d.shell && d.shell.cid;
  const ctrCard = c => {
    const st = c.status === 'running' ? d.up(c.started) : c.status === 'restarting' ? `Restarting (#${c.restartCount})` : c.status === 'paused' ? 'Paused' : c.status === 'created' ? 'Created' : `Exited (${c.exitCode})`;
    const net = Object.keys(c.ips)[0];
    const chips = [
      ...c.ports.map(p => `<span class="chip2 port" title="published port">🌐 localhost:${p.host} → ${p.cont}</span>`),
      ...c.mounts.map(m => m.type === 'volume' ? `<span class="chip2 vol" title="volume">💾 ${esc(m.anon ? m.src.slice(0, 8) + '…' : m.src)} → ${esc(m.dst)}${m.ro ? ' (ro)' : ''}</span>` : `<span class="chip2 bind" title="bind mount">📁 ${esc(m.label || './' + m.src)} → ${esc(m.dst)}${m.ro ? ' (ro)' : ''}</span>`),
    ].join('');
    return `<div class="ctr ${c.status}${c.id === shellCid ? ' inside' : ''}${hl('ctr:' + c.id)}" data-key="ctr-${c.id.slice(0, 12)}" data-name="${esc(c.name)}" title="click: docker logs ${esc(c.name)}">
      ${c.id === shellCid ? '<span class="inside-tag">you are inside</span>' : ''}
      <div class="top"><span class="dot"></span><span class="nm">${esc(c.name)}</span>${c.health ? `<span class="pill ${c.health}">${c.health}</span>` : ''}</div>
      <div class="img">${esc(c.imageName)} · ${c.id.slice(0, 12)}</div>
      <div class="st">${st}${c.restartCount ? ` · restarts: ${c.restartCount}` : ''}${c.memory ? ` · mem ≤ ${c.memory}MiB` : ''}</div>
      ${c.ips[net] ? `<span class="ip">${c.ips[net]}</span>` : ''}
      ${chips ? `<div class="chips">${chips}</div>` : ''}</div>`;
  };
  const netNames = Object.keys(d.networks).filter(n => !['host', 'none'].includes(n) || d.containers.some(c => n in c.ips));
  const nets = netNames.map(n => {
    const net = d.networks[n];
    const cs = d.containers.filter(c => Object.keys(c.ips)[0] === n);
    if(n === 'bridge' && !cs.length && Object.keys(d.networks).length > 3) return '';
    const also = d.containers.filter(c => Object.keys(c.ips)[0] !== n && n in c.ips);
    return `<div class="net ${net.project ? 'compose' : net.builtin ? '' : 'user'}${hl('net:' + n)}">
      <div class="net-head"><span>network</span><b>${esc(n)}</b>${net.project ? '<span class="dns">compose</span>' : ''}<span class="dns${net.dns ? ' yes' : ''}">${net.dns ? 'DNS ✔ by name' : net.builtin && n === 'bridge' ? 'default · no DNS' : net.driver}</span>${also.length ? `<span>+ also attached: ${also.map(c => esc(c.name)).join(', ')}</span>` : ''}</div>
      <div class="ctrs">${cs.map(ctrCard).join('') || '<div class="empty-state" style="padding:8px">no containers</div>'}</div></div>`;
  }).join('');
  const vols = Object.values(d.volumes).map(v => {
    const users = d.volUsers(v.name).map(c => c.name);
    const n = Object.keys(v.data).length;
    return `<div class="vol${hl('vol:' + v.name)}" data-key="vol-${esc(v.name)}"><span class="cyl"></span><div><div class="vn">${esc(v.anon ? v.name.slice(0, 12) + ' (anonymous)' : v.name)}</div><div class="vu">${n} file${n === 1 ? '' : 's'} · ${users.length ? 'used by ' + esc(users.join(', ')) : 'not in use'}</div></div></div>`;
  }).join('');
  return `<div class="host">
    <div><div class="col-title"><b>Registry</b></div>${hub}</div>
    <div><div class="col-title"><b>Images</b> (${ids.length})</div><div class="imgs">${imgs}</div></div>
    <div><div class="col-title"><b>Containers</b> (${d.containers.length}) grouped by network</div><div class="nets">${nets || '<div class="empty-state">No containers yet<br><b>docker run</b> one</div>'}</div></div>
    ${vols ? `<div class="vols"><div class="col-title" style="width:100%"><b>Volumes</b> (${Object.keys(d.volumes).length}) · data that outlives containers</div>${vols}</div>` : ''}
    <div class="legend-row"><span>● running</span><span style="opacity:.6">◌ exited (dashed)</span><span>🌐 published port</span><span>💾 volume</span><span>📁 bind mount</span><span>glow = just changed</span></div>
  </div>`;
}

/* ---------- layers ---------- */
function hlDockerfile(line){
  const t = esc(line);
  if(/^\s*#/.test(line)) return `<span class="cm">${t}</span>`;
  return t.replace(/^(\s*)(FROM|RUN|COPY|ADD|WORKDIR|ENV|ARG|EXPOSE|CMD|ENTRYPOINT|USER|HEALTHCHECK|LABEL|VOLUME)\b/i, '$1<span class="kw">$2</span>').replace(/\b(AS)\b/, '<span class="kw">$1</span>');
}
function renderLayers(d){
  const named = [...new Set(d.refs.map(r => r.id))];
  if(!named.length && !d.lastBuild) return `<div class="empty-state">No images yet.<br>Pull one (<b>docker pull nginx</b>) or build one (<b>docker build -t app .</b>).</div>`;
  let sel = d.selectedImage && d.imgs[d.selectedImage] ? d.selectedImage : (d.lastBuild && d.lastBuild.image) || named[0];
  const img = sel && d.imgs[sel];
  const pick = `<div class="img-pick"><span class="col-title" style="margin:0 4px 0 0"><b>Image</b></span>${named.map(id => `<button class="${id === sel ? 'on' : ''}" data-img="${id}">${esc(d.imageName(d.imgs[id]))}</button>`).join('')}</div>`;
  const lb = d.lastBuild;
  const showBuild = lb && (lb.image === sel || !lb.ok);
  let left;
  if(showBuild){
    const stepAt = {};
    for(const s of lb.steps) stepAt[s.line] = s;
    const rows = lb.lines.map((ln, i) => {
      const s = stepAt[i + 1];
      const op = (ln.trim().split(/\s+/)[0] || '').toUpperCase();
      const metaOp = ['WORKDIR', 'ENV', 'ARG', 'EXPOSE', 'CMD', 'ENTRYPOINT', 'USER', 'LABEL', 'HEALTHCHECK', 'VOLUME'].includes(op);
      const badge = !s ? '' : s.status === 'error' ? '<span class="badge error">ERROR</span>' : s.status === 'cached' ? '<span class="badge cached">CACHED</span>' : s.status === 'pulled' ? `<span class="badge pulled">PULLED</span><span class="t">${s.time.toFixed(1)}s</span>` : metaOp ? '<span class="badge meta">META</span>' : `<span class="badge built">BUILT</span><span class="t">${s.time.toFixed(1)}s</span>`;
      return `<div class="dline ${s ? s.status : ''}"><span class="no">${i + 1}</span><span class="tx">${hlDockerfile(ln) || ' '}</span><span>${badge}</span></div>`;
    }).join('');
    left = `<div class="dfile"><div class="hd"><span><b>${esc(lb.file)}</b> · last build${lb.tags.length ? ' → ' + esc(lb.tags.join(', ')) : ''}</span><span>${lb.ok ? `${lb.total.toFixed(1)}s` : '<span class="badge error">FAILED</span>'}</span></div>${rows}
      <div class="ctxinfo">Build context: ${lb.ctxFiles.length} file${lb.ctxFiles.length === 1 ? '' : 's'} sent${lb.ignored.length ? ` · excluded by .dockerignore: <code>${esc(lb.ignored.join(', '))}</code>` : ''}</div></div>`;
  } else if(img){
    left = `<div class="dfile"><div class="hd"><span><b>${esc(d.imageName(img))}</b></span></div><div class="ctxinfo" style="border:0">${img.stock ? `Pulled from Docker Hub: built by its publishers. <code>docker history ${esc(d.imageName(img))}</code> lists the instructions that made these layers.` : 'Built earlier; build again to see per-step cache status here.'}</div></div>`;
  }
  let right = '';
  if(img){
    const maxL = Math.max(...img.layers.map(l => l.size), 1);
    const stat = {};
    if(showBuild && lb.ok) for(const s of lb.steps) if(s.layer) stat[s.layer] = s.status;
    const rws = d.containers.filter(c => c.image === sel);
    const blocks = [...img.layers].reverse().map(l => {
      const meta = l.size === 0 && !l.base;
      const w = meta ? 46 : 46 + 54 * Math.sqrt(l.size / maxL);
      return `<div class="lyr ${l.base ? 'base' : meta ? 'meta' : ''} ${stat[l.id] || ''}" style="width:${w}%" title="${esc(l.instr)}"><span class="i">${esc(l.instr)}</span><span class="s">${fmtSize(l.size)}</span></div>`;
    }).join('');
    const rw = rws.map(c => `<div class="lyr rw" style="width:46%"><span class="i">✎ writable layer · ${esc(c.name)}</span><span class="s">${fmtSize(d.ctrSize(c))}</span></div>`).join('');
    right = `<div class="stack"><h5>Layers (top = newest)</h5>${rw}${blocks}<div class="total">${img.layers.length} layers · <b>${fmtSize(d.imgSize(img))}</b> · read-only, shared by every container of this image</div></div>`;
  }
  const all = named.map(id => ({id, n: d.imageName(d.imgs[id]), s: d.imgSize(d.imgs[id])})).sort((a, b) => b.s - a.s);
  const mx = Math.max(...all.map(x => x.s), 1);
  const sizes = all.length > 1 ? `<div class="sizes"><h5>Image sizes</h5><div class="cap">Smaller images pull faster, start faster and carry fewer vulnerabilities.</div>${all.map(x => `<div class="r${x.id === sel ? ' sel' : ''}"><span class="n" title="${esc(x.n)}">${esc(x.n)}</span><span><span class="b" style="display:block;width:${Math.max(0.5, 100 * x.s / mx)}%"></span></span><span class="v">${fmtSize(x.s)}</span></div>`).join('')}</div>` : '';
  return `<div class="layers">${pick}${left || '<div></div>'}${right}${sizes}</div>`;
}

/* ---------- files ---------- */
let curFile = null;
function renderFiles(d){
  const names = Object.keys(d.files).sort((a, b) => (a.startsWith('.') - b.startsWith('.')) || a.localeCompare(b));
  if(!names.length) return `<div class="empty-state">The project folder is empty.<br>Create files with <b>echo "…" > file</b> or <b>cat > Dockerfile &lt;&lt;EOF</b>.</div>`;
  const ctx = d.contextFiles();
  const lastFile = [...d.changed].filter(k => k.startsWith('file:')).map(k => k.slice(5)).pop();
  if(lastFile && d.files[lastFile] !== undefined) curFile = lastFile;
  if(!curFile || d.files[curFile] === undefined) curFile = names.includes('Dockerfile') ? 'Dockerfile' : names[0];
  return `<div class="files"><div class="flist"><div class="proj">~/project/</div>${names.map(n => `<button class="${n === curFile ? 'on' : ''}${n in ctx ? '' : ' ign'}${d.changed.has('file:' + n) ? ' chg' : ''}" data-file="${esc(n)}" title="${n in ctx ? esc(n) : esc(n) + ' (excluded by .dockerignore)'}">${esc(n)}</button>`).join('')}</div>
    <div class="editor"><div class="bar"><b>${esc(curFile)}</b><span>${curFile in ctx ? '' : '· excluded from the build context'}</span><span class="sp"></span><button class="btn" id="saveFile">💾 Save</button></div>
    <textarea id="fileText" spellcheck="false">${esc(d.files[curFile])}</textarea>
    <div class="note">Files here are the <b>build context</b>: what <code>COPY</code> can see. After editing an app file, rebuild the image (or use a bind mount) for containers to see the change.</div></div></div>`;
}

/* ---------- browser ---------- */
function renderBrowser(d){
  const b = d.browser;
  const url = b ? b.url : 'http://localhost:8080';
  let page;
  if(!b) page = `<div class="page blank"><div class="err" style="color:var(--text-faint)"><b style="color:var(--text-dim)">Nothing opened yet</b><span>Run <code>open http://localhost:8080</code> or type an address above.</span></div></div>`;
  else if(b.error) page = `<div class="page"><div class="err"><b>This site can't be reached</b><span>${esc(b.url.replace(/^https?:\/\//, ''))} refused to connect.</span><code>${esc(b.error)}</code><span style="font-size:12px;color:#777">Is a container running with that port published (-p)?</span></div></div>`;
  else if(b.type === 'html') page = `<div class="page"><iframe sandbox="" title="page" srcdoc="${esc(b.body)}"></iframe></div>`;
  else page = `<div class="page"><pre>${esc(b.body)}</pre></div>`;
  return `<div class="browser"><div class="addr"><span class="nav">◀ ▶ ⟳</span><input id="urlIn" value="${esc(url)}" spellcheck="false">${b && !b.error ? `<span class="code ${b.status < 400 ? 'ok' : 'bad'}">${b.status}</span>` : b ? '<span class="code bad">ERR</span>' : ''}<button class="btn" id="urlGo">Go</button></div>${page}</div>`;
}

function flipCapture(){
  const m = new Map();
  document.querySelectorAll('#viewBody [data-key]').forEach(el => m.set(el.dataset.key, el.getBoundingClientRect()));
  return m;
}
function flipPlay(before){
  document.querySelectorAll('#viewBody [data-key]').forEach(el => {
    const old = before.get(el.dataset.key);
    if(!old){ el.classList.add('pop-in'); return; }
    const now = el.getBoundingClientRect();
    const dx = old.left - now.left, dy = old.top - now.top;
    if(dx || dy) el.animate([{transform: `translate(${dx}px,${dy}px)`}, {transform: 'none'}], {duration: 480, easing: 'cubic-bezier(.2,.8,.2,1)'});
  });
}
function renderView(fresh){
  const d = S.d, v = S.view, body = $('#viewBody');
  $('#viewTitle').textContent = VIEWS[v].title;
  $('#viewHint').textContent = VIEWS[v].hint;
  const before = v === 'host' && !fresh ? flipCapture() : null;
  body.innerHTML = {host: renderHost, layers: renderLayers, files: renderFiles, browser: renderBrowser}[v](d);
  if(before) flipPlay(before);
  wireView();
  const hl = body.querySelector('.hl');
  if(hl) hl.scrollIntoView({block: 'nearest', inline: 'nearest', behavior: 'smooth'});
}
function wireView(){
  const body = $('#viewBody');
  body.querySelectorAll('[data-img]').forEach(el => el.addEventListener('click', () => { S.d.selectedImage = el.dataset.img; setView('layers'); }));
  body.querySelectorAll('.ctr[data-name]').forEach(el => el.addEventListener('click', () => userCommand(`docker logs ${el.dataset.name}`)));
  body.querySelectorAll('[data-file]').forEach(el => el.addEventListener('click', () => { curFile = el.dataset.file; renderView(true); }));
  const save = $('#saveFile');
  if(save) save.addEventListener('click', () => {
    S.d.files[curFile] = $('#fileText').value.replace(/\n?$/, '\n');
    printSys(`# saved ${curFile} in the editor${/Dockerfile|\.py$|requirements|package/.test(curFile) ? ' (rebuild the image to include it)' : ''}`); scrollTerm();
    S.d.changed = new Set(['file:' + curFile]); renderView(true);
  });
  const ui = $('#urlIn');
  if(ui){
    const go = () => { const u = ui.value.trim(); if(u) userCommand(`open ${u}`); };
    ui.addEventListener('keydown', e => { if(e.key === 'Enter') go(); });
    $('#urlGo').addEventListener('click', go);
  }
}

/* =====================================================================
   Terminal
   ===================================================================== */
const termOut = $('#termOut'), termIn = $('#termIn');
function promptHTML(){
  const d = S.d;
  if(d.shell){
    const c = d.containers.find(x => x.id === d.shell.cid);
    if(c){ const u = c.user || 'root'; return `<span class="p-root">${esc(u)}@${esc(c.hostname)}</span>:<span class="p-dir">${esc(c.cwd || c.workdir)}</span><span class="p-dollar">${u === 'root' ? '#' : '$'}</span>`; }
  }
  return `<span class="p-user">you@laptop</span>:<span class="p-dir">~/project</span><span class="p-dollar">$</span>`;
}
function printLine(segs){
  const el = document.createElement('div');
  el.className = 'ln';
  el.innerHTML = segs.map(([t, c]) => c ? `<span class="o-${c}">${esc(t)}</span>` : esc(t)).join('');
  termOut.append(el);
}
const printSys = text => printLine([[text, 'sys']]);
const scrollTerm = () => { termOut.scrollTop = termOut.scrollHeight; };
const updatePrompt = () => {
  $('#promptEl').innerHTML = promptHTML();
  $('#termTitle').textContent = S.d.shell ? `container shell: ${(S.d.containers.find(x => x.id === S.d.shell.cid) || {}).name || ''}` : 'bash: ~/project';
};

/* =====================================================================
   App state & runner
   ===================================================================== */
const S = {lesson: null, idx: 0, d: null, token: 0, busy: false, playing: false, view: 'host', history: [], hpos: 0};
let DONE = new Set();
try { DONE = new Set(JSON.parse(localStorage.getItem('docker-lab-done-v1') || '[]')); } catch(e) {}
const saveDone = () => { try { localStorage.setItem('docker-lab-done-v1', JSON.stringify([...DONE])); } catch(e) {} };

function setView(v, fresh){
  S.view = v;
  document.querySelectorAll('#tabs .tab').forEach(t => t.classList.toggle('active', t.dataset.view === v));
  renderView(fresh);
}
/* plain status commands (ps, logs, curl…) don't drag you away from Layers/Files/Browser */
function keepView(cmd, target){
  if(S.view === 'host' || target === S.view) return false;
  if(/^(docker\s+(build|history|compose\s+(up|build))|open\b|cat\s+>)/.test(cmd.trim())) return false;
  return target === 'host' && ['layers', 'browser', 'files'].includes(S.view) && !/^docker\s+(run|pull|rm|stop|start|network|volume|compose|system|push|tag|rmi|image|container|login)/.test(cmd.trim());
}
async function runCommand(cmd, {typed = true, token = S.token} = {}){
  const line = document.createElement('div');
  line.className = 'ln';
  line.innerHTML = promptHTML() + ' ';
  const span = document.createElement('span');
  line.append(span);
  termOut.append(line);
  if(typed){
    span.className = 'typing';
    const per = Math.min(24, 800 / Math.max(cmd.length, 1));
    for(let i = 0; i < cmd.length; i++){
      span.textContent += cmd[i];
      if(i % 2 === 0){ scrollTerm(); await sleep(per * 2); }
      if(token !== S.token) throw 'cancel';
    }
    span.className = '';
    await sleep(140);
    if(token !== S.token) throw 'cancel';
  } else span.textContent = cmd;
  const res = S.d.run(cmd);
  if(res.clear) termOut.innerHTML = '';
  for(const l of res.lines) printLine(l);
  scrollTerm();
  if(res.view && res.view !== S.view && !keepView(cmd, res.view)) setView(res.view); else renderView();
  updatePrompt();
  return res;
}
async function userCommand(cmd){
  if(S.busy) return;
  S.busy = true;
  try { await runCommand(cmd, {typed: false}); } finally { S.busy = false; updateButtons(); }
}

function narrate(html){

function updateButtons(){

async function nextStep({typed = true, from = 0} = {}){
  const L = S.lesson;
  if(S.busy || S.idx >= L.steps.length) return false;
  S.busy = true;
  const i = S.idx, tok = S.token;
  markCurrent(i); narrateStep(i); updateButtons();
  try {
    if(from || (typed && GUIDE_ON)) await guidedRun(L.steps[i].cmd, tok, i, from || 1);
    else await runCommand(L.steps[i].cmd, {typed, token: tok});
  }
  catch(e){ if(e === 'cancel') return false; throw e; }
  if(tok !== S.token) return false;
  S.idx = i + 1; S.busy = false;
  updateButtons();
  if(S.idx === L.steps.length) lessonComplete();
  return true;
}
/* Commands can't be undone one by one, so going back = rebuild the lesson's
   starting state and silently replay every earlier step. */
async function prevStep(){
  if(S.busy || S.idx === 0) return;
  const k = S.idx - 1;
  setupLesson();
  const tok = S.token;
  for(let i = 0; i < k && tok === S.token; i++){ if(!(await nextStep({typed: false}))) return; }
  if(tok === S.token && k > 0){ printSys(`# ◀ Went back: state after step ${k} of ${S.lesson.steps.length}. ▶ Next step re-runs step ${k + 1}.`); scrollTerm(); }
}
async function runUpTo(k){
  if(S.busy) return;
  if(k < S.idx) setupLesson();
  const tok = S.token;
  S.playing = false;
  while(S.idx < k && tok === S.token){ if(!(await nextStep({typed: false}))) return; }
  if(tok === S.token) await nextStep();
}
async function playAll(){
  if(S.playing){ S.playing = false; updateButtons(); return; }
  S.playing = true; updateButtons();
  const tok = S.token;
  while(S.playing && tok === S.token && S.idx < S.lesson.steps.length){
    if(!(await nextStep())) break;
    if(S.idx < S.lesson.steps.length) await sleep(1800);
  }
  if(tok === S.token){ S.playing = false; updateButtons(); }
}

/* =====================================================================
   Step guide: before a step runs, a goal card says what it does, then the
   command is typed into the terminal piece by piece with a bubble that
   explains each part (flags, ports, volumes, image…). Enter runs it and

const GUIDE_KEY = 'docker-lab-guide-v1';

/* ---------- explain a command: its parts and its goal ---------- */
function rawTokens(line){          // like tokenize, but keeps the quotes (this is what gets typed)
  const out = []; let cur = '', q = null;
  for(const c of line){
    if(q){ cur += c; if(c === q) q = null; continue; }
    if(c === '"' || c === "'"){ q = c; cur += c; continue; }
    if(/\s/.test(c)){ if(cur){ out.push(cur); cur = ''; } continue; }
    cur += c;
  }
  if(cur) out.push(cur);
  return out;
}
const unq = s => String(s).replace(/^(['"])([\s\S]*)\1$/, '$2');
const B = s => `<b>${esc(s)}</b>`;

const VALUE_FLAGS = {

  exec: ['-e', '--env', '-u', '--user', '-w', '--workdir'],
  build: ['-t', '--tag', '-f', '--file', '--target', '--build-arg'],
  logs: ['--tail', '-n', '--since'], ps: ['--filter', '--format'], up: ['--scale'], login: ['-u', '--username', '-p', '--password'], inspect: ['-f', '--format'], images: ['--filter', '--format'],
};
function flagText(sub, f, v){
  const run = sub === 'run' || sub === 'exec';

    case '-it': case '-ti': return 'interactive + terminal: you can type into it';
    case '-i': return 'interactive: keep its input open';
    case '-t': case '--tag': return sub === 'build' ? `name (tag) the image ${B(v)}` : 'give it a terminal (TTY)';
    case '--name': return `name the container ${B(v)}, so you can refer to it later`;
    case '-p': case '--publish': { const [h, c] = v.split(':').slice(-2); return `publish a port: ${B('localhost:' + h)} on your laptop → port ${B(c)} inside the container`; }
    case '-e': case '--env': { const [k, ...r] = unq(v).split('='); return r.length ? `set the environment variable ${B(k)} to ${B(r.join('='))}` : `pass the variable ${B(k)} from your shell`; }

    case '-v': case '--volume':
      if(sub === 'compose down' || sub === 'system prune') return 'also delete the volumes (the data goes too!)';
      { const [src, dst, mode] = v.split(':'); if(!dst) return `an anonymous volume at ${B(src)}`;
        return `${/^[.\/~]/.test(src) ? 'bind mount: your folder' : 'mount the volume'} ${B(src)} at ${B(dst)} in the container${mode === 'ro' ? ', read-only' : ''}`; }

    case '-m': case '--memory': return `limit its memory to ${B(v)}`;

    case '-u': case '--user': case '--username': return sub === 'login' ? `sign in as ${B(v)}` : `run as the user ${B(v)}`;
    case '-w': case '--workdir': return `start in the directory ${B(v)}`;
    case '-a': case '--all': return sub === 'ps' ? 'all containers, the stopped ones too' : 'everything unused, not only dangling images';
    case '-f': case '--file': case '--follow': case '--format':

}

  tag: 'give an image another name (same image ID)', login: 'sign in to the registry', stats: 'show live CPU and memory use per container', kill: 'kill a container at once',
  'system df': 'show disk usage: images, containers, volumes, build cache', 'system prune': 'remove everything unused',

function explain(cmd){
  const lines = cmd.split('\n'), first = lines[0].trim(), T = rawTokens(first), parts = [];

    const each = chain.map(c => explain(c));

    P([T.find(t => t.startsWith('<<'))], `a here-document: the next ${lines.length - 2} lines, up to ${B(here[1])}, are the file's content`);
    return {parts, goal: `Write a new ${B(file)} (${lines.length - 2} lines) into the project`};
  }
  if(T[0] !== 'docker'){
    const c = T[0];
    if(c === 'curl'){ P(['curl'], 'send an HTTP request, like a browser without the window'); P(T.slice(1), `to ${B(unq(T.slice(1).join(' ')))}`); return {parts, goal: `Send an HTTP request to ${B(unq(T[T.length - 1]))} and read the answer`}; }
    if(c === 'open'){ P(['open'], 'open a page in the Browser tab'); P(T.slice(1), 'the address'); return {parts, goal: `Open ${B(T[1])} in the Browser tab`}; }
    if(c === 'echo'){

    }

      P(T, `list ${all ? 'all the files, hidden ones (starting with a dot) too' : 'the files'}${dir ? ' in ' + B(dir) : ''}`);
      return {parts, goal: `List ${all ? 'all the files, hidden ones too' : 'the files'}${dir ? ' in ' + B(dir) : ''}`};
    }
    if(c === 'exit'){ P(T, 'leave the container\'s shell; the container stops if the shell was its main process'); return {parts, goal: 'Leave the container\'s shell and get back to your laptop'}; }
    if(c === 'ps'){ P(T, 'list the processes running here'); return {parts, goal: 'See which processes run inside the container'}; }
    if(c === 'sleep'){ P(T, `wait ${B(T[1] + ' s')} (simulated time)`); return {parts, goal: `Let ${B(T[1] + ' seconds')} pass`}; }

  if(GROUPS.includes(sub) && T[2] && !T[2].startsWith('-')){ sub = sub + ' ' + T[2]; i = 3; } else i = 2;

  const what = {pull: 'the image', push: 'the image', rmi: 'the image', history: 'the image', tag: 'the image',

    case 'run': {
      const bits = [];

      if(has('-d') || has('--detach')) bits.push('running in the background');
      if(has('-it') || has('-ti')) bits.push('with a terminal you can type into');
      const ports = [...(fl['-p'] || []), ...(fl['--publish'] || [])].map(p => p.split(':').slice(-2)[0]);
      if(ports.length) bits.push(`reachable at ${ports.map(h => B('localhost:' + h)).join(' and ')}`);

      if(vols.length) bits.push(`with ${vols.map(v => B(v.split(':')[0])).join(' and ')} mounted`);

    }
    case 'build': goal = `Build an image${val('-t') || val('--tag') ? ' called ' + B(val('-t') || val('--tag')) : ''} from the Dockerfile${has('--target') ? `, up to the stage ${B(val('--target'))}` : ''}`; break;
    case 'exec': goal = pos.length === 2 && /^(sh|bash)$/.test(pos[1]) ? `Open a shell inside ${B(pos[0])}` : `Run <code>${esc(pos.slice(1).map(unq).join(' '))}</code> inside ${B(pos[0] || '')}`; break;
    case 'ps': goal = has('-a') || has('--all') ? 'List every container, stopped ones too' : 'List the running containers'; break;
    case 'images': goal = 'List the images on this host'; break;

    case 'logs': goal = `Read what ${B(img)} printed`; break;
    case 'stop': case 'start': case 'restart': case 'kill': goal = `${sub[0].toUpperCase() + sub.slice(1)} the container ${B(img)}`; break;
    case 'rm': goal = `Delete the container${pos.length > 1 ? 's' : ''} ${pos.map(B).join(', ')}`; break;
    case 'rmi': goal = `Delete the image${pos.length > 1 ? 's' : ''} ${pos.map(x => B(unq(x))).join(' and ')}`; break;
    case 'history': goal = `See how the image ${B(img)} was built, layer by layer`; break;
    case 'diff': goal = `See which files changed inside ${B(img)}`; break;

    default: goal = (SUB[sub] || `Run docker ${sub}`).replace(/^./, c => c.toUpperCase());

  return {parts, goal};
}

/* ---------- the pointer, ring and bubble ---------- */

/* playback: pause holds every wait; "next" finishes the current action at once;

const GS = {active: false, paused: false, step: -1, cur: 0, total: 0, skipTo: 0};
const gSkipping = () => GS.cur <= GS.skipTo;

  let left = ms;

const PAUSE_ICO = '<svg viewBox="0 0 24 24"><path d="M6 5h4v14H6zM14 5h4v14h-4z" fill="currentColor"/></svg>';
const PLAY_ICO = '<svg viewBox="0 0 24 24"><path d="M7 4v16l13-8z" fill="currentColor"/></svg>';
function gPlayer(){

function gControl(k){

/* what the command changed: the glowing card in the picture, else the output */
function gResult(cmd, before){
  const hl = [...document.querySelectorAll('#viewBody .hl')].find(gVis);
  if(hl){
    hl.scrollIntoView({block: 'nearest', inline: 'nearest'});
    const q = s => hl.querySelector(s)?.textContent.trim() || '';

    if(hl.matches('.ctr')){ l = `Container <b>${esc(hl.dataset.name)}</b>`; v = q('.st'); }
    else if(hl.matches('.imgcard')){ l = `Image <b>${esc(q('.nm'))}</b>`; v = q('.sub').replace(/\s+/g, ' · '); }
    else if(hl.matches('.vol')){ l = `Volume <b>${esc(q('.vn'))}</b>`; v = q('.vu'); }
    else if(hl.matches('.net')){ l = `Network <b>${esc(q('.net-head b'))}</b>`; }

async function gPlay(a, n, tok, cmd){

  gRing(r); gBubble(r, a, n);
  if(a.k === 'type'){
    const base = termIn.value, text = (base ? ' ' : '') + a.t.split('\n')[0];
    await gCursor(Math.min(r.right - 30, r.left + 40 + base.length * 7.5), r.top + r.height / 2, tok);

    const move = ev => {
      // keep at least 100px of terminal and ~220px for the picture above it
      h = Math.round(Math.min(r.height - 220, Math.max(100, r.bottom - padBottom - ev.clientY - 5)));
      setTermH(h, false);
    };
    const up = () => {
      sp.removeEventListener('pointermove', move); sp.removeEventListener('pointerup', up); sp.removeEventListener('pointercancel', up);
      sp.classList.remove('drag'); document.body.classList.remove('term-dragging');
      if(h) setTermH(h);
    };
    sp.addEventListener('pointermove', move); sp.addEventListener('pointerup', up); sp.addEventListener('pointercancel', up);
  });
  sp.addEventListener('dblclick', () => setTermH(null));
  try { const h = +localStorage.getItem(TERM_KEY); if(h) setTermH(h, false); } catch(e) {}
})();

/* ---------- boot ---------- */
renderProgress();
openLesson(location.hash.slice(1) || LESSONS[0].id);
</script>
</body>
