<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Docker Lab — Advanced Programming</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg-0:#06060c;
  --bg-1:#0c0c18;
  --bg-2:#15152a;
  --surface:rgba(255,255,255,0.04);
  --surface-2:rgba(255,255,255,0.07);
  --border:rgba(255,255,255,0.09);
  --border-strong:rgba(255,255,255,0.18);
  --text:#e8e8f3;
  --text-dim:#9a9ab0;
  --text-faint:#666680;
  --accent:#7c5cff;
  --accent-2:#35d0ff;
  --accent-3:#ff6ec7;
  --brand:#2496ed;
  --brand-2:#5cb8ff;
  --success:#38d39f;
  --warn:#ffb547;
  --error:#ff5a7a;
  --radius:18px;
  --radius-sm:12px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg-0);color:var(--text);font-family:'Inter',system-ui,sans-serif;height:100%;overflow:hidden}
code,pre,.mono{font-family:'JetBrains Mono',ui-monospace,monospace}
code,pre,.mono,.term-out,.term-in,.jql-bar input,.jql-examples button{font-variant-ligatures:none;font-feature-settings:"liga" 0,"calt" 0}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
body{
  background:
    radial-gradient(1200px 700px at 8% -10%, rgba(36,150,237,0.20), transparent 60%),
    radial-gradient(1000px 600px at 110% 0%,  rgba(124,92,255,0.22), transparent 60%),
    radial-gradient(900px 600px at 50% 130%,  rgba(53,208,255,0.14), transparent 60%),
    linear-gradient(180deg, #050510 0%, #08081a 50%, #050510 100%);
}

/* ---------- layout ---------- */
.app{display:grid;grid-template-columns:272px minmax(0,1fr);height:100vh}
.main{display:grid;grid-template-columns:minmax(0,var(--lesson-fr,0.82fr)) 10px minmax(0,var(--play-fr,1.18fr));min-width:0;min-height:0}
/* draggable border between lesson and playground; drag to an edge to minimize a side */
.pane-divider{position:relative;cursor:col-resize;touch-action:none;display:flex;align-items:center;justify-content:center;z-index:2}
.pane-divider::before{content:"";position:absolute;top:0;bottom:0;left:50%;width:1px;transform:translateX(-50%);background:var(--border);transition:background .15s,width .15s}
.pane-divider:hover::before,.pane-divider.drag::before{width:3px;background:var(--brand)}
.pane-divider .pd-btns{position:relative;display:flex;flex-direction:column;gap:4px;opacity:0;transition:opacity .15s}
.pane-divider:hover .pd-btns,.pane-divider.drag .pd-btns,.main[data-max] .pane-divider .pd-btns{opacity:1}
.pane-divider button{width:18px;height:26px;border-radius:6px;border:1px solid var(--border-strong);background:var(--surface-2);color:var(--text-dim);font-size:10px;line-height:1;padding:0;cursor:pointer}
.pane-divider button:hover{color:#fff;background:var(--brand);border-color:transparent}
.main[data-max="play"]{grid-template-columns:0 10px minmax(0,1fr)}
.main[data-max="lesson"]{grid-template-columns:minmax(0,1fr) 10px 0}
.main[data-max="play"] .lesson-pane,.main[data-max="lesson"] .play-pane{display:none}
.main[data-max="play"] .pd-btns [data-dir="left"],.main[data-max="lesson"] .pd-btns [data-dir="right"]{display:none}
body.pane-dragging{user-select:none;cursor:col-resize}
.main[data-max="lesson"] .pd-btns{transform:translateX(-8px)}
.main[data-max="play"] .pd-btns{transform:translateX(4px)}
.main > .lesson-pane{grid-column:1}
.main > .pane-divider{grid-column:2}
.main > .play-pane{grid-column:3}

/* ---------- sidebar ---------- */
.sidebar{
  padding:22px 14px;overflow-y:auto;scrollbar-width:thin;
  background:linear-gradient(180deg,rgba(12,12,24,0.88),rgba(8,8,18,0.88));
  backdrop-filter:blur(22px) saturate(140%);-webkit-backdrop-filter:blur(22px) saturate(140%);
  border-right:1px solid var(--border);
}
.brand{display:flex;align-items:center;gap:12px;margin-bottom:16px;padding:4px}
.brand-cube{
  width:46px;height:46px;border-radius:12px;flex-shrink:0;
  background:linear-gradient(135deg,var(--brand-2),var(--brand));
  box-shadow:0 12px 30px -10px rgba(36,150,237,0.6),inset 0 0 0 1px rgba(255,255,255,0.25);
  transform:rotate(-6deg);display:flex;align-items:center;justify-content:center;
  animation:floatY 5s ease-in-out infinite;
}
.brand-cube svg{width:26px;height:26px}
@keyframes floatY{0%,100%{transform:rotate(-6deg) translateY(0)}50%{transform:rotate(-2deg) translateY(-4px)}}
.brand h1{margin:0;font-size:17px;font-weight:700;letter-spacing:-0.02em}
.brand .sub{font-size:10.5px;color:var(--text-faint);letter-spacing:0.08em;overflow:hidden;text-overflow:ellipsis;text-transform:uppercase}
.progress{margin:4px 4px 14px;font-size:12px;color:var(--text-dim)}
.progress .bar{height:6px;border-radius:6px;background:var(--surface-2);margin-top:6px;overflow:hidden}
.progress .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--brand),var(--accent));transition:width .5s}
.search{
  width:100%;padding:9px 12px;border-radius:11px;border:1px solid var(--border);
  background:rgba(255,255,255,0.03);color:var(--text);font-size:13px;outline:none;margin-bottom:6px;
}
.search:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(36,150,237,0.2)}
.section-label{font-size:10.5px;letter-spacing:0.16em;text-transform:uppercase;color:var(--text-faint);padding:14px 8px 6px;display:flex;align-items:center;gap:8px}
.section-label .dot{width:7px;height:7px;border-radius:50%}
.lesson-list{list-style:none;margin:0;padding:0}
.lesson-btn{
  width:100%;display:flex;align-items:center;gap:10px;text-align:left;
  padding:8px 10px;border-radius:10px;font-size:13px;color:var(--text-dim);
  border:1px solid transparent;transition:background .15s,color .15s,transform .15s;
}
.lesson-btn:hover{background:var(--surface);color:var(--text);transform:translateX(2px)}
.lesson-btn.active{
  background:linear-gradient(135deg,rgba(36,150,237,0.22),rgba(124,92,255,0.14));
  color:#fff;border-color:rgba(36,150,237,0.35);
}
.lesson-btn .n{
  width:22px;height:22px;border-radius:7px;flex-shrink:0;display:flex;align-items:center;justify-content:center;
  font-size:10.5px;font-weight:700;background:var(--surface-2);color:var(--text-dim);font-family:'JetBrains Mono',monospace;
}
.lesson-btn.done .n{background:rgba(56,211,159,0.18);color:var(--success)}
.lesson-btn.active .n{background:var(--brand);color:#fff}
.lesson-btn .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.back-link{
  display:flex;align-items:center;gap:8px;margin-top:18px;padding:10px 12px;border-radius:10px;
  color:var(--text-dim);font-size:13px;text-decoration:none;border:1px solid var(--border);
}
.back-link:hover{background:var(--surface);color:var(--text);border-color:var(--border-strong)}

/* minimizable sidebar */
.app{transition:grid-template-columns .3s ease}
.collapse-btn{
  margin-left:auto;flex-shrink:0;width:28px;height:28px;border-radius:8px;
  border:1px solid var(--border);background:var(--surface);color:var(--text-dim);font-size:15px;line-height:1;
  transition:background .15s,color .15s,border-color .15s;
}
.collapse-btn:hover{background:var(--surface-2);color:#fff;border-color:var(--border-strong)}
.brand-text{min-width:0;white-space:nowrap;overflow:hidden}
.app.collapsed{grid-template-columns:68px minmax(0,1fr)}
.app.collapsed .sidebar{padding:16px 9px;overflow-x:hidden}
.app.collapsed .brand{flex-direction:column;gap:10px;margin-bottom:12px}
.app.collapsed .brand-text,
.app.collapsed .progress #progText,
.app.collapsed .search,
.app.collapsed .lesson-btn .t,
.app.collapsed .back-link .t{display:none}
.app.collapsed .collapse-btn{margin-left:0}
.app.collapsed .progress{margin:0 2px 6px}
.app.collapsed .section-label{padding:10px 0 6px;justify-content:center;font-size:0;gap:0}
.app.collapsed .section-label .dot{width:22px;height:3px;border-radius:3px}
.app.collapsed .lesson-btn{justify-content:center;padding:6px 0}
.app.collapsed .lesson-btn:hover{transform:none}
.app.collapsed .lesson-btn .n{width:28px;height:28px;font-size:11px}
.app.collapsed .back-link{justify-content:center;padding:10px 0}

/* ---------- lesson pane ---------- */
.lesson-pane{overflow-y:auto;padding:26px 26px 40px;scrollbar-width:thin;min-width:0}
.lesson-head .meta{display:flex;gap:8px;align-items:center;font-size:12px;color:var(--text-faint)}
.level{font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:3px 9px;border-radius:20px}
.level.Beginner{background:rgba(56,211,159,0.15);color:var(--success)}
.level.Intermediate{background:rgba(53,208,255,0.15);color:var(--accent-2)}
.level.Advanced{background:rgba(255,110,199,0.15);color:var(--accent-3)}
.level.Reference{background:rgba(255,181,71,0.15);color:var(--warn)}
.lesson-head h2{margin:10px 0 4px;font-size:26px;letter-spacing:-0.02em;line-height:1.2}
.lesson-head .subtitle{color:var(--text-dim);font-size:14.5px;margin:0 0 18px}
.explain{font-size:14.5px;line-height:1.65;color:#d6d6e6}
.explain .lead{font-size:15.5px;color:var(--text)}
.explain h4{margin:22px 0 8px;font-size:14px;color:#fff;letter-spacing:.01em}
.explain code{background:rgba(255,255,255,0.07);border:1px solid var(--border);padding:1px 6px;border-radius:6px;font-size:12.5px;color:#c7dcff}
.explain pre{margin:0}
.explain pre.code,.mini pre{background:rgba(0,0,0,0.35);border:1px solid var(--border);border-radius:10px;padding:10px 12px;font-size:12px;line-height:1.5;color:#cfd3ff;overflow-x:auto}
.explain ul,.explain ol{padding-left:22px}
.explain li{margin:4px 0}
.explain .g{color:var(--success);font-weight:700}.explain .r{color:var(--error);font-weight:700}
.explain .note{font-size:12.5px;color:var(--text-faint);font-style:italic}
.analogy,.tip,.warn{display:flex;gap:12px;padding:12px 14px;border-radius:12px;margin:14px 0;font-size:14px}
.analogy{background:linear-gradient(135deg,rgba(124,92,255,0.12),rgba(53,208,255,0.06));border:1px solid rgba(124,92,255,0.25)}
.analogy .ico{font-size:22px;line-height:1}
.tip{display:block;background:rgba(56,211,159,0.08);border:1px solid rgba(56,211,159,0.25)}
.tip::before{content:"💡 ";}
.warn{display:block;background:rgba(255,90,122,0.08);border:1px solid rgba(255,90,122,0.3)}
.warn::before{content:"⚠️ ";}
.terms{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:0}
.terms dt{font-weight:700;color:#fff}
.terms dd{margin:0;color:var(--text-dim)}
.flow{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:10px 0}
.flow span{background:var(--surface-2);border:1px solid var(--border);border-radius:9px;padding:6px 10px;font-size:13px}
.flow i{color:var(--brand);font-style:normal;font-weight:700}
.tbl{width:100%;border-collapse:collapse;font-size:13px;margin:8px 0}
.tbl th,.tbl td{border-bottom:1px solid var(--border);padding:7px 8px;text-align:left;vertical-align:top}
.tbl th{color:var(--text-faint);font-weight:600;font-size:11.5px;text-transform:uppercase;letter-spacing:.06em}
.tbl.cheat th{color:var(--brand-2);padding-top:14px}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0}
.mini{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:10px;font-size:13px}
.mini pre{margin:6px 0}
.areas-diagram{display:flex;align-items:stretch;gap:6px;margin:14px 0;flex-wrap:wrap}
.ad{flex:1;min-width:110px;border-radius:12px;padding:10px;border:1px solid var(--border);display:flex;flex-direction:column;gap:3px}
.ad small{color:var(--text-dim);font-size:11.5px;line-height:1.35}
.ad.wd{background:rgba(255,90,122,0.08);border-color:rgba(255,90,122,0.3)}
.ad.st{background:rgba(255,181,71,0.08);border-color:rgba(255,181,71,0.3)}
.ad.rp{background:rgba(56,211,159,0.08);border-color:rgba(56,211,159,0.3)}
.ad-arrow{align-self:center;font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--brand-2);white-space:nowrap}
.legend{list-style:none;padding:0 !important}
.chip{display:inline-flex;align-items:center;justify-content:center;min-width:20px;height:18px;padding:0 5px;border-radius:5px;font-size:10.5px;font-weight:800;font-family:'JetBrains Mono',monospace}
.chip.u{background:rgba(255,90,122,0.2);color:#ff8fa6}
.chip.m{background:rgba(255,181,71,0.2);color:var(--warn)}
.chip.a{background:rgba(56,211,159,0.2);color:var(--success)}
.chip.d{background:rgba(255,90,122,0.2);color:#ff8fa6}
.chip.c{background:var(--error);color:#fff}
.chip.ok{background:rgba(255,255,255,0.08);color:var(--text-dim)}
.chip.ig{background:rgba(255,255,255,0.05);color:var(--text-faint)}
.chip.good{background:rgba(56,211,159,0.2);color:var(--success)}
.chip.bad{background:rgba(255,90,122,0.2);color:#ff8fa6}

/* steps */
.steps-head{display:flex;align-items:center;justify-content:space-between;margin:28px 0 10px}
.steps-head h3{margin:0;font-size:16px}
.steps-head small{color:var(--text-faint);font-size:12px}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.step{
  display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:10px;align-items:start;
  padding:10px 12px;border-radius:12px;background:var(--surface);border:1px solid var(--border);
  transition:border-color .25s,background .25s,opacity .25s;
}
.step .num{width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;background:var(--surface-2);color:var(--text-dim)}
.step code{font-size:12.5px;color:#c7dcff;word-break:break-word}
.step p{margin:5px 0 0;font-size:13px;line-height:1.5;color:var(--text-dim)}
.step p code{background:rgba(255,255,255,0.07);padding:0 5px;border-radius:5px;font-size:11.5px}
.step .go{width:28px;height:28px;border-radius:8px;background:var(--surface-2);color:var(--text-dim);font-size:11px;transition:background .15s,color .15s}
.step .go:hover{background:var(--brand);color:#fff}
.step.done{opacity:.62}
.step.done .num{background:rgba(56,211,159,0.2);color:var(--success)}
.step.current{border-color:rgba(36,150,237,0.55);background:linear-gradient(135deg,rgba(36,150,237,0.14),rgba(124,92,255,0.08));opacity:1}
.step.current .num{background:var(--brand);color:#fff}
.step.next{border-style:dashed;border-color:rgba(36,150,237,0.4)}

/* quiz */
.quiz{margin-top:26px;padding:16px;border-radius:14px;background:linear-gradient(135deg,rgba(53,208,255,0.08),rgba(124,92,255,0.08));border:1px solid rgba(53,208,255,0.22)}
.quiz h3{margin:0 0 4px;font-size:13px;text-transform:uppercase;letter-spacing:.1em;color:var(--accent-2)}
.quiz .q{font-size:14.5px;font-weight:600;margin:4px 0 10px}
.quiz button.opt{display:block;width:100%;text-align:left;padding:9px 12px;margin:6px 0;border-radius:10px;background:var(--surface);border:1px solid var(--border);font-size:13.5px;color:var(--text);transition:border-color .15s}
.quiz button.opt:hover{border-color:var(--border-strong)}
.quiz button.opt.right{border-color:var(--success);background:rgba(56,211,159,0.12)}
.quiz button.opt.wrong{border-color:var(--error);background:rgba(255,90,122,0.1)}
.quiz .why{font-size:13px;color:var(--text-dim);margin-top:8px}
.pager{display:flex;justify-content:space-between;gap:10px;margin-top:26px}
.pager button{padding:10px 14px;border-radius:11px;border:1px solid var(--border);background:var(--surface);font-size:13px;color:var(--text-dim);max-width:48%;text-align:left}
.pager button:hover{color:#fff;border-color:var(--border-strong)}
.pager button.next{text-align:right;margin-left:auto}
.pager small{display:block;font-size:11px;color:var(--text-faint)}

/* ---------- playground ---------- */
.play-pane{display:grid;grid-template-rows:auto auto minmax(0,1fr) var(--term-h,minmax(170px,34%));min-width:0;min-height:0;padding:14px 16px 16px;gap:10px}
.toolbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;container-type:inline-size}
/* Home sits in the top-right corner; a narrow bar drops labels first */
.home-btn{text-decoration:none;margin-left:auto}
@container (max-width:860px){ .home-btn .t,#guideBtn .t{display:none} }
@container (max-width:720px){ #playBtn .t{display:none} .toolbar .tab{padding:6px 8px} }
.tabs{display:flex;gap:4px;background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:3px}
.tab{padding:6px 11px;border-radius:8px;font-size:12.5px;color:var(--text-dim)}
.tab.active{background:var(--surface-2);color:#fff;box-shadow:inset 0 0 0 1px var(--border-strong)}
.spacer{flex:1}
.btn{padding:8px 13px;border-radius:10px;font-size:13px;font-weight:600;border:1px solid var(--border);background:var(--surface);color:var(--text);display:inline-flex;align-items:center;gap:6px;transition:background .15s,border-color .15s,transform .1s}
.btn:hover{border-color:var(--border-strong);background:var(--surface-2)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:linear-gradient(135deg,var(--brand-2),var(--brand));border-color:transparent;color:#fff;box-shadow:0 8px 24px -10px rgba(36,150,237,0.7)}
.btn.primary:hover{filter:brightness(1.08)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn .k{font-size:10.5px;opacity:.75;font-family:'JetBrains Mono',monospace}
.narr{
  min-height:44px;padding:10px 14px;border-radius:12px;font-size:13.5px;line-height:1.5;
  background:linear-gradient(135deg,rgba(36,150,237,0.12),rgba(124,92,255,0.08));border:1px solid rgba(36,150,237,0.28);
}
.narr b.stepno{color:var(--brand-2);margin-right:6px;font-size:12px;text-transform:uppercase;letter-spacing:.06em}
.narr code{background:rgba(255,255,255,0.08);padding:0 5px;border-radius:5px;font-size:12px;color:#c7dcff}
.narr .chip{vertical-align:1px}
.narr.flash{animation:narrFlash .7s ease}
@keyframes narrFlash{from{box-shadow:0 0 0 3px rgba(36,150,237,0.45)}to{box-shadow:0 0 0 0 rgba(36,150,237,0)}}

.viz{grid-row:3;min-height:0;min-width:0;display:flex;flex-direction:column;gap:10px}
.panel{min-width:0;background:rgba(10,10,22,0.6);border:1px solid var(--border);border-radius:14px;min-height:0;display:flex;flex-direction:column;overflow:hidden}
.panel-head{display:flex;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid var(--border);font-size:11.5px;color:var(--text-faint);text-transform:uppercase;letter-spacing:.1em;flex-shrink:0}
.panel-head b{color:var(--text-dim);font-weight:600}
.panel-head .hint{margin-left:auto;text-transform:none;letter-spacing:0;font-size:11.5px}
.panel-body{overflow:auto;flex:1;min-height:0;position:relative;scrollbar-width:thin}

/* ---------- Docker views ---------- */
.viz{display:flex}
.viz .panel{flex:1}
.o-auto{color:#c4b5fd}.o-hash{color:#9bd3ff}
.p-root{color:#ff8fa6}
.badge{display:inline-block;font-size:10px;font-weight:800;letter-spacing:.05em;padding:1px 6px;border-radius:4px;vertical-align:1px;font-family:'JetBrains Mono',monospace}
.badge.cached{background:rgba(56,211,159,0.18);color:#6ee7b7}
.badge.built{background:rgba(255,181,71,0.2);color:var(--warn)}
.badge.pulled{background:rgba(36,150,237,0.2);color:#9bd3ff}
.badge.error{background:rgba(255,90,122,0.2);color:#ff9db1}
.badge.meta{background:rgba(255,255,255,0.08);color:var(--text-faint)}
.pill{display:inline-block;font-size:10.5px;font-weight:700;padding:1px 7px;border-radius:10px}
.pill.starting{background:rgba(255,181,71,0.18);color:var(--warn)}
.pill.healthy{background:rgba(56,211,159,0.18);color:#6ee7b7}
.pill.unhealthy{background:rgba(255,90,122,0.2);color:#ff9db1}
.mini.bad{border-color:rgba(255,90,122,0.4)}.mini.good{border-color:rgba(56,211,159,0.4)}
.flow span.ok{border-color:rgba(56,211,159,0.5);color:#6ee7b7}
.empty-state{padding:30px 18px;text-align:center;color:var(--text-faint);font-size:13px;line-height:1.6}
.empty-state b{color:var(--text-dim)}

/* host map */
.host{display:grid;grid-template-columns:150px 190px minmax(320px,1fr);gap:12px;padding:12px;min-width:720px;align-items:start}
.col-title{font-size:10.5px;text-transform:uppercase;letter-spacing:.12em;color:var(--text-faint);margin:0 0 8px;display:flex;align-items:center;gap:6px}
.col-title b{color:var(--text-dim);font-weight:700}
.hub{border:1px dashed rgba(36,150,237,0.45);border-radius:14px;padding:10px 9px;background:radial-gradient(160px 90px at 50% 0%,rgba(36,150,237,0.14),transparent);display:flex;flex-direction:column;gap:5px}
.hub .cloud{font-size:22px;text-align:center;line-height:1}
.hub .hn{text-align:center;font-size:11.5px;font-weight:700;color:#9bd3ff;margin-bottom:4px}
.hub .repo{font-family:'JetBrains Mono',monospace;font-size:10.5px;color:var(--text-dim);padding:3px 6px;border-radius:6px;background:rgba(255,255,255,0.04);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hub .repo.mine{color:#fde68a;background:rgba(255,181,71,0.1)}
.hub .repo.flash{animation:hubFlash 1.4s ease}
@keyframes hubFlash{0%{background:rgba(36,150,237,0.6);color:#fff}100%{}}
.imgs{display:flex;flex-direction:column;gap:7px}
.imgcard{border:1px solid var(--border);background:rgba(255,255,255,0.035);border-radius:10px;padding:7px 9px;cursor:pointer;transition:border-color .2s,box-shadow .3s}
.imgcard:hover{border-color:var(--border-strong)}
.imgcard .nm{font-family:'JetBrains Mono',monospace;font-size:11.5px;font-weight:600;color:#cfe6ff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.imgcard .sub{display:flex;justify-content:space-between;font-size:10.5px;color:var(--text-faint);margin-top:2px}
.imgcard .bar{height:4px;border-radius:4px;background:rgba(255,255,255,0.07);margin-top:5px;overflow:hidden}
.imgcard .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--brand),var(--brand-2));border-radius:4px}
.imgcard.dangling{opacity:.5;border-style:dashed}
.imgcard.inuse{border-color:rgba(36,150,237,0.35)}
.nets{display:flex;flex-direction:column;gap:10px}
.net{border:1.5px dashed rgba(255,255,255,0.18);border-radius:14px;padding:8px 9px 10px;position:relative}
.net.user{border-color:rgba(167,139,250,0.55);background:rgba(167,139,250,0.05)}
.net.compose{border-color:rgba(56,211,159,0.5);background:rgba(56,211,159,0.04)}
.net-head{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--text-dim);margin:0 2px 7px;flex-wrap:wrap}
.net-head b{font-family:'JetBrains Mono',monospace;color:var(--text)}
.net-head .dns{font-size:10px;padding:1px 6px;border-radius:4px;background:rgba(255,255,255,0.07)}
.net-head .dns.yes{background:rgba(56,211,159,0.18);color:#6ee7b7}
.ctrs{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:8px}
.ctr{border:1px solid var(--border);border-radius:11px;background:#121427;padding:8px 9px;font-size:11.5px;position:relative;transition:border-color .3s,box-shadow .3s,opacity .3s}
.ctr .top{display:flex;align-items:center;gap:6px}
.ctr .dot{width:9px;height:9px;border-radius:50%;background:#6b6b80;flex-shrink:0}
.ctr.running .dot{background:var(--success);box-shadow:0 0 0 0 rgba(56,211,159,.6);animation:beat 2s infinite}
@keyframes beat{0%{box-shadow:0 0 0 0 rgba(56,211,159,.55)}70%{box-shadow:0 0 0 7px rgba(56,211,159,0)}100%{box-shadow:0 0 0 0 rgba(56,211,159,0)}}
.ctr.restarting .dot{background:var(--warn);animation:spin 1s linear infinite;border-radius:2px}
@keyframes spin{to{transform:rotate(360deg)}}
.ctr.paused .dot{background:var(--warn)}
.ctr.exited,.ctr.created{opacity:.62;border-style:dashed}
.ctr .nm{font-weight:700;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
.ctr .img{font-family:'JetBrains Mono',monospace;font-size:10.5px;color:var(--text-faint);margin:2px 0 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ctr .st{font-size:10.5px;color:var(--text-dim)}
.ctr .chips{display:flex;flex-direction:column;gap:3px;margin-top:5px}
.ctr .chip2{font-family:'JetBrains Mono',monospace;font-size:10px;padding:2px 6px;border-radius:5px;background:rgba(255,255,255,0.05);color:var(--text-dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ctr .chip2.port{background:rgba(36,150,237,0.16);color:#9bd3ff}
.ctr .chip2.vol{background:rgba(255,181,71,0.12);color:#fcd34d}
.ctr .chip2.bind{background:rgba(167,139,250,0.14);color:#c4b5fd}
.ctr .ip{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--text-faint);position:absolute;right:9px;top:26px}
.ctr.inside{border-color:var(--warn);box-shadow:0 0 0 2px rgba(255,181,71,0.45)}
.ctr .inside-tag{position:absolute;top:-9px;left:10px;font-size:10px;font-weight:800;background:var(--warn);color:#1a1205;padding:1px 6px;border-radius:5px}
.hl{box-shadow:0 0 0 2px var(--brand),0 10px 30px -10px rgba(36,150,237,.6) !important}
.vols{grid-column:2/-1;display:flex;flex-wrap:wrap;gap:8px;align-items:stretch}
.vol{display:flex;gap:8px;align-items:center;border:1px solid rgba(255,181,71,0.35);background:rgba(255,181,71,0.06);border-radius:11px;padding:7px 10px;font-size:11.5px;transition:box-shadow .3s}
.vol .cyl{width:20px;height:24px;border-radius:50%/22%;background:linear-gradient(180deg,#fcd34d,#b7791f);flex-shrink:0;box-shadow:inset 0 3px 0 rgba(255,255,255,.35)}
.vol .vn{font-family:'JetBrains Mono',monospace;font-weight:600;font-size:11px}
.vol .vu{font-size:10.5px;color:var(--text-faint)}
.legend-row{grid-column:1/-1;display:flex;gap:14px;flex-wrap:wrap;font-size:11px;color:var(--text-faint);padding-top:2px}
.legend-row span{display:inline-flex;align-items:center;gap:5px}
.pop-in{animation:popIn .45s cubic-bezier(.3,1.5,.5,1)}
@keyframes popIn{from{transform:scale(.6);opacity:0}}

/* layers */
.layers{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:14px;padding:12px;min-width:640px}
.img-pick{grid-column:1/-1;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.img-pick button{font-family:'JetBrains Mono',monospace;font-size:11px;padding:4px 8px;border-radius:7px;border:1px solid var(--border);background:var(--surface);color:var(--text-dim)}
.img-pick button.on{border-color:var(--brand);color:#fff;background:rgba(36,150,237,0.2)}
.dfile{border:1px solid var(--border);border-radius:12px;background:#0b0c18;overflow:hidden}
.dfile .hd{display:flex;justify-content:space-between;align-items:center;padding:7px 10px;border-bottom:1px solid var(--border);font-size:11.5px;color:var(--text-dim)}
.dfile .hd b{font-family:'JetBrains Mono',monospace;color:var(--text)}
.dline{display:grid;grid-template-columns:26px minmax(0,1fr) auto;gap:8px;align-items:center;padding:2px 10px;font-family:'JetBrains Mono',monospace;font-size:11.5px;line-height:1.7;white-space:pre;overflow:hidden}
.dline .no{color:var(--text-faint);text-align:right;font-size:10.5px}
.dline .tx{overflow:hidden;text-overflow:ellipsis}
.dline .tx .kw{color:#7cc4ff;font-weight:700}
.dline .tx .cm{color:var(--text-faint)}
.dline.built{background:rgba(255,181,71,0.08)}
.dline.cached{background:rgba(56,211,159,0.05)}
.dline.error{background:rgba(255,90,122,0.12)}
.dline .t{font-size:10px;color:var(--text-faint);margin-left:5px}
.ctxinfo{font-size:11.5px;color:var(--text-dim);padding:7px 10px;border-top:1px solid var(--border)}
.ctxinfo code{font-size:11px}
.stack{display:flex;flex-direction:column;align-items:center;gap:3px}
.stack h5,.sizes h5{margin:0 0 6px;font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--text-faint);align-self:stretch}
.lyr{border-radius:8px;padding:5px 9px;font-size:11px;display:flex;justify-content:space-between;gap:8px;align-items:center;border:1px solid rgba(255,255,255,0.1);background:rgba(36,150,237,0.12);transition:width .5s;min-width:46%;max-width:100%;box-sizing:border-box}
.lyr .i{font-family:'JetBrains Mono',monospace;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.lyr .s{font-size:10.5px;color:var(--text-dim);white-space:nowrap}
.lyr.base{background:rgba(255,255,255,0.05);color:var(--text-dim)}
.lyr.meta{background:transparent;border-style:dashed;color:var(--text-faint);padding:2px 9px}
.lyr.built{background:rgba(255,181,71,0.18);border-color:rgba(255,181,71,0.55);animation:popIn .5s ease}
.lyr.cached{border-color:rgba(56,211,159,0.5)}
.lyr.rw{background:repeating-linear-gradient(135deg,rgba(255,255,255,0.05) 0 6px,transparent 6px 12px);border-style:dashed;color:var(--text-dim)}
.stack .total{font-size:11.5px;color:var(--text-dim);margin-top:6px}
.sizes{grid-column:1/-1;border:1px solid var(--border);border-radius:12px;padding:10px 12px;background:rgba(255,255,255,0.02)}
.sizes .r{display:grid;grid-template-columns:150px minmax(0,1fr) 64px;gap:8px;align-items:center;font-size:11.5px;margin:4px 0}
.sizes .r .n{font-family:'JetBrains Mono',monospace;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text-dim)}
.sizes .r .b{height:12px;border-radius:0 4px 4px 0;background:#3987e5;min-width:2px;transition:width .6s}
.sizes .r.sel .n{color:#fff;font-weight:700}
.sizes .r .v{text-align:right;color:var(--text-dim);font-variant-numeric:tabular-nums}
.sizes .cap{font-size:11px;color:var(--text-faint);margin-bottom:4px}

/* files */
.files{display:grid;grid-template-columns:170px minmax(0,1fr);height:100%;min-height:260px}
.flist{border-right:1px solid var(--border);padding:8px;display:flex;flex-direction:column;gap:2px;overflow:auto}
.flist .proj{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--text-faint);padding:2px 6px 6px}
.flist button{text-align:left;font-family:'JetBrains Mono',monospace;font-size:11.5px;padding:5px 8px;border-radius:7px;color:var(--text-dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.flist button:hover{background:var(--surface)}
.flist button.on{background:rgba(36,150,237,0.2);color:#fff}
.flist button.ign{opacity:.5;text-decoration:line-through}
.flist button.chg{box-shadow:inset 3px 0 0 var(--warn)}
.editor{display:flex;flex-direction:column;min-width:0}
.editor .bar{display:flex;align-items:center;gap:8px;padding:6px 10px;border-bottom:1px solid var(--border);font-size:11.5px;color:var(--text-dim)}
.editor .bar b{font-family:'JetBrains Mono',monospace;color:var(--text)}
.editor .bar .sp{flex:1}
.editor textarea{flex:1;min-height:220px;resize:none;border:none;outline:none;background:#0b0c18;color:#e6e6f0;font-family:'JetBrains Mono',monospace;font-size:12px;line-height:1.6;padding:10px 12px;tab-size:4;font-variant-ligatures:none}
.editor .note{font-size:11.5px;color:var(--text-faint);padding:6px 10px;border-top:1px solid var(--border)}

/* browser */
.browser{display:flex;flex-direction:column;height:100%;min-height:260px}
.addr{display:flex;gap:8px;padding:8px 10px;border-bottom:1px solid var(--border);align-items:center}
.addr .nav{color:var(--text-faint);font-size:13px}
.addr input{flex:1;font-family:'JetBrains Mono',monospace;font-size:12px;padding:6px 10px;border-radius:9px;border:1px solid var(--border-strong);background:#0b0c18;color:#fff;outline:none}
.addr input:focus{border-color:var(--brand)}
.addr .code{font-size:11px;font-weight:700;padding:2px 7px;border-radius:6px}
.addr .code.ok{background:rgba(56,211,159,0.2);color:#6ee7b7}.addr .code.bad{background:rgba(255,90,122,0.2);color:#ff9db1}
.page{flex:1;background:#fff;min-height:220px;position:relative}
.page iframe{border:0;width:100%;height:100%;min-height:220px;display:block;background:#fff}
.page pre{margin:0;padding:14px;color:#111;font-size:13px;white-space:pre-wrap;font-family:'JetBrains Mono',monospace}
.page .err{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:#444;font-family:'Inter',sans-serif;text-align:center;padding:20px}
.page .err b{font-size:16px;color:#222}
.page .err code{font-size:12px;color:#666}
.page.blank{background:#0b0c18}

/* terminal */
/* draggable border above the terminal (shares the terminal's grid cell, sits in the gap) */
.term-split{grid-row:4;grid-column:1;align-self:start;height:10px;margin-top:-10px;cursor:row-resize;position:relative;z-index:2;touch-action:none}
.term-split::after{content:"";position:absolute;left:50%;top:50%;width:36px;height:3px;border-radius:3px;background:var(--border-strong);transform:translate(-50%,-50%);opacity:.6;transition:opacity .15s,background .15s,width .15s}
.term-split:hover::after,.term-split.drag::after{opacity:1;background:var(--brand);width:60px}
body.term-dragging{user-select:none;cursor:row-resize}
.term{grid-row:4;grid-column:1;min-width:0;display:flex;flex-direction:column;min-height:0;border-radius:14px;overflow:hidden;background:#07070f;border:1px solid var(--border-strong);box-shadow:0 20px 50px -25px rgba(0,0,0,0.9)}
.term-chrome{display:flex;align-items:center;gap:7px;padding:8px 12px;background:rgba(255,255,255,0.04);border-bottom:1px solid var(--border);font-size:11.5px;color:var(--text-faint);flex-shrink:0}
.term-chrome .dot{width:11px;height:11px;border-radius:50%}
.term-chrome .r{background:#ff5f57}.term-chrome .y{background:#febc2e}.term-chrome .g{background:#28c840}
.term-chrome .title{margin-left:8px;font-family:'JetBrains Mono',monospace}
.term-chrome .hint{margin-left:auto}
.term-chrome button{font-size:11.5px;color:var(--text-dim);padding:2px 8px;border-radius:6px;border:1px solid var(--border)}
.term-chrome button:hover{color:#fff}
.term-out{flex:1;overflow-y:auto;padding:10px 14px 4px;font-family:'JetBrains Mono',monospace;font-size:12.5px;line-height:1.55;scrollbar-width:thin;cursor:text}
.term-out .ln{white-space:pre-wrap;word-break:break-word;min-height:1.55em}
.term-in{display:flex;align-items:center;gap:0;padding:4px 14px 10px;font-family:'JetBrains Mono',monospace;font-size:12.5px;flex-shrink:0}
.term-in input{flex:1;background:transparent;border:none;outline:none;color:#fff;font:inherit;caret-color:var(--brand-2);min-width:60px}
.p-user{color:var(--success)}.p-dir{color:var(--accent-2)}.p-br{color:var(--brand-2)}.p-dollar{color:var(--text-dim);margin-right:8px}
.o-err{color:#ff7a93}.o-ok{color:#5ee6ae}.o-warn{color:var(--warn)}.o-info{color:var(--accent-2)}.o-hash{color:#ffd166}.o-dim{color:var(--text-faint)}.o-bold{color:#fff;font-weight:600}
.o-sys{color:var(--text-faint);font-style:italic}
.typing::after{content:"▋";color:var(--brand-2);animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}

.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);opacity:0;padding:10px 16px;border-radius:12px;background:linear-gradient(135deg,var(--brand-2),var(--accent));color:#fff;font-size:13.5px;font-weight:600;transition:transform .3s,opacity .3s;pointer-events:none;z-index:50;box-shadow:0 16px 40px -12px rgba(0,0,0,0.7)}
.toast.show{transform:translate(-50%,0);opacity:1}

/* ---------- light mode for the Docker views (the terminal and code editors stay dark) ---------- */
:root[data-theme="light"] .panel{background:#fff}
:root[data-theme="light"] .hub .hn,:root[data-theme="light"] .ctr .chip2.port,:root[data-theme="light"] .badge.pulled{color:#0b63c4}
:root[data-theme="light"] .hub .repo,:root[data-theme="light"] .ctr .chip2,:root[data-theme="light"] .lyr.base,:root[data-theme="light"] .net-head .dns,:root[data-theme="light"] .badge.meta,:root[data-theme="light"] .chip.ok,:root[data-theme="light"] .chip.ig{background:rgba(9,30,66,0.06)}
:root[data-theme="light"] .hub .repo.mine,:root[data-theme="light"] .ctr .chip2.vol{color:#8a5a00;background:#fff1cf}
:root[data-theme="light"] .ctr .chip2.port{background:#e3efff}
:root[data-theme="light"] .ctr .chip2.bind{color:#6e3fd1;background:#efe8ff}
:root[data-theme="light"] .imgcard{background:#f7f9fc}
:root[data-theme="light"] .imgcard .nm{color:#0b3a75}
:root[data-theme="light"] .imgcard .bar,:root[data-theme="light"] .sizes{background:rgba(9,30,66,0.06)}
:root[data-theme="light"] .net{border-color:rgba(9,30,66,0.2)}
:root[data-theme="light"] .ctr{background:#fff;box-shadow:0 1px 3px rgba(9,30,66,0.12)}
:root[data-theme="light"] .vol{background:#fff8e6}
:root[data-theme="light"] .lyr{border-color:rgba(9,30,66,0.12)}
:root[data-theme="light"] .net-head .dns.yes,:root[data-theme="light"] .badge.cached,:root[data-theme="light"] .pill.healthy,:root[data-theme="light"] .flow span.ok,:root[data-theme="light"] .addr .code.ok{color:#1f845a}
:root[data-theme="light"] .badge.error,:root[data-theme="light"] .pill.unhealthy,:root[data-theme="light"] .addr .code.bad,:root[data-theme="light"] .chip.u,:root[data-theme="light"] .chip.d,:root[data-theme="light"] .chip.bad{color:#c9372c}
:root[data-theme="light"] .sizes .r.sel .n,:root[data-theme="light"] .flist button.on{color:var(--text)}
:root[data-theme="light"] .addr input{background:#fff;color:var(--text)}
:root[data-theme="light"] .page.blank{background:#f3f4f8}
:root[data-theme="light"] .dfile{background:#f7f9fc}
:root[data-theme="light"] .dline .tx .kw{color:#0b63c4}
:root[data-theme="light"] .img-pick button.on{color:#0b63c4}
:root[data-theme="light"] .lyr.rw{background:repeating-linear-gradient(135deg,rgba(9,30,66,0.06) 0 6px,transparent 6px 12px)}

/* ---------- step guide: the command part by part ---------- */
.how{list-style:none;margin:8px 0 0;padding:0;display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--text-dim);counter-reset:how}
.how li{display:flex;align-items:baseline;gap:7px;max-width:100%;padding:3px 9px 3px 4px;border-radius:8px;background:var(--surface-2);border:1px solid var(--border);line-height:1.55;counter-increment:how;transition:border-color .2s,background .2s}
.how li::before{content:counter(how);width:16px;height:16px;flex-shrink:0;align-self:center;border-radius:50%;background:rgba(255,171,0,.18);color:#ffb84d;font-size:10px;font-weight:700;display:inline-flex;align-items:center;justify-content:center}
.how li b{color:var(--text);font-weight:600}
.how li > span:last-child{line-height:1.45}
.how .gv{flex-shrink:0;max-width:48%;padding:0 5px;border-radius:4px;background:rgba(255,171,0,.14);color:#ffc66b;font-family:'JetBrains Mono',monospace;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.how i{font-style:normal;font-size:10px;opacity:.65;white-space:nowrap}
.how li{cursor:pointer}
.how li:hover{border-color:rgba(255,171,0,.55)}
.how li.on{border-color:#ffab00;background:rgba(255,171,0,.12)}
:root[data-theme="light"] .how li::before{color:#8a5a00;background:#ffe9b8}
:root[data-theme="light"] .how .gv{color:#7a4f00;background:#fff1cf}
:root[data-theme="light"] .how li.on{background:#fff6e0}
#guideBtn[aria-pressed="true"]{border-color:rgba(255,171,0,.6);color:#ffb84d}
:root[data-theme="light"] #guideBtn[aria-pressed="true"]{color:#8a5a00;background:#fff6e0}

.g-layer{position:fixed;inset:0;pointer-events:none;z-index:300}
.g-layer [hidden]{display:none!important}
.g-ring{position:fixed;border:2px solid #ffab00;border-radius:8px;box-shadow:0 0 0 4px rgba(255,171,0,.22),0 0 22px rgba(255,171,0,.35);transition:left .35s,top .35s,width .35s,height .35s;animation:gpulse 1.2s ease-in-out infinite}
@keyframes gpulse{50%{box-shadow:0 0 0 8px rgba(255,171,0,.1),0 0 28px rgba(255,171,0,.3)}}
.g-cur{position:fixed;width:24px;height:24px;margin:-2px 0 0 -3px;transition:left .5s cubic-bezier(.3,.7,.3,1),top .5s cubic-bezier(.3,.7,.3,1);filter:drop-shadow(0 2px 3px rgba(0,0,0,.45))}
.g-cur svg{width:24px;height:24px;display:block;transition:transform .12s}
.g-cur.press svg{transform:scale(.82)}

<script>
/* =====================================================================
   Docker simulator engine
   An in-memory Docker host: registry, images made of layers, a build
   cache, containers with writable layers, volumes, bind mounts, networks
   with DNS, port publishing, Compose, healthchecks and restart policies.
   Apps inside containers are simulated by reading their source.
   ===================================================================== */

/* ---------- small helpers ---------- */
function hash(str){
  let h = 0x811c9dc5, g = 0x9747b28c;
  for(let i = 0; i < str.length; i++){ const c = str.charCodeAt(i); h ^= c; h = Math.imul(h, 16777619); g ^= c; g = Math.imul(g, 0x5bd1e995); g ^= g >>> 13; }
  const part = ((h >>> 0).toString(16).padStart(8, '0') + (g >>> 0).toString(16).padStart(8, '0'));
  if(str.endsWith('\u0001')) return part;
  return part + hash(str + 'a\u0001') + hash(str + 'b\u0001') + hash(str + 'c\u0001');
}
const L = (...segs) => segs.map(s => typeof s === 'string' ? [s, ''] : s);
const T = (text, cls = '') => String(text).split('\n').map(t => [[t, cls]]);
const pad = (s, n) => String(s).length >= n ? String(s) + ' ' : String(s).padEnd(n);
function fmtSize(b){
  if(b < 1000) return b + 'B';
  if(b < 1e6) return (b / 1e3).toFixed(b < 1e4 ? 1 : 0).replace(/\.0$/, '') + 'kB';
  if(b < 1e9) return (b / 1e6).toFixed(b < 1e7 ? 2 : b < 1e8 ? 1 : 0).replace(/\.0+$/, '') + 'MB';
  return (b / 1e9).toFixed(2) + 'GB';
}
const MB = 1e6;
const ADJ = ['focused', 'eager', 'jolly', 'brave', 'quirky', 'sharp', 'kind', 'happy', 'clever', 'nifty', 'zen', 'vibrant'];
const SCI = ['turing', 'hopper', 'lovelace', 'curie', 'noether', 'tesla', 'darwin', 'shannon', 'ritchie', 'torvalds', 'goodall', 'babbage'];

/* ---------- the registry (Docker Hub) ---------- */
const NGINX_HTML = `<!DOCTYPE html>
<html><head><title>Welcome to nginx!</title></head>
<body><h1>Welcome to nginx!</h1>
<p>If you see this page, the nginx web server is successfully installed and working.</p>
<p><em>Thank you for using nginx.</em></p></body></html>`;
const NGINX_CONF = `server {
    listen 80;
    location / {
        root   /usr/share/nginx/html;
        index  index.html;
    }
}`;
const OS = {
  alpine: 'NAME="Alpine Linux"\nID=alpine\nVERSION_ID=3.20.3\nPRETTY_NAME="Alpine Linux v3.20"',
  debian: 'PRETTY_NAME="Debian GNU/Linux 12 (bookworm)"\nNAME="Debian GNU/Linux"\nVERSION_ID="12"',
  ubuntu: 'PRETTY_NAME="Ubuntu 24.04.1 LTS"\nNAME="Ubuntu"\nVERSION_ID="24.04"',
};
const SH = ['sh', 'echo', 'cat', 'ls', 'mkdir', 'rm', 'touch', 'env', 'printenv', 'whoami', 'hostname', 'id', 'sleep', 'pwd', 'kill', 'chmod', 'chown', 'true', 'ps', 'cp', 'mv', 'exit', 'uname'];
const STOCK = {
  'hello-world': {size: 13.3e3, layers: [['COPY hello /', 13.3e3]], cmd: ['/hello'], tools: [], os: null},
  'alpine': {size: 7.8 * MB, layers: [['ADD alpine-minirootfs-3.20.3.tar.gz /', 7.8 * MB]], cmd: ['/bin/sh'], tools: [...SH, 'apk', 'ping', 'wget', 'adduser', 'addgroup'], os: 'alpine'},
  'busybox': {size: 4.3 * MB, layers: [['ADD busybox.tar /', 4.3 * MB]], cmd: ['sh'], tools: [...SH, 'ping', 'wget'], os: null},
  'ubuntu': {size: 78 * MB, layers: [['ADD ubuntu-noble-rootfs.tar.gz /', 78 * MB]], cmd: ['/bin/bash'], tools: [...SH, 'bash', 'apt-get', 'useradd'], os: 'ubuntu'},
  'nginx': {size: 188 * MB, layers: [['ADD debian-bookworm-rootfs.tar.gz /', 74.8 * MB], ['RUN apt-get install nginx', 110 * MB], ['COPY docker-entrypoint.sh /', 3.2 * MB]], cmd: ['nginx', '-g', 'daemon off;'], expose: ['80/tcp'], tools: [...SH, 'bash', 'apt-get', 'curl', 'nginx'], os: 'debian', fs: {'/usr/share/nginx/html/index.html': NGINX_HTML, '/etc/nginx/conf.d/default.conf': NGINX_CONF}},
  'nginx:alpine': {size: 47.9 * MB, layers: [['ADD alpine-minirootfs-3.20.3.tar.gz /', 7.8 * MB], ['RUN apk add nginx', 40.1 * MB]], cmd: ['nginx', '-g', 'daemon off;'], expose: ['80/tcp'], tools: [...SH, 'apk', 'wget', 'curl', 'nginx'], os: 'alpine', fs: {'/usr/share/nginx/html/index.html': NGINX_HTML, '/etc/nginx/conf.d/default.conf': NGINX_CONF}},
  'python:3.12': {size: 1.02e9, layers: [['ADD debian-bookworm-rootfs.tar.gz /', 117 * MB], ['RUN apt-get install build tools', 584 * MB], ['RUN install Python 3.12.7', 319 * MB]], cmd: ['python3'], tools: [...SH, 'bash', 'apt-get', 'curl', 'python', 'python3', 'pip', 'useradd'], os: 'debian'},
  'python:3.12-slim': {size: 130 * MB, layers: [['ADD debian-bookworm-rootfs.tar.gz /', 74.8 * MB], ['RUN install Python 3.12.7', 55.2 * MB]], cmd: ['python3'], tools: [...SH, 'bash', 'apt-get', 'python', 'python3', 'pip', 'useradd'], os: 'debian'},
  'python:3.12-alpine': {size: 52.4 * MB, layers: [['ADD alpine-minirootfs-3.20.3.tar.gz /', 7.8 * MB], ['RUN install Python 3.12.7', 44.6 * MB]], cmd: ['python3'], tools: [...SH, 'apk', 'wget', 'python', 'python3', 'pip', 'adduser'], os: 'alpine'},
  'node:20': {size: 1.1e9, layers: [['ADD debian-bookworm-rootfs.tar.gz /', 117 * MB], ['RUN apt-get install build tools', 840 * MB], ['RUN install Node.js 20.18', 143 * MB]], cmd: ['node'], tools: [...SH, 'bash', 'apt-get', 'curl', 'node', 'npm', 'useradd'], os: 'debian'},
  'node:20-alpine': {size: 135 * MB, layers: [['ADD alpine-minirootfs-3.20.3.tar.gz /', 7.8 * MB], ['RUN install Node.js 20.18', 127 * MB]], cmd: ['node'], tools: [...SH, 'apk', 'wget', 'node', 'npm', 'adduser'], os: 'alpine'},
  'redis': {size: 117 * MB, layers: [['ADD debian-bookworm-rootfs.tar.gz /', 74.8 * MB], ['RUN install redis 7.4', 42.2 * MB]], cmd: ['redis-server'], expose: ['6379/tcp'], volumes: ['/data'], workdir: '/data', tools: [...SH, 'bash', 'redis-cli', 'redis-server'], os: 'debian'},
  'postgres': {size: 432 * MB, layers: [['ADD debian-bookworm-rootfs.tar.gz /', 74.8 * MB], ['RUN install postgresql 16.4', 357 * MB]], entrypoint: ['docker-entrypoint.sh'], cmd: ['postgres'], expose: ['5432/tcp'], volumes: ['/var/lib/postgresql/data'], tools: [...SH, 'bash', 'psql', 'pg_isready', 'postgres'], os: 'debian'},
};
// tag aliases → stock key
const TAGS = {
  'hello-world:latest': 'hello-world', 'alpine:latest': 'alpine', 'alpine:3.20': 'alpine', 'busybox:latest': 'busybox',
  'ubuntu:latest': 'ubuntu', 'ubuntu:24.04': 'ubuntu', 'nginx:latest': 'nginx', 'nginx:1.27': 'nginx', 'nginx:alpine': 'nginx:alpine',
  'python:3.12': 'python:3.12', 'python:latest': 'python:3.12', 'python:3.12-slim': 'python:3.12-slim', 'python:3.12-alpine': 'python:3.12-alpine',
  'node:20': 'node:20', 'node:latest': 'node:20', 'node:20-alpine': 'node:20-alpine', 'redis:latest': 'redis', 'redis:7': 'redis', 'redis:alpine': 'redis',
  'postgres:latest': 'postgres', 'postgres:16': 'postgres',
};
const MEM = {nginx: 7.6, redis: 3.9, postgres: 38.2, python: 27.5, node: 41, sleep: 0.4, sh: 0.6};

function splitRef(ref){
  let r = ref.replace(/^docker\.io\/(library\/)?/, '');
  let tag = 'latest';
  const m = r.match(/^(.*?):([\w.-]+)$/);
  if(m){ r = m[1]; tag = m[2]; }
  return {repo: r, tag, full: `${r}:${tag}`};
}

/* ---------- shell-ish tokenizer ---------- */
function tokenize(src){
  const toks = []; let cur = '', q = null, has = false;
  for(let i = 0; i < src.length; i++){
    const c = src[i];
    if(q){ if(c === q) q = null; else cur += c; continue; }
    if(c === '"' || c === "'"){ q = c; has = true; continue; }
    if(/\s/.test(c)){ if(has || cur){ toks.push(cur); cur = ''; has = false; } continue; }
    if(c === '>' && !q){ if(has || cur){ toks.push(cur); cur = ''; has = false; } if(src[i + 1] === '>'){ toks.push('>>'); i++; } else toks.push('>'); continue; }
    if(c === '|' && src[i + 1] === '|'){ if(has || cur){ toks.push(cur); cur = ''; has = false; } toks.push('||'); i++; continue; }
    cur += c;
  }
  if(has || cur) toks.push(cur);
  return toks;
}
function splitChain(src){
  const parts = []; let cur = '', q = null;
  for(let i = 0; i < src.length; i++){
    const c = src[i];
    if(q){ if(c === q) q = null; cur += c; continue; }
    if(c === '"' || c === "'"){ q = c; cur += c; continue; }
    if(c === '&' && src[i + 1] === '&'){ parts.push(cur); cur = ''; i++; continue; }
    if(c === ';'){ parts.push(cur); cur = ''; continue; }
    cur += c;
  }
  parts.push(cur);
  return parts.map(p => p.trim()).filter(Boolean);
}

/* ---------- a tiny YAML reader (enough for docker-compose.yml) ---------- */
function parseYaml(src){
  const lines = src.split('\n').map((raw, n) => ({raw, n: n + 1})).filter(l => l.raw.trim() && !l.raw.trim().startsWith('#'));
  const scalar = v => {
    v = v.trim();
    if(v === '') return null;
    if(/^".*"$|^'.*'$/.test(v)) return v.slice(1, -1);
    if(/^\[.*\]$/.test(v)) return v.slice(1, -1).split(',').map(x => scalar(x)).filter(x => x !== null);
    if(/^-?\d+(\.\d+)?$/.test(v)) return Number(v);
    if(v === 'true') return true; if(v === 'false') return false;
    return v.replace(/\s+#.*$/, '');
  };
  let i = 0;
  const indent = l => l.raw.match(/^ */)[0].length;
  function block(ind){
    if(i >= lines.length) return null;
    if(lines[i].raw.trim().startsWith('- ')){
      const arr = [];
      while(i < lines.length && indent(lines[i]) === ind && lines[i].raw.trim().startsWith('- ')){
        const item = lines[i].raw.trim().slice(2);
        i++;
        const m = item.match(/^([\w.-]+):(?:\s+(.*)|\s*$)/);
        if(m && !/^["']/.test(item)){
          const obj = {[m[1]]: m[2] ? scalar(m[2]) : block(ind + 4)};
          while(i < lines.length && indent(lines[i]) === ind + 2){
            const mm = lines[i].raw.trim().match(/^([\w.-]+):(?:\s+(.*)|\s*$)/); i++;
            if(mm) obj[mm[1]] = mm[2] ? scalar(mm[2]) : block(ind + 4);
          }
          arr.push(obj);
        } else arr.push(scalar(item));
      }
      return arr;
    }
    const obj = {};
    while(i < lines.length && indent(lines[i]) === ind){
      const t = lines[i].raw.trim();
      const m = t.match(/^("[^"]+"|[\w.\/-]+):(?:\s+(.*)|\s*$)/);
      if(!m) throw new Error(`yaml: line ${lines[i].n}: could not find expected ':'`);
      i++;
      const key = m[1].replace(/"/g, '');
      if(m[2] !== undefined && m[2] !== ''){ obj[key] = scalar(m[2]); continue; }
      if(i < lines.length && indent(lines[i]) > ind) obj[key] = block(indent(lines[i]));
      else obj[key] = null;
    }
    if(i < lines.length && indent(lines[i]) > ind) throw new Error(`yaml: line ${lines[i].n}: mapping values are not allowed in this context (check the indentation)`);
    return obj;
  }
  return block(0) || {};
}

/* ---------- reading a (simulated) Python app ---------- */
function analyzePy(src){
  const A = {imports: new Set(), env: {}, prints: [], server: null, routes: {}, redisHost: null, exit: null, lines: src.split('\n')};
  A.lines.forEach((ln, n) => {
    const t = ln.trim();
    let m;
    if((m = t.match(/^import\s+([\w, ]+)/))) m[1].split(',').forEach(x => A.imports.add(x.trim().split('.')[0]));
    if((m = t.match(/^from\s+([\w]+)/))) A.imports.add(m[1]);
    if((m = t.match(/^(\w+)\s*=\s*os\.(?:getenv|environ\.get)\(\s*["'](\w+)["']\s*(?:,\s*["']?([^"')]*)["']?)?\s*\)/))) A.env[m[1]] = {key: m[2], def: m[3] ?? null, line: n + 1};
    if((m = t.match(/^(\w+)\s*=\s*(?:int\()?os\.environ\[\s*["'](\w+)["']\s*\]/))) A.env[m[1]] = {key: m[2], required: true, line: n + 1};

  for(let k = 0; k < A.lines.length; k++){

    if(!m) continue;

      const t = A.lines[j].trim();
      let r;
      if((r = t.match(/^(\w+)\s*=\s*\w+\.incr\(\s*["'](\w+)["']\s*\)/))) route.incr = {var: r[1], key: r[2]};
      if((r = t.match(/^return\s+f?(["'])(.*?)\1(?:\s*,\s*(\d+))?/))){ route.ret = r[2]; if(r[3]) route.status = +r[3]; break; }
    }
    A.routes[route.path] = route;
  }
  return A;
}

/* =====================================================================
   The Docker host
   ===================================================================== */
class Docker {
  constructor(){
    this.home = '/home/you/project';
    this.files = {};                   // host project files: relative path -> content
    this.imgs = {};                    // id -> image
    this.refs = [];                    // {repo, tag, id}
    this.containers = [];
    this.volumes = {};
    this.networks = {
      bridge: {name: 'bridge', driver: 'bridge', builtin: true, subnet: '172.17.0', dns: false, id: hash('net-bridge').slice(0, 12)},
      host: {name: 'host', driver: 'host', builtin: true, subnet: null, dns: false, id: hash('net-host').slice(0, 12)},
      none: {name: 'none', driver: 'null', builtin: true, subnet: null, dns: false, id: hash('net-none').slice(0, 12)},
    };
    this.hub = {};                     // pushed user images: 'you/app:1.0' -> image id
    this.loggedIn = null;
    this.cache = {};                   // build cache key -> layer
    this.lastBuild = null;
    this.selectedImage = null;
    this.browser = null;
    this.shell = null;                 // {cid, cwd, viaExec}
    this.clock = 0;
    this.seq = 0;
    this.netSeq = 18;
    this.rr = {};                      // DNS round-robin counters
    this.compose = {};                 // project -> {services}
    this.changed = new Set();
    this.events = [];                  // animation hints for the UI: {type, ...}
  }

  /* ---------- lookup ---------- */
  ref(name){ const r = splitRef(name); return this.refs.find(x => x.repo === r.repo && x.tag === r.tag) || null; }
  image(name){
    const r = this.ref(name);
    if(r) return this.imgs[r.id];
    if(/^[0-9a-f]{3,64}$/.test(name)){ const hit = Object.keys(this.imgs).filter(id => id.startsWith(name)); if(hit.length === 1) return this.imgs[hit[0]]; }
    return null;
  }
  imageName(img){ const r = this.refs.find(x => x.id === img.id && x.repo !== '<none>'); return r ? `${r.repo}:${r.tag}` : img.id.slice(0, 12); }
  ctr(name){
    return this.containers.find(c => c.name === name) || (/^[0-9a-f]{3,64}$/.test(name) ? (this.containers.filter(c => c.id.startsWith(name)).length === 1 ? this.containers.find(c => c.id.startsWith(name)) : null) : null);
  }
  ago(t){ const s = this.clock - t; if(s < 2) return 'Less than a second ago'; if(s < 60) return `${s} seconds ago`; if(s < 120) return 'About a minute ago'; if(s < 3600) return `${Math.floor(s / 60)} minutes ago`; return `${Math.floor(s / 3600)} hours ago`; }
  up(t){ const s = this.clock - t; if(s < 2) return 'Up Less than a second'; if(s < 60) return `Up ${s} seconds`; if(s < 120) return 'Up About a minute'; return `Up ${Math.floor(s / 60)} minutes`; }
  imgSize(img){ return img.layers.reduce((a, l) => a + l.size, 0); }
  ctrSize(c){ return Object.values(c.rw).reduce((a, v) => a + (v === null ? 0 : String(v).length), 0); }
  touch(...keys){ for(const k of keys) this.changed.add(k); }

  /* ---------- images ---------- */
  makeImage({layers, config, fs, tools, pkgs, users, from}){
    const id = hash(layers.map(l => l.id).join('|') + JSON.stringify(config)).slice(0, 64);
    if(!this.imgs[id]) this.imgs[id] = {id, layers, config, fs, tools: new Set(tools), pkgs: new Set(pkgs || []), users: new Set(users || ['root']), created: this.clock, from};
    return this.imgs[id];
  }
  stockImage(key){
    const s = STOCK[key];
    let parent = '';
    const layers = s.layers.map(([instr, size]) => { const id = hash(key + instr + parent).slice(0, 64); parent = id; return {id, instr, size, base: true}; });
    const fs = {...(s.fs || {})};
    if(s.os) fs['/etc/os-release'] = OS[s.os];

  }
  tag(id, name){
    const r = splitRef(name);
    const old = this.refs.find(x => x.repo === r.repo && x.tag === r.tag);

    }

  }
  danglingCheck(){
    for(const id of Object.keys(this.imgs)){
      if(this.refs.some(r => r.id === id)) continue;
      if(this.imgs[id].stage) continue;
      this.refs.push({repo: '<none>', tag: '<none>', id});

  }
  pull(name, out){
    const r = splitRef(name);
    const local = this.ref(name);
    const userKey = this.hub[r.full];
    const key = TAGS[r.full];
    if(!key && !userKey){
      out.err(`Error response from daemon: pull access denied for ${r.repo}, repository does not exist or may require 'docker login'`);
      return null;
    }
    const img = userKey ? this.imgs[userKey] : this.stockImage(key);
    out.say(`${r.tag}: Pulling from ${r.repo.includes('/') ? r.repo : 'library/' + r.repo}`);
    if(local && local.id === img.id){ out.say(`Digest: sha256:${img.id.slice(0, 64)}\nStatus: Image is up to date for ${r.full}`); return img; }
    const have = new Set(Object.values(this.imgs).filter(i => this.refs.some(x => x.id === i.id)).flatMap(i => i.layers.map(l => l.id)));
    for(const l of img.layers) out.say(`${l.id.slice(0, 12)}: ${have.has(l.id) ? 'Already exists' : 'Pull complete'}`, have.has(l.id) ? 'dim' : '');
    out.say(`Digest: sha256:${hash('digest' + img.id).slice(0, 64)}\nStatus: Downloaded newer image for ${r.full}`);

  /* ---------- container file system ---------- */
  resolveMount(c, path){
    const m = [...c.mounts].sort((a, b) => b.dst.length - a.dst.length).find(m => path === m.dst || path.startsWith(m.dst.replace(/\/$/, '') + '/'));
    if(!m) return null;
    const rel = path.slice(m.dst.replace(/\/$/, '').length).replace(/^\//, '');

  }
  readFile(c, path){
    const mt = this.resolveMount(c, path);
    if(mt){
      if(mt.m.type === 'volume') return this.volumes[mt.m.src].data[mt.rel];
      const hostPath = (mt.m.src.replace(/^\.\/?/, '').replace(/\/$/, '') + '/' + mt.rel).replace(/^\//, '');
      return this.files[mt.rel === '' ? mt.m.src : hostPath];
    }
    if(path in c.rw) return c.rw[path] === null ? undefined : c.rw[path];

  }
  writeFile(c, path, content){
    const mt = this.resolveMount(c, path);
    if(mt){
      if(mt.m.ro) return 'Read-only file system';
      if(mt.m.type === 'volume'){ this.volumes[mt.m.src].data[mt.rel] = content; this.touch('vol:' + mt.m.src); return null; }
      this.files[(mt.m.src.replace(/^\.\/?/, '').replace(/\/$/, '') + '/' + mt.rel).replace(/^\//, '')] = content; this.touch('files'); return null;

  }
  listDir(c, dir){
    dir = dir.replace(/\/$/, '') || '';
    const names = new Set();
    const add = p => { if(p.startsWith(dir + '/')){ const rest = p.slice(dir.length + 1); if(rest) names.add(rest.split('/')[0] + (rest.includes('/') ? '/' : '')); } };
    for(const p of Object.keys(this.imgs[c.image].fs)) if(!(p in c.rw && c.rw[p] === null)) add(p);
    for(const [p, v] of Object.entries(c.rw)) if(v !== null) add(p);
    for(const m of c.mounts){
      const base = m.dst.replace(/\/$/, '');
      if(base === dir || base.startsWith(dir + '/')) add(base + '/x');

  abs(c, p){ if(!p) return c.workdir; if(p.startsWith('/')) return p; return (c.cwd || c.workdir).replace(/\/$/, '') + '/' + p.replace(/^\.\//, ''); }

  /* ---------- networking ---------- */
  ip(c, net){ return c.ips[net] || null; }
  resolveName(from, name){
    if(['localhost', '127.0.0.1', '0.0.0.0'].includes(name)) return from ? [from] : 'host';
    if(!from) return [];
    const nets = Object.keys(from.ips).filter(n => this.networks[n] && this.networks[n].dns);
    const hits = this.containers.filter(c => c.status === 'running' && c !== from && Object.keys(c.ips).some(n => nets.includes(n) && (c.name === name || (c.aliases || []).includes(name) || c.id.startsWith(name))));

  pickRR(name, list){ const k = name; this.rr[k] = ((this.rr[k] ?? -1) + 1) % list.length; return list[this.rr[k]]; }

  serve(c, port, path, from){

      case 'GET': out = db[k] === undefined ? '(nil)' : `"${db[k]}"`; break;
      case 'SET': db[k] = v; out = 'OK'; break;
      case 'DEL': out = db[k] === undefined ? 0 : 1; delete db[k]; break;
      case 'KEYS': out = Object.keys(db).map((x, i) => `${i + 1}) "${x}"`).join('\n') || '(empty array)'; break;
      default: return `(error) ERR unknown command '${cmd}'`;
    }

  /* ---------- what program a container runs ---------- */
  argvOf(c){ return [...(c.entrypoint || []), ...(c.cmd || [])]; }
  proc(c){
    let argv = this.argvOf(c);

    // entrypoint scripts that end with exec "$@"
    const script = argv[0] && this.readFile(c, this.abs(c, argv[0].replace(/^\.\//, '')));
    if(script && /exec\s+"\$@"/.test(script)) argv = argv.slice(1);
    if(argv[0] === 'docker-entrypoint.sh') argv = argv.slice(1);

    const img = this.imgs[c.image];
    if(bin === 'hello') return {kind: 'hello'};
    if(bin === 'nginx') return {kind: 'nginx', server: {port: 80}};
    if(bin === 'redis-server') return {kind: 'redis', server: {port: 6379}};
    if(bin === 'postgres') return {kind: 'postgres', server: {port: 5432}};
    if(/^python3?$/.test(bin) && argv[1]){
      const src = this.readFile(c, this.abs(c, argv[1]));
      if(src === undefined) return {kind: 'missing', argv, file: argv[1]};
      const app = analyzePy(src);
      const vars = this.pyVars(c, app);
      const port = app.server ? (app.server.port.lit || +vars[app.server.port.var] || 5000) : null;
      return {kind: 'python', app, file: argv[1], server: port ? {port} : null};
    }
    if(/^python3?$/.test(bin)) return {kind: 'repl'};
    if(bin === 'sleep') return {kind: 'sleep', argv};
    if(['sh', 'bash', 'ash'].includes(bin) && argv.length === 1) return {kind: 'shell'};

  /* start the main process; returns lines printed for attached runs */
  start(c, out, attached, interactive){

    c.health = c.healthcheck ? 'starting' : null; c.healthFails = 0; c.healthAt = this.clock;

    const crash = (lines, code) => { lines.forEach(l => print(l)); this.exit(c, code, out); };
    // an ENTRYPOINT script ("do setup, then exec "$@"") prints its echo lines first

      for(const m of script.matchAll(/^\s*echo\s+["']?(.*?)["']?\s*$/gm)) print(m[1].replace(/\$\{?(\w+)\}?/g, (x, k) => c.env[k] ?? ''));

      case 'hello':
        ['', 'Hello from Docker!', 'This message shows that your installation appears to be working correctly.', '', 'To generate this message, Docker took the following steps:', ' 1. The Docker client contacted the Docker daemon.', ' 2. The Docker daemon pulled the "hello-world" image from the Docker Hub.', ' 3. The Docker daemon created a new container from that image which runs the', '    executable that produces the output you are currently reading.', ' 4. The Docker daemon streamed that output to the Docker client, which sent it', '    to your terminal.'].forEach(print);
        this.exit(c, 0, out); return;
      case 'nginx':
        print('/docker-entrypoint.sh: Configuration complete; ready for start up');
        print('2024/10/05 09:00:00 [notice] 1#1: nginx/1.27.2 started'); return;
      case 'redis':
        print('1:M * Server initialized'); print('1:M * Ready to accept connections tcp'); return;
      case 'postgres':
        if(!c.env.POSTGRES_PASSWORD && c.env.POSTGRES_HOST_AUTH_METHOD !== 'trust')
