<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>JS Lab — BergerOverflow</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/lib/codemirror.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/theme/dracula.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/addon/dialog/dialog.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/addon/hint/show-hint.min.css">

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/lib/codemirror.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/mode/javascript/javascript.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/addon/edit/closebrackets.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/addon/edit/matchbrackets.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/addon/selection/active-line.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/addon/comment/comment.min.js"></script>

<style>
:root{
  --bg-0:#06060c;
  --bg-1:#0c0c18;
  --bg-2:#15152a;
  --surface:rgba(255,255,255,0.04);
  --surface-2:rgba(255,255,255,0.07);
  --border:rgba(255,255,255,0.09);
  --border-strong:rgba(255,255,255,0.18);
  --text:#e8e8f3;
  --text-dim:#9a9ab0;
  --text-faint:#666680;
  --accent:#7c5cff;
  --accent-2:#35d0ff;
  --accent-3:#ff6ec7;
  --js-yellow:#f7df1e;
  --success:#38d39f;
  --warn:#ffb547;
  --error:#ff5a7a;
  --radius:18px;
  --radius-sm:12px;
  --shadow-lg: 0 30px 80px -30px rgba(124,92,255,0.35), 0 10px 30px -15px rgba(0,0,0,0.6);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg-0);color:var(--text);font-family:'Inter',system-ui,sans-serif;height:100%;overflow:hidden}
code,pre,textarea,.mono,.CodeMirror{font-family:'JetBrains Mono',ui-monospace,monospace}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}

/* 3D Three.js canvas — background layer */
#bg-3d{
  position:fixed; inset:0; z-index:-2;
  display:block;
  background:
    radial-gradient(1200px 700px at 8% -10%, rgba(124,92,255,0.30), transparent 60%),
    radial-gradient(1000px 600px at 110% 0%,  rgba(53,208,255,0.22), transparent 60%),
    radial-gradient(900px 600px at 50% 130%,  rgba(255,110,199,0.18), transparent 60%),
    linear-gradient(180deg, #050510 0%, #08081a 50%, #050510 100%);
}
/* tiny stars overlay */
body::after{
  content:""; position:fixed; inset:0; z-index:-1; pointer-events:none; opacity:.32;
  background-image:
    radial-gradient(1px 1px at 20% 30%, #ffffff 100%, transparent),
    radial-gradient(1px 1px at 70% 60%, #ffffff 100%, transparent),
    radial-gradient(1.5px 1.5px at 40% 80%, #ffffff 100%, transparent),
    radial-gradient(1px 1px at 85% 20%, #ffffff 100%, transparent),
    radial-gradient(1px 1px at 15% 65%, #ffffff 100%, transparent);
  background-size: 1200px 800px;
  mask-image:linear-gradient(180deg,transparent,#000 20%,#000 80%,transparent);
}

/* Layout */
.app{
  display:grid; grid-template-columns: 300px 1fr; height:100vh;
}
@media (max-width: 980px){
  .app{ grid-template-columns: 1fr; height:auto; min-height:100vh; overflow:auto }
  html,body{ overflow:auto; height:auto }
}

/* Sidebar */
.sidebar{
  padding:22px 16px; position:relative; z-index:5;
  background:linear-gradient(180deg, rgba(12,12,24,0.85), rgba(8,8,18,0.85));
  backdrop-filter: blur(22px) saturate(140%);
  -webkit-backdrop-filter: blur(22px) saturate(140%);
  border-right:1px solid var(--border);
  overflow-y:auto;
  scrollbar-width:thin;
}
.sidebar::-webkit-scrollbar{width:6px}
.sidebar::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.08);border-radius:6px}

.brand{
  display:flex;align-items:center;gap:12px;margin-bottom:18px;
  padding:6px 4px;border-radius:14px;user-select:none;
}
.brand-cube{
  width:46px;height:46px;border-radius:12px;position:relative;
  background:linear-gradient(135deg,#f7df1e,#f5b800);
  box-shadow:
    0 12px 30px -10px rgba(247,223,30,0.45),
    inset 0 0 0 1px rgba(255,255,255,0.25),
    inset 0 -10px 20px -8px rgba(0,0,0,0.35);
  transform: rotate(-6deg);
  display:flex;align-items:center;justify-content:center;
  font-weight:800;font-size:13px;color:#1a1a2a;letter-spacing:0.5px;
  animation: floatY 5s ease-in-out infinite;
}
.brand-cube::after{
  content:""; position:absolute; inset:auto -6px -6px auto;
  width:100%;height:100%; border-radius:12px;
  background:linear-gradient(135deg, rgba(124,92,255,0.5), rgba(53,208,255,0.5));
  filter:blur(14px); z-index:-1;
}
@keyframes floatY{
  0%,100%{ transform: rotate(-6deg) translateY(0) }
  50%   { transform: rotate(-2deg) translateY(-4px) }
}
.brand h1{margin:0;font-size:17px;font-weight:700;letter-spacing:-0.02em}
.brand .sub{font-size:11px;color:var(--text-faint);letter-spacing:0.14em;text-transform:uppercase}

.search-wrap{ position:relative; margin-bottom:14px }
.search{
  width:100%;padding:10px 14px 10px 34px;border-radius:12px;border:1px solid var(--border);
  background:rgba(255,255,255,0.03);color:var(--text);font-size:13.5px;outline:none;
  transition:border-color .2s, box-shadow .2s;
}
.search:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(124,92,255,0.2)}
.search-wrap::before{
  content:"⌕"; position:absolute; left:11px; top:50%; transform:translateY(-50%);
  color:var(--text-faint); font-size:14px; pointer-events:none;
}

.section-label{
  font-size:11px; letter-spacing:0.16em; text-transform:uppercase; color:var(--text-faint);
  padding:14px 8px 6px;
}

.file-list{ list-style:none; padding:0; margin:0 }
.file-list li{ margin:2px 0 }
.file-btn{
  width:100%;display:flex;align-items:center;gap:10px;
  background:transparent;color:var(--text-dim);
  padding:10px 12px;border-radius:10px;font-size:13.5px;font-weight:500;text-align:left;
  transition: background .15s, color .15s, transform .15s, box-shadow .2s;
  border:1px solid transparent;
}
.file-btn:hover{ background:var(--surface); color:var(--text); transform:translateX(2px) }
.file-btn.active{
  background:linear-gradient(135deg,rgba(124,92,255,0.22),rgba(53,208,255,0.12));
  color:#fff; border-color:rgba(124,92,255,0.32);
  box-shadow: inset 0 0 0 1px rgba(124,92,255,0.18), 0 8px 24px -16px rgba(124,92,255,0.55);
}
.file-btn .ico{
  width:24px; height:24px; flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  border-radius:6px;
  background:linear-gradient(135deg,#f7df1e,#f5b800);
  color:#1a1a2a; font-weight:800; font-size:9.5px; letter-spacing:0.5px;
  box-shadow: inset 0 0 0 1px rgba(255,255,255,0.2);
}
.file-btn .label{ flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap }
.file-btn .lines{
  font-size:10.5px; color:var(--text-faint); padding:1px 6px; border-radius:20px;
  background:rgba(255,255,255,0.04); flex-shrink:0;
}
.file-btn.active .lines{ background:rgba(124,92,255,0.22); color:#dcd5ff }
.file-btn.dirty::before{
  content:""; width:6px; height:6px; border-radius:50%;
  background:var(--accent-2); flex-shrink:0;
  box-shadow: 0 0 8px var(--accent-2);
}

.top-bar .action-btn{ white-space:nowrap; flex-shrink:0 }
.top-bar .file-meta{ flex:1 1 auto }
.top-bar .file-links{ flex-wrap:wrap }
.home-btn{ text-decoration:none; margin-left:6px; align-self:flex-start; margin-top:-4px; margin-right:-6px }
.action-btn:disabled{ opacity:.4; cursor:default; pointer-events:none }

/* Main pane */
.editor-pane{
  position:relative; padding:22px 22px 22px 22px;
  display:grid; grid-template-rows: auto 1fr auto; gap:14px;
  min-width:0; min-height:0; overflow:hidden;
}

/* Top header bar with file info & actions */
.top-bar{
  display:flex;align-items:center;gap:14px;
  padding:14px 18px;
  background: linear-gradient(135deg, rgba(20,20,40,0.7), rgba(12,12,24,0.7));
  border:1px solid var(--border); border-radius: var(--radius);
  backdrop-filter: blur(20px) saturate(150%);
  -webkit-backdrop-filter: blur(20px) saturate(150%);
  box-shadow: var(--shadow-lg);
}
.file-meta{ display:flex; align-items:center; gap:12px; min-width:0 }
.file-icon{
  width:36px;height:36px;border-radius:10px;
  background:linear-gradient(135deg,#f7df1e,#f5b800);
  color:#1a1a2a; font-weight:800; font-size:13px; letter-spacing:0.5px;
  display:flex;align-items:center;justify-content:center;
  box-shadow: 0 6px 18px -8px rgba(247,223,30,0.55), inset 0 0 0 1px rgba(255,255,255,0.25);
  flex-shrink:0;
}
.file-name{ font-size:15px; font-weight:600; letter-spacing:-0.01em }
.file-name .dirty-mark{ color:var(--accent-2); margin-left:6px; opacity:0; transition:opacity .15s }
.file-name.dirty .dirty-mark{ opacity:1 }
.file-sub{ font-size:11.5px; color:var(--text-faint); margin-top:1px; font-family:'JetBrains Mono',monospace }
.spacer{ flex:1 }

.action-btn{
  display:inline-flex;align-items:center;gap:7px;
  padding:8px 14px; border-radius:10px;
  border:1px solid var(--border); background:rgba(255,255,255,0.03);
  color:var(--text-dim); font-size:13px; font-weight:600;
  transition: background .15s, color .15s, border-color .15s, transform .15s;
}
.action-btn:hover{ background:var(--surface-2); color:var(--text); border-color:var(--border-strong) }
.action-btn:active{ transform:translateY(1px) }
.action-btn .k{ font-family:'JetBrains Mono',monospace; font-size:10.5px; opacity:.6; padding:1px 5px; border-radius:5px; background:rgba(255,255,255,0.06) }
.run-btn{
  background:linear-gradient(135deg,#7c5cff,#35d0ff);
  color:#fff; border-color:transparent;
  box-shadow: 0 10px 30px -12px rgba(124,92,255,0.7);
}
.run-btn:hover{ filter:brightness(1.08); transform:translateY(-1px); border-color:transparent }
.stop-btn{
  background:linear-gradient(135deg,#ff5a7a,#ff8c5a);
  color:#fff; border-color:transparent;
  box-shadow: 0 10px 30px -12px rgba(255,90,122,0.65);
}
.stop-btn:hover{ filter:brightness(1.08); transform:translateY(-1px); border-color:transparent }
.stop-btn .k{ background:rgba(255,255,255,0.16) }

/* Editor card with 3D float */
.editor-card{
  position:relative; min-height:0;
  background: linear-gradient(180deg, rgba(20,20,40,0.65), rgba(8,8,18,0.65));
  border:1px solid var(--border); border-radius: var(--radius);
  overflow:hidden;
  backdrop-filter: blur(22px) saturate(150%);
  -webkit-backdrop-filter: blur(22px) saturate(150%);
  box-shadow: var(--shadow-lg);
  transform-style: preserve-3d;
  transition: transform .25s cubic-bezier(.2,.7,.2,1);
}
.editor-card::before{
  content:""; position:absolute; inset:-1px; border-radius: calc(var(--radius) + 1px); pointer-events:none;
  background: linear-gradient(135deg, rgba(124,92,255,0.45), rgba(53,208,255,0.0) 40%, rgba(255,110,199,0.35));
  -webkit-mask:
    linear-gradient(#000 0 0) content-box,
    linear-gradient(#000 0 0);
  mask:
    linear-gradient(#000 0 0) content-box,
    linear-gradient(#000 0 0);
  -webkit-mask-composite: xor; mask-composite: exclude;
  padding:1px;
  opacity:.55;
}
.editor-chrome{
  display:flex; align-items:center; gap:10px; padding:9px 14px;
  border-bottom:1px solid var(--border);
  background: linear-gradient(180deg, rgba(255,255,255,0.025), transparent);
}
.dot{ width:11px; height:11px; border-radius:50% }
.dot.r{ background:#ff5a7a; box-shadow:0 0 10px rgba(255,90,122,0.55) }
.dot.y{ background:#ffb547; box-shadow:0 0 10px rgba(255,181,71,0.55) }
.dot.g{ background:#38d39f; box-shadow:0 0 10px rgba(56,211,159,0.55) }
.editor-chrome .filename{
  margin-left:8px; font-family:'JetBrains Mono',monospace; font-size:12px; color:var(--text-dim);
}
.editor-chrome .badge{
  margin-left:auto; font-size:10.5px; letter-spacing:0.14em; text-transform:uppercase;
  color:var(--text-faint); padding:3px 9px; border-radius:20px;
  background:rgba(247,223,30,0.08); border:1px solid rgba(247,223,30,0.18);
  color:#f7df1e;
}

/* Text-size control (A− 16 A+) for the editor and the console */
.fs-ctl{
  display:inline-flex; align-items:center; flex-shrink:0;
  border:1px solid var(--border); border-radius:8px; overflow:hidden;
  background:rgba(255,255,255,0.02);
}
.fs-ctl button{
  padding:4px 8px; border:none; background:transparent; color:var(--text-dim);
  font-size:11.5px; font-weight:600; cursor:pointer;
  transition: background .15s, color .15s;
}
.fs-ctl button:hover{ background:var(--surface-2); color:var(--text) }
.fs-ctl button:disabled{ opacity:.35; pointer-events:none }
.fs-ctl .fs-val{
  min-width:28px; font-family:'JetBrains Mono',monospace; font-weight:500;
  border-left:1px solid var(--border); border-right:1px solid var(--border);
}
.editor-chrome .fs-ctl{ margin-left:8px }

/* Step tabs (per-file numbered runners) */
.step-tabs{
  display:flex; gap:5px; margin: 0 6px 0 12px;
  flex:1; min-width:0; overflow-x:auto;
  scrollbar-width:none;
}
.step-tabs::-webkit-scrollbar{ display:none }
.step-tabs:empty{ display:none }
.step-tab{
  flex-shrink:0;
  padding: 3px 11px; font-size:11px; border-radius:7px;
  border:1px solid var(--border); background:rgba(255,255,255,0.025);
  color:var(--text-dim); font-weight:600;
  font-family:'JetBrains Mono',ui-monospace,monospace;
  transition: background .15s, color .15s, border-color .15s, transform .15s;
}
.step-tab:hover{ background:var(--surface-2); color:var(--text); border-color:var(--border-strong) }
.step-tab.active{
  background:linear-gradient(135deg, rgba(124,92,255,0.32), rgba(53,208,255,0.20));
  color:#fff; border-color:rgba(124,92,255,0.45);
  box-shadow: 0 0 0 1px rgba(124,92,255,0.28), 0 6px 14px -8px rgba(124,92,255,0.55);
}
.step-tab .lbl{ opacity:.85; margin-left:2px; font-weight:500 }

/* Per-file external links (e.g. wikipedia / MDN) */
.file-links{
  display:flex; gap:6px; margin-top:6px; flex-wrap:wrap;
}
.file-links:empty{ display:none }
.file-link{
  display:inline-flex; align-items:center; gap:6px;
  padding: 4px 9px; border-radius: 8px;
  font-size: 11.5px; line-height:1.2;
  border:1px solid rgba(53,208,255,0.28);
  background:linear-gradient(135deg, rgba(53,208,255,0.10), rgba(124,92,255,0.08));
  color:#cfeaff; text-decoration:none;
  transition: background .15s, color .15s, border-color .15s, transform .15s;
}
.file-link:hover{
  background:linear-gradient(135deg, rgba(53,208,255,0.20), rgba(124,92,255,0.16));
  border-color:rgba(53,208,255,0.55);
  color:#fff; transform: translateY(-1px);
}
.file-link .ico{ font-size:12px; opacity:.85 }
.file-link .arrow{ font-size:10px; opacity:.65 }
.file-link .host{ font-size:10px; color:var(--text-faint); font-family:'JetBrains Mono',monospace }
.cm-host{ position:relative; height:calc(100% - 41px) }
.CodeMirror{
  height:100% !important; background:transparent;
  font-size:var(--editor-fs, 16px); line-height:1.55;
  padding: 6px 0;
}
.CodeMirror-gutters{ background:transparent; border-right:1px solid var(--border) }
.CodeMirror-linenumber{ color:rgba(154,154,176,0.4) }
.CodeMirror-cursor{ border-left-color:#fff }
.CodeMirror-activeline-background{ background:rgba(124,92,255,0.05) !important }
.CodeMirror-selected{ background:rgba(124,92,255,0.22) !important }
.CodeMirror-matchingbracket{ color:#35d0ff !important; text-shadow:0 0 8px rgba(53,208,255,0.6) }

/* Console card */
.console-card{
  height: 220px;
  background: linear-gradient(180deg, rgba(8,8,18,0.78), rgba(6,6,14,0.78));
  border:1px solid var(--border); border-radius: var(--radius);
  display:flex; flex-direction:column; min-height:0;
  backdrop-filter: blur(22px) saturate(150%);
  -webkit-backdrop-filter: blur(22px) saturate(150%);
  box-shadow: var(--shadow-lg);
  overflow:hidden;
}
.console-head{
  display:flex; align-items:center; gap:10px; padding:10px 14px;
  border-bottom:1px solid var(--border);
}
.console-head .label{
  font-size:11.5px; letter-spacing:0.18em; text-transform:uppercase; color:var(--text-dim);
  display:flex; align-items:center; gap:8px;
}
.console-head .label::before{
  content:""; width:8px; height:8px; border-radius:50%;
  background: var(--success); box-shadow: 0 0 10px rgba(56,211,159,0.7);
}
.console-head .label.running::before{ background: var(--accent-2); box-shadow: 0 0 10px rgba(53,208,255,0.7); animation: pulse 1s ease infinite }
.console-head .label.error::before{ background: var(--error); box-shadow: 0 0 10px rgba(255,90,122,0.7) }
@keyframes pulse{
  0%,100%{ transform: scale(1); opacity:1 }
  50%   { transform: scale(1.4); opacity:.55 }
}
.console-head .stats{
  font-size:11px; color:var(--text-faint); font-family:'JetBrains Mono',monospace;
}
.console-head .right{ margin-left:auto; display:flex; gap:6px }
.console-head .icon-btn{
  padding:5px 10px; border-radius:8px; border:1px solid var(--border);
  background:rgba(255,255,255,0.02); color:var(--text-dim); font-size:11.5px;
  transition: background .15s, color .15s, border-color .15s;
}
.console-head .icon-btn:hover{ background:var(--surface-2); color:var(--text); border-color:var(--border-strong) }
.console-out{
  flex:1; overflow:auto; padding:10px 14px;
  font-family:'JetBrains Mono',monospace; font-size:var(--console-fs, 15px); line-height:1.55;
  scrollbar-width:thin;
}
.console-out::-webkit-scrollbar{ width:8px; height:8px }
.console-out::-webkit-scrollbar-thumb{ background:rgba(255,255,255,0.08); border-radius:8px }
.console-out .empty{
  color:var(--text-faint); text-align:center; padding:34px 0; font-style:italic; font-family:'Inter',sans-serif;
}
.line{
  padding:3px 8px; margin:1px 0; border-radius:6px;
  display:flex; gap:10px; align-items:flex-start;
  border-left:2px solid transparent;
  white-space:pre-wrap; word-break:break-word;
}
.line .t{ flex-shrink:0; color:var(--text-faint); font-size:.8em; padding-top:.2em; min-width:5.8em }
.line .c{ flex:1; min-width:0 }
.line.log{ color:#dcd5ff; border-left-color:rgba(124,92,255,0.4) }
.line.info{ color:#9bd9ff; border-left-color:rgba(53,208,255,0.5) }
.line.warn{ color:#ffe0a3; border-left-color:rgba(255,181,71,0.6); background:rgba(255,181,71,0.04) }
.line.error{ color:#ffb1bf; border-left-color:rgba(255,90,122,0.7); background:rgba(255,90,122,0.06) }
.line.system{ color:var(--text-faint); border-left-color:rgba(255,255,255,0.15); font-style:italic }
.line.result{ color:#a8f5d2; border-left-color:rgba(56,211,159,0.55) }
.console-out table{
  border-collapse:collapse; margin:4px 0; font-size:.93em;
}
.console-out th, .console-out td{
  border:1px solid rgba(255,255,255,0.1); padding:3px 8px; text-align:left;
}
.console-out th{ background:rgba(124,92,255,0.12); color:#fff }

/* Floating ambient glow shape */
.ambient{
  position:absolute; border-radius:50%; pointer-events:none; z-index:0;
  filter: blur(60px); opacity:.5;
}
.ambient.a{ width:340px;height:340px; background:rgba(124,92,255,0.35); top:-80px; right:-100px; animation:floatA 14s ease-in-out infinite }
.ambient.b{ width:280px;height:280px; background:rgba(53,208,255,0.28); bottom:-60px; left:8%; animation:floatB 18s ease-in-out infinite }
@keyframes floatA{ 0%,100%{transform:translate(0,0)} 50%{transform:translate(-30px,20px)} }
@keyframes floatB{ 0%,100%{transform:translate(0,0)} 50%{transform:translate(40px,-20px)} }

/* Media modal — embeds external videos in-page */
.media-modal{
  position: fixed; inset: 0; z-index: 200; display: none;
  align-items: center; justify-content: center;
  padding: 24px;
  background: rgba(4,4,12,0.78);
  -webkit-backdrop-filter: blur(14px);
  backdrop-filter: blur(14px);
  animation: mmFade .18s ease both;
}
.media-modal.open{ display: flex }
@keyframes mmFade{ from{opacity:0} to{opacity:1} }
.media-panel{
  width: min(960px, 100%);
  max-height: 92vh;
  display: flex; flex-direction: column;
  background: linear-gradient(180deg, rgba(20,20,40,0.9), rgba(8,8,18,0.9));
  border: 1px solid var(--border-strong);
  border-radius: 18px;
  box-shadow: var(--shadow-lg);
  overflow: hidden;
  position: relative;
}
.media-panel::before{
  content:""; position: absolute; inset: -1px; border-radius: 19px; pointer-events: none;
  background: linear-gradient(135deg, rgba(124,92,255,0.45), rgba(53,208,255,0) 40%, rgba(255,110,199,0.4));
  -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
  mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
  -webkit-mask-composite: xor; mask-composite: exclude; padding: 1px;
  opacity: .55;
}
.media-head{
  display: flex; align-items: center; gap: 12px; padding: 14px 18px;
  border-bottom: 1px solid var(--border);
}
.media-head h3{ margin: 0; font-size: 15px; font-weight: 600; letter-spacing: -0.01em; flex: 1; min-width: 0;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
.media-host{ font-size: 11px; color: var(--text-faint); font-family: 'JetBrains Mono', monospace }
.media-close{
  width: 30px; height: 30px; flex-shrink: 0;
  border-radius: 50%; border: 1px solid var(--border);
  background: rgba(255,255,255,0.04); color: var(--text-dim);
  font-size: 17px; line-height: 1;
  display: flex; align-items: center; justify-content: center;
  transition: background .15s, color .15s, border-color .15s;
}
.media-close:hover{ background: rgba(255,90,122,0.14); color: #fff; border-color: rgba(255,90,122,0.4) }
.media-body{
  flex: 1; min-height: 0; padding: 14px 18px;
  display: flex; align-items: center; justify-content: center;
  background: #000;
}
.media-body video{
  max-width: 100%; max-height: 70vh;
  display: block; border-radius: 10px;
  background: #000;
}
.media-foot{
  padding: 10px 18px; border-top: 1px solid var(--border);
  font-size: 12px; color: var(--text-faint);
  display: flex; align-items: center; gap: 10px;
}
.media-foot a{ color: var(--accent-2); text-decoration: none }
.media-foot a:hover{ text-decoration: underline }
.media-loading{ color: var(--text-dim); font-size: 13px; padding: 60px 0 }

/* HTML-content mode for the modal — used for install guides etc. */
.media-body.html-mode{
  background: linear-gradient(180deg, rgba(20,20,35,0.95), rgba(10,10,22,0.95));
  display: block; align-items: stretch; justify-content: stretch;
  padding: 20px 26px 24px;
  overflow: auto;
  font-family: 'Inter', system-ui, sans-serif;
  color: var(--text); line-height: 1.65; text-align: left;
}
.media-body.html-mode h4{
  margin: 18px 0 8px; font-size: 14px; font-weight: 700; color: #fff; letter-spacing: -0.005em;
}
.media-body.html-mode h4:first-child{ margin-top: 0 }
.media-body.html-mode p{ margin: 8px 0; font-size: 14px; color: var(--text) }
.media-body.html-mode ul{ margin: 8px 0; padding-left: 22px }
.media-body.html-mode li{ margin: 4px 0; font-size: 14px }
.media-body.html-mode a{
  color: var(--accent-2); text-decoration: none;
  border-bottom: 1px dashed rgba(53,208,255,0.4);
  transition: color .15s, border-color .15s;
}
.media-body.html-mode a:hover{ color: #fff; border-bottom-color: rgba(53,208,255,0.85) }
.media-body.html-mode code{
  background: rgba(124,92,255,0.14);
  border: 1px solid rgba(124,92,255,0.28);
  color: #d4cbff; padding: 1px 6px; border-radius: 5px;
  font-size: 12.5px; font-family: 'JetBrains Mono', monospace;
}
.media-body.html-mode pre{
  background: rgba(6,6,14,0.85);
  border: 1px solid var(--border); border-radius: 10px;
  padding: 14px 16px; overflow-x: auto; margin: 12px 0;
}
.media-body.html-mode pre code{
  background: none; border: 0; padding: 0;
  color: #cfeaff; font-size: 12.5px; line-height: 1.55;
}
.media-body.html-mode kbd{
  display: inline-block; padding: 2px 8px; margin: 0 2px;
  font-family: 'JetBrains Mono', monospace; font-size: 11px; line-height: 1.35;
  color: #f0e8ff;
  background: rgba(124,92,255,0.18);
  border: 1px solid rgba(124,92,255,0.42);
  border-bottom-width: 2px; border-radius: 5px;
}
.media-body.html-mode small,
.media-body.html-mode .note{ color: var(--text-faint); font-size: 12px; font-style: italic }
.media-body.html-mode .arrow-note{ color: var(--text-dim); font-size: 12px; margin-top: 6px }
.media-body.html-mode .step-pill{
  display: inline-block; min-width: 20px; height: 20px; padding: 0 6px;
  border-radius: 999px; background: rgba(53,208,255,0.16);
  border: 1px solid rgba(53,208,255,0.4); color: #a4e2ff;
  font-size: 11px; font-weight: 700; text-align: center; line-height: 18px;
  margin-right: 8px; font-family: 'JetBrains Mono', monospace;
}

/* Toast / status */
.toast{
  position:fixed; bottom:22px; right:22px; z-index:50;
  padding:10px 14px; border-radius:12px; font-size:13px;
  background:linear-gradient(135deg,#7c5cff,#35d0ff); color:#fff;
  box-shadow: 0 18px 40px -18px rgba(124,92,255,0.7);
  transform: translateY(20px); opacity:0;
  transition: transform .25s ease, opacity .25s ease;
}
.toast.show{ transform: translateY(0); opacity:1 }
.toast.error{ background:linear-gradient(135deg,#ff5a7a,#ff8c5a) }

<script type="text/plain" data-jsfile="let_vs_var.js">// let vs. var
// let defines a BLOCK scoped variable    — lives inside the nearest { }
// var defines a FUNCTION scoped variable — ignores { } blocks, only functions stop it
//
// lines that would throw an ERROR are left commented out ( // // ... )
// so every step runs — uncomment one to see the error yourself.

// 1) let — using it before the declaration is an ERROR
// // let IS hoisted, but stays in the "temporal dead zone" (TDZ)
// // until the line `let x = ...` actually runs
// // console.log(x); // ERROR: Cannot access 'x' before initialization
// let x = 5;
// console.log(x); // 5

// 2) var — using it before the declaration is just undefined
// // var is hoisted AND initialized to undefined — no error, which hides bugs
// console.log(y); // undefined
// var y = 5;
// console.log(y); // 5
// y = "3";        // var (and let) can change value and even type
// console.log(y); // "3"

// 3) let in a for loop — i exists only inside the loop
// for (let i = 0; i < 3; i++) {
//     console.log(`i = ${i}`);
// }
// // console.log(`after loop i = ${i}`); // ERROR: i is not defined

// 4) var in a for loop — i leaks out of the loop
// for (var i = 0; i < 3; i++) {
//     console.log(`i = ${i}`);
// }
// console.log(`after loop i = ${i}`); // no error — i is 3

// 5) let inside a function — invisible outside it
// function useLet() {
//     let a = 3;
//     console.log("inside useLet:", a);
// }
// useLet();
// // console.log(a); // ERROR: a is not defined

// 6) var inside a function — ALSO invisible outside it
// // var is function scoped, so a function stops it just like let
// function useVar() {
//     var b = 3;
//     console.log("inside useVar:", b);
// }
// useVar();
// // console.log(b); // ERROR: b is not defined (again!)

// 7) let in a block — the inner x is a NEW variable
// let x = 7;
// { // opening a block
//     let x = 11;        // shadows the outer x, only inside these { }
//     console.log(x);    // 11
// }
// console.log(x);        // 7 — the outer x was never touched

// 8) var in a block — there is only ONE x
// // a block { } is NOT a function, so var ignores it
// var x = 7;
// { // opening a block
//     var x = 11;        // same x as outside — overwrites it
//     console.log(x);    // 11
// }
// console.log(x);        // 11 — changed outside too!

// 9) no keyword at all — NOT let, it creates a GLOBAL
// // console.log(z); // ERROR: z is not defined — reading before any assignment
// z = 5;                 // no let / var / const -> becomes window.z (global)
// console.log(z);        // 5
// z = 7;
// console.log(z);        // 7
// // in 'use strict' mode `z = 5` would be an ERROR — always declare your variables

// 10) redeclaring — only var allows it
// // let twice in the same scope is a SyntaxError — the whole script refuses to run:
// // let a = 1;
// // let a = 2;  // ERROR: Identifier 'a' has already been declared
// // mixing let and var is the same error:
// // let b = 1;
// // var b = 2;  // ERROR: Identifier 'b' has already been declared
//
// // const can't be redeclared OR reassigned
// const c = 2;
// console.log(c); // 2
// // c = 3;      // ERROR: Assignment to constant variable.

// 11) var twice — allowed (one more reason to prefer let)
var v = 2;
console.log(v); // 2
var v = 3;      // silently redeclares — no error
console.log(v); // 3
</script>
<script type="text/plain" data-jsfile="count_down.js">/*
Create a JS function that gets a number of seconds, then counts them down.

Example: 
--------
Got seconds = 60  

60
59
58
57
...
0

Time's Up!
 */

function countDown(seconds) {
    const oneSecond = 1000;

    console.log(`Time left ${seconds}`);

    for (let i = 1; i < seconds; i++) {
        setTimeout(updateClock, oneSecond * i, seconds - i);
    }

    setTimeout(() => {
        console.log("Time's Up!");
    }, oneSecond * seconds)
}

function updateClock(timeLeft) {
    console.log(`Time left: ${timeLeft}`);
}

// call the function
countDown(seconds = 5);
console.log(`Some Staff`);
</script>
<script type="text/plain" data-jsfile="current_date.js">/* 
Write a JavaScript program to display the current day and time in the following format:
Today is: Tuesday.
Current time is: 11 PM : 30 : 38
*/


const daylist = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];

function logCurrentDate() {
    // get today's Date object
    const today = new Date();

    // get the day as a number
    const day = today.getDay();

    console.log(`Today is: ${daylist[day]}.`); // formatted string 

    // now for the time in the day

    let hour = today.getHours();
    const minute = today.getMinutes();
    const second = today.getSeconds();

    const prepand = (hour >= 12)? "PM": "AM" // instead of using if else
    
    hour = (hour >= 12)? hour - 12: hour 

    if (hour === 0 && prepand === 'PM') { 
        if (minute === 0 && second === 0) { 
            prepand = ' Noon';
        }

        hour = 12;
    }

  if (hour === 0 && prepand === 'AM') { 
    if (minute === 0 && second === 0) { 
      prepand = ' Midnight';
    } 
    
    hour = 12;
  }

  console.log(`Current Time: ${hour} ${prepand} : ${minute} : ${second}`)
};

// call the function
logCurrentDate()

</script>
<script type="text/plain" data-jsfile="fun_with_arrays.js">/*
1) Write a JS program to find the 
   first occurrence of a number inside a given array. 

2) Write a JS program that counts the number of occurrences of a given item.

3) Write a JS program that returns true if an item is 
   found in a given array and false otherwise.

4) Write a JS program that filters an array by a filter function.

5) Write a JS program that multiplies each element of an array by a given number

6) Write a JS function that returns an array of random numbers with a given length.
*/


// 1)
function findFirstOccurrence(array, item) {
    let index = null;

    for (let i = 0; i < array.length; i++) {
        if (array[i] == item) {
            index = i;
            break;
        }
    } 

    return index;
}


// 2)
function countItemOccurrence(array, item) {
    let counter = 0;

    // we can use forEach for that
    array.forEach(x => {
        if (x == item) {
            counter++;
        }
    })

    return counter
}

// 3) 
function isItemInArray(array, item) {
    // we can use the previous functions:
    // return !(findFirstOccurrence(array, item) === null)
    let found = false;

    for (let i = 0; i < array.length; i++) {
        if (array[i] == item) {
            found = true;
            break; // can't use break inside forEach
        }
    }

    return found
}


// 4) 
function filterArray(array, filterFunction) {
    // this function exsits in JS 
    // return array.filter(filterFunction)

    let filteredArray = new Array(); // it is possible to define an array with '[]' as well

    array.forEach(x => {
        if (filterFunction(x) === true) {
            filteredArray.push(x)
        }
    })

    return filteredArray
}

// 5) 
function multiplyEachElement(array, multiplier) {
    let newArray = [];

    array.forEach(x => {
        newArray.push(x * multiplier);
    })

    return newArray;
}

// 6) 
function getRandomArray(arrayLength, low, high) {
    let randomArray = [];

    for (let i = 0; i < arrayLength; i++) {
        const randomNumber = (Math.random() * (high - low)) + low;

        randomArray.push(randomNumber);
    }

    return randomArray
}

let array = [1, 2, 3, '3'];

console.log(filterArray([1, 2, 3, '3'], x => x == '3'));

console.log(multiplyEachElement([1, 2, '3', "a"], 5))

console.log(getRandomArray(5, 2, 10));

// console.log(c2.inc()); // 2
// console.log(c2.inc()); // 3
// console.log(c.get());  // 1 — c is unaffected

// 3) the famous `var`-in-loop pitfall
// // var binds at function scope — every callback closes over the *same* i
// for (var i = 0; i < 3; i++) {
//     setTimeout(() => console.log("var i =", i), 0);
// }
// // prints: 3, 3, 3

// // `let` binds per-iteration — each callback closes over its own i
// for (let i = 0; i < 3; i++) {
//     setTimeout(() => console.log("let i =", i), 0);
// }
// // prints: 0, 1, 2


// 4) fibonacci — naive recursion vs. memoization
function fibonacci(n) {
    if (n <= 1) {
        return n;
    } else {
        return fibonacci(n - 1) + fibonacci(n - 2);
    }
}

function fibonacci_dm(n, memo = {}) {
    if (n in memo) {
        return memo[n];
    }
    if (n <= 1) {
        return BigInt(n);
    }
    memo[n] = fibonacci_dm(n - 1, memo) + fibonacci_dm(n - 2, memo);
    return memo[n];
}

// Example usage:
// console.log(fibonacci(300));

// Example usage:
console.log(fibonacci_dm(300));
// console.log(fibonacci_dm(301));

<script type="text/plain" data-jsfile="promises.js">// promises
//
// a Promise is an object that stands for a value that isn't ready yet.
// it starts "pending" and settles exactly ONCE, to either:
//   fulfilled  — resolve(value) was called
//   rejected   — reject(reason) was called, or the executor threw
// once settled it never changes again.

// 1) creating a Promise — the executor runs IMMEDIATELY (synchronously)
// console.log("before");
// const p = new Promise((resolve, reject) => {
//     console.log("executor runs now");
//     setTimeout(() => resolve("ready!"), 200);
// });
// console.log("after — p is still pending");
// p.then(value => console.log("then got:", value));

// 2) settling only happens once — later calls are ignored
// const once = new Promise((resolve, reject) => {
//     resolve("first");
//     resolve("second");          // ignored
//     reject(new Error("nope"));  // ignored too
// });
// once.then(v => console.log(v)); // first

// 3) rejecting — throw inside the executor == reject
// const bad = new Promise(() => {
//     throw new Error("executor blew up");
// });
// bad.catch(err => console.log("caught:", err.message));

// 4) then / catch / finally
// function coinFlip() {
//     return new Promise((resolve, reject) => {
//         setTimeout(() => Math.random() < 0.5
//             ? resolve("heads")
//             : reject(new Error("tails")), 100);
//     });
// }
// coinFlip()
//     .then(v => console.log("won:", v))
//     .catch(e => console.log("lost:", e.message))
//     .finally(() => console.log("finally runs either way"));

// 5) chaining — each .then returns a NEW Promise
// //    return a value  -> next .then gets that value
// //    return a Promise -> the chain WAITS for it
// //    throw           -> skips to the next .catch
// Promise.resolve(2)
//     .then(n => n * 10)                                       // 20
//     .then(n => new Promise(r => setTimeout(() => r(n + 1), 100))) // waits, 21
//     .then(n => { if (n > 20) throw new Error("too big: " + n); return n; })
//     .then(n => console.log("never runs", n))
//     .catch(e => { console.log("caught:", e.message); return 0; })
//     .then(n => console.log("recovered with", n));            // 0

// 6) the classic mistake — forgetting to RETURN inside .then
// Promise.resolve(1)
//     .then(n => { Promise.resolve(n + 1); })   // no return -> undefined
//     .then(n => console.log("forgot return:", n));
// Promise.resolve(1)
//     .then(n => Promise.resolve(n + 1))        // returned -> 2
//     .then(n => console.log("with return:  ", n));

// 7) turning a callback API into a Promise ("promisify")
// function readConfig(name, callback) {           // old node-style API
//     setTimeout(() => name
//         ? callback(null, { name, debug: true })
//         : callback(new Error("no name")), 100);
// }
// function readConfigAsync(name) {
//     return new Promise((resolve, reject) => {
//         readConfig(name, (err, data) => err ? reject(err) : resolve(data));
//     });
// }
// readConfigAsync("app").then(cfg => console.log("config:", cfg));
// readConfigAsync("").catch(e => console.log("error:", e.message));

// 8) the combinators — all / allSettled / race / any
// const wait = (ms, v, fail) => new Promise((res, rej) =>
//     setTimeout(() => fail ? rej(new Error(v)) : res(v), ms));
//
// // all: every one must succeed; fails FAST on the first rejection
// Promise.all([wait(100, "a"), wait(50, "b")])
//     .then(v => console.log("all       :", v));                 // ["a","b"] (input order!)
// Promise.all([wait(100, "a"), wait(50, "x", true)])
//     .catch(e => console.log("all fail  :", e.message));        // x
//
// // allSettled: never rejects — reports every outcome
// Promise.allSettled([wait(100, "a"), wait(50, "x", true)])
//     .then(r => console.log("allSettled:", r.map(x => x.status)));
//
// // race: first to SETTLE wins (success or failure)
// Promise.race([wait(100, "slow"), wait(50, "fast")])
//     .then(v => console.log("race      :", v));                 // fast
//
// // any: first to SUCCEED wins; rejects only if ALL fail
// Promise.any([wait(30, "x", true), wait(80, "ok")])
//     .then(v => console.log("any       :", v));                 // ok


// 9) active demo — a timeout wrapper built from Promise.race
function wait(ms, value) {
    return new Promise(resolve => setTimeout(() => resolve(value), ms));
}

function withTimeout(promise, ms) {
    const timeout = new Promise((_, reject) =>
        setTimeout(() => reject(new Error("timed out after " + ms + "ms")), ms));
    return Promise.race([promise, timeout]);
}

withTimeout(wait(100, "fast response"), 300)
    .then(v => console.log("ok:", v))
    .catch(e => console.log("error:", e.message));

withTimeout(wait(500, "slow response"), 300)
    .then(v => console.log("ok:", v))
    .catch(e => console.log("error:", e.message));

// 7) loops — for...of awaits one by one, .map + Promise.all runs together
// const delay = (ms, v) => new Promise(r => setTimeout(() => r(v), ms));
// const ids = [1, 2, 3];

// async function oneByOne() {

//     console.log("Promise.all got", values);

// // careful: ids.forEach(async id => await ...) does NOT wait — forEach ignores promises

// 8) forgetting await — you get the Promise, not the value
// async function getUser() { return { name: "Ada" }; }

// 9) active demo — a tiny async pipeline with error handling
function delay(ms, value) {
    return new Promise(resolve => setTimeout(() => resolve(value), ms));
}

async function fetchUser(id) {
    if (id <= 0) throw new Error("invalid id: " + id);
    await delay(120); // pretend this is a network call
    return { id, name: "User#" + id };
}

async function main() {
    try {
        // these two run in parallel — total wait ~120ms, not 240ms
        const [u1, u2] = await Promise.all([fetchUser(1), fetchUser(2)]);
        console.log("loaded in parallel:", u1, u2);

        // and a sequential one
        const u3 = await fetchUser(3);
        console.log("then loaded:", u3);

        await fetchUser(-1);

<script type="text/plain" data-jsfile="event_loop.js">// the event loop
//
// JS runs on ONE thread with ONE call stack. waiting (timers, network,
// clicks) happens outside JS; when it's done, a callback is queued.
//
//   call stack       — the code running right now
//   microtask queue  — promise callbacks (.then/await), queueMicrotask
//   task queue       — setTimeout, setInterval, events, I/O  ("macrotasks")
//
// the loop, forever:
//   1. run the current task until the call stack is EMPTY
//   2. run ALL microtasks (including ones added while draining)
//   3. (browser) maybe render a frame
//   4. take the NEXT task from the task queue -> back to 1

// 1) sync code always finishes first
// console.log("A");
// setTimeout(() => console.log("C — timer, even with 0ms"), 0);
// console.log("B");
// // A, B, C

// 2) microtasks beat tasks
// setTimeout(() => console.log("3. setTimeout (task)"), 0);
// Promise.resolve().then(() => console.log("2. promise (microtask)"));
// console.log("1. sync");

// 3) the classic quiz — guess the order before you run it
// console.log("1");
// setTimeout(() => console.log("2"), 0);
// Promise.resolve()
//     .then(() => console.log("3"))
//     .then(() => console.log("4"));
// queueMicrotask(() => console.log("5"));
// console.log("6");
// // answer: 1 6 3 5 4 2
// //   sync: 1 6 | microtasks: 3 5, then 4 (queued when 3 finished) | task: 2

// 4) await = "pause here, continue in a microtask"
// async function worker() {
//     console.log("b. worker starts (sync!)");
//     await null;
//     console.log("d. worker resumes (microtask)");
// }
// console.log("a. start");
// worker();
// console.log("c. end of script");

// 5) setTimeout's delay is a MINIMUM, not a promise
// const t0 = performance.now();
// setTimeout(() => {
//     console.log("asked for 0ms, got", (performance.now() - t0).toFixed(0) + "ms");
// }, 0);
// const end = Date.now() + 200;
// while (Date.now() < end) {}   // block the call stack for 200ms
// console.log("busy loop done");

// 6) blocking the thread blocks EVERYTHING — timers, clicks, rendering
// let ticks = 0;
// const id = setInterval(() => console.log("tick", ++ticks), 50);
// setTimeout(() => {
//     console.log("--- blocking for 300ms ---");
//     const end = Date.now() + 300;
//     while (Date.now() < end) {}
//     console.log("--- unblocked ---");
// }, 120);
// setTimeout(() => clearInterval(id), 600);
// // notice: no ticks while blocked, then only ONE catches up (intervals don't pile up)

// 7) chunking long work so the loop can breathe
// function sumInChunks(n, chunk) {
//     return new Promise(resolve => {
//         let i = 0, total = 0, slices = 0;
//         (function step() {
//             const stop = Math.min(i + chunk, n);
//             for (; i < stop; i++) total += i;
//             slices++;
//             if (i < n) setTimeout(step, 0);  // yield to the loop, then continue
//             else resolve({ total, slices });
//         })();
//     });
// }
// setTimeout(() => console.log("a timer squeezed in between chunks"), 0);
// sumInChunks(1_000_000, 250_000).then(r => console.log("sum:", r.total, "in", r.slices, "slices"));

// 8) microtasks can STARVE the loop — they all run before the next task
// let count = 0;
// function again() {
//     if (++count < 100_000) queueMicrotask(again);  // re-queues itself
//     else console.log("microtasks done:", count);
// }
// setTimeout(() => console.log("timer finally runs"), 0);
// queueMicrotask(again);
// // the 0ms timer waits for all 100k microtasks (an infinite version would freeze the page)


// 9) active demo — label every callback with the queue it came from
const log = (queue, msg) => console.log(queue.padEnd(10), "|", msg);

log("sync", "script start");

setTimeout(() => {
    log("task", "timeout 1");
    Promise.resolve().then(() => log("microtask", "promise inside timeout 1"));
}, 0);

setTimeout(() => log("task", "timeout 2"), 0);

Promise.resolve().then(() => {
    log("microtask", "promise 1");
    setTimeout(() => log("task", "timeout queued by promise 1"), 0);

(async () => {
    log("sync", "async fn body (before await)");
    await null;
    log("microtask", "async fn after await");
})();

log("sync", "script end");

(function init3D(){
  const canvas = document.getElementById('bg-3d');
  if(!window.THREE){ return; }
  const renderer = new THREE.WebGLRenderer({ canvas, alpha:true, antialias:true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.75));
  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(55, 1, 0.1, 100);
  camera.position.z = 7;

  // Group of floating wireframe shapes
  const group = new THREE.Group();
  scene.add(group);

  const palette = [0x7c5cff, 0x35d0ff, 0xff6ec7, 0xf7df1e];

  function addShape(geom, color, scale, position){
    const mat = new THREE.LineBasicMaterial({ color, transparent:true, opacity:0.55 });
    const wire = new THREE.WireframeGeometry(geom);
    const line = new THREE.LineSegments(wire, mat);
    line.scale.setScalar(scale);
    line.position.set(position.x, position.y, position.z);
    line.userData.spinSpeed = {
      x: (Math.random() - 0.5) * 0.004,
      y: (Math.random() - 0.5) * 0.004,
      z: (Math.random() - 0.5) * 0.0025
    };
    line.userData.float = { phase: Math.random()*Math.PI*2, amp: 0.3 + Math.random()*0.4 };
    group.add(line);
    return line;
  }

  addShape(new THREE.IcosahedronGeometry(1, 0), palette[0], 1.6,  { x:-4.5, y:1.6, z:-2 });
  addShape(new THREE.TorusKnotGeometry(0.7, 0.22, 80, 12), palette[1], 1.4, { x: 4.5, y:-1.8, z:-1 });
  addShape(new THREE.OctahedronGeometry(1, 0), palette[2], 1.0,  { x: 3.0, y: 2.2, z:-3 });
  addShape(new THREE.TetrahedronGeometry(1, 0), palette[3], 0.9, { x:-3.2, y:-2.0, z:-2.5 });
  addShape(new THREE.IcosahedronGeometry(1, 0), palette[1], 0.6, { x: 0.2, y: 0.0, z:-4 });
  addShape(new THREE.DodecahedronGeometry(1, 0), palette[0], 0.7,{ x:-1.6, y: 2.6, z:-3.5 });
  addShape(new THREE.OctahedronGeometry(1, 0), palette[3], 0.55, { x: 1.8, y:-2.6, z:-3.5 });

  // Particle field
  const pCount = 220;
  const pGeom = new THREE.BufferGeometry();
  const pPos = new Float32Array(pCount * 3);
  for(let i=0; i<pCount; i++){
    pPos[i*3+0] = (Math.random() - 0.5) * 18;
    pPos[i*3+1] = (Math.random() - 0.5) * 12;
    pPos[i*3+2] = (Math.random() - 0.5) * 10 - 2;
  }
  pGeom.setAttribute('position', new THREE.BufferAttribute(pPos, 3));
  const pMat = new THREE.PointsMaterial({ color:0xffffff, size:0.025, transparent:true, opacity:0.65 });
  const points = new THREE.Points(pGeom, pMat);
  scene.add(points);

  // Mouse parallax
  const target = { x:0, y:0 };
  const current = { x:0, y:0 };
  window.addEventListener('mousemove', (e)=>{
    target.x = (e.clientX / window.innerWidth - 0.5) * 0.6;
    target.y = (e.clientY / window.innerHeight - 0.5) * 0.4;
  });

  function resize(){
    const w = window.innerWidth, h = window.innerHeight;
    renderer.setSize(w, h, false);
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
  }
  resize();
  window.addEventListener('resize', resize);

  let t = 0;
  function tick(){
    t += 0.01;
    current.x += (target.x - current.x) * 0.05;
    current.y += (target.y - current.y) * 0.05;

    group.children.forEach((m)=>{
      m.rotation.x += m.userData.spinSpeed.x;
      m.rotation.y += m.userData.spinSpeed.y;
      m.rotation.z += m.userData.spinSpeed.z;
      m.position.y += Math.sin(t + m.userData.float.phase) * 0.0025 * m.userData.float.amp;
    });
    group.rotation.y = current.x * 0.4;
    group.rotation.x = -current.y * 0.3;
    points.rotation.y += 0.0006;
    points.rotation.x = -current.y * 0.05;

    renderer.render(scene, camera);
    requestAnimationFrame(tick);
  }
  tick();
})();

   File loading & state

const fileListEl = document.getElementById('fileList');

const state = {
  active: null,           // current file name
  originals: {},          // file -> original text from disk
  buffers: {},            // file -> "All" buffer text (preserved per file)
  loaded: {},             // file -> bool
  lineCounts: {},         // file -> line count
  steps: {},              // file -> [{n, title, code}] | null  (parsed step list)
  activeStep: {},         // file -> 0 (All) | step number
  stepEdits: {},          // file -> { stepN: editedCode }       (per-step scratch buffer)
};

/* Parse "// N) title" headings into step snippets. A step is included only if
   its extracted code contains at least one console.* call (otherwise running
   it would produce no visible output). The file gets step tabs only if 2+
   steps qualify. Bodies that are mostly commented-out get their leading "// "
   stripped; bodies that already contain live code are left as-is. */
function parseSteps(source){
  if(!source) return null;
  const lines = source.split('\n');
  const headingRe = /^(\s*)\/\/\s*(\d+)\)\s*(.*)$/;
  const headings = [];
  for(let i=0; i<lines.length; i++){
    const m = lines[i].match(headingRe);
    if(m) headings.push({ n: parseInt(m[2],10), title: m[3].trim(), line: i });
  }
  if(headings.length < 2) return null;

  const result = [];
  for(let h=0; h<headings.length; h++){
    const start = headings[h].line;
    const end = (h+1 < headings.length) ? headings[h+1].line : lines.length;
    const block = lines.slice(start, end);

    // Decide commented-mode vs live-mode by counting body lines (skip heading)
    let commented = 0, live = 0;
    for(let j=1; j<block.length; j++){
      const t = block[j].trim();
      if(!t) continue;
      if(t.startsWith('//')) commented++;
      else live++;
    }
    let code;
    if(commented > live){
      // Strip a single "// " (or "//") from each non-heading line
      code = [block[0]].concat(
        block.slice(1).map(line => line.replace(/^(\s*)\/\/ ?/, '$1'))
      ).join('\n');
    }else{
      code = block.join('\n');
    }

    if(/\bconsole\.(log|info|warn|error|table|dir|trace)\b/.test(code)){
      result.push({ n: headings[h].n, title: headings[h].title, code });
    }
  }
  return result.length >= 2 ? result : null;
}

/* Save whatever's in the editor into the right slot for the active file/step. */
function saveCurrentEditor(){
  const file = state.active;
  if(!file) return;
  const step = state.activeStep[file] || 0;
  const v = editor.getValue();
  if(step === 0){
    state.buffers[file] = v;
    // Editing the canonical "All" view invalidates per-step caches —
    // they should be regenerated from the new buffer next time.
    if(state.stepEdits[file]) delete state.stepEdits[file];
    state.steps[file] = parseSteps(v);
  }else{
    if(!state.stepEdits[file]) state.stepEdits[file] = {};
    state.stepEdits[file][step] = v;
  }
}

/* Set the editor content + chrome labels for the currently-active step. */
function loadEditorForCurrentStep(){
  const file = state.active;
  if(!file) return;
  const step = state.activeStep[file] || 0;
  let content;
  if(step === 0){
    content = state.buffers[file] ?? state.originals[file] ?? '';
    chromeNameEl.textContent = file;
    fileSubEl.textContent = 'javascript/' + file;
  }else{
    const cached = state.stepEdits[file] && state.stepEdits[file][step];
    if(cached != null){
      content = cached;
    }else{
      const steps = parseSteps(state.buffers[file] ?? state.originals[file] ?? '');
      const s = (steps || []).find(x => x.n === step);
      content = s ? s.code : '// step ' + step + ' not found';
    }
    const s = (state.steps[file] || []).find(x => x.n === step);
    chromeNameEl.textContent = file + '  ·  step ' + step;
    fileSubEl.textContent = s ? `step ${step} — ${s.title}` : `step ${step}`;
  }
  editor.setValue(content);
  editor.clearHistory();
}

function switchStep(stepN){
  const file = state.active;
  if(!file) return;
  saveCurrentEditor();
  state.activeStep[file] = stepN;
  loadEditorForCurrentStep();
  renderStepTabs();
  refreshDirty(file);
  editor.focus();
}

function renderStepTabs(){
  const tabsEl = document.getElementById('stepTabs');
  const file = state.active;
  const steps = state.steps[file];
  if(!steps || steps.length < 2){
    tabsEl.innerHTML = '';
    return;
  }
  const cur = state.activeStep[file] || 0;
  const esc = (s) => s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');
  let html = '';
  steps.forEach(s => {
    const tip = `${s.n}) ${s.title || 'Step '+s.n}`;
    html += `<button class="step-tab ${cur===s.n?'active':''}" data-step="${s.n}" title="${esc(tip)}">${s.n}</button>`;
  });
  html += `<button class="step-tab ${cur===0?'active':''}" data-step="0" title="Run the full file">All</button>`;
  tabsEl.innerHTML = html;
  tabsEl.querySelectorAll('.step-tab').forEach(b => {
    b.addEventListener('click', () => switchStep(parseInt(b.dataset.step, 10)));
  });
}

function renderFileLinks(){
  const linksEl = document.getElementById('fileLinks');
  const entry = FILES.find(f => f.file === state.active);
  const links = (entry && entry.links) || [];
  if(!links.length){ linksEl.innerHTML = ''; return; }
  const esc = (s) => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');
  linksEl.innerHTML = links.map((l, i) => {
    let host = '';
    try { host = new URL(l.url).hostname.replace(/^www\./,''); } catch {}
    const isEmbed = !!l.embed;
    const defaultIco = isEmbed
      ? (l.embed.type === 'video' ? '▶' : (l.embed.type === 'html' ? '📥' : '⤢'))
      : '📚';
    const ico = l.icon || defaultIco;
    const arrow = isEmbed ? '⤢' : '↗';
    const tag = isEmbed ? 'button type="button"' : `a href="${esc(l.url || '#')}" target="_blank" rel="noopener noreferrer"`;
    const close = isEmbed ? 'button' : 'a';
    const tip = l.url ? esc(l.url) : esc(l.title);
    return `<${tag} class="file-link" data-link-index="${i}" title="${tip}">`
         + `<span class="ico">${esc(ico)}</span><span>${esc(l.title)}</span>`
         + (host ? `<span class="host">${esc(host)}</span>` : '')
         + `<span class="arrow">${arrow}</span></${close}>`;
  }).join('');
  // Attach click handlers for embed-style links
  linksEl.querySelectorAll('button.file-link').forEach(btn => {
    const idx = parseInt(btn.dataset.linkIndex, 10);
    const link = links[idx];
    if(!link) return;
    btn.addEventListener('click', () => openMediaModal(link));
  });
}

/* ==========================================================
   Media modal — plays cross-origin video (and optional separate
   audio track, e.g. Reddit DASH) inside the lab.
   ========================================================== */
const mediaModalEl = document.getElementById('mediaModal');
const mediaTitleEl = document.getElementById('mediaTitle');
const mediaHostEl  = document.getElementById('mediaHost');
const mediaBodyEl  = document.getElementById('mediaBody');
const mediaSrcLink = document.getElementById('mediaSource');

function openMediaModal(link){
  if(!link || !link.embed) return;
  const e = link.embed;
  const foot = document.getElementById('mediaFoot');
  mediaTitleEl.textContent = link.title || 'Embedded media';
  let host = '';
  try { if(link.url) host = new URL(link.url).hostname.replace(/^www\./,''); } catch {}
  mediaHostEl.textContent = host;
  // Footer is only meaningful when there's an external source URL
  if(link.url){
    foot.style.display = '';
    mediaSrcLink.href = link.url;
    mediaSrcLink.textContent = host || 'source';
    mediaSrcLink.title = link.url;
  }else{
    foot.style.display = 'none';
  }

  mediaBodyEl.classList.remove('html-mode');
  mediaBodyEl.innerHTML = '<div class="media-loading">Loading…</div>';
  mediaModalEl.classList.add('open');

  if(e.type === 'html'){
    mediaBodyEl.classList.add('html-mode');
    mediaBodyEl.innerHTML = e.html || '';
    return;
  }
  if(e.type === 'video'){
    const video = document.createElement('video');
    video.src = e.videoSrc;
    video.controls = true;
    video.playsInline = true;
    video.preload = 'metadata';
    if(e.poster) video.poster = e.poster;
    if(e.width) video.width = e.width;
    if(e.height) video.height = e.height;

    let audio = null;
    if(e.audioSrc){
      // Reddit DASH videos have audio in a separate file; play in sync
      audio = document.createElement('audio');
      audio.src = e.audioSrc;
      audio.preload = 'metadata';
      const sync = () => { try { audio.currentTime = video.currentTime; } catch {} };
      video.addEventListener('play',   () => { sync(); audio.play().catch(()=>{}); });
      video.addEventListener('pause',  () => audio.pause());
      video.addEventListener('seeking',() => sync());
      video.addEventListener('seeked', () => sync());
      video.addEventListener('ratechange', () => { audio.playbackRate = video.playbackRate; });
      video.addEventListener('volumechange', () => { audio.volume = video.volume; audio.muted = video.muted; });
      // Periodically nudge if drift > 0.25s
      setInterval(() => {
        if(audio.paused || video.paused) return;
        const drift = audio.currentTime - video.currentTime;
        if(Math.abs(drift) > 0.25) sync();
      }, 1000);
    }

    mediaBodyEl.innerHTML = '';
    mediaBodyEl.appendChild(video);
    if(audio) mediaBodyEl.appendChild(audio);
  } else if(e.type === 'iframe'){
    mediaBodyEl.innerHTML = '';
    const ifr = document.createElement('iframe');
    ifr.src = e.src;
    ifr.style.cssText = 'border:0;width:100%;height:60vh;border-radius:10px;background:#000';
    if(e.allow) ifr.allow = e.allow;
    mediaBodyEl.appendChild(ifr);
  } else {
    mediaBodyEl.innerHTML = '<div class="media-loading">Unsupported embed type.</div>';
  }
}

function closeMediaModal(){
  mediaModalEl.classList.remove('open');
  // Tear down media to stop playback and free the network stream
  mediaBodyEl.querySelectorAll('video, audio, iframe').forEach(n => {
    if(n.tagName === 'IFRAME'){ n.src = 'about:blank'; }
    else { try { n.pause(); } catch {} n.removeAttribute('src'); n.load && n.load(); }
  });
  mediaBodyEl.classList.remove('html-mode');
  mediaBodyEl.innerHTML = '';
}

document.getElementById('mediaClose').addEventListener('click', closeMediaModal);
mediaModalEl.addEventListener('click', (e) => {
  if(e.target === mediaModalEl) closeMediaModal();
});

function readEmbedded(name){
  const node = document.querySelector(`script[type="text/plain"][data-jsfile="${name}"]`);
  if(!node) return null;
  // Restore "<\/script" → "</script" in case anything was neutralized at embed time
  return node.textContent.replace(/<\\\/script/gi, '</script');
}

async function loadFile(name){
  if(state.loaded[name]) return state.originals[name];
  let text = readEmbedded(name);
  if(text == null){
    // Fall back to fetch when served over http(s) and a file isn't embedded
    try{
      const r = await fetch(name + '?t=' + Date.now());
      if(!r.ok) throw new Error('HTTP ' + r.status);
      text = await r.text();
    }catch(err){
      text = `// Source for ${name} is not embedded in this page and could not be fetched.\n// ${err.message}\n`;
    }
  }
  state.originals[name] = text;
  state.buffers[name] = text;
  state.loaded[name] = true;
  state.lineCounts[name] = text.split('\n').length;
  const btn = document.querySelector(`.file-btn[data-file="${name}"]`);
  if(btn){
    const lines = btn.querySelector('[data-lines]');
    if(lines) lines.textContent = state.lineCounts[name] + 'L';
  }
  return text;
}

/* "◀ Prev" / "Next ▶" — walk FILES in sidebar order; disabled at either end. */
const prevBtnEl = document.getElementById('prevBtn');
const nextBtnEl = document.getElementById('nextBtn');
function neighborFile(delta){
  const i = FILES.findIndex(f => f.file === state.active);
  const j = i + delta;
  return (i >= 0 && j >= 0 && j < FILES.length) ? FILES[j] : null;
}
function updateNextBtn(){
  const pf = neighborFile(-1), nf = neighborFile(1);
  prevBtnEl.disabled = !pf;
  prevBtnEl.title = pf ? 'Previous example: ' + pf.label : 'This is the first example';
  nextBtnEl.disabled = !nf;
  nextBtnEl.title = nf ? 'Next example: ' + nf.label : 'This is the last example';
}
prevBtnEl.addEventListener('click', () => {
  const pf = neighborFile(-1);
  if(pf) activate(pf.file);
});
nextBtnEl.addEventListener('click', () => {
  const nf = neighborFile(1);
  if(nf) activate(nf.file);
});

async function activate(name){
  // Save current view (file + step) into its slot
  if(state.active){
    saveCurrentEditor();
    refreshDirty(state.active);
  }
  state.active = name;
  document.querySelectorAll('.file-btn').forEach(b=>{
    b.classList.toggle('active', b.dataset.file === name);
  });
  updateNextBtn();
  fileNameEl.firstChild.textContent = name;
  if(!state.loaded[name]){
    editor.setValue('// Loading ' + name + '…');
    await loadFile(name);
  }
  // (Re)compute steps from the current "All" buffer
  state.steps[name] = parseSteps(state.buffers[name] ?? state.originals[name] ?? '');
  // First time this file is opened: default to the FIRST step when there are
  // multiple steps; otherwise fall back to All (0).
  if(state.activeStep[name] == null){
    const ss = state.steps[name];
    state.activeStep[name] = (ss && ss.length >= 2) ? ss[0].n : 0;
  }
  // If a previously-active step no longer exists (e.g. headings removed), fall back to the first available step or All
  if(state.activeStep[name] !== 0 && !(state.steps[name] || []).some(s => s.n === state.activeStep[name])){
    const ss = state.steps[name];
    state.activeStep[name] = (ss && ss.length) ? ss[0].n : 0;
  }
  loadEditorForCurrentStep();
  renderStepTabs();
  renderFileLinks();
  refreshDirty(name);
  editor.focus();
}

function refreshDirty(name){
  // "Dirty" = the file's canonical (All) buffer differs from the original.
  // The editor view may be a step extraction — that derivation is not
  // a real edit, so don't read editor.getValue() here.
  const buf = state.buffers[name];
  const dirty = state.loaded[name] && buf != null && buf !== state.originals[name];
  const btn = document.querySelector(`.file-btn[data-file="${name}"]`);
  if(btn) btn.classList.toggle('dirty', dirty);
  if(name === state.active){
    fileNameEl.classList.toggle('dirty', dirty);
  }
}

editor.on('change', ()=>{
  if(!state.active) return;
  const file = state.active;
  const step = state.activeStep[file] || 0;
  const v = editor.getValue();
  if(step === 0){
    state.buffers[file] = v;
    if(state.stepEdits[file]) delete state.stepEdits[file];
    const newSteps = parseSteps(v);
    state.steps[file] = newSteps;
    renderStepTabs();
  }else{
    if(!state.stepEdits[file]) state.stepEdits[file] = {};
    state.stepEdits[file][step] = v;
  }
  refreshDirty(file);
});

document.getElementById('resetBtn').addEventListener('click', ()=>{
  const file = state.active;
  if(!file || state.originals[file] == null) return;
  const step = state.activeStep[file] || 0;
  if(step === 0){
    state.buffers[file] = state.originals[file];
    if(state.stepEdits[file]) delete state.stepEdits[file];
    state.steps[file] = parseSteps(state.originals[file]);
    loadEditorForCurrentStep();
    renderStepTabs();
    toast('Reset ' + file);

    if(state.stepEdits[file]) delete state.stepEdits[file][step];
    loadEditorForCurrentStep();
    toast(`Reset step ${step}`);
  }
  refreshDirty(file);
});

/* Text size for the editor and the console — A− / A+, click the number to reset.
   Stored as CSS vars (--editor-fs / --console-fs) and remembered across reloads. */
const FONT_SIZES = {
  editor:  { def: 16, cssVar: '--editor-fs',  label: 'editor' },
  console: { def: 15, cssVar: '--console-fs', label: 'output' },
};
const FS_MIN = 10, FS_MAX = 32;
document.querySelectorAll('.fs-ctl').forEach(ctl => {
  const key = ctl.dataset.fs, cfg = FONT_SIZES[key];
  const storeKey = 'jsLab.fontSize.' + key;
  ctl.innerHTML = `<button type="button" title="Smaller ${cfg.label} text">A−</button>`
    + `<button type="button" class="fs-val" title="Reset ${cfg.label} text size"></button>`
    + `<button type="button" title="Bigger ${cfg.label} text">A+</button>`;
  const [down, val, up] = ctl.querySelectorAll('button');
  function apply(px, save){
    px = Math.max(FS_MIN, Math.min(FS_MAX, px));
    cfg.px = px;
    document.documentElement.style.setProperty(cfg.cssVar, px + 'px');
    val.textContent = px;
    down.disabled = px <= FS_MIN;
    up.disabled = px >= FS_MAX;
    if(save){ try{ localStorage.setItem(storeKey, String(px)); }catch(_){} }
    if(key === 'editor') editor.refresh();
  }
  down.addEventListener('click', () => apply(cfg.px - 1, true));
  up.addEventListener('click',   () => apply(cfg.px + 1, true));
  val.addEventListener('click',  () => apply(cfg.def, true));
  let saved = NaN;
  try{ saved = parseInt(localStorage.getItem(storeKey), 10); }catch(_){}
  apply(Number.isFinite(saved) ? saved : cfg.def, false);
});

function ts(){
  const now = (performance.now() - runStartTime) / 1000;
  return (now >= 0 && runStartTime > 0) ? '+' + now.toFixed(3) + 's' : '';
}
function appendLine(kind, parts){
  ensureConsoleEmptyCleared();
  const line = document.createElement('div');
  line.className = 'line ' + kind;
  const t = document.createElement('span'); t.className = 't'; t.textContent = ts();
  const c = document.createElement('span'); c.className = 'c';
  c.textContent = parts.map(formatVal).join(' ');
  line.append(t, c);
  consoleOut.appendChild(line);
  consoleOut.scrollTop = consoleOut.scrollHeight;
}
function appendTable(parts){
  ensureConsoleEmptyCleared();
  const data = parts[0];
  if(data == null || typeof data !== 'object'){ appendLine('log', parts); return; }
  const rows = Array.isArray(data) ? data : Object.entries(data).map(([k,v])=>({ '(key)':k, value:v }));
  const cols = new Set();
  rows.forEach(r => {
    if(r && typeof r === 'object') Object.keys(r).forEach(k=>cols.add(k));
    else cols.add('value');
  });
  const colArr = ['(index)', ...cols];
  const tbl = document.createElement('table');
  const thead = document.createElement('thead'); const trH = document.createElement('tr');
  colArr.forEach(c=>{ const th = document.createElement('th'); th.textContent = c; trH.appendChild(th); });
  thead.appendChild(trH); tbl.appendChild(thead);
  const tbody = document.createElement('tbody');
  rows.forEach((r, i)=>{
    const tr = document.createElement('tr');
    colArr.forEach(col=>{
      const td = document.createElement('td');
      let val;
      if(col === '(index)') val = i;
      else if(r && typeof r === 'object') val = r[col];
      else if(col === 'value') val = r;
      td.textContent = val === undefined ? '' : formatVal(val);
      tr.appendChild(td);
    });
    tbody.appendChild(tr);
  });
  tbl.appendChild(tbody);
  const wrap = document.createElement('div'); wrap.className = 'line log';
  const t = document.createElement('span'); t.className = 't'; t.textContent = ts();
  const c = document.createElement('span'); c.className = 'c'; c.appendChild(tbl);
  wrap.append(t, c);
  consoleOut.appendChild(wrap);
  consoleOut.scrollTop = consoleOut.scrollHeight;
}
function formatVal(v){
  if(v === null) return 'null';
  if(v === undefined) return 'undefined';
  if(typeof v === 'string') return v;
  if(typeof v === 'number' || typeof v === 'boolean') return String(v);
  if(typeof v === 'bigint') return v.toString() + 'n';
  if(typeof v === 'function') return v.toString();
  if(typeof v === 'symbol') return v.toString();
  try { return JSON.stringify(v, replacer, 2); }
  catch { return String(v); }
}
function replacer(_, value){
  if(typeof value === 'bigint') return value.toString() + 'n';
  if(typeof value === 'function') return '[Function ' + (value.name || 'anonymous') + ']';
  if(typeof value === 'symbol') return value.toString();
  return value;
}

function bumpStats(kind){
  if(kind === 'log' || kind === 'info') logCount++;
  else if(kind === 'warn') warnCount++;
  else if(kind === 'error') errorCount++;
  consoleStats.textContent = `${logCount} log · ${warnCount} warn · ${errorCount} err`;
}

/* ==========================================================
   Sandbox runner — uses srcdoc iframe so timers + async work,
   and so the runner cannot pollute or break this page.
   ========================================================== */
let sandbox = null;
let sandboxId = 0;

function killSandbox(){
  if(sandbox){ sandbox.remove(); sandbox = null; }
}

/* Run/Stop button state — keeps Stop visible while the iframe is alive
   (so async setTimeout/Promise output can still arrive). Auto-reverts to
   Run after a brief idle window with no incoming messages, or immediately
   if the user clicks Stop. */
let isRunning = false;
let idleTimer = null;
const IDLE_WINDOW_MS = 800;
let pendingTimers = 0;   // setTimeout/setInterval still queued in the sandbox
let syncDone = false;    // top-level user code has finished

function setRunButton(running){
  const btn = document.getElementById('runBtn');
  if(!btn) return;
  if(running){
    btn.classList.remove('run-btn');
    btn.classList.add('stop-btn');
    btn.title = 'Stop running code';
    btn.innerHTML = '■ Stop <span class="k">⌘↵</span>';
  }else{
    btn.classList.remove('stop-btn');
    btn.classList.add('run-btn');
    btn.title = 'Run code';
    btn.innerHTML = '▶ Run <span class="k">⌘↵</span>';
  }
}

function scheduleIdle(){
  if(idleTimer) clearTimeout(idleTimer);
  if(pendingTimers > 0){ idleTimer = null; return; }  // timers still queued — stay alive
  idleTimer = setTimeout(()=>{
    idleTimer = null;
    if(!isRunning || pendingTimers > 0) return;
    killSandbox();
    isRunning = false;
    setRunButton(false);
  }, IDLE_WINDOW_MS);
}

function stopRun(reason){
  if(idleTimer){ clearTimeout(idleTimer); idleTimer = null; }
  const wasRunning = isRunning;
  killSandbox();
  isRunning = false;
  setRunButton(false);
  if(wasRunning){
    consoleStatus.classList.remove('running');
    if(errorCount > 0){ consoleStatus.classList.add('error'); consoleStatus.textContent = 'Failed'; }
    else { consoleStatus.textContent = reason === 'user' ? 'Stopped' : 'Done'; }
    if(reason === 'user') appendLine('system', ['■ Stopped by user']);
  }
}

function buildSandboxSrc(code, runId){
  // serialize the user code as a JSON string so quotes/backticks survive intact
  const codeJson = JSON.stringify(code);
  return `<!DOCTYPE html><html><head><meta charset="utf-8"></head><body><script>
(function(){
  const RUN_ID = ${runId};
  function send(kind, payload){
    try{
      parent.postMessage({ __js_lab__: true, runId: RUN_ID, kind, payload }, '*');
    }catch(_){
      // Last resort if something still can't be structured-cloned
      parent.postMessage({ __js_lab__: true, runId: RUN_ID, kind, payload: payload.map(p => String(p)) }, '*');
    }
  }
  // postMessage can't clone Promises, functions, DOM nodes, ... — turn them
  // into display strings (recursively) so console.log never throws.
  function clean(v, seen, depth){
    const t = typeof v;
    if(v === null || v === undefined || t === 'string' || t === 'number' || t === 'boolean' || t === 'bigint') return v;
    if(t === 'symbol') return v.toString();
    if(t === 'function') return depth === 0 ? v.toString() : '[Function ' + (v.name || 'anonymous') + ']';
    if(v instanceof Promise) return 'Promise { … }';
    if(v instanceof Error){
      return depth === 0 ? { __t:'error', name:v.name, message:v.message, stack:v.stack } : v.name + ': ' + v.message;
    }
    if(v instanceof Date || v instanceof RegExp) return v;
    if(typeof Node !== 'undefined' && v instanceof Node) return '<' + (v.nodeName || 'node').toLowerCase() + '>';
    if(seen.has(v)) return '[Circular]';
    seen.add(v);
    let out;
    if(Array.isArray(v)) out = v.map(x => clean(x, seen, depth + 1));
    else if(v instanceof Map) out = new Map(Array.from(v, ([k, x]) => [clean(k, seen, depth + 1), clean(x, seen, depth + 1)]));
    else if(v instanceof Set) out = new Set(Array.from(v, x => clean(x, seen, depth + 1)));
    else { out = {}; Object.keys(v).forEach(k => { out[k] = clean(v[k], seen, depth + 1); }); }
    seen.delete(v);
    return out;
  }
  function pack(args){
    return Array.from(args).map(a => clean(a, new Set(), 0));
  }
  const origLog = console.log;
  ['log','info','warn','error','debug'].forEach(m=>{
    console[m] = function(){ send(m === 'debug' ? 'log' : m, pack(arguments)); };
  });
  console.table = function(data){ send('table', pack([data])); };
  console.dir = function(o){ send('log', pack([o])); };
  console.trace = function(){ send('log', ['trace']); };
  console.group = function(){ send('log', ['▼ '+Array.from(arguments).join(' ')]); };
  console.groupEnd = function(){};
  console.time = function(l){ console.__t = console.__t||{}; console.__t[l||'default']=performance.now(); };
  console.timeEnd = function(l){
    const k = l||'default';
    const start = (console.__t||{})[k];
    if(start!=null) send('info', [k+': '+(performance.now()-start).toFixed(3)+'ms']);
  };
  // Track pending timers so the host keeps the run alive until they fire
  // (a 1s countdown would otherwise outlive the idle window and get cut).
  const pending = new Set();
  const report = () => send('timers', [pending.size]);
  const origST = window.setTimeout, origCT = window.clearTimeout;
  const origSI = window.setInterval, origCI = window.clearInterval;
  window.setTimeout = function(fn, ms){
    const args = Array.prototype.slice.call(arguments, 2);
    const id = origST(function(){
      try{ typeof fn === 'function' ? fn.apply(this, args) : (0, eval)(String(fn)); }
      finally{ pending.delete(id); report(); }
    }, ms);
    pending.add(id); report();
    return id;
  };
  window.clearTimeout = function(id){ origCT(id); if(pending.delete(id)) report(); };
  window.setInterval = function(){
    const id = origSI.apply(window, arguments);
    pending.add(id); report();
    return id;
  };
  window.clearInterval = function(id){ origCI(id); if(pending.delete(id)) report(); };
  window.addEventListener('error', function(e){
    send('error', [{__t:'error', name:(e.error&&e.error.name)||'Error', message:e.message, stack:(e.error&&e.error.stack)||''}]);
  });
  window.addEventListener('unhandledrejection', function(e){
    const r = e.reason;
    if(r instanceof Error) send('error', [{__t:'error', name:r.name, message:r.message, stack:r.stack}]);
    else send('error', ['Unhandled promise rejection: '+String(r)]);
  });
  // Run user code; wrap in a fresh function so top-level "return" works
  // and so syntax errors are reported as errors.
  const userCode = ${codeJson};
  try{
    (0, eval)(userCode);
    send('done', []);
  }catch(err){
    send('error', [{__t:'error', name:err.name, message:err.message, stack:err.stack}]);
    send('done', []);
  }
})();
<\/script></body></html>`;
}

window.addEventListener('message', (ev)=>{
  const data = ev.data;
  if(!data || !data.__js_lab__) return;
  if(data.runId !== sandboxId) return;
  const { kind, payload } = data;
  if(kind === 'timers'){
    // Pending timer count changed — hold the run open while any remain,
    // start the idle window once they're all gone.
    pendingTimers = payload[0];
    if(syncDone && isRunning) scheduleIdle();
    return;
  }
  if(kind === 'done'){
    // Sync user code finished — start the idle window (unless timers are
    // still pending). Any further async output will reset it.
    syncDone = true;
    consoleStatus.classList.remove('running');
    if(errorCount > 0){ consoleStatus.classList.add('error'); consoleStatus.textContent = 'Failed'; }
    else { consoleStatus.textContent = 'Done'; }
    if(isRunning) scheduleIdle();
    return;
  }
  if(kind === 'table'){ appendTable(payload); }
  else {
    // unwrap structured errors
    const display = payload.map(p => {
      if(p && p.__t === 'error') return `${p.name}: ${p.message}` + (p.stack ? '\n' + indent(p.stack) : '');
      return p;
    });
    appendLine(kind, display);
    bumpStats(kind);
  }
  // Any async output extends the idle window — keep Stop visible
  if(isRunning && idleTimer) scheduleIdle();
});
function indent(s){ return s.split('\n').map(l=>'    '+l).join('\n'); }

function runCode(){
  if(!state.active){ toast('No file selected'); return; }
  const code = editor.getValue();
  // Reset console
  consoleOut.innerHTML = '';
  logCount = warnCount = errorCount = 0;
  consoleStats.textContent = '';
  consoleStatus.classList.remove('error');
  consoleStatus.classList.add('running');
  consoleStatus.textContent = 'Running…';
  const _step = state.activeStep[state.active] || 0;
  appendLine('system', [`▶ Running ${state.active}${_step ? ' — step ' + _step : ''}`]);

  // Tear down any previous run, including its idle timer
  if(idleTimer){ clearTimeout(idleTimer); idleTimer = null; }
  killSandbox();
  pendingTimers = 0;
  syncDone = false;
  sandboxId += 1;
  runStartTime = performance.now();
  const iframe = document.createElement('iframe');
  iframe.sandbox = 'allow-scripts';
  iframe.style.display = 'none';
  iframe.srcdoc = buildSandboxSrc(code, sandboxId);
  document.body.appendChild(iframe);
  sandbox = iframe;
  isRunning = true;
  setRunButton(true);
}

/* ==========================================================
   Toast helper
   ========================================================== */
const toastEl = document.getElementById('toast');
let toastTimer;
function toast(msg, kind){
  toastEl.textContent = msg;
  toastEl.classList.toggle('error', kind === 'error');
  toastEl.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=> toastEl.classList.remove('show'), 1800);
}

/* ==========================================================
   Boot
   ========================================================== */
(async function boot(){
  // Pre-fetch line counts for sidebar in the background
  FILES.forEach(f => loadFile(f.file));
  // Activate first file
  await activate(FILES[0].file);
})();
</script>
