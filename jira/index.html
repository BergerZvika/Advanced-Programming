/* =====================================================================
   UI: board, backlog, issue, workflow, reports, search, console, runner
   ===================================================================== */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c]));
const sleep = ms => new Promise(r => setTimeout(r, ms));
const AV_COLORS = {you: '#4c9aff', ada: '#f9a8d4', ben: '#fcd34d', cleo: '#86efac', dan: '#c4b5fd', automation: '#a78bfa'};
const PRI_ICON = {Highest: '⇈', High: '↑', Medium: '=', Low: '↓', Lowest: '⇊'};
const SERIES = {committed: '#d95926', completed: '#3987e5'};  // validated categorical pair (dark surface)

const av = (u) => u && USERS[u]
  ? `<span class="av" style="background:${AV_COLORS[u]}" title="${esc(USERS[u])}">${USERS[u].split(' ').map(w => w[0]).join('').slice(0, 2)}</span>`
  : u === 'automation' ? `<span class="av" style="background:${AV_COLORS.automation}" title="Automation">⚡</span>`
  : `<span class="av none" title="Unassigned">?</span>`;
const ti = t => `<span class="ti ${t}" title="${t}"></span>`;
const pri = p => `<span class="pri ${p}" title="Priority: ${p}">${PRI_ICON[p]}</span>`;
const lz = (j, i) => `<span class="lz ${j.cat(i)}">${esc(i.status)}</span>`;
const pts = i => i.type === 'Epic' || i.type === 'Sub-task' ? '' : `<span class="pts${i.points === null ? ' none' : ''}" title="Story points">${i.points === null ? '–' : i.points}</span>`;
const epicChip = (j, i) => { const e = i.epic && j.issue(i.epic); return e ? `<span class="epic-chip" title="Epic ${e.key}">${esc(e.summary)}</span>` : ''; };

/* =====================================================================
   Views
   ===================================================================== */
/* views are the project tabs; the issue view is a dialog on top of them */
let lastIssueSnap = {key: null, fields: {}, hist: 0};

function flipCapture(sel){
  const m = new Map();
  document.querySelectorAll(sel).forEach(el => m.set(el.dataset.key, el.getBoundingClientRect()));
  return m;
}
function flipPlay(sel, before, fresh){
  document.querySelectorAll(sel).forEach(el => {
    const old = before.get(el.dataset.key);
    if(!old){ if(fresh) el.classList.add('pop-in'); return; }
    const now = el.getBoundingClientRect();
    const dx = old.left - now.left, dy = old.top - now.top;
    if(!dx && !dy) return;
    el.animate([{transform: `translate(${dx}px,${dy}px)`}, {transform: 'none'}], {duration: 520, easing: 'cubic-bezier(.2,.8,.2,1)'});
  });
}

function renderBoard(j){
  if(!j.project) return `<div class="empty-state">No project yet.<br>Press <b>Create space</b> above, or ▶ Next step.</div>`;
  let head = '';
  const s = j.activeSprint();
  if(j.scrum){
    if(!s) return `<div class="empty-state"><b>No active sprint.</b><br>A Scrum board only shows the running sprint.<br>Plan one in the <b>Backlog</b>: create a sprint, drag work items into it, then start it.</div>`;
    const left = Math.max(0, s.endDay - j.day);
    head = `<div class="board-head"><h4>${esc(s.name)}</h4>${s.goal ? `<span class="goal">🎯 ${esc(s.goal)}</span>` : ''}<span class="days">day ${j.day} · ${left} day${left === 1 ? '' : 's'} left · ${j.remaining(s)} of ${j.sprintPoints(s)} pts remaining</span></div>`;
  } else head = '';
  const cols = j.workflow.statuses.map(st => {
    const items = j.ranked().filter(i => i.status === st.name && j.onBoard(i));
    const lim = j.wip[st.name];
    const over = lim && items.length > lim;
    return `<div class="col${over ? ' over' : ''}" data-status="${esc(st.name)}">
      <div class="col-head"><span class="lz ${st.cat}">${esc(st.name)}</span><span class="n">${items.length}</span>${lim ? `<span class="wip" title="WIP limit">${items.length}/${lim}</span>` : ''}</div>
      <div class="col-body">${items.map(i => card(j, i)).join('')}</div></div>`;
  }).join('');
  return head + `<div class="board">${cols}</div>`;
}
function card(j, i){
  const cls = ['card'];
  if(i.flagged) cls.push('flagged');
  if(j.cat(i) === 'done') cls.push('done');
  if(j.changed.has(i.key)) cls.push('hl');
  if(j.blockers(i).length) cls.push('blocked');
  const subs = j.subtasks(i.key);
  const chips = [epicChip(j, i), ...i.labels.map(l => `<span class="label-chip">${esc(l)}</span>`), i.parent && i.type === 'Sub-task' ? `<span class="label-chip">↳ ${i.parent}</span>` : ''].filter(Boolean).join('');
  return `<div class="${cls.join(' ')}" draggable="true" data-key="${i.key}">
    <div class="sum">${esc(i.summary)}</div>
    ${chips ? `<div class="chips">${chips}</div>` : ''}
    <div class="meta">${ti(i.type)}<span class="key">${i.key}</span>${subs.length ? `<span title="sub-tasks done">☑ ${subs.filter(x => j.cat(x) === 'done').length}/${subs.length}</span>` : ''}<span class="grow"></span>${pri(i.priority)}${pts(i)}${av(i.assignee)}</div>
  </div>`;
}

function renderBacklog(j){
  if(!j.project) return `<div class="empty-state">No project yet.</div>`;
  const epics = j.ranked().filter(i => i.type === 'Epic');
  const epicHtml = epics.length ? epics.map(e => {
    const ch = j.children(e.key).filter(c => c.type !== 'Sub-task');
    const done = ch.filter(c => j.cat(c) === 'done').length;
    const pct = ch.length ? Math.round(100 * done / ch.length) : 0;
    return `<div class="epic-card" data-open="${e.key}"><div class="k">${e.key}</div>${esc(e.summary)}<div class="bar"><i style="width:${pct}%"></i></div><div class="pct">${done}/${ch.length} done · ${pct}%</div></div>`;
  }).join('') : `<div class="rows"><div class="none">No epics yet</div></div>`;
  const rows = list => list.length ? list.map(i => {
    const cls = ['row'];
    if(j.changed.has(i.key)) cls.push('hl');
    if(j.cat(i) === 'done') cls.push('done');
    if(i.flagged) cls.push('flagged');
    return `<div class="${cls.join(' ')}" draggable="${j.scrum}" data-key="${i.key}" title="${esc(i.summary)}">${ti(i.type)}<span class="key">${i.key}</span><span class="sum">${esc(i.summary)}</span>${epicChip(j, i) || '<span></span>'}${lz(j, i)}${pts(i) || '<span></span>'}${av(i.assignee)}</div>`;
  }).join('') : `<div class="none">Empty: drag issues here</div>`;
  const items = j.ranked().filter(i => i.type !== 'Epic' && i.type !== 'Sub-task');
  let main = '';
  if(j.scrum){
    for(const s of j.sprints.filter(s => s.state !== 'closed')){
      const list = items.filter(i => i.sprint === s.id);
      main += `<div class="sprint-box ${s.state}" data-sprint="${esc(s.name)}"><div class="sb-head"><b>${esc(s.name)}</b><span class="state ${s.state}">${s.state === 'active' ? 'active' : 'planned'}</span>${s.goal ? `<span class="goal">🎯 ${esc(s.goal)}</span>` : ''}<span class="tot">${list.length} issues · ${j.sprintPoints(s)} pts${s.state === 'active' ? ` · ends day ${s.endDay}` : ''}</span>${s.state === 'active' ? '<button class="jw-btn" data-cmd="sprint complete">Complete sprint</button>' : !j.activeSprint() && s === j.sprints.find(x => x.state === 'future') ? `<button class="jw-btn primary" data-cmd="sprint start ${q(s.name)}">Start sprint</button>` : ''}</div><div class="rows">${rows(list)}</div></div>`;
    }
    const back = items.filter(i => i.sprint === null);
    main += `<div class="sprint-box" data-sprint=""><div class="sb-head"><b>Backlog</b><span class="tot">${back.length} issues · ${back.reduce((a, i) => a + (i.points || 0), 0)} pts</span><button class="jw-btn" data-cmd="sprint create ${q(j.project.key + ' Sprint ' + (j.sprints.length + 1))}">Create sprint</button></div><div class="rows">${rows(back)}</div></div>`;
  } else {
    main = `<div class="sprint-box"><div class="sb-head"><b>All issues</b><span class="goal">ranked · Kanban has no sprints</span><span class="tot">${items.length} issues</span></div><div class="rows">${rows(items)}</div></div>`;
  }
  return `<div class="bl"><div class="epics"><h5>Epics</h5>${epicHtml}</div><div class="bl-main">${main}</div></div>`;
}

function renderWorkflow(j){
  const wf = j.workflow, st = wf.statuses;
  const W = 112, G = 40, Y0 = 120, H = 40;
  const x = k => 30 + k * (W + G) + W / 2;
  const idx = n => st.findIndex(s => s.name === n);
  const width = 60 + st.length * W + (st.length - 1) * G;
  const edges = [];
  const arc = (a, b, cls, lift) => {
    const forward = b > a;
    const xa = x(a) + (forward ? 18 : -18), xb = x(b) + (forward ? -18 : 18);
    const yb = forward ? Y0 - H / 2 : Y0 + H / 2;
    const h = (forward ? -1 : 1) * (lift || (26 + 18 * Math.abs(b - a)));
    return `<path class="edge ${cls}" d="M${xa},${yb} C${xa},${yb + h} ${xb},${yb + h} ${xb},${yb}" marker-end="url(#ah${cls.includes('hot') ? 'hot' : ''})"/>`;
  };
  const last = j.last;
  let hotDrawn = false;
  if(wf.transitions){
    for(const t of wf.transitions){
      if(t.from === '*') continue;
      const a = idx(t.from), b = idx(t.to);
      if(a < 0 || b < 0) continue;
      const hot = last && last.from === t.from && last.to === t.to;
      if(hot) hotDrawn = true;
      edges.push(arc(a, b, (b < a ? 'back' : '') + (hot ? ' hot' : '')));
    }
  }
  if(last && !hotDrawn && idx(last.from) >= 0 && idx(last.to) >= 0 && !(wf.transitions && wf.transitions.some(t => t.from === '*' && t.to === last.to)))
    edges.push(arc(idx(last.from), idx(last.to), 'hot'));
  const globals = wf.transitions ? wf.transitions.filter(t => t.from === '*') : [];
  const gl = globals.map(t => {
    const b = idx(t.to), hot = last && last.to === t.to && !(wf.transitions.some(x => x.from === last.from && x.to === last.to));
    return `<g><text class="any" x="${x(b)}" y="${Y0 - H / 2 - 54}" text-anchor="middle">(any status)</text><path class="edge${hot ? ' hot' : ''}" d="M${x(b)},${Y0 - H / 2 - 46} L${x(b)},${Y0 - H / 2 - 2}" marker-end="url(#ah${hot ? 'hot' : ''})"/></g>`;
  }).join('');
  const nodes = st.map((s, k) => {
    const n = [...j.issues.values()].filter(i => i.status === s.name && i.type !== 'Epic').length;
    return `<g class="node ${s.cat}"><rect x="${x(k) - W / 2}" y="${Y0 - H / 2}" width="${W}" height="${H}" rx="9"/><text x="${x(k)}" y="${Y0 - 3}">${esc(s.name)}</text><text class="cnt" x="${x(k)}" y="${Y0 + 11}" text-anchor="middle">${n} issue${n === 1 ? '' : 's'}</text></g>`;
  }).join('');
  let openBox = '';
  if(!wf.transitions){
    for(let k = 0; k < st.length - 1; k++) edges.unshift(`<path class="edge" style="opacity:.35" d="M${x(k) + W / 2},${Y0} L${x(k + 1) - W / 2 - 2},${Y0}" marker-end="url(#ah)"/>`);
    openBox = `<rect x="14" y="${Y0 - H / 2 - 16}" width="${width - 28}" height="${H + 32}" rx="14" fill="none" stroke="rgba(255,255,255,0.18)" stroke-dasharray="5 4"/><text class="any" x="${width / 2}" y="${Y0 + H / 2 + 34}" text-anchor="middle">open workflow: any status ⇄ any status</text>`;
  }
  const svg = `<svg viewBox="0 0 ${width} ${Y0 + 120}" style="max-width:${width}px" role="img" aria-label="Workflow diagram">
    <defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="rgba(255,255,255,0.55)"/></marker>
    <marker id="ahhot" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4c9aff"/></marker></defs>
    ${openBox}${edges.join('')}${gl}${nodes}</svg>`;
  const note = wf.transitions
    ? `<b>Strict workflow</b>: only the arrows shown are allowed. Solid arrows go forward; dashed arrows step back (e.g. "changes requested").${globals.length ? ' A vertical arrow from "(any status)" is a <b>global transition</b>.' : ''}`
    : `<b>Open workflow</b>: every status can move to every other status. Simple and flexible: Jira's default for team-managed projects.`;
  return `<div class="wf">${svg}</div><div class="wf-legend"><span><span class="lz todo">To Do</span> category</span><span><span class="lz inprogress">In Progress</span> category</span><span><span class="lz done">Done</span> category</span>${last ? `<span>blue arrow = last transition (${esc(last.key)}: ${esc(last.from)} → ${esc(last.to)})</span>` : ''}</div><div class="wf-note">${note}</div>`;
}

/* ---------- charts (inline SVG, hover tooltips) ---------- */
function niceMax(v){ if(v <= 5) return 5; const p = Math.pow(10, Math.floor(Math.log10(v))); for(const m of [1, 2, 2.5, 5, 10]) if(m * p >= v) return m * p; return 10 * p; }
function burndownChart(j, s){
  const W = 560, H = 220, ML = 34, MR = 12, MT = 12, MB = 26;
  const end = s.endDay, start = s.startDay, today = s.state === 'active' ? Math.min(j.day, end) : (s.closedDay || end);
  const series = [];
  let v = s.burn[start] ?? s.committed;
  for(let d = start; d <= today; d++){ if(s.burn[d] !== undefined) v = s.burn[d]; series.push({d, v}); }
  const ymax = niceMax(Math.max(s.committed, ...series.map(p => p.v), 1));
  const X = d => ML + (d - start) / Math.max(1, end - start) * (W - ML - MR);
  const Y = v => MT + (1 - v / ymax) * (H - MT - MB);
  const ideal = d => s.committed * (1 - (d - start) / Math.max(1, end - start));
  const ticks = [0, ymax / 2, ymax].map(t => Math.round(t * 10) / 10);
  const step = end - start > 14 ? 2 : 1;
  let path = '';
  series.forEach((p, k) => { path += k === 0 ? `M${X(p.d)},${Y(p.v)}` : ` L${X(p.d)},${Y(series[k - 1].v)} L${X(p.d)},${Y(p.v)}`; });
  const marks = series.filter((p, k) => k === 0 || p.v !== series[k - 1].v).map(p => `<circle cx="${X(p.d)}" cy="${Y(p.v)}" r="4" fill="${SERIES.completed}" stroke="var(--j-raised, #0f0f1d)" stroke-width="2"/>`).join('');
  const hits = [];
  for(let d = start; d <= end; d++) hits.push(`<rect class="hit" data-d="${d}" x="${X(d) - (W - ML - MR) / (end - start || 1) / 2}" y="${MT}" width="${(W - ML - MR) / (end - start || 1)}" height="${H - MT - MB}" fill="transparent"/>`);
  const last = series[series.length - 1];
  const svg = `<svg viewBox="0 0 ${W} ${H}" data-chart="burn">
    <g class="grid">${ticks.map(t => `<line x1="${ML}" x2="${W - MR}" y1="${Y(t)}" y2="${Y(t)}"/>`).join('')}</g>
    <g class="axis">${ticks.map(t => `<text x="${ML - 6}" y="${Y(t) + 3}" text-anchor="end">${t}</text>`).join('')}
      ${Array.from({length: end - start + 1}, (_, k) => start + k).filter((d, k) => k % step === 0).map(d => `<text x="${X(d)}" y="${H - 8}" text-anchor="middle">${d}</text>`).join('')}</g>
    <line x1="${X(start)}" y1="${Y(s.committed)}" x2="${X(end)}" y2="${Y(0)}" stroke="#8a8aa0" stroke-width="2" stroke-dasharray="5 4"/>
    ${s.state === 'active' ? `<line class="today" x1="${X(today)}" x2="${X(today)}" y1="${MT}" y2="${H - MB}"/>` : ''}
    <path d="${path}" fill="none" stroke="${SERIES.completed}" stroke-width="2.5" stroke-linejoin="round"/>
    ${marks}
    ${last ? `<text class="vlabel" x="${X(last.d) + 8}" y="${Y(last.v) < MT + 16 ? Y(last.v) + 16 : Y(last.v) - 8}">${last.v} pts</text>` : ''}
    <line class="cross" x1="0" x2="0" y1="${MT}" y2="${H - MB}" visibility="hidden"/>
    ${hits.join('')}
  </svg>`;
  CHART_DATA.burn = {start, end, today, series: Object.fromEntries(series.map(p => [p.d, p.v])), ideal, X};
  return `<div class="chart"><h5>Burndown · ${esc(s.name)}</h5><div class="cap">Story points remaining per day (x-axis: day). Drops only when issues reach Done.</div>
    <div class="legend"><span><i style="background:${SERIES.completed}"></i>Remaining work</span><span><i style="background:repeating-linear-gradient(90deg,#8a8aa0 0 5px,transparent 5px 9px)"></i>Guideline</span>${s.state === 'active' ? '<span><i style="background:var(--text-faint)"></i>Today</span>' : ''}</div>${svg}</div>`;
}
function velocityChart(j){
  const closed = j.sprints.filter(s => s.state === 'closed');
  if(!closed.length) return `<div class="chart"><h5>Velocity</h5><div class="cap">Appears after the first completed sprint: committed vs. completed points per sprint.</div></div>`;
  const W = 560, H = 200, ML = 34, MR = 12, MT = 16, MB = 26;
  const ymax = niceMax(Math.max(...closed.map(s => Math.max(s.committed + s.scopeAdded, s.completed)), 1));
  const gw = (W - ML - MR) / closed.length, bw = Math.min(34, gw / 3);
  const Y = v => MT + (1 - v / ymax) * (H - MT - MB);
  const bar = (x, v, color, label, sname) => {
    const y = Y(v), h = (H - MB) - y, r = Math.min(4, h / 2);
    const d = h <= 0 ? '' : `M${x},${H - MB} L${x},${y + r} Q${x},${y} ${x + r},${y} L${x + bw - r},${y} Q${x + bw},${y} ${x + bw},${y + r} L${x + bw},${H - MB} Z`;
    return `<path d="${d}" fill="${color}"/><text class="vlabel" x="${x + bw / 2}" y="${y - 5}" text-anchor="middle">${v}</text><rect class="hit" data-tip="${esc(sname)}|${label}|${v}|${color}" x="${x - 3}" y="${MT}" width="${bw + 6}" height="${H - MT - MB}" fill="transparent"/>`;
  };
  const ticks = [0, ymax / 2, ymax].map(t => Math.round(t * 10) / 10);
  const groups = closed.map((s, k) => {
    const cx = ML + gw * k + gw / 2;
    return bar(cx - bw - 1, s.committed + s.scopeAdded, SERIES.committed, 'Committed', s.name) + bar(cx + 1, s.completed, SERIES.completed, 'Completed', s.name) + `<text x="${cx}" y="${H - 8}" text-anchor="middle">${esc(s.name)}</text>`;
  }).join('');
  const avg = closed.reduce((a, s) => a + s.completed, 0) / closed.length;
  return `<div class="chart"><h5>Velocity</h5><div class="cap">Points committed vs. completed per sprint · average velocity <b>${Math.round(avg * 10) / 10}</b></div>
    <div class="legend"><span><i class="sq" style="background:${SERIES.committed}"></i>Committed</span><span><i class="sq" style="background:${SERIES.completed}"></i>Completed</span></div>
    <svg viewBox="0 0 ${W} ${H}" data-chart="vel"><g class="grid">${ticks.map(t => `<line x1="${ML}" x2="${W - MR}" y1="${Y(t)}" y2="${Y(t)}"/>`).join('')}</g>
    <g class="axis">${ticks.map(t => `<text x="${ML - 6}" y="${Y(t) + 3}" text-anchor="end">${t}</text>`).join('')}${groups}</g></svg></div>`;
}
const CHART_DATA = {};
function wireCharts(root){
  root.querySelectorAll('.chart').forEach(ch => {
    const svg = ch.querySelector('svg'); if(!svg) return;
    let tip = ch.querySelector('.tip-box');
    const show = (html, ev) => {
      if(!tip){ tip = document.createElement('div'); tip.className = 'tip-box'; ch.append(tip); }
      tip.innerHTML = html; tip.style.display = 'block';
      const r = ch.getBoundingClientRect();
      let left = ev.clientX - r.left + 12; if(left > r.width - 160) left -= 180;
      tip.style.left = left + 'px'; tip.style.top = (ev.clientY - r.top - 10) + 'px';
    };
    const hide = () => { if(tip) tip.style.display = 'none'; const c = svg.querySelector('.cross'); if(c) c.setAttribute('visibility', 'hidden'); };
    svg.addEventListener('mouseleave', hide);
    svg.querySelectorAll('.hit').forEach(h => h.addEventListener('mousemove', ev => {
      if(svg.dataset.chart === 'burn'){
        const b = CHART_DATA.burn, d = +h.dataset.d;
        const c = svg.querySelector('.cross'); c.setAttribute('x1', b.X(d)); c.setAttribute('x2', b.X(d)); c.setAttribute('visibility', 'visible');
        const rem = b.series[d];
        show(`<b>Day ${d}</b><br><i style="background:${SERIES.completed}"></i>Remaining: ${rem === undefined ? '(future)' : rem + ' pts'}<br><i style="background:#8a8aa0"></i>Guideline: ${Math.round(b.ideal(d) * 10) / 10} pts`, ev);
      } else {
        const [sn, label, v, color] = h.dataset.tip.split('|');
        show(`<b>${sn}</b><br><i style="background:${color}"></i>${label}: ${v} pts`, ev);
      }
    }));
  });
}
function renderReports(j){
  if(!j.project) return `<div class="empty-state">No project yet.</div>`;
  let html = '<div class="reports">';
  const tile = (lbl, num, sub) => `<div class="tile"><div class="lbl">${lbl}</div><div class="num">${num}</div>${sub ? `<div class="sub">${sub}</div>` : ''}</div>`;
  if(j.scrum){
    const s = j.activeSprint() || [...j.sprints].reverse().find(x => x.state === 'closed');
    const closed = j.sprints.filter(x => x.state === 'closed');
    const avg = closed.length ? Math.round(closed.reduce((a, x) => a + x.completed, 0) / closed.length * 10) / 10 : '–';
    if(s){
      html += `<div class="tiles">${tile('Sprint', esc(s.name), s.state === 'active' ? `day ${j.day} of ${s.startDay}–${s.endDay}` : 'completed')}${tile('Committed', s.committed, 'points at start')}${s.scopeAdded ? tile('Added', '+' + s.scopeAdded, 'scope change') : ''}${tile(s.state === 'active' ? 'Remaining' : 'Completed', s.state === 'active' ? j.remaining(s) : s.completed, 'points')}${tile('Avg velocity', avg, closed.length + ' sprint' + (closed.length === 1 ? '' : 's'))}</div>`;
      html += burndownChart(j, s);
    } else html += `<div class="empty-state">No sprint has started yet. Reports appear once a sprint is running.</div>`;
    html += velocityChart(j);
  } else {
    const done = j.ranked().filter(i => j.cat(i) === 'done' && i.type !== 'Epic');
    const wip = j.ranked().filter(i => j.cat(i) === 'inprogress').length;
    const avg = (f) => done.length ? Math.round(done.reduce((a, i) => a + f(i), 0) / done.length * 10) / 10 : '–';
    html += `<div class="tiles">${tile('Throughput', done.length, 'issues done')}${tile('Avg cycle time', avg(i => i.resolved - i.started), 'days, started → done')}${tile('Avg lead time', avg(i => i.resolved - i.created), 'days, created → done')}${tile('WIP now', wip, 'in progress')}</div>`;
    html += `<div class="chart"><h5>Cycle & lead time per finished issue</h5><div class="cap">Shorter and more predictable is better. Limiting WIP is the usual fix for long cycle times.</div>${done.length ? `<table class="rtable"><tr><th>Issue</th><th>Summary</th><th class="num">Created</th><th class="num">Started</th><th class="num">Done</th><th class="num">Cycle</th><th class="num">Lead</th></tr>${done.map(i => `<tr><td>${ti(i.type)} ${i.key}</td><td>${esc(i.summary)}</td><td class="num">${i.created}</td><td class="num">${i.started}</td><td class="num">${i.resolved}</td><td class="num"><b>${i.resolved - i.started}d</b></td><td class="num">${i.resolved - i.created}d</td></tr>`).join('')}</table>` : '<div class="empty-state">Nothing finished yet</div>'}</div>`;
  }
  if(j.versions.length){
    html += `<div class="chart"><h5>Releases</h5><table class="rtable"><tr><th>Version</th><th>Status</th><th class="num">Issues</th><th class="num">Done</th></tr>${j.versions.map(v => { const it = [...j.issues.values()].filter(i => i.fixVersion === v.name); return `<tr><td><b>${esc(v.name)}</b></td><td>${v.released ? `<span class="lz done">released day ${v.day}</span>` : '<span class="lz todo">unreleased</span>'}</td><td class="num">${it.length}</td><td class="num">${it.filter(i => j.cat(i) === 'done').length}</td></tr>`; }).join('')}</table></div>`;
  }
  return html + '</div>';
}

const STAT_COLOR = {todo: 'var(--j-status-todo)', inprogress: 'var(--j-status-prog)', done: 'var(--j-status-done)'};
const q = v => `"${String(v).replace(/"/g, "'")}"`;
const faint = t => `<span style="color:var(--text-faint)">${t}</span>`;

/* ---------- Summary: the project's overview page ---------- */
function donut(parts, total){
  const R = 60, r = 42, C = 75, gap = parts.filter(p => p.n).length > 1 ? 0.035 : 0;
  let a = -Math.PI / 2, segs = '';
  const pt = (rad, ang) => `${C + rad * Math.cos(ang)},${C + rad * Math.sin(ang)}`;
  for(const p of parts){
    if(!p.n) continue;
    const span = p.n / total * Math.PI * 2;
    if(span >= Math.PI * 2 - 1e-6){ segs += `<circle cx="${C}" cy="${C}" r="${(R + r) / 2}" fill="none" stroke="${p.color}" stroke-width="${R - r}"><title>${esc(p.name)}: ${p.n}</title></circle>`; break; }
    const a0 = a + gap / 2, a1 = a + span - gap / 2, big = a1 - a0 > Math.PI ? 1 : 0;
    segs += `<path d="M${pt(R, a0)} A${R},${R} 0 ${big} 1 ${pt(R, a1)} L${pt(r, a1)} A${r},${r} 0 ${big} 0 ${pt(r, a0)} Z" fill="${p.color}"><title>${esc(p.name)}: ${p.n} (${Math.round(100 * p.n / total)}%)</title></path>`;
    a += span;
  }
  if(!total) segs = `<circle cx="${C}" cy="${C}" r="${(R + r) / 2}" fill="none" stroke="var(--j-hover)" stroke-width="${R - r}"/>`;
  return `<svg viewBox="0 0 150 150" role="img" aria-label="Status overview">${segs}<g class="ctr"><text x="${C}" y="${C + 4}" text-anchor="middle"><tspan style="font-size:26px;font-weight:653;fill:var(--text)">${total}</tspan></text><text x="${C}" y="${C + 20}" text-anchor="middle" style="font-size:10px;fill:var(--text-faint)">work items</text></g></svg>`;
}
function meterRows(rows, total){
  return `<div class="sm-rows">${rows.map(r => { const p = total ? Math.round(100 * r.n / total) : 0; return `<div class="r" title="${esc(r.label)}: ${r.n} of ${total}"><span class="n">${r.icon}${esc(r.label)}</span><div class="meter"><i style="width:${p}%"></i><span>${p}%</span></div></div>`; }).join('')}</div>`;
}
function priorityBars(items){
  const W = 300, H = 150, ML = 22, MB = 34, MT = 16;
  const counts = PRIORITIES.map(p => items.filter(i => i.priority === p).length);
  const ymax = Math.max(4, ...counts);
  const gw = (W - ML) / PRIORITIES.length, bw = Math.min(28, gw * .5);
  const Y = v => MT + (1 - v / ymax) * (H - MT - MB);
  const ticks = [0, Math.round(ymax / 2), ymax];
  const bars = PRIORITIES.map((p, k) => {
    const x = ML + gw * k + (gw - bw) / 2, v = counts[k], y = Y(v), h = H - MB - y, r = Math.min(4, h);
    const d = h <= 0 ? '' : `M${x},${H - MB} L${x},${y + r} Q${x},${y} ${x + r},${y} L${x + bw - r},${y} Q${x + bw},${y} ${x + bw},${y + r} L${x + bw},${H - MB} Z`;
    return `<g><title>${p}: ${v}</title><rect x="${x - 6}" y="${MT}" width="${bw + 12}" height="${H - MT - MB}" fill="transparent"/><path d="${d}" fill="var(--j-status-prog)"/>${v ? `<text x="${x + bw / 2}" y="${y - 4}" text-anchor="middle" style="fill:var(--text);font-weight:600">${v}</text>` : ''}<text x="${x + bw / 2}" y="${H - MB + 14}" text-anchor="middle">${PRI_ICON[p]}</text><text x="${x + bw / 2}" y="${H - MB + 27}" text-anchor="middle">${p}</text></g>`;
  }).join('');
  return `<div class="sm-bars"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Priority breakdown"><g class="grid">${ticks.map(t => `<line x1="${ML}" x2="${W}" y1="${Y(t)}" y2="${Y(t)}"/><text x="${ML - 6}" y="${Y(t) + 3}" text-anchor="end">${t}</text>`).join('')}</g>${bars}</svg></div>`;
}
function renderSummary(j){
  if(!j.project) return `<div class="empty-state">No project yet.<br>Press <b>Create space</b> above, or ▶ Next step.</div>`;
  const items = j.ranked(), d = j.day, recent = x => x !== null && x !== undefined && x > d - 7;
  const tile = (ico, n, what, sub) => `<div class="sm-tile"><span class="ico" aria-hidden="true">${ico}</span><div><b>${n} ${what}</b><small>${sub}</small></div></div>`;
  let html = `<div class="sm"><div class="sm-tiles">
    ${tile('✓', items.filter(i => recent(i.resolved)).length, 'completed', 'in the last 7 days')}
    ${tile('✎', items.filter(i => i.history.some(h => h.field !== 'Created' && recent(h.day))).length, 'updated', 'in the last 7 days')}
    ${tile('＋', items.filter(i => recent(i.created)).length, 'created', 'in the last 7 days')}
    ${tile('📅', 0, 'due soon', 'in the next 7 days')}</div><div class="sm-grid">`;
  // status overview
  const parts = j.workflow.statuses.map(st => ({name: st.name, n: items.filter(i => i.status === st.name).length, color: STAT_COLOR[st.cat]}));
  html += `<div class="sm-card"><h4>Status overview</h4><div class="sub">Get a snapshot of the status of your work items.</div><div class="sm-donut">${donut(parts, items.length)}<div class="sm-legend">${parts.map(p => `<span><i style="background:${p.color}"></i>${esc(p.name)}<em>${p.n}</em></span>`).join('')}</div></div></div>`;
  // recent activity
  const feed = [];
  for(const i of items) i.history.forEach((h, k) => feed.push({i, h, k}));
  feed.sort((a, b) => b.h.day - a.h.day || b.k - a.k);
  const who = h => esc(USERS[h.by] || (h.by === 'automation' ? 'Automation' : h.by));
  html += `<div class="sm-card"><h4>Recent activity</h4><div class="sub">Stay up to date with what's happening across the project.</div><div class="sm-feed">${feed.length ? feed.slice(0, 14).map(({i, h}) => `<div class="it">${av(h.by)}<div><b>${who(h)}</b> ${h.field === 'Created' ? 'created' : h.field === 'Comment' ? 'commented on' : `changed <b>${esc(h.field)}</b>${h.to !== '' ? ` to <span class="lz-plain">${esc(String(h.to).slice(0, 30))}</span>` : ''} on`} <a data-open="${i.key}">${i.key}: ${esc(i.summary)}</a><span class="when">day ${h.day}</span></div></div>`).join('') : '<div class="sm-empty">No activity yet.</div>'}</div></div>`;
  // priority
  html += `<div class="sm-card"><h4>Priority breakdown</h4><div class="sub">Get a holistic view of how work is being prioritized.</div>${priorityBars(items)}</div>`;
  // types of work
  const types = ['Epic', 'Story', 'Task', 'Bug', 'Sub-task'].map(t => ({label: t, icon: ti(t), n: items.filter(i => i.type === t).length})).filter(r => r.n);
  html += `<div class="sm-card"><h4>Types of work</h4><div class="sub">Get a breakdown of work items by their types.</div>${types.length ? meterRows(types, items.length) : '<div class="sm-empty">No work items yet.</div>'}</div>`;
  // team workload
  const people = [...Object.keys(USERS), null].map(u => ({label: u ? USERS[u] : 'Unassigned', icon: av(u), n: items.filter(i => i.type !== 'Epic' && i.assignee === u).length})).filter(r => r.n);
  const nonEpic = items.filter(i => i.type !== 'Epic').length;
  html += `<div class="sm-card"><h4>Team workload</h4><div class="sub">Monitor the capacity of your team.</div>${people.length ? meterRows(people, nonEpic) : '<div class="sm-empty">No work items yet.</div>'}</div>`;
  // epic progress
  const epics = items.filter(i => i.type === 'Epic');
  html += `<div class="sm-card sm-epic"><h4>Epic progress</h4><div class="sub">See how your epics are progressing at a glance.</div>${epics.length ? `<div class="sm-rows">${epics.map(e => { const ch = j.children(e.key).filter(c => c.type !== 'Sub-task'), dn = ch.filter(c => j.cat(c) === 'done').length, p = ch.length ? Math.round(100 * dn / ch.length) : 0; return `<div class="r" title="${dn} of ${ch.length} done"><span class="n">${ti('Epic')}<a data-open="${e.key}" style="cursor:pointer">${esc(e.summary)}</a></span><div class="meter"><i style="width:${p}%"></i></div></div>`; }).join('')}</div>` : '<div class="sm-empty">Use epics to track larger initiatives. Create one with + Create → Epic.</div>'}</div>`;
  return html + '</div></div>';
}

/* tabs that don't fit go into "More", like Jira */
function fitTabs(){
  const nav = $('#tabs'), tabs = [...nav.querySelectorAll('.tab')], wrap = nav.querySelector('.tab-more-wrap');
  if(!wrap) return;
  tabs.forEach(t => { t.hidden = false; }); wrap.hidden = true;
  const hid = [];
  for(let k = tabs.length - 1; k >= 0 && nav.scrollWidth > nav.clientWidth + 1; k--){
    if(tabs[k].classList.contains('active')) continue;
    tabs[k].hidden = true; hid.unshift(tabs[k].dataset.view); wrap.hidden = false;
  }
  wrap.querySelector('.cnt').textContent = hid.length;
  const menu = $('#moreMenu');
  if(menu) menu.innerHTML = hid.map(v => `<button data-view-more="${v}">${ICO[v]}<span>${TAB_LABEL[v]}</span></button>`).join('');
}

/* ---------- Timeline ---------- */
const DAY_MS = 864e5;
function renderTimeline(j){
  const base = S.baseDate, dateOf = d => new Date(base.getTime() + (d - 1) * DAY_MS);
  const today = dateOf(j.day);
  const m0 = new Date(today.getFullYear(), today.getMonth() - 1, 1), months = [];
  for(let k = 0; k < 4; k++) months.push(new Date(m0.getFullYear(), m0.getMonth() + k, 1));
  const end = new Date(m0.getFullYear(), m0.getMonth() + 4, 1);
  const PX = 6, X = dt => Math.round((dt - m0) / DAY_MS * PX), W = X(end);
  const cur = today.getMonth();
  const items = j.ranked();
  const epics = items.filter(i => i.type === 'Epic' && passes(i));
  const loose = items.filter(i => i.type !== 'Epic' && i.type !== 'Sub-task' && !i.epic && passes(i));
  const rows = [];
  const push = (i, depth, kids) => {
    rows.push({i, depth, kids});
    if(kids && S.tlOpen.has(i.key)) for(const c of j.children(i.key).filter(c => c.type !== 'Sub-task' && passes(c))) rows.push({i: c, depth: depth + 1, kids: false});
  };
  epics.forEach(e => push(e, 0, j.children(e.key).some(c => c.type !== 'Sub-task')));
  loose.forEach(i => push(i, 0, false));
  const span = i => {
    if(i.type === 'Epic'){
      const ch = j.children(i.key).filter(c => c.started !== null);
      if(!ch.length) return null;
      const s = Math.min(...ch.map(c => c.started)), all = j.children(i.key).every(c => j.cat(c) === 'done');
      return [s, all ? Math.max(...ch.map(c => c.resolved ?? j.day)) : Math.max(j.day, ...ch.map(c => c.resolved ?? j.day)), all];
    }
    return i.started === null ? null : [i.started, i.resolved ?? j.day, i.resolved !== null];
  };
  const bar = i => {
    const sp = span(i); if(!sp) return '';
    const x = X(dateOf(sp[0])), w = Math.max(PX * 2, X(dateOf(sp[1] + 1)) - x);
    const fmt = d => dateOf(d).toLocaleDateString(undefined, {month: 'short', day: 'numeric'});
    return `<div class="tl-bar ${i.type === 'Epic' ? 'epic' : 'item'}${sp[2] ? ' done' : ''}" style="left:${x}px;width:${w}px" title="${esc(i.key)}: ${fmt(sp[0])} → ${sp[2] ? fmt(sp[1]) : 'today'}" data-open="${i.key}"></div>`;
  };
  const left = rows.map(({i, depth, kids}) => `<div class="tl-row${j.changed.has(i.key) ? ' hl' : ''}"><div class="tl-work" style="padding-left:${10 + depth * 22}px">${kids ? `<button class="tl-chev${S.tlOpen.has(i.key) ? ' open' : ''}" data-tl="${i.key}" aria-label="Show child work items">${ICO.chev}</button>` : '<span class="tl-chev-sp"></span>'}${ti(i.type)}<a class="k" data-open="${i.key}">${i.key}</a><span class="s" data-open="${i.key}">${esc(i.summary)}</span></div><div class="tl-st">${lz(j, i)}</div><div class="tl-as">${av(i.assignee)}</div></div>`).join('');
  const right = rows.map(({i}) => `<div class="tl-lane">${bar(i)}</div>`).join('');
  const mhead = months.map(m => `<div class="tl-m${m.getMonth() === cur ? ' cur' : ''}" style="left:${X(m)}px;width:${X(new Date(m.getFullYear(), m.getMonth() + 1, 1)) - X(m)}px">${m.toLocaleDateString(undefined, {month: 'long'})}</div>`).join('');
  const shade = months.filter(m => m.getMonth() === cur).map(m => `<div class="tl-shade" style="left:${X(m)}px;width:${X(new Date(m.getFullYear(), m.getMonth() + 1, 1)) - X(m)}px"></div>`).join('');
  return viewBar(j, 'timeline') + `<div class="tl" id="tl"><div class="tl-in" style="width:${380 + W}px">
    <div class="tl-left"><div class="tl-head"><div>Work</div><div>Status</div><div>Assignee</div></div>${left}<div class="tl-row tl-create" id="tlCreate"><div class="tl-work">${ICO.plus}<span>Create</span></div></div><div class="tl-rsz" id="tlRsz" title="Drag to resize · double-click to reset"></div></div>
    <div class="tl-right" style="width:${W}px"><div class="tl-head">${mhead}</div><div class="tl-grid">${shade}${months.map(m => `<div class="tl-vline" style="left:${X(m)}px"></div>`).join('')}<div class="tl-today" style="left:${X(today) + PX / 2}px" title="Today (day ${j.day})"></div>${right}<div class="tl-lane"></div></div></div>
  </div></div>`;
}

/* ---------- Development / Forms / Docs ---------- */
function renderDevelopment(j){
  const rows = j.ranked().filter(i => i.dev.branches.length || i.dev.commits.length);
  if(!rows.length) return `<div class="jw-empty">${ICO.development}<h4>Connect your code to Jira</h4><p>Put a work item key in a branch name or commit message (e.g. <code>git commit -m "SHOP-4 Add login"</code>) and the branch, commits and status updates show up here and on the work item.</p></div>`;
  return `<div class="ls"><table class="rtable"><tr><th>Work item</th><th>Status</th><th>Branches</th><th>Commits</th></tr>${rows.map(i => `<tr class="click" data-open="${i.key}"><td>${ti(i.type)} <span class="k" style="color:var(--j-blue);font-weight:500">${i.key}</span> ${esc(i.summary)}</td><td>${lz(j, i)}</td><td>${i.dev.branches.map(b => `<div class="mono">⎇ ${esc(b)}</div>`).join('') || faint('–')}</td><td>${i.dev.commits.map(c => `<div class="mono">${c.hash} ${esc(c.msg)}</div>`).join('') || faint('–')}</td></tr>`).join('')}</table></div>`;

const renderForms = () => `<div class="jw-empty">${ICO.forms}<h4>Collect requests with forms</h4><p>Forms let people outside the team submit work that lands straight in this space. (Not simulated in this lab.)</p></div>`;
const renderDocs = () => `<div class="jw-empty">${ICO.docs}<h4>Keep docs next to the work</h4><p>Docs hold specs, meeting notes and decisions linked to your work items. (Not simulated in this lab.)</p></div>`;

function headerAction(a){
  const j = S.j;
  if(a === 'full'){ $('#jw').classList.toggle('full'); renderProj(); return; }
  if(a === 'automation'){
    showFlags([[[j.rules.length ? `${j.rules.length} automation rule${j.rules.length === 1 ? '' : 's'} active` : 'No automation rules yet', 'auto']], [[j.rules.length ? j.rules.map(r => r.name).join(', ') : 'Rules run actions for you, e.g. "when a Bug is created → assign it". See the Automation lesson.', 'dim']]]);
    return;
  }
  if(a === 'people'){ showFlags([[['Space members', 'ok']], [[Object.values(USERS).join(', '), 'dim']]]); return; }
  if(a === 'share'){ showFlags([[['Link copied (simulated)', 'ok']]]); return; }
  if(a === 'feedback'){ showFlags([[['Thanks for the feedback! (simulated)', 'ok']]]); return; }
}

/* ---------- issue dialog ---------- */
let ivTab = 'comments', editingDesc = false;
function renderIssueDialog(j){
  const i = j.selected && j.issue(j.selected);
  if(!i) return '';
  const sel = (name, opts, cur) => `<select class="jsel" data-f="${name}">${opts.map(([v, l, dis]) => `<option value="${esc(v)}"${v === cur ? ' selected' : ''}${dis ? ' disabled' : ''}>${esc(l)}</option>`).join('')}</select>`;
  const estimable = i.type !== 'Epic' && i.type !== 'Sub-task';
  const fields = {
    Assignee: `${av(i.assignee)}${sel('assignee', [['none', 'Unassigned'], ...Object.entries(USERS)], i.assignee || 'none')}`,
    Reporter: `${av(i.reporter)} ${esc(USERS[i.reporter] || i.reporter)}`,
    Priority: `${pri(i.priority)}${sel('priority', PRIORITIES.map(p => [p, p]), i.priority)}`,
    'Story points': estimable ? sel('points', [['none', 'None'], ...[1, 2, 3, 5, 8, 13].map(n => [String(n), String(n)])], i.points === null ? 'none' : String(i.points)) : faint('n/a'),
    Labels: i.labels.length ? i.labels.map(l => `<span class="label-chip">${esc(l)}</span>`).join('') : faint('None'),
    [i.type === 'Sub-task' ? 'Parent' : 'Epic']: i.type === 'Sub-task' ? `<a data-open="${i.parent}" style="cursor:pointer;color:var(--j-blue)">${i.parent}</a>` : (i.epic ? epicChip(j, i) : faint('None')),
    Sprint: i.sprint ? esc(j.sprints[i.sprint - 1].name) : faint(j.scrum ? 'Backlog' : 'n/a (Kanban)'),
    'Fix versions': i.fixVersion || faint('None'),
  };
  const same = lastIssueSnap.key === i.key;
  const side = Object.entries(fields).map(([k, v]) => `<div class="f${same && lastIssueSnap.fields[k] !== undefined && lastIssueSnap.fields[k] !== v ? ' flash' : ''}"><span>${k}</span><span class="v">${v}</span></div>`).join('');
  const prevHist = same ? lastIssueSnap.hist : i.history.length;
  lastIssueSnap = {key: i.key, fields, hist: i.history.length};
  const crumbs = [i.epic ? `${ti('Epic')} ${i.epic}` : '', i.parent ? `${ti(j.issue(i.parent).type)} ${i.parent}` : '', `${ti(i.type)} ${i.key}`].filter(Boolean).join(' <span style="opacity:.4">/</span> ');
  const stOpts = j.workflow.statuses.map(st => [st.name, st.name, st.name !== i.status && !j.allowed(i.status, st.name)]);
  let main = `<h2>${esc(i.summary)}</h2><h6>Description</h6>`;
  main += editingDesc
    ? `<div class="iv-comment"><textarea id="descIn">${esc(i.description)}</textarea></div><div style="display:flex;gap:6px"><button class="jw-btn primary" id="descSave">Save</button><button class="jw-btn subtle" id="descCancel">Cancel</button></div>`
    : `<div class="desc${i.description ? '' : ' empty'}" id="descView" style="cursor:text;white-space:pre-wrap" title="Click to edit">${i.description ? esc(i.description) : 'Add a description…'}</div>`;
  const list = (items, rel) => `<div class="ilist">${items.map(c => `<div class="it" data-open="${c.key}">${rel ? `<span class="rel">${esc(rel(c))}</span>` : ''}${ti(c.type)}<span class="key">${c.key}</span><span class="sum">${esc(c.summary)}</span>${av(c.assignee)}${lz(j, c)}</div>`).join('')}</div>`;
  const prog = (items) => { const d = items.filter(c => j.cat(c) === 'done').length, p = items.length ? Math.round(100 * d / items.length) : 0; return `<div class="progress-line"><div class="bar"><i style="width:${p}%"></i></div>${d} of ${items.length} done</div>`; };
  const subs = j.subtasks(i.key);
  if(subs.length) main += `<h6>Subtasks</h6>${prog(subs)}${list(subs)}`;
  if(i.type === 'Epic'){ const ch = j.children(i.key); main += `<h6>Child work items</h6>${ch.length ? prog(ch) + list(ch) : '<div class="desc empty">No child work items yet</div>'}`; }
  if(i.links.length) main += `<h6>Linked work items</h6>${list(i.links.map(l => j.issue(l.key)), c => i.links.find(l => l.key === c.key).type)}`;
  if(i.dev.branches.length || i.dev.commits.length) main += `<h6>Development</h6><div class="dev">${i.dev.branches.map(b => `<span>⎇ ${esc(b)}</span>`).join('')}${i.dev.commits.map(c => `<span>● ${c.hash} ${esc(c.msg)}</span>`).join('')}</div>`;
  main += `<h6>Activity</h6><div class="iv-act"><button data-ivtab="comments" class="${ivTab === 'comments' ? 'on' : ''}">Comments (${i.comments.length})</button><button data-ivtab="history" class="${ivTab === 'history' ? 'on' : ''}">History</button></div>`;
  if(ivTab === 'comments'){
    main += `<div class="iv-comment">${av('you')}<textarea id="commentIn" placeholder="Add a comment…"></textarea><button class="jw-btn primary" id="commentGo">Save</button></div>`;
    main += i.comments.length ? [...i.comments].reverse().map(c => `<div class="comment${c.by === 'automation' ? ' auto' : ''}">${av(c.by)}<div class="body"><div class="who"><b>${esc(USERS[c.by] || 'Automation')}</b> · day ${c.day}</div>${esc(c.text)}</div></div>`).join('') : '';
  } else {
    const hist = i.history.map((h, k) => ({h, k})).slice(-12).reverse();
    main += `<div class="hist">${hist.map(({h, k}) => `<div class="h${k >= prevHist ? ' fresh' : ''}"><span class="d">day ${h.day}</span><b>${esc(USERS[h.by] || (h.by === 'automation' ? '⚡ Automation' : h.by))}</b> ${h.field === 'Created' ? 'created the work item' : h.field === 'Comment' ? 'commented' : `changed <b>${esc(h.field)}</b> ${h.from !== '' ? `<span>${esc(String(h.from).slice(0, 40))}</span> <span class="arrow">→</span>` : ''} <span>${esc(String(h.to).slice(0, 50))}</span>`}</div>`).join('')}</div>`;
  }
  return `<div class="jw-dialog" role="dialog" aria-label="${esc(i.key)}">
    <div class="dlg-head"><div class="crumbs">${crumbs}</div><div class="dlg-x"><button class="jw-btn subtle" data-cmd="${i.flagged ? 'unflag' : 'flag'} ${i.key}" title="${i.flagged ? 'Remove flag' : 'Flag as impediment'}">${i.flagged ? '⚑ Remove flag' : '⚐ Flag'}</button><button class="jw-ibtn" data-close title="Close (Esc)" aria-label="Close">✕</button></div></div>
    <div class="dlg-body"><div class="iv">${main}</div>
      <div class="iv-side"><select class="st-sel ${j.cat(i)}" data-f="status" aria-label="Status">${stOpts.map(([v, l, dis]) => `<option value="${esc(v)}"${v === i.status ? ' selected' : ''}${dis ? ' disabled' : ''}>${esc(l)}</option>`).join('')}</select>
        ${i.flagged ? '<div class="flag warn" style="animation:none;box-shadow:none;border:1px solid var(--border)"><span class="fi">!</span><div><b>Flagged</b><small>This work item is blocked (impediment).</small></div></div>' : ''}
        <div class="det"><h5>Details</h5>${side}</div>
        <div class="det-foot">Created day ${i.created}<br>Updated day ${i.updated}${i.resolved !== null ? `<br>Resolved day ${i.resolved}` : ''}</div></div></div></div>`;
}

/* ---------- modal plumbing ---------- */
function openModal(kind){
  S.modal = kind;
  if(kind === 'issue'){ ivTab = 'comments'; editingDesc = false; }
  renderModal();
}
function closeModal(){ S.modal = null; S.createType = null; editingDesc = false; renderModal(); }
function renderModal(){
  const m = $('#modal'), j = S.j;
  if(!S.modal || (S.modal === 'issue' && !(j.selected && j.issue(j.selected))) || (S.modal === 'create' && !j.project)){ S.modal = null; m.hidden = true; m.innerHTML = ''; return; }
  const keepScroll = m.scrollTop;
  m.innerHTML = S.modal === 'issue' ? renderIssueDialog(j) : S.modal === 'create' ? renderCreateDialog(j) : renderProjectDialog();
  m.hidden = false; m.scrollTop = keepScroll;
  wireModal();
}
function wireModal(){
  const m = $('#modal'), j = S.j;
  m.querySelectorAll('[data-close]').forEach(b => b.addEventListener('click', closeModal));
  m.querySelectorAll('[data-cmd]').forEach(b => b.addEventListener('click', () => userCommand(b.dataset.cmd, {stay: true})));
  m.querySelectorAll('[data-open]').forEach(el => el.addEventListener('click', () => { j.selected = el.dataset.open; openModal('issue'); }));
  if(S.modal === 'issue'){
    const key = j.selected;
    m.querySelectorAll('select[data-f]').forEach(s => s.addEventListener('change', () => {
      const f = s.dataset.f, v = s.value;
      userCommand(f === 'status' ? `move ${key} ${q(v)}` : f === 'assignee' ? `assign ${key} ${v}` : `edit ${key} ${f}=${v}`, {stay: true});
    }));
    m.querySelectorAll('[data-ivtab]').forEach(b => b.addEventListener('click', () => { ivTab = b.dataset.ivtab; renderModal(); }));
    const go = $('#commentGo'), cin = $('#commentIn');
    if(go){
      const send = () => { const t = cin.value.trim(); if(t) userCommand(`comment ${key} ${q(t)}`, {stay: true}); };
      go.addEventListener('click', send);
      cin.addEventListener('keydown', e => { if(e.key === 'Enter' && (e.ctrlKey || e.metaKey)) send(); });
    }
    const dv = $('#descView');
    if(dv) dv.addEventListener('click', () => { editingDesc = true; renderModal(); const t = $('#descIn'); t.focus(); t.setSelectionRange(t.value.length, t.value.length); });
    if($('#descSave')){
      $('#descSave').addEventListener('click', () => { editingDesc = false; userCommand(`edit ${key} description=${q($('#descIn').value)}`, {stay: true}); });
      $('#descCancel').addEventListener('click', () => { editingDesc = false; renderModal(); });
    }
  }
  if(S.modal === 'create'){
    const f = $('#createForm'), type = f.elements.type;
    const sync = () => {
      const t = type.value;
      f.querySelector('[data-for="points"]').hidden = t === 'epic' || t === 'subtask';
      f.querySelector('[data-for="epic"]').hidden = t === 'epic' || t === 'subtask';
      f.querySelector('[data-for="parent"]').hidden = t !== 'subtask';
      const sp = f.querySelector('[data-for="sprint"]'); if(sp) sp.hidden = t === 'epic' || t === 'subtask';
    };
    type.addEventListener('change', sync); sync();
    f.elements.summary.focus();
    const submit = async e => {
      if(e) e.preventDefault();
      const v = n => (f.elements[n] && !f.elements[n].closest('[hidden]') ? f.elements[n].value.trim() : '');
      if(!v('summary')){ $('#createErr').textContent = 'Summary is required.'; f.elements.summary.focus(); return; }
      const t = type.value;
      let cmd = t === 'subtask' ? `subtask ${v('parent')} ${q(v('summary'))}` : `create ${t} ${q(v('summary'))}`;
      if(v('description')) cmd += ` description=${q(v('description'))}`;
      if(v('assignee')) cmd += ` assignee=${v('assignee')}`;
      if(v('priority') && v('priority') !== 'Medium') cmd += ` priority=${v('priority')}`;
      if(v('points')) cmd += ` points=${v('points')}`;
      if(v('epic')) cmd += ` epic=${v('epic')}`;
      if(v('labels')) cmd += ` labels=${q(v('labels').replace(/\s*,\s*/g, ',').replace(/\s+/g, '-'))}`;
      if(v('sprint')) cmd += ` sprint=${q(v('sprint'))}`;
      const more = $('#createMore').checked;
      const res = await userCommand(cmd, {stay: true});
      if(!res || !res.ok){ const e2 = res && res.lines.find(l => l.some(([, c]) => c === 'err')); $('#createErr').textContent = e2 ? e2.map(([x]) => x).join('').replace(/^✖\s*/, '') : ''; return; }
      if(more){ openModal('create'); $('#createMore').checked = true; } else closeModal();
    };
    f.addEventListener('submit', submit);
    $('#createGo').addEventListener('click', submit);
  }
  if(S.modal === 'project'){
    const f = $('#projForm');
    f.elements.name.focus();
    f.elements.name.addEventListener('input', () => {
      if(f.elements.key.dataset.touched) return;
      f.elements.key.value = f.elements.name.value.replace(/[^A-Za-z ]/g, '').split(/\s+/).filter(Boolean).map((w, k, a) => a.length > 1 ? w[0] : w.slice(0, 4)).join('').toUpperCase().slice(0, 6);
    });
    f.elements.key.addEventListener('input', () => { f.elements.key.dataset.touched = '1'; });
    const submit = async e => {
      if(e) e.preventDefault();
      const name = f.elements.name.value.trim(), key = f.elements.key.value.trim().toUpperCase();
      if(!name){ $('#projErr').textContent = 'Give the project a name.'; return; }
      const res = await userCommand(`project create ${key} ${q(name)} ${f.elements.type.value}`, {stay: true});
      if(!res || !res.ok){ const e2 = res && res.lines.find(l => l.some(([, c]) => c === 'err')); $('#projErr').textContent = e2 ? e2.map(([x]) => x).join('').replace(/^✖\s*/, '') : ''; return; }
      closeModal(); setView('board');
    };
    f.addEventListener('submit', submit);
    $('#projGo').addEventListener('click', submit);
  }
}

/* ---------- flags: Jira's pop-up messages replace the console output ---------- */
function showFlags(lines){
  const box = $('#flags'), out = [];
  for(const segs of lines){
    const kind = (segs.find(([t, c]) => c && String(t).trim()) || [])[1];
    const text = segs.map(([t]) => t).join('').trim();
    if(!text) continue;
    if(kind === 'ok' || kind === 'err' || kind === 'warn' || kind === 'auto') out.push({kind, title: text.replace(/^[✔✖⚠]\s*/, '').replace(/^⚡ Automation\s*/, ''), sub: kind === 'auto' ? 'Automation rule' : ''});
    else if(out.length && (kind === 'dim' || !kind) && out[out.length - 1].sub.length < 160) out[out.length - 1].sub += (out[out.length - 1].sub ? ' ' : '') + text;
  }
  for(const f of out.slice(0, 3)){
    const el = document.createElement('div');
    el.className = 'flag ' + f.kind;
    el.innerHTML = `<span class="fi" aria-hidden="true">${{ok: '✓', err: '!', warn: '!', auto: '⚡'}[f.kind]}</span><div><b>${esc(f.title)}</b>${f.sub ? `<small>${esc(f.sub)}</small>` : ''}</div>`;
    box.prepend(el);
    setTimeout(() => { el.classList.add('out'); setTimeout(() => el.remove(), 260); }, f.kind === 'err' ? 6000 : 3200);
  }
  while(box.children.length > 2) box.lastElementChild.remove();
}

function renderView(fresh){
  const j = S.j, body = $('#viewBody'), v = S.view;
  renderProj();
  const sel = v === 'board' ? '.card' : v === 'backlog' ? '.row' : null;
  const before = sel ? flipCapture('#viewBody ' + sel) : null;
  const html = {summary: renderSummary, board: renderBoard, backlog: renderBacklog, workflow: renderWorkflow, reports: renderReports, search: renderSearch, timeline: renderTimeline, development: renderDevelopment, forms: renderForms, docs: renderDocs}[v](j);
  const sprintBtn = j.scrum && j.activeSprint() ? '<button class="jw-btn" data-cmd="sprint complete">Complete sprint</button>' : '';
  const bar = !j.project ? '' : v === 'board' && (!j.scrum || j.activeSprint()) ? viewBar(j, v, sprintBtn) : v === 'search' ? viewBar(j, v, `<button class="jw-obtn wide${S.jql ? ' on' : ''}" id="jqlToggle">JQL</button>`) : '';
  const oldTl = $('#tl'), keepTl = oldTl && v === 'timeline' ? [oldTl.scrollLeft, oldTl.scrollTop] : null;
  body.innerHTML = bar + html;
  if(sel && !fresh) flipPlay('#viewBody ' + sel, before, true);
  wireView();
  if(v === 'board') applyBoardFilter();
  const tl = $('#tl');
  if(tl){ if(keepTl){ tl.scrollLeft = keepTl[0]; tl.scrollTop = keepTl[1]; } else { const td = tl.querySelector('.tl-today'); tl.scrollLeft = Math.max(0, td.offsetLeft + 380 - tl.clientWidth * 0.6); } }
  const hl = body.querySelector('.card.hl, .row.hl');
  if(hl) hl.scrollIntoView({block: 'nearest', inline: 'nearest', behavior: 'smooth'});
  if(S.modal) renderModal();
}

let dragKey = null;
function wireView(){
  const body = $('#viewBody');
  body.querySelectorAll('[data-open]').forEach(el => el.addEventListener('click', () => { S.j.selected = el.dataset.open; openModal('issue'); }));
  body.querySelectorAll('[data-cmd]').forEach(b => b.addEventListener('click', () => userCommand(b.dataset.cmd)));
  body.querySelectorAll('.card').forEach(c => {
    c.addEventListener('click', () => { S.j.selected = c.dataset.key; openModal('issue'); });
    c.addEventListener('dragstart', e => { dragKey = c.dataset.key; c.classList.add('dragging'); e.dataTransfer.setData('text/plain', dragKey); });
    c.addEventListener('dragend', () => { c.classList.remove('dragging'); });
  });
  body.querySelectorAll('.col').forEach(col => {
    col.addEventListener('dragover', e => { e.preventDefault(); col.classList.add('drop'); });
    col.addEventListener('dragleave', () => col.classList.remove('drop'));
    col.addEventListener('drop', e => {
      e.preventDefault(); col.classList.remove('drop');
      const k = dragKey; dragKey = null;

   App state & runner
   ===================================================================== */
const S = {lesson: null, idx: 0, j: null, token: 0, busy: false, playing: false, view: 'board', modal: null, extraTabs: new Set(), tlOpen: new Set(), baseDate: new Date(), addMenu: false, jql: false, createType: null};
let DONE = new Set();
try { DONE = new Set(JSON.parse(localStorage.getItem('jira-lab-done-v1') || '[]')); } catch(e) {}
const saveDone = () => { try { localStorage.setItem('jira-lab-done-v1', JSON.stringify([...DONE])); } catch(e) {} };

function setView(v, fresh){
  if(v === 'issue'){ renderView(fresh); openModal('issue'); return; }
  if(EXTRA_TABS.includes(v) || (v === 'backlog' && !S.j.scrum)) S.extraTabs.add(v);
  if(v === 'search' && S.j.lastSearch) S.jql = true;
  S.view = v; S.addMenu = false; S.moreMenu = false; BF.menu = false;
  renderView(fresh);
}

/* Runs one simulator command. Its messages pop up as Jira flags; the
   workspace re-renders from state. `stay` keeps the current tab and dialog
   (used when you click inside a dialog). */
async function runCommand(cmd, {typed = true, token = S.token, stay = false, snap, fresh} = {}){
  if(typed){ await sleep(380); if(token !== S.token) throw 'cancel'; }
  const res = S.j.run(cmd, {snap, fresh});
  showFlags(res.lines);
  if(stay || !res.view) renderView();
  else if(res.view === 'issue') setView('issue');
  else {
    if(S.modal) closeModal();
    if(res.view !== S.view && !keepView(cmd, res.view)) setView(res.view); else renderView();
  }
  return res;
}
/* Commands that only touch an issue (move, edit, assign…) don't drag you away
   from Summary/Reports/Workflow/Backlog/List: you watch the change happen there. */
const STRONG = new Set(['board', 'backlog', 'reports', 'search', 'view', 'open', 'workflow', 'jql', 'filter', 'filters', 'sprint', 'version', 'versions', 'wip', 'project', 'git']);
function keepView(cmd, target){
  const first = cmd.trim().split(/\s+/)[0].toLowerCase();
  if(STRONG.has(first)) return false;
  return (target === 'board' || target === 'issue') && ['summary', 'reports', 'workflow', 'backlog', 'search'].includes(S.view);
}
async function userCommand(cmd, opts = {}){
  if(S.busy) return null;
  S.busy = true;
  try { return await runCommand(cmd, {typed: false, ...opts}); } finally { S.busy = false; updateButtons(); }
}

function narrate(html){
  const n = $('#narr');
  n.hidden = false;
  n.innerHTML = html;
  n.classList.remove('flash'); void n.offsetWidth; n.classList.add('flash');
}
function narrateStep(i){
  const L = S.lesson;
  narrate(`<b class="stepno">Step ${i + 1} / ${L.steps.length}</b>${L.steps[i].note || ''}`);
}
function updateButtons(){
  const L = S.lesson, done = S.idx >= L.steps.length;
  $('#nextBtn').disabled = S.busy || done;
  $('#prevBtn').disabled = S.busy || S.idx === 0;
  $('#playBtn').disabled = done && !S.playing;
  $('#playBtn').innerHTML = S.playing ? '⏸ Pause' : '⏵ Play';
  document.querySelectorAll('#steps .step').forEach((el, i) => {
    el.classList.toggle('done', i < S.idx && !(S.busy && i === S.idx - 1));
    el.classList.toggle('next', i === S.idx && !S.busy);
  });
}
function markCurrent(i){
  document.querySelectorAll('#steps .step').forEach((el, k) => el.classList.toggle('current', k === i));
  const el = document.querySelectorAll('#steps .step')[i];
  const pane = $('#lessonPane');
  if(el && pane.scrollHeight > pane.clientHeight + 4){
    const r = el.getBoundingClientRect(), pr = pane.getBoundingClientRect();
    if(r.top < pr.top + 40 || r.bottom > pr.bottom - 40) pane.scrollTo({top: pane.scrollTop + r.top - pr.top - pr.height / 3, behavior: 'smooth'});
  }
}

function setupLesson(){
  S.token++;
  gHide();
  S.busy = false; S.playing = false; S.idx = 0;
  const L = S.lesson;
  const j = new Jira();
  for(const c of L.setup) j.run(c);
  j.changed = new Set(); j.last = null;
  if(L.setup.length && L.view === 'issue' && !j.selected) j.selected = null;
  S.j = j;
  lastIssueSnap = {key: null, fields: {}, hist: 0};
  S.modal = null; $('#modal').hidden = true; $('#flags').innerHTML = '';
  BF.text = ''; BF.who = null; BF.types.clear(); BF.cats.clear(); BF.menu = false;
  S.extraTabs = new Set(); S.tlOpen = new Set(); S.addMenu = false; S.jql = false;
  S.baseDate = new Date(); S.baseDate.setHours(0, 0, 0, 0);
  $('#jw').classList.remove('full');
  setView(L.view === 'issue' ? 'board' : (L.view || 'board'), true);
  if(L.view === 'issue' && j.selected) openModal('issue');
  document.querySelectorAll('#steps .step').forEach(el => el.classList.remove('current', 'done'));
  if(L.steps.length){ $('#narr').hidden = true; $('#narr').innerHTML = ''; }
  else narrate(`<b class="stepno">Sandbox</b>No script here. Press <b>+ Create</b>, drag cards on the board or into a sprint in the Backlog, open a work item to edit it, or try JQL in the <b>List</b> tab.`);
  updateButtons();
}

async function nextStep({typed = true, from = 0} = {}){
  const L = S.lesson;
  if(S.busy || S.idx >= L.steps.length) return false;
  S.busy = true;
  const i = S.idx, tok = S.token;
  markCurrent(i); narrateStep(i); updateButtons();
  try {
    if(from || (typed && GUIDE_ON)) await guidedRun(L.steps[i].cmd, tok, i, from || 1);
    else await runCommand(L.steps[i].cmd, {typed, token: tok});
  }
  catch(e){ if(e === 'cancel') return false; throw e; }
  if(tok !== S.token) return false;
  S.idx = i + 1; S.busy = false;
  updateButtons();
  if(S.idx === L.steps.length) lessonComplete();
  return true;
}
/* Actions can't be "un-done" one by one, so going back = rebuild the
   lesson's starting state and silently replay every earlier step. */
async function prevStep(){
  if(S.busy || S.idx === 0) return;
  const k = S.idx - 1;
  setupLesson();
  const tok = S.token;
  for(let i = 0; i < k && tok === S.token; i++){ if(!(await nextStep({typed: false}))) return; }
  if(tok === S.token && k > 0) narrate(`<b class="stepno">◀ Went back</b>This is the state after step ${k} of ${S.lesson.steps.length}. ▶ Next step re-runs step ${k + 1}.`);
}
async function runUpTo(k){
  if(S.busy) return;
  if(k < S.idx) setupLesson();
  const tok = S.token;
  S.playing = false;
  while(S.idx < k && tok === S.token){ if(!(await nextStep({typed: false}))) return; }
  if(tok === S.token) await nextStep();
}
async function playAll(){
  if(S.playing){ S.playing = false; updateButtons(); return; }
  S.playing = true; updateButtons();
  const tok = S.token;
  while(S.playing && tok === S.token && S.idx < S.lesson.steps.length){
    if(!(await nextStep())) break;
    if(S.idx < S.lesson.steps.length) await sleep(1800);
  }
  if(tok === S.token){ S.playing = false; updateButtons(); }
}
function lessonComplete(){
  const L = S.lesson;
  DONE.add(L.id); saveDone(); renderNav(); renderProgress();
  const i = LESSONS.indexOf(L), nx = LESSONS[i + 1];
  setTimeout(() => {
    if(S.lesson !== L) return;
    narrate(`<b class="stepno">✓ Lesson complete</b>Keep experimenting (the project is still live), take the quiz, ${nx ? `or continue to <a href="#${nx.id}" style="color:var(--brand-2)">${esc(nx.title)} →</a>` : 'or revisit any lesson.'}`);
  }, 2600);
  toast('🎉 Lesson complete!');
}
let toastT;
function toast(msg){ const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 2200); }

/* =====================================================================
   Step guide: before a step runs, a pointer shows where you would click
   in Jira and what you would type in each field. The step's command then
   does the actual change, so the result is the same with the guide off.
   ===================================================================== */
const GUIDE_KEY = 'jira-lab-guide-v1';
let GUIDE_ON = true;
try { GUIDE_ON = localStorage.getItem(GUIDE_KEY) !== 'off'; } catch(e) {}

const gVis = el => el && el.getClientRects().length && !el.closest('[hidden]') ? el : null;
const gq = sel => gVis(document.querySelector(sel));
const gUser = u => u === 'me' ? 'you' : u;
const gTab = v => gq(`.jw-tabs .tab[data-view="${v}"]`) || gq('#tabMore') || gq('#tabAdd');
const gIssueEl = key => [...$('#viewBody').querySelectorAll(`[data-key="${key}"], [data-open="${key}"]`)].find(gVis) || null;
const gDetRow = name => [...document.querySelectorAll('#modal .det .f')].find(f => f.firstElementChild.textContent === name) || null;
const gText = s => String(s).replace(/\\n/g, '\n');

/* action kinds: click · fill (type into / pick in a field) · drag · info (point and explain) */
const gClick = (l, at, o = {}) => ({k: 'click', l, at, ...o});
const gFill = (l, v, at, o = {}) => ({k: 'fill', l, v, at, ...o});
const gInfo = (l, v, at, o = {}) => ({k: 'info', l, v, at, ...o});
const gGo = v => gClick(`Open the <b>${TAB_LABEL[v]}</b> tab`, () => gTab(v), {skip: () => S.view === v && !S.modal, post: () => { if(S.modal) closeModal(); setView(v); }});
function gOpen(key){
  const open = () => { S.j.selected = key; openModal('issue'); };
  const here = () => S.modal === 'issue' && S.j.selected === key;
  return gClick(`Open <b>${key}</b>`, () => gIssueEl(key), {
    skip: here,
    pre: () => { if(S.modal && !here()) closeModal(); },
    post: open,
    alt: gFill('Search', key, () => gq('#jwSearch'), {hint: 'then press Enter', post: open}),
  });
}
const gSel = (f, label, v, shown) => gFill(label, shown ?? v, () => gq(`#modal select[data-f="${f}"]`), {sel: v});
const gForm = (form, name) => () => gq(`#${form} [name="${name}"]`);

function gFields(kv, form){
  const out = [], F = n => gForm(form, n);
  for(const [k, v] of Object.entries(kv)){
    if(k === 'description') out.push(gFill('Description', gText(v), F('description')));
    else if(k === 'assignee') out.push(gFill('Assignee', USERS[gUser(v)] || v, F('assignee'), {sel: gUser(v)}));
    else if(k === 'priority') out.push(gFill('Priority', v, F('priority'), {sel: v}));
    else if(k === 'points') out.push(gFill('Story points', v, F('points'), {sel: v}));
    else if(k === 'epic') out.push(gFill('Epic', v, F('epic'), {sel: v}));
    else if(k === 'labels') out.push(gFill('Labels', v.split(',').join(', '), F('labels')));
    else if(k === 'sprint') out.push(gFill('Sprint', v, F('sprint'), {sel: v}));
  }
  return out;
}

/* one simulator command → the clicks a person would make in Jira */
function guideFor(src){
  const t = tokenize(src), c = (t[0] || '').toLowerCase(), pos = [], kv = {};
  for(const x of t.slice(1)){ const m = /^([A-Za-z]+)(\+?=)([\s\S]*)$/.exec(x); if(m) kv[m[1] + (m[2] === '+=' ? '+' : '')] = m[3]; else pos.push(x); }
  const ok = () => gq('#createGo');
  switch(c){
    case 'project': {
      const [, key, name, type = 'kanban'] = pos;
      return [
        gClick('Click <b>Create space</b>', () => gq('#newProjBtn'), {post: () => openModal('project')}),
        gFill('Name', name, gForm('projForm', 'name')),
        gFill('Key', key, gForm('projForm', 'key')),
        gFill('Template', type === 'scrum' ? 'Scrum' : 'Kanban', gForm('projForm', 'type'), {sel: type}),
        gClick('Click <b>Create</b>', () => gq('#projGo'), {post: closeModal}),
      ];
    }
    case 'create': case 'subtask': {
      const type = c === 'subtask' ? 'subtask' : (pos[0] || 'task').toLowerCase();
      const summary = pos[1];
      const acts = [

function goalText(cmd){
  const groups = [];
  for(const part of cmd.split(/\s+&&\s+/)){

    if(last && last.g === g.g && g.g !== part) last.xs.push(g.x); else groups.push({g: g.g, f: g.f, xs: [g.x], key: g.key, st: g.st});

  // above the target: it then covers what is already done, not the next field
  let top = r.top - bh - 12;
  if(top < 8) top = r.bottom + 12;
  if(top + bh > H - 8) top = Math.max(8, Math.min(H - bh - 8, r.top + 30));
  b.style.left = Math.max(8, Math.min(W - bw - 8, r.left + r.width / 2 - bw / 2)) + 'px';
  b.style.top = top + 'px';
}
async function gCursor(x, y, tok){
  const c = gLayer().cur;
  if(c.hidden){ c.style.transition = 'none'; c.style.left = x + 40 + 'px'; c.style.top = y + 50 + 'px'; c.hidden = false; void c.offsetWidth; c.style.transition = ''; }
  c.style.left = x + 'px'; c.style.top = y + 'px';
  await gWait(520, tok);
}
async function gPress(tok){
  const c = gLayer().cur;
  c.classList.remove('press'); void c.offsetWidth; c.classList.add('press');
  await gWait(380, tok);
  c.classList.remove('press');
}
const gPoint = r => [r.left + Math.min(r.width / 2, 48), r.top + Math.min(r.height / 2, 22)];
function gFind(a){
  let el = a.at && a.at();
  if(!el) return null;
  el.scrollIntoView({block: 'nearest', inline: 'nearest'});
  return el;
}
async function gType(el, a, tok){
  el.classList.remove('g-set'); void el.offsetWidth; el.classList.add('g-set');
  if(el.tagName === 'SELECT'){
    const want = String(a.sel ?? a.v);
    const o = [...el.options].find(o => o.value === want) || [...el.options].find(o => o.text === want || o.text.startsWith(want + ' '));
    await gWait(250, tok);
    if(o){ el.value = o.value; if(a.change) el.dispatchEvent(new Event('change')); }
    return;
  }
  const text = String(a.v), base = a.append ? el.value : '';
  const step = Math.max(1, Math.ceil(text.length / 34));
  for(let k = step; k < text.length + step; k += step){
    if(gSkipping()){ el.value = base + text; break; }
    el.value = base + text.slice(0, k); el.scrollTop = el.scrollHeight; await gWait(26, tok);
  }
}

async function gPlay(a, n, tok){
  if(a.k === 'route'){ for(const x of a.pick()) await gPlay(x, n, tok); return; }
  if(a.skip && a.skip()) return;
  if(a.pre) await a.pre();
  await sleep(40); if(tok !== S.token) throw 'cancel';
  let el = gFind(a);
  if(!el && a.alt) return gPlay(a.alt, n, tok);
  const show = el || $('#jw');
  let r = show.getBoundingClientRect();
  if(!el) r = {left: r.left + r.width / 2 - 60, top: r.top + 120, width: 120, height: 10, right: 0, bottom: r.top + 130};
  gRing(el ? r : null);
  gBubble(r, a, n);
  await gCursor(...gPoint(r), tok);
  if(a.k === 'click'){
    for(let k = 0; k < (a.times || 1); k++) await gPress(tok);
    await gWait(260, tok);
    if(a.post) await a.post();
  } else if(a.k === 'fill'){
    await gWait(250, tok);
    if(el) await gType(el, a, tok);
    if(a.post){ await gWait(300, tok); a.post(); }
    await gWait(650, tok);
  } else if(a.k === 'drag' && el){
    const to = a.to && a.to();
    if(to){
      to.scrollIntoView({block: 'nearest', inline: 'nearest'});
      await gPress(tok);
      r = el.getBoundingClientRect();
      const ghost = el.cloneNode(true);
      ghost.classList.add('g-ghost');
      Object.assign(ghost.style, {left: r.left + 'px', top: r.top + 'px', width: r.width + 'px'});
      el.parentElement.appendChild(ghost);
      const tr = to.getBoundingClientRect();
      const tx = tr.left + Math.min(12, tr.width / 2), ty = a.edge === 'bottom' ? tr.bottom - r.height / 2 : a.edge === 'top' ? tr.top - r.height / 2 : tr.top + 8;
      void ghost.offsetWidth;
      ghost.style.left = tx + 'px'; ghost.style.top = ty + 'px';
      gRing(tr);
      await gCursor(tx + Math.min(r.width / 2, 48), ty + Math.min(r.height / 2, 22), tok);
      await gWait(320, tok);
      ghost.remove();
      // leave the row where it was dropped until the step's command re-renders
      if(a.drop){ to.querySelector('.none')?.remove(); to.appendChild(el); }
    } else await gWait(900, tok);
  } else {
    await gWait(1300 + Math.min(1400, String(a.v || '').length * 18), tok);
  }
  await gWait(280, tok);
}

/* plays each part of a step (parts are joined with &&), then runs that part */
/* the goal card: what this step does, before the pointer starts (→ skips it) */
async function gIntro(cmd, tok){
  const g = gLayer(), box = g.intro;
  GS.cur = 0.5; gPlayer();
  box.innerHTML = `<div class="gi-h"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="12" cy="12" r="5" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="12" cy="12" r="1.6" fill="currentColor"/></svg>Goal of step ${GS.step + 1}</div><p>${goalText(cmd)}</p><small>${GS.total} action${GS.total === 1 ? '' : 's'} to watch · Space pauses · → skips</small>`;
  const r = $('#jw').getBoundingClientRect();
  box.hidden = false;
  box.style.left = r.left + r.width / 2 + 'px';
  box.style.top = r.top + Math.min(r.height * 0.38, 260) + 'px';
  box.classList.remove('in'); void box.offsetWidth; box.classList.add('in');
  try { await gWait(1600 + Math.min(1600, box.textContent.length * 22), tok); }
  finally { box.hidden = true; }
}
async function guidedRun(cmd, tok, stepIdx, from = 1){
  const lis = document.querySelectorAll(`#steps .step[data-k="${stepIdx}"] .how li`);
  const parts = cmd.split(/\s+&&\s+/);
  let n = 0, res = null;
  Object.assign(GS, {active: true, step: stepIdx, cur: 0, total: gCount(cmd), skipTo: from - 1});
  const mark = () => { GS.cur = n; lis.forEach((li, k) => li.classList.toggle('on', k === n - 1)); gPlayer(); };
  if(from === 1 && GS.total) await gIntro(cmd, tok);
  for(const [pi, part] of parts.entries()){
    const acts = guideFor(part);
    for(const a of acts.filter(a => !a.after)){
      n++; mark();
      await gPlay(a, n, tok);
    }
    gRing(null); if(G) G.bub.hidden = true;
    res = await runCommand(part, {typed: !acts.length, token: tok, fresh: pi === 0, snap: pi === parts.length - 1});
    for(const a of acts.filter(a => a.after)){
      n++; mark();
      await gWait(250, tok); await gPlay(a, n, tok);
    }
    if(res && res.ok === false){ if(pi < parts.length - 1) S.j.snapshot(); break; }
  }
  if(n) await gWait(350, tok);
  gHide();
  return res;
}

function renderGuideBtn(){
  const b = $('#guideBtn');
  b.innerHTML = `<svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true"><path d="M4 2l15 10.5-6.6 1.2 3.9 7.4-2.9 1.5-3.9-7.5L4 19.6z" fill="currentColor"/></svg><span class="t">${GUIDE_ON ? 'Guide on' : 'Guide off'}</span>`;
  b.setAttribute('aria-label', GUIDE_ON ? 'Guide on' : 'Guide off');
  b.setAttribute('aria-pressed', GUIDE_ON);
}
$('#guideBtn').addEventListener('click', () => {
  GUIDE_ON = !GUIDE_ON;
  try { localStorage.setItem(GUIDE_KEY, GUIDE_ON ? 'on' : 'off'); } catch(e) {}
  if(!GUIDE_ON) gHide();
  renderGuideBtn();
});
renderGuideBtn();

/* ---------- lesson | playground divider (remembered per browser) ---------- */
const PANE_KEY = 'jira-lab-panes-v1';
const PANE = {ratio: 0.41, max: ''};          // ratio = lesson share; max = 'play' | 'lesson' | ''
try { Object.assign(PANE, JSON.parse(localStorage.getItem(PANE_KEY) || '{}')); } catch(e) {}
function applyPanes(save = true){
  const main = document.querySelector('.main');
  main.style.setProperty('--lesson-fr', PANE.ratio + 'fr');
  main.style.setProperty('--play-fr', (1 - PANE.ratio) + 'fr');
  if(PANE.max) main.dataset.max = PANE.max; else delete main.dataset.max;
  if(save) try { localStorage.setItem(PANE_KEY, JSON.stringify(PANE)); } catch(e) {}
  if(S.j) fitTabs();
}
(() => {
  const dv = $('#paneDivider'), main = document.querySelector('.main');
  const LESSON_MIN = 300, PLAY_MIN = 440, SNAP = 140;   // px; drag closer than SNAP to an edge to minimize
  dv.addEventListener('pointerdown', e => {
    if(e.target.closest('button')) return;
    e.preventDefault();
    dv.setPointerCapture(e.pointerId);
    dv.classList.add('drag'); document.body.classList.add('pane-dragging');
    const r = main.getBoundingClientRect(), w = r.width - 10;
    const move = ev => {
      const x = ev.clientX - r.left - 5;
      if(x < SNAP) PANE.max = 'play';
      else if(w - x < SNAP) PANE.max = 'lesson';
      else {
        PANE.max = '';
        PANE.ratio = Math.min(w - PLAY_MIN, Math.max(LESSON_MIN, x)) / w;
      }
      applyPanes(false);
    };
    const up = () => {
      dv.removeEventListener('pointermove', move); dv.removeEventListener('pointerup', up); dv.removeEventListener('pointercancel', up);
      dv.classList.remove('drag'); document.body.classList.remove('pane-dragging');
      applyPanes();
    };
    dv.addEventListener('pointermove', move); dv.addEventListener('pointerup', up); dv.addEventListener('pointercancel', up);
  });
  dv.addEventListener('dblclick', e => { if(e.target.closest('button')) return; PANE.ratio = 0.41; PANE.max = ''; applyPanes(); });
  dv.addEventListener('click', e => {
    const b = e.target.closest('button'); if(!b) return;
    // ◀ squeezes the lesson, ▶ squeezes the playground; from a minimized side, one click restores the split
    PANE.max = PANE.max ? '' : (b.dataset.dir === 'left' ? 'play' : 'lesson');
    applyPanes();
  });
})();
applyPanes(false);

/* ---------- Timeline: Work list | months border (remembered per browser) ---------- */
const TLW_KEY = 'jira-lab-tl-w-v1';
function setTlW(px, save = true){
  const jw = $('#jw');
  if(px) jw.style.setProperty('--tl-w', px + 'px'); else jw.style.removeProperty('--tl-w');
  if(save) try { px ? localStorage.setItem(TLW_KEY, px) : localStorage.removeItem(TLW_KEY); } catch(e) {}
}
try { const w = +localStorage.getItem(TLW_KEY); if(w) setTlW(w, false); } catch(e) {}
document.addEventListener('pointerdown', e => {
  const h = e.target.closest('#tlRsz'); if(!h) return;
  e.preventDefault();
  h.setPointerCapture(e.pointerId);
  h.classList.add('drag'); document.body.classList.add('tl-dragging');
  const left = h.parentElement, tl = left.closest('.tl');
  const x0 = left.getBoundingClientRect().left;
  let w = left.offsetWidth;
  const move = ev => {
    w = Math.round(Math.min(tl.clientWidth - 120, Math.max(240, ev.clientX - x0)));
    setTlW(w, false);
  };
  const up = () => {
    h.removeEventListener('pointermove', move); h.removeEventListener('pointerup', up); h.removeEventListener('pointercancel', up);
    h.classList.remove('drag'); document.body.classList.remove('tl-dragging');
    setTlW(w);
  };
  h.addEventListener('pointermove', move); h.addEventListener('pointerup', up); h.addEventListener('pointercancel', up);
});
document.addEventListener('dblclick', e => { if(e.target.closest('#tlRsz')) setTlW(0); });

/* ---------- boot ---------- */
renderProgress();
openLesson(location.hash.slice(1) || LESSONS[0].id);
</script>
