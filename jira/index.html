<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Jira Lab — Advanced Programming</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg-0:#06060c;
  --bg-1:#0c0c18;
  --bg-2:#15152a;
  --surface:rgba(255,255,255,0.04);
  --surface-2:rgba(255,255,255,0.07);
  --border:rgba(255,255,255,0.09);
  --border-strong:rgba(255,255,255,0.18);
  --text:#e8e8f3;
  --text-dim:#9a9ab0;
  --text-faint:#666680;
  --accent:#7c5cff;
  --accent-2:#35d0ff;
  --accent-3:#ff6ec7;
  --brand:#2684ff;
  --brand-2:#4c9aff;
  --success:#38d39f;
  --warn:#ffb547;
  --error:#ff5a7a;
  --radius:18px;
  --radius-sm:12px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg-0);color:var(--text);font-family:'Inter',system-ui,sans-serif;height:100%;overflow:hidden}
code,pre,.mono{font-family:'JetBrains Mono',ui-monospace,monospace}
code,pre,.mono,.term-out,.term-in,.jql-bar input,.jql-examples button{font-variant-ligatures:none;font-feature-settings:"liga" 0,"calt" 0}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
body{
  background:
    radial-gradient(1200px 700px at 8% -10%, rgba(38,132,255,0.20), transparent 60%),
    radial-gradient(1000px 600px at 110% 0%,  rgba(124,92,255,0.22), transparent 60%),
    radial-gradient(900px 600px at 50% 130%,  rgba(53,208,255,0.14), transparent 60%),
    linear-gradient(180deg, #050510 0%, #08081a 50%, #050510 100%);
}

/* ---------- layout ---------- */
.app{display:grid;grid-template-columns:272px minmax(0,1fr);height:100vh}
.main{display:grid;grid-template-columns:minmax(0,var(--lesson-fr,0.82fr)) 10px minmax(0,var(--play-fr,1.18fr));min-width:0;min-height:0}
/* draggable border between lesson and playground; drag to an edge to minimize a side */
.pane-divider{position:relative;cursor:col-resize;touch-action:none;display:flex;align-items:center;justify-content:center;z-index:2}
.pane-divider::before{content:"";position:absolute;top:0;bottom:0;left:50%;width:1px;transform:translateX(-50%);background:var(--border);transition:background .15s,width .15s}
.pane-divider:hover::before,.pane-divider.drag::before{width:3px;background:var(--brand)}
.pane-divider .pd-btns{position:relative;display:flex;flex-direction:column;gap:4px;opacity:0;transition:opacity .15s}
.pane-divider:hover .pd-btns,.pane-divider.drag .pd-btns,.main[data-max] .pane-divider .pd-btns{opacity:1}
.pane-divider button{width:18px;height:26px;border-radius:6px;border:1px solid var(--border-strong);background:var(--surface-2);color:var(--text-dim);font-size:10px;line-height:1;padding:0;cursor:pointer}
.pane-divider button:hover{color:#fff;background:var(--brand);border-color:transparent}
.main[data-max="play"]{grid-template-columns:0 10px minmax(0,1fr)}
.main[data-max="lesson"]{grid-template-columns:minmax(0,1fr) 10px 0}
.main[data-max="play"] .lesson-pane,.main[data-max="lesson"] .play-pane{display:none}
.main[data-max="play"] .pd-btns [data-dir="left"],.main[data-max="lesson"] .pd-btns [data-dir="right"]{display:none}
body.pane-dragging{user-select:none;cursor:col-resize}
.main[data-max="lesson"] .pd-btns{transform:translateX(-8px)}
.main[data-max="play"] .pd-btns{transform:translateX(4px)}
.main > .lesson-pane{grid-column:1}
.main > .pane-divider{grid-column:2}
.main > .play-pane{grid-column:3}

/* ---------- sidebar ---------- */
.sidebar{
  padding:22px 14px;overflow-y:auto;scrollbar-width:thin;
  background:linear-gradient(180deg,rgba(12,12,24,0.88),rgba(8,8,18,0.88));
  backdrop-filter:blur(22px) saturate(140%);-webkit-backdrop-filter:blur(22px) saturate(140%);
  border-right:1px solid var(--border);
}
.brand{display:flex;align-items:center;gap:12px;margin-bottom:16px;padding:4px}
.brand-cube{
  width:46px;height:46px;border-radius:12px;flex-shrink:0;
  background:linear-gradient(135deg,var(--brand-2),var(--brand));
  box-shadow:0 12px 30px -10px rgba(38,132,255,0.6),inset 0 0 0 1px rgba(255,255,255,0.25);
  transform:rotate(-6deg);display:flex;align-items:center;justify-content:center;
  animation:floatY 5s ease-in-out infinite;
}
.brand-cube svg{width:26px;height:26px}
@keyframes floatY{0%,100%{transform:rotate(-6deg) translateY(0)}50%{transform:rotate(-2deg) translateY(-4px)}}
.brand h1{margin:0;font-size:17px;font-weight:700;letter-spacing:-0.02em}
.brand .sub{font-size:10.5px;color:var(--text-faint);letter-spacing:0.08em;overflow:hidden;text-overflow:ellipsis;text-transform:uppercase}
.progress{margin:4px 4px 14px;font-size:12px;color:var(--text-dim)}
.progress .bar{height:6px;border-radius:6px;background:var(--surface-2);margin-top:6px;overflow:hidden}
.progress .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--brand),var(--accent));transition:width .5s}
.search{
  width:100%;padding:9px 12px;border-radius:11px;border:1px solid var(--border);
  background:rgba(255,255,255,0.03);color:var(--text);font-size:13px;outline:none;margin-bottom:6px;
}
.search:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(38,132,255,0.2)}
.section-label{font-size:10.5px;letter-spacing:0.16em;text-transform:uppercase;color:var(--text-faint);padding:14px 8px 6px;display:flex;align-items:center;gap:8px}
.section-label .dot{width:7px;height:7px;border-radius:50%}
.lesson-list{list-style:none;margin:0;padding:0}
.lesson-btn{
  width:100%;display:flex;align-items:center;gap:10px;text-align:left;
  padding:8px 10px;border-radius:10px;font-size:13px;color:var(--text-dim);
  border:1px solid transparent;transition:background .15s,color .15s,transform .15s;
}
.lesson-btn:hover{background:var(--surface);color:var(--text);transform:translateX(2px)}
.lesson-btn.active{
  background:linear-gradient(135deg,rgba(38,132,255,0.22),rgba(124,92,255,0.14));
  color:#fff;border-color:rgba(38,132,255,0.35);
}
.lesson-btn .n{
  width:22px;height:22px;border-radius:7px;flex-shrink:0;display:flex;align-items:center;justify-content:center;
  font-size:10.5px;font-weight:700;background:var(--surface-2);color:var(--text-dim);font-family:'JetBrains Mono',monospace;
}
.lesson-btn.done .n{background:rgba(56,211,159,0.18);color:var(--success)}
.lesson-btn.active .n{background:var(--brand);color:#fff}
.lesson-btn .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.back-link{
  display:flex;align-items:center;gap:8px;margin-top:18px;padding:10px 12px;border-radius:10px;
  color:var(--text-dim);font-size:13px;text-decoration:none;border:1px solid var(--border);
}
.back-link:hover{background:var(--surface);color:var(--text);border-color:var(--border-strong)}

/* minimizable sidebar */
.app{transition:grid-template-columns .3s ease}
.collapse-btn{
  margin-left:auto;flex-shrink:0;width:28px;height:28px;border-radius:8px;
  border:1px solid var(--border);background:var(--surface);color:var(--text-dim);font-size:15px;line-height:1;
  transition:background .15s,color .15s,border-color .15s;
}
.collapse-btn:hover{background:var(--surface-2);color:#fff;border-color:var(--border-strong)}
.brand-text{min-width:0;white-space:nowrap;overflow:hidden}
.app.collapsed{grid-template-columns:68px minmax(0,1fr)}
.app.collapsed .sidebar{padding:16px 9px;overflow-x:hidden}
.app.collapsed .brand{flex-direction:column;gap:10px;margin-bottom:12px}
.app.collapsed .brand-text,
.app.collapsed .progress #progText,
.app.collapsed .search,
.app.collapsed .lesson-btn .t,
.app.collapsed .back-link .t{display:none}
.app.collapsed .collapse-btn{margin-left:0}
.app.collapsed .progress{margin:0 2px 6px}
.app.collapsed .section-label{padding:10px 0 6px;justify-content:center;font-size:0;gap:0}
.app.collapsed .section-label .dot{width:22px;height:3px;border-radius:3px}
.app.collapsed .lesson-btn{justify-content:center;padding:6px 0}
.app.collapsed .lesson-btn:hover{transform:none}
.app.collapsed .lesson-btn .n{width:28px;height:28px;font-size:11px}
.app.collapsed .back-link{justify-content:center;padding:10px 0}

/* ---------- lesson pane ---------- */
.lesson-pane{overflow-y:auto;padding:26px 26px 40px;scrollbar-width:thin;min-width:0}
.lesson-head .meta{display:flex;gap:8px;align-items:center;font-size:12px;color:var(--text-faint)}
.level{font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:3px 9px;border-radius:20px}
.level.Beginner{background:rgba(56,211,159,0.15);color:var(--success)}
.level.Intermediate{background:rgba(53,208,255,0.15);color:var(--accent-2)}
.level.Advanced{background:rgba(255,110,199,0.15);color:var(--accent-3)}
.level.Reference{background:rgba(255,181,71,0.15);color:var(--warn)}
.lesson-head h2{margin:10px 0 4px;font-size:26px;letter-spacing:-0.02em;line-height:1.2}
.lesson-head .subtitle{color:var(--text-dim);font-size:14.5px;margin:0 0 18px}
.explain{font-size:14.5px;line-height:1.65;color:#d6d6e6}
.explain .lead{font-size:15.5px;color:var(--text)}
.explain h4{margin:22px 0 8px;font-size:14px;color:#fff;letter-spacing:.01em}
.explain code{background:rgba(255,255,255,0.07);border:1px solid var(--border);padding:1px 6px;border-radius:6px;font-size:12.5px;color:#c7dcff}
.explain pre{margin:0}
.explain pre.code,.mini pre{background:rgba(0,0,0,0.35);border:1px solid var(--border);border-radius:10px;padding:10px 12px;font-size:12px;line-height:1.5;color:#cfd3ff;overflow-x:auto}
.explain ul,.explain ol{padding-left:22px}
.explain li{margin:4px 0}
.explain .g{color:var(--success);font-weight:700}.explain .r{color:var(--error);font-weight:700}
.explain .note{font-size:12.5px;color:var(--text-faint);font-style:italic}
.analogy,.tip,.warn{display:flex;gap:12px;padding:12px 14px;border-radius:12px;margin:14px 0;font-size:14px}
.analogy{background:linear-gradient(135deg,rgba(124,92,255,0.12),rgba(53,208,255,0.06));border:1px solid rgba(124,92,255,0.25)}
.analogy .ico{font-size:22px;line-height:1}
.tip{display:block;background:rgba(56,211,159,0.08);border:1px solid rgba(56,211,159,0.25)}
.tip::before{content:"💡 ";}
.warn{display:block;background:rgba(255,90,122,0.08);border:1px solid rgba(255,90,122,0.3)}
.warn::before{content:"⚠️ ";}
.terms{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:0}
.terms dt{font-weight:700;color:#fff}
.terms dd{margin:0;color:var(--text-dim)}
.flow{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:10px 0}
.flow span{background:var(--surface-2);border:1px solid var(--border);border-radius:9px;padding:6px 10px;font-size:13px}
.flow i{color:var(--brand);font-style:normal;font-weight:700}
.tbl{width:100%;border-collapse:collapse;font-size:13px;margin:8px 0}
.tbl th,.tbl td{border-bottom:1px solid var(--border);padding:7px 8px;text-align:left;vertical-align:top}
.tbl th{color:var(--text-faint);font-weight:600;font-size:11.5px;text-transform:uppercase;letter-spacing:.06em}
.tbl.cheat th{color:var(--brand-2);padding-top:14px}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0}
.mini{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:10px;font-size:13px}
.mini pre{margin:6px 0}
.areas-diagram{display:flex;align-items:stretch;gap:6px;margin:14px 0;flex-wrap:wrap}
.ad{flex:1;min-width:110px;border-radius:12px;padding:10px;border:1px solid var(--border);display:flex;flex-direction:column;gap:3px}
.ad small{color:var(--text-dim);font-size:11.5px;line-height:1.35}
.ad.wd{background:rgba(255,90,122,0.08);border-color:rgba(255,90,122,0.3)}
.ad.st{background:rgba(255,181,71,0.08);border-color:rgba(255,181,71,0.3)}
.ad.rp{background:rgba(56,211,159,0.08);border-color:rgba(56,211,159,0.3)}
.ad-arrow{align-self:center;font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--brand-2);white-space:nowrap}
.legend{list-style:none;padding:0 !important}
.chip{display:inline-flex;align-items:center;justify-content:center;min-width:20px;height:18px;padding:0 5px;border-radius:5px;font-size:10.5px;font-weight:800;font-family:'JetBrains Mono',monospace}
.chip.u{background:rgba(255,90,122,0.2);color:#ff8fa6}
.chip.m{background:rgba(255,181,71,0.2);color:var(--warn)}
.chip.a{background:rgba(56,211,159,0.2);color:var(--success)}
.chip.d{background:rgba(255,90,122,0.2);color:#ff8fa6}
.chip.c{background:var(--error);color:#fff}
.chip.ok{background:rgba(255,255,255,0.08);color:var(--text-dim)}
.chip.ig{background:rgba(255,255,255,0.05);color:var(--text-faint)}
.chip.good{background:rgba(56,211,159,0.2);color:var(--success)}
.chip.bad{background:rgba(255,90,122,0.2);color:#ff8fa6}

/* steps */
.steps-head{display:flex;align-items:center;justify-content:space-between;margin:28px 0 10px}
.steps-head h3{margin:0;font-size:16px}
.steps-head small{color:var(--text-faint);font-size:12px}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.step{
  display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:start;
  padding:10px 12px;border-radius:12px;background:var(--surface);border:1px solid var(--border);
  transition:border-color .25s,background .25s,opacity .25s;
}
.step .num{width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;background:var(--surface-2);color:var(--text-dim)}
.step code{font-size:12.5px;color:#c7dcff;word-break:break-word}
.step p{margin:5px 0 0;font-size:13px;line-height:1.5;color:var(--text-dim)}
.step p code{background:rgba(255,255,255,0.07);padding:0 5px;border-radius:5px;font-size:11.5px}
.step .go{width:28px;height:28px;border-radius:8px;background:var(--surface-2);color:var(--text-dim);font-size:11px;transition:background .15s,color .15s}
.step .go:hover{background:var(--brand);color:#fff}
.step.done{opacity:.62}
.step.done .num{background:rgba(56,211,159,0.2);color:var(--success)}
.step.current{border-color:rgba(38,132,255,0.55);background:linear-gradient(135deg,rgba(38,132,255,0.14),rgba(124,92,255,0.08));opacity:1}
.step.current .num{background:var(--brand);color:#fff}
.step.next{border-style:dashed;border-color:rgba(38,132,255,0.4)}

/* quiz */
.quiz{margin-top:26px;padding:16px;border-radius:14px;background:linear-gradient(135deg,rgba(53,208,255,0.08),rgba(124,92,255,0.08));border:1px solid rgba(53,208,255,0.22)}
.quiz h3{margin:0 0 4px;font-size:13px;text-transform:uppercase;letter-spacing:.1em;color:var(--accent-2)}
.quiz .q{font-size:14.5px;font-weight:600;margin:4px 0 10px}
.quiz button.opt{display:block;width:100%;text-align:left;padding:9px 12px;margin:6px 0;border-radius:10px;background:var(--surface);border:1px solid var(--border);font-size:13.5px;color:var(--text);transition:border-color .15s}
.quiz button.opt:hover{border-color:var(--border-strong)}
.quiz button.opt.right{border-color:var(--success);background:rgba(56,211,159,0.12)}
.quiz button.opt.wrong{border-color:var(--error);background:rgba(255,90,122,0.1)}
.quiz .why{font-size:13px;color:var(--text-dim);margin-top:8px}
.pager{display:flex;justify-content:space-between;gap:10px;margin-top:26px}
.pager button{padding:10px 14px;border-radius:11px;border:1px solid var(--border);background:var(--surface);font-size:13px;color:var(--text-dim);max-width:48%;text-align:left}
.pager button:hover{color:#fff;border-color:var(--border-strong)}
.pager button.next{text-align:right;margin-left:auto}
.pager small{display:block;font-size:11px;color:var(--text-faint)}

/* ---------- playground ---------- */
.play-pane{display:grid;grid-template-rows:auto auto minmax(0,1fr);min-width:0;min-height:0;padding:14px 16px 16px;gap:10px}
.play-pane > .narr{grid-row:2}
.play-pane > .jw{grid-row:3}
.lab-bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;container-type:inline-size}
/* Home sits in the top-right corner; when the bar gets narrow, the tag goes first, then Home's label */
.home-btn{text-decoration:none;margin-left:auto}
@container (max-width:830px){ .lab-bar .lab-tag{display:none} }
@container (max-width:720px){ .home-btn .t{display:none} }
@container (max-width:660px){ #guideBtn .t,#dayBtn .t{display:none} }
.lab-tag{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--text-faint);padding:5px 9px;border:1px dashed var(--border-strong);border-radius:8px}
.spacer{flex:1}
.btn{padding:8px 13px;border-radius:10px;font-size:13px;font-weight:600;border:1px solid var(--border);background:var(--surface);color:var(--text);display:inline-flex;align-items:center;gap:6px;transition:background .15s,border-color .15s,transform .1s}
.btn:hover{border-color:var(--border-strong);background:var(--surface-2)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:linear-gradient(135deg,var(--brand-2),var(--brand));border-color:transparent;color:#fff;box-shadow:0 8px 24px -10px rgba(38,132,255,0.7)}
.btn.primary:hover{filter:brightness(1.08)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn .k{font-size:10.5px;opacity:.75;font-family:'JetBrains Mono',monospace}
.narr{
  min-height:44px;padding:10px 14px;border-radius:12px;font-size:13.5px;line-height:1.5;
  background:linear-gradient(135deg,rgba(38,132,255,0.12),rgba(124,92,255,0.08));border:1px solid rgba(38,132,255,0.28);
}
.narr b.stepno{color:var(--brand-2);margin-right:6px;font-size:12px;text-transform:uppercase;letter-spacing:.06em}
.narr code{background:rgba(255,255,255,0.08);padding:0 5px;border-radius:5px;font-size:12px;color:#c7dcff}
.narr .chip{vertical-align:1px}
.narr.flash{animation:narrFlash .7s ease}
@keyframes narrFlash{from{box-shadow:0 0 0 3px rgba(38,132,255,0.45)}to{box-shadow:0 0 0 0 rgba(38,132,255,0)}}

/* ---------- Jira views ---------- */
.o-auto{color:#c4b5fd}.o-hash{color:#9cc4ff}
.auto-tag{font-family:'JetBrains Mono',monospace;font-size:12px;color:#c4b5fd;background:rgba(167,139,250,.12);padding:1px 6px;border-radius:5px}
.p-key{color:#9cc4ff}

/* issue-type icons, avatars, priorities, lozenges */
.ti{display:inline-flex;align-items:center;justify-content:center;width:16px;height:16px;border-radius:4px;flex-shrink:0;vertical-align:-3px;color:#fff;font-size:10px;font-weight:800;line-height:1}
.ti.Epic{background:#8b5cf6}.ti.Epic::after{content:"⚡";font-size:9px}
.ti.Story{background:#22a06b}.ti.Story::after{content:"";width:6px;height:8px;background:#fff;clip-path:polygon(0 0,100% 0,100% 100%,50% 70%,0 100%)}
.ti.Task{background:#2684ff}.ti.Task::after{content:"✓"}
.ti.Bug{background:#e5484d}.ti.Bug::after{content:"";width:6px;height:6px;border-radius:50%;background:#fff}
.ti.Sub-task{background:#4ba3c7}.ti.Sub-task::after{content:"↳";font-size:10px}
.av{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:50%;font-size:9.5px;font-weight:800;color:#0b0b14;flex-shrink:0}
.av.none{background:rgba(255,255,255,0.08);color:var(--text-faint);border:1px dashed var(--border-strong)}
.pri{font-size:12px;font-weight:800;width:14px;text-align:center;flex-shrink:0}
.pri.Highest{color:#ff5a7a}.pri.High{color:#ff8a5c}.pri.Medium{color:#ffb547}.pri.Low{color:#4c9aff}.pri.Lowest{color:#7dd3fc}
.lz{display:inline-block;font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;padding:2px 6px;border-radius:4px;white-space:nowrap}
.lz.todo{background:rgba(255,255,255,0.1);color:#d0d0de}
.lz.inprogress{background:rgba(38,132,255,0.22);color:#9cc4ff}
.lz.done{background:rgba(56,211,159,0.2);color:#6ee7b7}
.pts{display:inline-flex;align-items:center;justify-content:center;min-width:20px;height:18px;padding:0 5px;border-radius:9px;background:rgba(255,255,255,0.1);font-size:11px;font-weight:700;color:#dcdcea}
.pts.none{opacity:.35}
.epic-chip{font-size:10.5px;font-weight:700;padding:1px 6px;border-radius:4px;background:rgba(139,92,246,0.2);color:#c4b5fd;white-space:nowrap;max-width:120px;overflow:hidden;text-overflow:ellipsis}
.label-chip{font-size:10.5px;padding:1px 6px;border-radius:4px;background:rgba(255,255,255,0.07);color:var(--text-dim);border:1px solid var(--border)}
.empty-state{padding:34px 18px;text-align:center;color:var(--text-faint);font-size:13.5px;line-height:1.6}
.empty-state b{color:var(--text-dim)}

/* board */
.board-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:12px 14px 0}
.board-head h4{margin:0;font-size:14px}
.board-head .goal{font-size:12.5px;color:var(--text-dim)}
.board-head .days{margin-left:auto;font-size:12px;color:var(--text-faint)}
.board{display:flex;gap:10px;padding:12px 14px 14px;align-items:stretch;min-height:calc(100% - 40px)}
.col{flex:1 0 170px;min-width:170px;background:rgba(255,255,255,0.03);border:1px solid var(--border);border-radius:12px;display:flex;flex-direction:column;transition:background .25s,border-color .25s}
.col-head{display:flex;align-items:center;gap:6px;padding:10px 10px 6px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--text-dim)}
.col-head .n{color:var(--text-faint);font-weight:600}
.col-head .wip{margin-left:auto;font-size:10.5px;padding:1px 6px;border-radius:5px;background:rgba(255,255,255,0.07)}
.col.over{background:rgba(255,90,122,0.09);border-color:rgba(255,90,122,0.5)}
.col.over .wip{background:var(--error);color:#fff}
.col.drop{border-color:var(--brand);background:rgba(38,132,255,0.08)}
.col-body{display:flex;flex-direction:column;gap:8px;padding:4px 8px 10px;flex:1;min-height:60px}
.card{background:#171829;border:1px solid var(--border);border-radius:10px;padding:9px 10px;cursor:grab;box-shadow:0 4px 14px -8px rgba(0,0,0,.8);transition:box-shadow .3s,border-color .3s;position:relative}
.card:hover{border-color:var(--border-strong)}
.card:active{cursor:grabbing}
.card .sum{font-size:13px;line-height:1.35;color:var(--text);margin-bottom:8px}
.card .meta{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--text-dim)}
.card .meta .key{font-family:'JetBrains Mono',monospace;font-size:11px;white-space:nowrap}
.card .meta .grow{flex:1}
.card .chips{display:flex;gap:4px;flex-wrap:wrap;margin:-2px 0 7px}
.card.flagged{background:#2a2115;border-color:rgba(255,181,71,0.45)}
.card.flagged::before{content:"⚑";position:absolute;top:7px;right:9px;color:var(--warn);font-size:12px}
.card.done .sum{color:var(--text-dim)}
.card.done .key{text-decoration:line-through}
.card.hl{box-shadow:0 0 0 2px var(--brand),0 10px 30px -10px rgba(38,132,255,.6)}
.card.blocked .key::after{content:" ⛔";font-size:10px}
.card.dragging{opacity:.4}
.pop-in{animation:popIn .45s cubic-bezier(.3,1.5,.5,1)}
@keyframes popIn{from{transform:scale(.6);opacity:0}}

/* backlog */
.bl{display:grid;grid-template-columns:190px minmax(0,1fr);gap:12px;padding:12px 14px;min-width:620px}
.epics{display:flex;flex-direction:column;gap:8px}
.epics h5,.bl-main h5{margin:0 0 2px;font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--text-faint)}
.epic-card{border:1px solid rgba(139,92,246,0.35);background:rgba(139,92,246,0.08);border-radius:10px;padding:8px 9px;font-size:12.5px;cursor:pointer}
.epic-card .k{font-family:'JetBrains Mono',monospace;font-size:10.5px;color:var(--text-faint)}
.epic-card .bar{height:5px;border-radius:5px;background:rgba(255,255,255,0.08);margin-top:6px;overflow:hidden}
.epic-card .bar i{display:block;height:100%;background:var(--success);transition:width .6s}
.epic-card .pct{font-size:10.5px;color:var(--text-faint);margin-top:3px}
.bl-main{display:flex;flex-direction:column;gap:12px;min-width:0}
.sprint-box{border:1px solid var(--border);border-radius:12px;background:rgba(255,255,255,0.025);transition:border-color .2s,background .2s}
.sprint-box.active{border-color:rgba(38,132,255,0.45)}
.sprint-box.drop{border-color:var(--brand);background:rgba(38,132,255,0.08)}
.sb-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:9px 12px;border-bottom:1px solid var(--border);font-size:13px}
.sb-head b{font-size:13.5px}
.sb-head .state{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;padding:2px 6px;border-radius:4px;background:rgba(255,255,255,0.08);color:var(--text-dim)}
.sb-head .state.active{background:rgba(38,132,255,0.25);color:#9cc4ff}
.sb-head .goal{color:var(--text-dim);font-size:12px}
.sb-head .tot{margin-left:auto;font-size:12px;color:var(--text-faint)}
.rows{display:flex;flex-direction:column;min-height:34px}
.row{display:grid;grid-template-columns:18px 64px minmax(0,1fr) auto auto 28px 24px;gap:8px;align-items:center;padding:6px 12px;border-bottom:1px solid rgba(255,255,255,0.04);font-size:12.5px;cursor:grab;transition:background .3s}
.row:last-child{border-bottom:none}
.row:hover{background:rgba(255,255,255,0.03)}
.row .key{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--text-dim)}
.row .sum{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row.hl{background:rgba(38,132,255,0.14)}
.row.done .sum{color:var(--text-faint);text-decoration:line-through}
.row.flagged{background:rgba(255,181,71,0.08)}
.rows .none{padding:10px 12px;font-size:12px;color:var(--text-faint);font-style:italic}

/* issue */
.issue{display:grid;grid-template-columns:minmax(0,1fr) 230px;gap:16px;padding:14px 16px;min-width:560px}
.issue .crumbs{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text-dim);margin-bottom:6px;font-family:'JetBrains Mono',monospace}
.issue h3{margin:0 0 12px;font-size:19px;line-height:1.3}
.issue h6{margin:16px 0 6px;font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--text-faint)}
.issue .desc{white-space:pre-wrap;font-size:13px;line-height:1.55;color:#d6d6e6;background:rgba(255,255,255,0.03);border:1px solid var(--border);border-radius:10px;padding:10px 12px}
.issue .desc.empty{color:var(--text-faint);font-style:italic}
.ilist{display:flex;flex-direction:column;border:1px solid var(--border);border-radius:10px;overflow:hidden}
.ilist .it{display:flex;align-items:center;gap:8px;padding:6px 10px;font-size:12.5px;border-bottom:1px solid rgba(255,255,255,0.05)}
.ilist .it:last-child{border-bottom:none}
.ilist .it .key{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--text-dim)}
.ilist .it .rel{font-size:11.5px;color:var(--text-faint);min-width:88px}
.ilist .it .sum{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.progress-line{display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--text-faint);margin:-2px 0 6px}
.progress-line .bar{flex:1;height:5px;border-radius:5px;background:rgba(255,255,255,0.08);overflow:hidden}
.progress-line .bar i{display:block;height:100%;background:var(--success);transition:width .6s}
.comment{display:flex;gap:9px;margin-bottom:9px}
.comment .body{flex:1;font-size:13px;line-height:1.5}
.comment .who{font-size:12px;color:var(--text-dim)}
.comment .who b{color:var(--text)}
.comment.auto .body{color:#c4b5fd}
.hist{font-size:12px;color:var(--text-dim);display:flex;flex-direction:column;gap:5px}
.hist .h{display:flex;gap:6px;align-items:baseline;flex-wrap:wrap}
.hist .d{font-family:'JetBrains Mono',monospace;font-size:10.5px;color:var(--text-faint);min-width:40px}
.hist .h .arrow{color:var(--text-faint)}
.hist .h.fresh{color:var(--text)}
.dev{display:flex;flex-direction:column;gap:4px;font-size:12px;font-family:'JetBrains Mono',monospace;color:var(--text-dim)}
.fields{border:1px solid var(--border);border-radius:12px;padding:6px 12px;background:rgba(255,255,255,0.025);align-self:start}
.fields .f{display:grid;grid-template-columns:86px 1fr;gap:8px;align-items:center;padding:7px 0;border-bottom:1px solid rgba(255,255,255,0.05);font-size:12.5px}
.fields .f:last-child{border-bottom:none}
.fields .f > span:first-child{color:var(--text-faint);font-size:11.5px}
.fields .f .v{display:flex;align-items:center;gap:6px;flex-wrap:wrap;min-width:0}
.fields .f.flash{animation:fieldFlash 1.2s ease}
@keyframes fieldFlash{0%{background:rgba(38,132,255,0.35)}100%{background:transparent}}

/* workflow */
.wf{padding:10px 14px}
.wf svg{display:block;width:100%;height:auto}
.wf .node rect{stroke-width:1.5}
.wf .node text{font-family:'Inter',sans-serif;font-size:12.5px;font-weight:700;dominant-baseline:central;text-anchor:middle}
.wf .node.todo rect{fill:rgba(255,255,255,0.08);stroke:rgba(255,255,255,0.3)}.wf .node.todo text{fill:#e1e1ec}
.wf .node.inprogress rect{fill:rgba(38,132,255,0.18);stroke:#4c9aff}.wf .node.inprogress text{fill:#bcd6ff}
.wf .node.done rect{fill:rgba(56,211,159,0.16);stroke:#38d39f}.wf .node.done text{fill:#a7f3d0}
.wf .node .cnt{font-size:10.5px;font-weight:600;fill:var(--text-faint)}
.wf .edge{fill:none;stroke:rgba(255,255,255,0.35);stroke-width:1.6}
.wf .edge.back{stroke-dasharray:4 3}
.wf .edge.hot{stroke:var(--brand);stroke-width:3;animation:hot 1.4s ease}
@keyframes hot{0%{stroke-width:6;stroke:#fff}100%{stroke-width:3}}
.wf .any{font-size:12px;fill:var(--text-dim);font-family:'Inter',sans-serif}
.wf-note{font-size:12.5px;color:var(--text-dim);padding:2px 14px 14px;line-height:1.55}
.wf-legend{display:flex;gap:12px;flex-wrap:wrap;padding:0 14px 6px;font-size:11.5px;color:var(--text-faint)}

/* reports */
.reports{padding:12px 14px;display:flex;flex-direction:column;gap:14px;min-width:540px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}
.tile{border:1px solid var(--border);border-radius:12px;padding:10px 12px;background:rgba(255,255,255,0.03)}
.tile .lbl{font-size:11px;color:var(--text-faint);text-transform:uppercase;letter-spacing:.08em}
.tile .num{font-size:24px;font-weight:800;margin-top:2px;font-variant-numeric:tabular-nums}
.tile .sub{font-size:11.5px;color:var(--text-dim)}
.chart{border:1px solid var(--border);border-radius:12px;padding:10px 12px 8px;background:rgba(255,255,255,0.025);position:relative}
.chart h5{margin:0;font-size:13px}
.chart .cap{font-size:11.5px;color:var(--text-faint);margin:2px 0 6px}
.chart .legend{display:flex;gap:14px;font-size:11.5px;color:var(--text-dim);margin-bottom:4px;flex-wrap:wrap}
.chart .legend i{display:inline-block;width:14px;height:3px;border-radius:2px;vertical-align:middle;margin-right:5px}
.chart .legend i.sq{height:10px;width:10px;border-radius:3px}
.chart svg{display:block;width:100%;max-width:600px;height:auto;overflow:visible}
.play-pane .tab{padding:6px 9px}
.play-pane .btn{padding:8px 11px}
.chart .grid line{stroke:rgba(255,255,255,0.07)}
.chart .axis text{fill:var(--text-faint);font-size:10.5px;font-family:'Inter',sans-serif}
.chart .vlabel{fill:var(--text-dim);font-size:10.5px;font-weight:600;font-family:'Inter',sans-serif}
.chart .today{stroke:rgba(255,255,255,0.35);stroke-dasharray:2 3}
.chart .cross{stroke:rgba(255,255,255,0.4);pointer-events:none}
.tip-box{position:absolute;pointer-events:none;background:#0b0b16;border:1px solid var(--border-strong);border-radius:8px;padding:6px 9px;font-size:11.5px;line-height:1.5;color:var(--text);white-space:nowrap;box-shadow:0 10px 24px -8px rgba(0,0,0,.8);z-index:5}
.tip-box i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:5px}
.rtable{width:100%;border-collapse:collapse;font-size:12.5px}
.rtable th,.rtable td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--border)}
.rtable th{font-size:11px;color:var(--text-faint);text-transform:uppercase;letter-spacing:.06em;font-weight:600}
.rtable td.num{font-variant-numeric:tabular-nums;text-align:right}
.rtable th.num{text-align:right}

/* search */
.search-view{padding:12px 14px;min-width:560px}
.jql-bar{display:flex;gap:8px;margin-bottom:10px}
.jql-bar input{flex:1;font-family:'JetBrains Mono',monospace;font-size:12.5px;padding:9px 12px;border-radius:10px;border:1px solid var(--border-strong);background:#0b0b16;color:#fff;outline:none}
.jql-bar input:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(38,132,255,0.25)}
.jql-bar .btn{padding:8px 12px}
.jql-err{font-size:12.5px;color:#ff9db1;background:rgba(255,90,122,0.1);border:1px solid rgba(255,90,122,0.35);border-radius:10px;padding:8px 12px;margin-bottom:10px}
.jql-count{font-size:12px;color:var(--text-faint);margin-bottom:6px}
.jql-examples{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.jql-examples button{font-family:'JetBrains Mono',monospace;font-size:11px;padding:4px 8px;border-radius:7px;border:1px solid var(--border);background:var(--surface);color:var(--text-dim)}
.jql-examples button:hover{color:#fff;border-color:var(--border-strong)}
.rtable tr.click{cursor:pointer}
.rtable tr.click:hover td{background:rgba(255,255,255,0.03)}

/* ---------- Jira workspace (looks like Jira Cloud, follows the lab theme) ---------- */
.jw{
  /* Atlassian-style tokens, dark */
  --j-bg:#1f1f21; --j-sunken:#18191a; --j-raised:#242528; --j-overlay:#2b2c2f;
  --j-hover:rgba(206,206,217,0.08); --j-press:rgba(206,206,217,0.14); --j-sel:#1c2b42;
  --j-blue:#669df1; --j-blue-solid:#357de8; --j-on-blue:#1f1f21;
  --j-lz-todo-bg:#3d3f43; --j-lz-todo:#cecfd2; --j-lz-prog-bg:#123263; --j-lz-prog:#8fb8f6; --j-lz-done-bg:#1c3329; --j-lz-done:#7ee2b8;
  --j-status-todo:#738496; --j-status-prog:#1d7afc; --j-status-done:#1f845a;
  --j-shadow:0 1px 1px rgba(1,4,4,.5), 0 0 1px rgba(1,4,4,.5);
  --j-shadow-o:0 8px 12px rgba(1,4,4,.36), 0 0 1px rgba(1,4,4,.5);
  --text:#cecfd2; --text-dim:#a9abaf; --text-faint:#96999e;
  --border:rgba(206,206,217,0.14); --border-strong:rgba(206,206,217,0.26);
  --surface:var(--j-hover); --surface-2:var(--j-press); --brand:var(--j-blue); --brand-2:var(--j-blue);
  --success:#7ee2b8; --warn:#fbc828; --error:#fd9891;
  position:relative; min-height:0; min-width:0; display:flex; flex-direction:column; overflow:hidden;
  background:var(--j-bg); color:var(--text); border:1px solid var(--border); border-radius:12px;
  font-family:"Atlassian Sans",ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Ubuntu,"Helvetica Neue",sans-serif;
  font-size:14px; box-shadow:0 20px 50px -25px rgba(0,0,0,.8);
}
:root[data-theme="light"] .jw{
  --j-bg:#ffffff; --j-sunken:#f8f8f8; --j-raised:#ffffff; --j-overlay:#ffffff;
  --j-hover:rgba(5,21,36,0.06); --j-press:rgba(8,22,39,0.12); --j-sel:#e9f2fe;
  --j-blue:#1868db; --j-blue-solid:#1868db; --j-on-blue:#ffffff;
  --j-lz-todo-bg:#dddee1; --j-lz-todo:#292a2e; --j-lz-prog-bg:#cfe1fd; --j-lz-prog:#1558bc; --j-lz-done-bg:#baf3db; --j-lz-done:#216e4e;
  --j-status-todo:#8590a2; --j-status-prog:#1d7afc; --j-status-done:#22a06b;
  --j-shadow:0 1px 1px rgba(30,31,33,.25), 0 0 1px rgba(30,31,33,.31);
  --j-shadow-o:0 8px 12px rgba(30,31,33,.15), 0 0 1px rgba(30,31,33,.31);
  --text:#292a2e; --text-dim:#505258; --text-faint:#6b6e76;
  --border:rgba(11,18,14,0.14); --border-strong:rgba(11,18,14,0.28);
  --success:#216e4e; --warn:#a54800; --error:#ae2e24;
  box-shadow:0 20px 50px -30px rgba(30,40,90,.35);
}
.jw button{font:inherit;color:inherit}
.jw .spacer{flex:1}

/* top navigation */
.jw-top{display:flex;align-items:center;gap:6px;padding:8px 10px;border-bottom:1px solid var(--border);flex-shrink:0}
.jw-ibtn{width:32px;height:32px;border-radius:6px;display:inline-flex;align-items:center;justify-content:center;color:var(--text-dim);flex-shrink:0}
.jw-ibtn:hover{background:var(--j-hover);color:var(--text)}
.jw-ibtn svg{width:16px;height:16px}
.jw-logo{display:inline-flex;align-items:center;gap:7px;font-weight:653;font-size:15px;padding:0 6px 0 2px;flex-shrink:0}
.jw-mark{width:24px;height:24px;border-radius:6px;background:var(--j-blue-solid);display:inline-flex;align-items:center;justify-content:center}
.jw-mark svg{width:15px;height:15px}
.jw-search{flex:1 1 200px;max-width:420px;min-width:110px;display:flex;align-items:center;gap:7px;height:32px;padding:0 10px;border:1px solid var(--border-strong);border-radius:6px;color:var(--text-faint);margin-left:6px}
.jw-search:focus-within{border-color:var(--j-blue);box-shadow:inset 0 0 0 1px var(--j-blue)}
.jw-search svg{width:14px;height:14px;flex-shrink:0}
.jw-search input{flex:1;min-width:0;border:none;outline:none;background:transparent;color:var(--text);font:inherit;font-size:14px}
.jw-create{height:32px;padding:0 12px;border-radius:6px;background:var(--j-blue-solid);color:var(--j-on-blue)!important;font-weight:600!important;display:inline-flex;align-items:center;gap:6px;flex-shrink:0}
.jw-create b{font-size:17px;font-weight:500;line-height:1}
.jw-create:hover{filter:brightness(1.1)}
.jw-create:disabled{opacity:.45;cursor:not-allowed;filter:none}
.av.me{width:24px;height:24px;font-size:11px;background:#4c9aff;color:#0b1d3a;margin:0 4px}

/* project header + tabs */
.jw-proj{padding:12px 18px 0;flex-shrink:0}
.jw-crumb{font-size:12px;color:var(--text-faint);margin-bottom:4px}
.jw-ptitle{display:flex;align-items:center;gap:10px}
.jw-ptitle h3{margin:0;font-size:20px;font-weight:653;letter-spacing:-.01em;color:var(--text)}
.jw-pav{width:24px;height:24px;border-radius:6px;display:inline-flex;align-items:center;justify-content:center;font-size:14px;background:linear-gradient(135deg,#ff8f73,#f15b50);flex-shrink:0}
.jw-pmeta{font-size:12px;color:var(--text-faint);margin-left:4px}
.jw-pbtn{margin-left:auto;height:32px;padding:0 12px;border-radius:6px;border:1px solid var(--border-strong);font-weight:500;font-size:14px}
.jw-pbtn:hover{background:var(--j-hover)}
.jw-pbtn.primary{background:var(--j-blue-solid);color:var(--j-on-blue)!important;border-color:transparent}
.jw-tabs{display:flex;gap:2px;padding:6px 12px 0;border-bottom:1px solid var(--border);overflow-x:auto;scrollbar-width:none;flex-shrink:0}
.jw-tabs::-webkit-scrollbar{display:none}
.jw-tabs .tab{position:relative;padding:8px 8px 10px;border-radius:4px 4px 0 0;font-size:14px;font-weight:500;color:var(--text-dim);background:none;box-shadow:none;white-space:nowrap}
.jw-tabs .tab:hover{color:var(--text);background:var(--j-hover)}
.jw-tabs .tab.active,:root[data-theme="light"] .jw-tabs .tab.active{color:var(--j-blue);background:none;box-shadow:none}
.jw-tabs .tab.active::after{content:"";position:absolute;left:8px;right:8px;bottom:-1px;height:2px;border-radius:2px;background:var(--j-blue)}
.jw-tabs .tab:disabled{opacity:.4;cursor:default}
.jw-body{flex:1;min-height:0;overflow:auto;position:relative;scrollbar-width:thin}

/* Jira look for the shared pieces */
.jw .lz{border-radius:3px;font-size:11px;font-weight:653;padding:1px 4px;letter-spacing:.02em}
.jw .lz.todo{background:var(--j-lz-todo-bg);color:var(--j-lz-todo)}
.jw .lz.inprogress{background:var(--j-lz-prog-bg);color:var(--j-lz-prog)}
.jw .lz.done{background:var(--j-lz-done-bg);color:var(--j-lz-done)}
.jw .ti{border-radius:3px}
.jw .av{color:#1f1f21}
.jw .av.none{background:var(--j-hover);color:var(--text-faint)}
.jw .pts{background:var(--j-lz-todo-bg);color:var(--j-lz-todo)}
.jw .epic-chip{background:rgba(150,74,192,0.18);color:#d8a0f7;border-radius:3px}
:root[data-theme="light"] .jw .epic-chip{background:#f8eefe;color:#803fa5}
.jw .label-chip{border-radius:3px;background:var(--j-hover)}
.jw .empty-state b{color:var(--text)}

/* board */
.bd-tools{display:flex;align-items:center;gap:10px;padding:14px 18px 2px;flex-wrap:wrap}
.bd-search{display:flex;align-items:center;gap:6px;height:32px;width:180px;padding:0 9px;border:1px solid var(--border-strong);border-radius:6px;color:var(--text-faint)}
.bd-search svg{width:13px;height:13px}
.bd-search input{flex:1;min-width:0;border:none;outline:none;background:transparent;color:var(--text);font:inherit;font-size:14px}
.bd-avs{display:flex;align-items:center}
.bd-avs .av{width:28px;height:28px;font-size:11px;margin-left:-4px;box-shadow:0 0 0 2px var(--j-bg);cursor:pointer}
.bd-avs .av.on{box-shadow:0 0 0 2px var(--j-bg),0 0 0 4px var(--j-blue)}
.bd-tools .days{margin-left:auto;font-size:12px;color:var(--text-faint)}
.jw .board-head{padding:12px 18px 0}
.jw .board-head h4{font-size:16px;font-weight:653}
.jw .board{gap:12px;padding:12px 18px 18px}
.jw .col{background:var(--j-sunken);border:none;border-radius:8px}
:root[data-theme="light"] .jw .col{background:#f8f8f8}
.jw .col-head{font-size:12px;font-weight:600;letter-spacing:.02em;color:var(--text-dim);padding:12px 12px 6px}
.jw .col-head .lz{background:none;color:var(--text-dim);padding:0;font-size:12px;font-weight:600}
.jw .col.drop{background:var(--j-sel);outline:2px dashed var(--j-blue);outline-offset:-2px}
.jw .col.over{background:rgba(253,152,145,0.12)}
.jw .col-body{gap:4px;padding:2px 6px 8px}
.jw .card{background:var(--j-raised);border:none;border-radius:6px;padding:10px 12px;box-shadow:var(--j-shadow)}
.jw .card:hover{background:color-mix(in srgb,var(--j-raised) 92%,#888)}
.jw .card .sum{font-size:14px;line-height:1.43;color:var(--text)}
.jw .card.done .sum{text-decoration:none;color:var(--text-dim)}
.jw .card.flagged{background:color-mix(in srgb,var(--j-raised) 85%,#fbc828)}
.jw .card .meta .key{font-size:12px;font-family:inherit;font-weight:600;color:var(--text-dim)}
.jw .card.done .meta .key{text-decoration:line-through}
.jw .card.hide{display:none}

/* backlog / issue lists / reports adapt via tokens */
.jw .sprint-box{background:var(--j-sunken);border:none;border-radius:8px}
.jw .row{background:var(--j-raised);border-bottom:1px solid var(--border)}
.jw .row .key{font-family:inherit;font-weight:600}
.jw .chart,.jw .tile,.jw .fields{background:var(--j-raised);border-color:var(--border)}
.jw .tip-box{background:var(--j-overlay);box-shadow:var(--j-shadow-o)}

/* summary */
.sm{padding:16px 18px 22px;display:flex;flex-direction:column;gap:14px}
.sm-hello{font-size:14px;color:var(--text-dim)}
.sm-tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}
.sm-tile{display:flex;align-items:center;gap:10px;padding:12px;border:1px solid var(--border);border-radius:8px;background:var(--j-raised)}
.sm-tile .ico{width:32px;height:32px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:16px;background:var(--j-hover);flex-shrink:0}
.sm-tile b{display:block;font-size:14px;font-weight:653;white-space:nowrap}
.sm-tile small{display:block;font-size:12px;color:var(--text-faint);margin-top:2px}
.sm-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}
.sm-card{border:1px solid var(--border);border-radius:8px;padding:16px;background:var(--j-raised);min-width:0}
.sm-card h4{margin:0 0 2px;font-size:16px;font-weight:653}
.sm-card .sub{font-size:12px;color:var(--text-faint);margin-bottom:12px}
.sm-donut{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.sm-donut svg{width:150px;height:150px;flex-shrink:0}
.sm-donut .ctr b{font-size:26px;font-weight:653;fill:var(--text)}
.sm-donut .ctr small{font-size:11px;fill:var(--text-faint)}
.sm-legend{display:flex;flex-direction:column;gap:8px;font-size:14px}
.sm-legend span{display:flex;align-items:center;gap:8px}
.sm-legend i{width:12px;height:12px;border-radius:3px;flex-shrink:0}
.sm-legend em{font-style:normal;color:var(--text-faint);margin-left:4px}
.sm-feed{display:flex;flex-direction:column;gap:12px;max-height:260px;overflow:auto;scrollbar-width:thin}
.sm-feed .it{display:flex;gap:10px;font-size:13px;line-height:1.45}
.sm-feed .it .av{flex-shrink:0;margin-top:1px}
.sm-feed .it .when{display:block;font-size:12px;color:var(--text-faint)}
.sm-feed .it a{color:var(--j-blue);cursor:pointer;font-weight:500}
.sm-bars svg{width:100%;height:auto;display:block}
.sm-bars text{font-size:11px;fill:var(--text-dim)}
.sm-bars .grid line{stroke:var(--border)}
.sm-rows{display:flex;flex-direction:column;gap:10px}
.sm-rows .r{display:grid;grid-template-columns:minmax(0,130px) 1fr;align-items:center;gap:10px;font-size:13px}
.sm-rows .r .n{display:flex;align-items:center;gap:7px;min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.sm-rows .meter{height:24px;border-radius:4px;background:var(--j-hover);position:relative;overflow:hidden}
.sm-rows .meter i{position:absolute;inset:0 auto 0 0;background:var(--j-lz-todo-bg);border-radius:4px}
.sm-rows .meter span{position:relative;padding-left:8px;line-height:24px;font-size:12px;font-weight:600;color:var(--text)}
.sm-epic .meter{height:8px}
.sm-epic .meter i{background:var(--j-status-done)}
.sm-empty{font-size:13px;color:var(--text-faint);padding:6px 0}
.sm-hit{cursor:default}

/* list */
.ls{padding:14px 18px 20px}
.ls-bar{display:flex;gap:8px;align-items:center;margin-bottom:10px;flex-wrap:wrap}
.ls-bar .jql-in{flex:1;min-width:200px;height:32px;padding:0 10px;border-radius:6px;border:1px solid var(--border-strong);background:var(--j-bg);color:var(--text);font:13px 'JetBrains Mono',monospace;outline:none}
.ls-bar .jql-in:focus{border-color:var(--j-blue);box-shadow:inset 0 0 0 1px var(--j-blue)}
.ls-bar .lbl{font-size:12px;font-weight:653;color:var(--text-dim)}
.ls-count{font-size:12px;color:var(--text-faint);margin:2px 0 8px}
.jw .rtable{width:100%;border-collapse:collapse;font-size:14px}
.jw .rtable th{font-size:12px;font-weight:600;color:var(--text-dim);text-align:left;padding:8px;border-bottom:2px solid var(--border);text-transform:none;letter-spacing:0;background:none}
.jw .rtable td{padding:8px;border-bottom:1px solid var(--border)}
.jw .rtable td.k{white-space:nowrap;font-weight:500;color:var(--j-blue)}
.jw .rtable tr.click:hover td{background:var(--j-hover)}
.jw .jql-err{color:var(--error);background:rgba(253,152,145,0.1);border-color:rgba(253,152,145,0.4)}
.jw .jql-examples button{border-radius:4px;background:var(--j-hover);border-color:transparent}
.jw .jql-examples button:hover{color:var(--text);border-color:var(--border-strong)}

/* dialogs: issue view & create */
.jw-modal{position:absolute;inset:0;z-index:20;background:rgba(5,10,20,0.55);display:flex;align-items:flex-start;justify-content:center;padding:28px 14px;overflow:auto}
:root[data-theme="light"] .jw-modal{background:rgba(5,21,36,0.4)}
.jw-modal[hidden]{display:none}
.jw-dialog{width:100%;max-width:960px;background:var(--j-overlay);border-radius:12px;box-shadow:var(--j-shadow-o);display:flex;flex-direction:column;min-height:0;animation:dlgIn .18s ease}
.jw-dialog.small{max-width:560px}
@keyframes dlgIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.dlg-head{display:flex;align-items:center;gap:8px;padding:14px 16px 6px}
.dlg-head .crumbs{font-size:13px;color:var(--text-dim);margin:0;display:flex;align-items:center;gap:6px}
.dlg-head h3{margin:0;font-size:20px;font-weight:653}
.dlg-x{margin-left:auto;display:flex;gap:2px}
.dlg-body{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:24px;padding:4px 24px 24px}
.dlg-body.one{display:block}
.iv h2{font-size:22px;font-weight:653;margin:6px 0 14px;line-height:1.3}
.iv h6{font-size:14px;font-weight:653;margin:18px 0 8px;color:var(--text);text-transform:none;letter-spacing:0}
.iv .desc{font-size:14px;line-height:1.5;color:var(--text);background:none;border:none;padding:0}
.iv .desc.empty{color:var(--text-faint)}
.iv-act{display:flex;gap:4px;margin-bottom:8px}
.iv-act button{padding:4px 10px;border-radius:4px;font-size:13px;font-weight:500;color:var(--text-dim)}
.iv-act button.on{background:var(--j-sel);color:var(--j-blue)}
.iv-act button:hover{background:var(--j-hover)}
.iv-comment{display:flex;gap:10px;align-items:flex-start;margin:4px 0 14px}
.iv-comment textarea{flex:1;min-height:38px;resize:vertical;padding:8px 10px;border-radius:6px;border:1px solid var(--border-strong);background:var(--j-bg);color:var(--text);font:inherit;font-size:14px;outline:none}
.iv-comment textarea:focus{border-color:var(--j-blue);box-shadow:inset 0 0 0 1px var(--j-blue)}
.iv-side{display:flex;flex-direction:column;gap:12px}
.st-sel{align-self:flex-start;height:32px;padding:0 30px 0 12px;border-radius:6px;border:none;font:inherit;font-size:14px;font-weight:600;cursor:pointer;appearance:none;background-image:linear-gradient(45deg,transparent 50%,currentColor 50%),linear-gradient(135deg,currentColor 50%,transparent 50%);background-position:calc(100% - 15px) 14px,calc(100% - 10px) 14px;background-size:5px 5px;background-repeat:no-repeat}
.st-sel.todo{background-color:var(--j-lz-todo-bg);color:var(--j-lz-todo)}
.st-sel.inprogress{background-color:var(--j-blue-solid);color:var(--j-on-blue)}
.st-sel.done{background-color:var(--j-lz-done-bg);color:var(--j-lz-done)}
.det{border:1px solid var(--border);border-radius:8px}
.det h5{margin:0;padding:12px 14px;font-size:14px;font-weight:653;border-bottom:1px solid var(--border)}
.det .f{display:grid;grid-template-columns:100px 1fr;align-items:center;gap:8px;padding:6px 14px;font-size:14px;min-height:36px}
.det .f > span:first-child{color:var(--text-dim);font-weight:500;font-size:13px}
.det .f .v{display:flex;align-items:center;gap:6px;flex-wrap:wrap;min-width:0}
.det .f.flash{animation:fieldFlash 1.2s ease}
.jsel{max-width:100%;height:30px;padding:0 6px;border-radius:4px;border:1px solid transparent;background:transparent;color:var(--text);font:inherit;font-size:14px;cursor:pointer}
.jsel:hover{background:var(--j-hover)}
.jsel:focus{outline:none;border-color:var(--j-blue)}
.jsel option{background:var(--j-overlay);color:var(--text)}
.det-foot{font-size:12px;color:var(--text-faint);padding:2px 2px 0;line-height:1.6}
.iv .comment{background:none}
.iv .ilist .it{border-radius:4px;background:var(--j-sunken);margin-bottom:2px;border:none}
.jw-btn{height:32px;padding:0 12px;border-radius:6px;font-size:14px;font-weight:500;background:var(--j-hover)}
.jw-btn:hover{background:var(--j-press)}
.jw-btn.primary{background:var(--j-blue-solid);color:var(--j-on-blue)!important}
.jw-btn.primary:hover{filter:brightness(1.1)}
.jw-btn.subtle{background:none}
.jw-btn.subtle:hover{background:var(--j-hover)}
.jw-btn:disabled{opacity:.5;cursor:not-allowed}

/* create form */
.jf{display:flex;flex-direction:column;gap:14px}
.jf .req{font-size:12px;color:var(--text-dim)}
.jf .req b,.jf label b{color:var(--error)}
.jf [hidden]{display:none!important}
.jf label{display:flex;flex-direction:column;gap:5px;font-size:12px;font-weight:653;color:var(--text-dim)}
.jf input,.jf select,.jf textarea{height:36px;padding:0 9px;border-radius:6px;border:1px solid var(--border-strong);background:var(--j-bg);color:var(--text);font:inherit;font-size:14px;font-weight:400;outline:none}
.jf textarea{height:auto;min-height:72px;padding:8px 9px;resize:vertical}
.jf select option{background:var(--j-overlay)}
.jf :is(input,select,textarea):focus{border-color:var(--j-blue);box-shadow:inset 0 0 0 1px var(--j-blue)}
.jf .two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.jf .hint{font-weight:400;color:var(--text-faint)}
.jf .err{color:var(--error);font-size:13px;min-height:1em}
.dlg-foot{display:flex;justify-content:flex-end;gap:8px;padding:14px 24px 20px;border-top:1px solid var(--border)}
.dlg-foot .left{margin-right:auto;font-size:13px;color:var(--text-dim);display:flex;align-items:center;gap:6px}

/* flags (Jira's pop-up messages, bottom-left) */
.jw-flags{position:absolute;left:14px;bottom:14px;z-index:30;display:flex;flex-direction:column-reverse;gap:8px;width:min(340px,calc(100% - 28px));pointer-events:none}
.flag{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-radius:8px;background:var(--j-overlay);box-shadow:var(--j-shadow-o);font-size:14px;line-height:1.45;pointer-events:auto;animation:flagIn .25s ease}
.flag .fi{width:20px;height:20px;border-radius:50%;flex-shrink:0;display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;color:#1f1f21;margin-top:1px}
.flag.ok .fi{background:#4bce97}.flag.err .fi{background:#f87168}.flag.warn .fi{background:#fbc828}.flag.auto .fi{background:#b8acf6}.flag.info .fi{background:#669df1}
.flag b{display:block;font-weight:653}
.flag small{display:block;color:var(--text-dim);font-size:13px;margin-top:2px}
.flag.out{animation:flagOut .25s ease forwards}
@keyframes flagIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes flagOut{to{opacity:0;transform:translateX(-12px)}}

/* lesson-pane bits that the old console used to style */
.o-auto{color:#c4b5fd}
:root[data-theme="light"] :is(.auto-tag,.o-auto){color:#6d3fd6}
:root[data-theme="light"] .explain pre.code,:root[data-theme="light"] .mini pre{background:rgba(20,20,60,0.04);color:#2b2f6b}
:root[data-theme="light"] :is(.step .go,.pager button):hover{color:var(--text)}
:root[data-theme="light"] .step .go:hover{color:#fff}
:root[data-theme="light"] :is(.chip.u,.chip.d,.chip.bad){color:#c0264a}
:root[data-theme="light"] .chip.ok{background:rgba(20,20,60,0.07);color:#44475e}

/* ---------- header / tabs / toolbar as in Jira Cloud ---------- */
.jw-proj{padding:10px 16px 0}
.jw-crumb{font-size:14px;color:var(--text-dim);margin-bottom:6px}
.jw-ptitle{gap:8px}
.jw-ptitle h3{font-size:20px;font-weight:653;margin-right:2px}
.jw-pav{width:24px;height:24px;border-radius:5px;background:#1d7afc}
.jw-pav svg{width:16px;height:16px}
.jw-ptools{margin-left:auto;display:flex;gap:8px}
.jw-obtn{height:32px;min-width:32px;padding:0 7px;border-radius:6px;border:1px solid var(--border-strong);display:inline-flex;align-items:center;justify-content:center;gap:6px;color:var(--text-dim);font-size:14px;font-weight:500;flex-shrink:0;background:none}
.jw-obtn:hover{background:var(--j-hover);color:var(--text)}
.jw-obtn svg{width:16px;height:16px}
.jw-obtn.wide{padding:0 11px}
.jw-obtn.on{border-color:var(--j-blue);color:var(--j-blue);background:var(--j-sel)}
.jw-obtn .cnt{display:inline-block;min-width:16px;padding:0 4px;border-radius:8px;background:var(--j-blue-solid);color:var(--j-on-blue);font-size:11px;line-height:16px;text-align:center}
.jw-ibtn svg{width:16px;height:16px}
.jw-tabs{gap:6px;padding:4px 10px 0;align-items:center}
.jw-tabs .tab{display:inline-flex;align-items:center;gap:6px;padding:8px 6px 10px}
.jw-tabs .tab svg{width:16px;height:16px;flex-shrink:0}
.jw-tabs .tab.active::after{left:0;right:0;height:2px}
.tab-add-wrap{position:relative;display:inline-flex;margin:0 0 4px 4px}
.tab-add{width:32px;height:30px;border-radius:6px;border:1px solid var(--border-strong);display:inline-flex;align-items:center;justify-content:center;color:var(--text-dim)}
.tab-add:hover{background:var(--j-hover);color:var(--text)}
.tab-add svg{width:16px;height:16px}
.tab-add:disabled{opacity:.4;cursor:default}
.jw-menu{position:absolute;top:calc(100% + 6px);left:0;z-index:25;min-width:190px;padding:6px 0;border-radius:8px;background:var(--j-overlay);box-shadow:var(--j-shadow-o);display:flex;flex-direction:column}
.jw-menu.wide{min-width:220px;padding:8px 0 10px}
.jw-menu > button{display:flex;align-items:center;gap:10px;padding:8px 14px;font-size:14px;text-align:left}
.jw-menu > button:hover{background:var(--j-hover)}
.jw-menu > button svg{width:16px;height:16px;color:var(--text-dim)}
.jw-menu em{margin-left:auto;font-style:normal;font-size:12px;color:var(--text-faint)}
.jw-menu h6{margin:6px 14px 4px;font-size:12px;font-weight:653;color:var(--text-dim);text-transform:none;letter-spacing:0}
.jw-menu label{display:flex;align-items:center;gap:8px;padding:6px 14px;font-size:14px;cursor:pointer}
.jw-menu label:hover{background:var(--j-hover)}
.jw-menu input{accent-color:var(--j-blue-solid);width:15px;height:15px}
.jw-menu .jw-btn{margin:8px 14px 0;align-self:flex-start}
.jw-tabs{overflow:visible;flex-wrap:nowrap}
.jw-tabs .tab[hidden]{display:none}
.tab-more-wrap{position:relative;display:inline-flex;flex-shrink:0}
.tab-more-wrap[hidden]{display:none}
.tab-more{display:inline-flex;align-items:center;gap:4px;padding:8px 6px 10px;font-size:14px;font-weight:500;color:var(--text-dim);border-radius:4px 4px 0 0}
.tab-more:hover{background:var(--j-hover);color:var(--text)}
.tab-more .cnt{font-size:11px;padding:0 5px;border-radius:8px;background:var(--j-press)}
.jw-proj,.jw-tabs{position:relative;z-index:6}

.vt-bar{display:flex;align-items:center;gap:8px;padding:16px 16px 10px;flex-wrap:wrap}
.vt-search{display:flex;align-items:center;gap:7px;height:32px;width:160px;padding:0 9px;border:1px solid var(--border-strong);border-radius:6px;color:var(--text-dim)}
.vt-search:focus-within{border-color:var(--j-blue);box-shadow:inset 0 0 0 1px var(--j-blue)}
.vt-search svg{width:14px;height:14px;flex-shrink:0}
.vt-search input{flex:1;min-width:0;border:none;outline:none;background:transparent;color:var(--text);font:inherit;font-size:14px}
.vt-search input::placeholder{color:var(--text-dim)}
.vt-fwrap{position:relative;display:inline-flex}
.bd-avs{margin-left:4px}
.bd-avs .av{width:26px;height:26px}
.bd-avs .av.grp{background:var(--j-press);color:var(--text-dim);cursor:default}
.bd-avs .av.grp svg{width:14px;height:14px}
.jw .board-head{padding:4px 16px 0}
.jw .board{padding:8px 16px 16px}

/* timeline */
.tl{overflow:auto;border-top:1px solid var(--border);margin:6px 0 0;height:calc(100% - 64px);min-height:260px;position:relative;scrollbar-width:thin}
.tl-in{display:flex;min-height:100%;position:relative}
.tl-left{width:var(--tl-w,380px);flex-shrink:0;position:sticky;left:0;z-index:3;background:var(--j-bg);border-right:1px solid var(--border);display:flex;flex-direction:column}
.tl-head{height:40px;display:grid;grid-template-columns:1fr 92px 76px;border-bottom:2px solid var(--border);font-size:12px;font-weight:653;color:var(--text-dim);position:sticky;top:0;background:var(--j-bg);z-index:2}
.tl-head > div{display:flex;align-items:center;padding:0 8px;border-left:1px solid var(--border)}
.tl-head > div:first-child{border-left:none}

.tl-vline{position:absolute;top:0;bottom:0;border-left:1px solid var(--border)}

.tl-bar{position:absolute;top:11px;height:18px;border-radius:4px;cursor:pointer;z-index:1}

.jw .mono{font-family:'JetBrains Mono',monospace;font-size:12px;white-space:nowrap}

/* ---------- step guide: where to click, what to type ---------- */
.how{list-style:none;margin:8px 0 0;padding:0;display:flex;flex-wrap:wrap;gap:5px;font-size:12px;color:var(--text-dim);counter-reset:how}

.how li::before{content:counter(how);width:16px;height:16px;flex-shrink:0;border-radius:50%;background:rgba(255,171,0,.18);color:#ffb84d;font-size:10px;font-weight:700;display:inline-flex;align-items:center;justify-content:center}
.how li b{color:var(--text);font-weight:600}
.how li > span:first-child{white-space:nowrap}
.how .gv{min-width:0;padding:0 5px;border-radius:4px;background:rgba(255,171,0,.14);color:#ffc66b;font-family:'JetBrains Mono',monospace;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.how i{font-style:normal;font-size:10px;opacity:.65;white-space:nowrap}
.how li{cursor:pointer}
.how li:hover{border-color:rgba(255,171,0,.55)}
.how li.on{border-color:#ffab00;background:rgba(255,171,0,.12)}
:root[data-theme="light"] .how li::before{color:#8a5a00;background:#ffe9b8}
:root[data-theme="light"] .how .gv{color:#7a4f00;background:#fff1cf}
:root[data-theme="light"] .how li.on{background:#fff6e0}
#guideBtn[aria-pressed="true"]{border-color:rgba(255,171,0,.6);color:#ffb84d}
:root[data-theme="light"] #guideBtn[aria-pressed="true"]{color:#8a5a00;background:#fff6e0}

.g-layer{position:fixed;inset:0;pointer-events:none;z-index:300}
.g-layer [hidden]{display:none!important}
.g-ring{position:fixed;border:2px solid #ffab00;border-radius:8px;box-shadow:0 0 0 4px rgba(255,171,0,.22),0 0 22px rgba(255,171,0,.35);transition:left .35s,top .35s,width .35s,height .35s;animation:gpulse 1.2s ease-in-out infinite}
@keyframes gpulse{50%{box-shadow:0 0 0 8px rgba(255,171,0,.1),0 0 28px rgba(255,171,0,.3)}}
.g-cur{position:fixed;width:24px;height:24px;margin:-2px 0 0 -3px;transition:left .5s cubic-bezier(.3,.7,.3,1),top .5s cubic-bezier(.3,.7,.3,1);filter:drop-shadow(0 2px 3px rgba(0,0,0,.45))}
