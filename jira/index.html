<script>
/* =====================================================================
   Jira simulator engine
   An in-memory model of a Jira project: issues, workflow, board, sprints,
   JQL search, automation rules, releases and Git "smart commits".
   Every command returns console lines; the UI re-renders from state.
   ===================================================================== */

const PRIORITIES = ['Highest', 'High', 'Medium', 'Low', 'Lowest'];
const TYPES = {epic: 'Epic', story: 'Story', task: 'Task', bug: 'Bug', subtask: 'Sub-task', 'sub-task': 'Sub-task'};
const USERS = {you: 'You', ada: 'Ada Lovelace', ben: 'Ben Okafor', cleo: 'Cleo Park', dan: 'Dan Reyes'};
const CATS = {todo: 'To Do', inprogress: 'In Progress', done: 'Done'};
const RULES = {
  'subtasks-close-parent': 'When all sub-tasks are Done → move the parent to Done',
  'assign-bugs': 'When a Bug is created → assign it to {user} and add label "triage"',
  'urgent-flag': 'When an issue is created with priority Highest → flag it and comment',
  'done-comment': 'When an issue moves to Done → add a comment with the day',
};

/* ---------- console line helpers: a line is [[text, cls], ...] ---------- */
const L = (...segs) => segs.map(s => typeof s === 'string' ? [s, ''] : s);
const T = (text, cls = '') => String(text).split('\n').map(t => [[t, cls]]);
const pad = (s, n) => String(s).length > n ? String(s).slice(0, n - 1) + '…' : String(s).padEnd(n);

/* shell-ish tokenizer: quotes, key="value with spaces", && chains */
function tokenize(src){
  const toks = []; let cur = '', q = null, has = false;
  for(let i = 0; i < src.length; i++){
    const c = src[i];
    if(q){ if(c === q) q = null; else cur += c; continue; }
    if(c === '"' || c === "'"){ q = c; has = true; continue; }
    if(/\s/.test(c)){ if(has || cur){ toks.push(cur); cur = ''; has = false; } continue; }
    if(c === '&' && src[i + 1] === '&'){ if(has || cur){ toks.push(cur); cur = ''; has = false; } toks.push('&&'); i++; continue; }
    cur += c;
  }
  if(has || cur) toks.push(cur);
  return toks;
}

/* =====================================================================
   JQL: tokenizer → recursive-descent parser → evaluator
   ===================================================================== */
class JqlError extends Error {}

function jqlTokens(src){
  const out = [];
  const re = /\s*(?:("(?:[^"\\]|\\.)*"|'[^']*')|(!=|>=|<=|!~|=|>|<|~)|([(),])|([^\s()=!<>~,"']+))/y;
  let m; re.lastIndex = 0;
  while(re.lastIndex < src.length){
    const at = re.lastIndex;
    m = re.exec(src);
    if(!m){ if(/^\s*$/.test(src.slice(at))) break; throw new JqlError(`Error in the JQL Query: the character '${src.slice(at).trim()[0]}' is a reserved JQL character (character ${at + 1}).`); }
    if(m[1] !== undefined) out.push({t: 'str', v: m[1].slice(1, -1).replace(/\\(.)/g, '$1'), at});
    else if(m[2] !== undefined) out.push({t: 'op', v: m[2], at});
    else if(m[3] !== undefined) out.push({t: m[3], v: m[3], at});
    else if(m[4] !== undefined) out.push({t: 'word', v: m[4], at});
    else break;
  }
  return out;
}

function parseJql(src){
  const toks = jqlTokens(src);
  let i = 0;
  const peek = () => toks[i];
  const kw = (w) => peek() && peek().t === 'word' && peek().v.toUpperCase() === w;
  const expect = (what) => {
    const t = peek();
    throw new JqlError(`Error in the JQL Query: Expecting ${what} but got ${t ? `'${t.v}'` : 'the end of the query'}.`);
  };
  function value(){
    const t = peek();
    if(!t || (t.t !== 'word' && t.t !== 'str')) expect('a value');
    i++;
    if(t.t === 'word' && peek() && peek().t === '('){
      i++;
      if(!peek() || peek().t !== ')') expect("')'");
      i++;
      return {fn: t.v.toLowerCase()};
    }
    if(t.t === 'word' && (t.v.toUpperCase() === 'EMPTY' || t.v.toUpperCase() === 'NULL')) return {empty: true};
    return {v: t.v, quoted: t.t === 'str'};
  }
  function clause(){
    const f = peek();
    if(!f || (f.t !== 'word' && f.t !== 'str')) expect('a field name');
    i++;
    const field = f.v;
    if(kw('IS')){
      i++;
      let not = false;
      if(kw('NOT')){ not = true; i++; }
      if(!(kw('EMPTY') || kw('NULL'))) expect("'EMPTY'");
      i++;
      return {field, op: not ? 'is not' : 'is'};
    }
    let op;
    if(kw('NOT')){ i++; if(!kw('IN')) expect("'IN'"); i++; op = 'not in'; }
    else if(kw('IN')){ i++; op = 'in'; }
    else if(peek() && peek().t === 'op'){ op = peek().v; i++; }
    else expect('an operator such as =, !=, ~, IN, IS');
    if(op === 'in' || op === 'not in'){
      if(peek() && peek().t === 'word' && toks[i + 1] && toks[i + 1].t === '(' && toks[i + 2] && toks[i + 2].t === ')') return {field, op, value: value()};
      if(!peek() || peek().t !== '(') expect("'('");
      i++;
      const list = [];
      for(;;){
        list.push(value());
        if(peek() && peek().t === ','){ i++; continue; }
        if(peek() && peek().t === ')'){ i++; break; }
        expect("',' or ')'");
      }
      return {field, op, list};
    }
    return {field, op, value: value()};
  }
  function factor(){
    if(kw('NOT')){ i++; return {not: factor()}; }
    if(peek() && peek().t === '('){
      i++;
      const e = expr();
      if(!peek() || peek().t !== ')') expect("')'");
      i++;
      return e;
    }
    return clause();
  }
  function term(){
    let n = factor();
    while(kw('AND')){ i++; n = {and: [n, factor()]}; }
    return n;
  }
  function expr(){
    let n = term();
    while(kw('OR')){ i++; n = {or: [n, term()]}; }
    return n;
  }
  let where = null;
  if(peek() && !kw('ORDER')) where = expr();
  const order = [];
  if(kw('ORDER')){
    i++;
    if(!kw('BY')) expect("'BY'");
    i++;
    for(;;){
      const f = peek();
      if(!f || (f.t !== 'word' && f.t !== 'str')) expect('a field to order by');
      i++;
      let dir = 'asc';
      if(kw('ASC') || kw('DESC')){ dir = peek().v.toLowerCase(); i++; }
      order.push({field: f.v, dir});
      if(peek() && peek().t === ','){ i++; continue; }
      break;
    }
  }
  if(peek()) expect("'AND', 'OR' or 'ORDER BY'");
  return {where, order};
}

/* =====================================================================
   The project simulator
   ===================================================================== */
class Jira {
  constructor(){
    this.project = null;
    this.issues = new Map();
    this.rank = [];
    this.seq = 0;
    this.day = 1;
    this.me = 'you';
    this.workflow = {statuses: [{name: 'To Do', cat: 'todo'}, {name: 'In Progress', cat: 'inprogress'}, {name: 'Done', cat: 'done'}], transitions: null};
    this.wip = {};
    this.sprints = [];
    this.versions = [];
    this.filters = [];
    this.rules = [];
    this.selected = null;
    this.last = null;          // {key, from, to} — last transition, for highlighting
    this.lastSearch = null;    // {query, keys, error}
    this.changed = new Set();  // keys touched by the last command
  }

  /* ---------- helpers ---------- */
  get scrum(){ return this.project && this.project.type === 'scrum'; }
  status(name){ return this.workflow.statuses.find(s => s.name.toLowerCase() === String(name).toLowerCase()); }
  cat(issue){ const s = this.status(issue.status); return s ? s.cat : 'todo'; }
  activeSprint(){ return this.sprints.find(s => s.state === 'active') || null; }
  sprintByName(n){ return this.sprints.find(s => s.name.toLowerCase() === String(n).toLowerCase()); }
  user(v){
    if(v === undefined || v === null) return undefined;
    const s = String(v).toLowerCase().trim();
    if(['none', 'unassigned', 'nobody', ''].includes(s)) return null;
    if(s === 'me' || s === 'currentuser()' || s === 'you') return 'you';
    for(const [id, name] of Object.entries(USERS)) if(id === s || name.toLowerCase() === s || name.split(' ')[0].toLowerCase() === s) return id;
    return undefined;
  }
  issue(key){ return this.issues.get(String(key).toUpperCase()); }
  children(key){ return [...this.issues.values()].filter(i => i.parent === key || i.epic === key); }
  subtasks(key){ return [...this.issues.values()].filter(i => i.parent === key && i.type === 'Sub-task'); }
  ranked(){ return this.rank.map(k => this.issues.get(k)).filter(Boolean); }
  blockers(issue){ return issue.links.filter(l => l.type === 'is blocked by').map(l => this.issue(l.key)).filter(b => b && this.cat(b) !== 'done'); }
  remaining(sprint){ return this.ranked().filter(i => i.sprint === sprint.id && i.type !== 'Sub-task' && this.cat(i) !== 'done').reduce((a, i) => a + (i.points || 0), 0); }
  sprintPoints(sprint){ return this.ranked().filter(i => i.sprint === sprint.id && i.type !== 'Sub-task').reduce((a, i) => a + (i.points || 0), 0); }
  log(issue, field, from, to, by = this.me){ issue.history.push({day: this.day, by, field, from, to}); issue.updated = this.day; this.changed.add(issue.key); }
  allowed(from, to){
    const wf = this.workflow;
    if(!wf.transitions) return true;
    return wf.transitions.some(t => (t.from === '*' || t.from.toLowerCase() === from.toLowerCase()) && t.to.toLowerCase() === to.toLowerCase());
  }
  snapshot(){
    const s = this.activeSprint();
    if(s) s.burn[this.day] = this.remaining(s);
  }

  /* ---------- entry point ---------- */
  /* snap/fresh = false let the step guide run a chain one part at a time
     and still get the same result as running the whole chain at once */
  run(line, {snap = true, fresh = true} = {}){
    const src = line.trim();
    const out = {lines: [], ok: true, clear: false, view: null};
    if(fresh) this.changed = new Set();
    // jql / filter keep the raw query text (its quotes matter)
    const parts = /^(jql|filter\s+save)\b/i.test(src) ? [src] : this.splitChain(src);
    for(const p of parts){
      if(!p.trim()) continue;
      let res;
      try { res = this.exec(p.trim()); }
      catch(e){ res = {lines: T('simulator: that command hit an unsupported case (' + e.message + ')', 'err'), err: true}; this.crashed = e; }
      if(res.clear){ out.clear = true; out.lines.length = 0; }
      out.lines.push(...res.lines);
      if(res.view) out.view = res.view;
      if(res.err){ out.ok = false; break; }
    }
    if(snap) this.snapshot();
    return out;
  }
  splitChain(src){
    const parts = []; let cur = '', q = null;
    for(let i = 0; i < src.length; i++){
      const c = src[i];
      if(q){ if(c === q) q = null; cur += c; continue; }
      if(c === '"' || c === "'"){ q = c; cur += c; continue; }
      if(c === '&' && src[i + 1] === '&'){ parts.push(cur); cur = ''; i++; continue; }
      cur += c;
    }
    parts.push(cur);
    return parts;
  }

  exec(src){
    const res = {lines: [], err: false, view: null};
    const say = (text, cls) => { res.lines.push(...T(text, cls)); };
    const ok = (text) => say('✔ ' + text, 'ok');
    const fail = (text) => { res.lines.push(...T('✖ ' + text, 'err')); res.err = true; return res; };
    const warn = (text) => say('⚠ ' + text, 'warn');

    if(/^jql\b/i.test(src)) return this.cmdJql(src.replace(/^jql\s*/i, ''), res, say, fail);
    const argv = tokenize(src);
    const [cmd0, ...args] = argv;
    const cmd = (cmd0 || '').toLowerCase();
    const needProject = !['project', 'help', 'clear', 'users', 'whoami', ''].includes(cmd);
    if(needProject && !this.project) return fail('No project yet. Create one first:  project create SHOP "Online Shop" scrum');
    const kv = {}; const pos = [];
    for(const a of args){
      const m = a.match(/^([A-Za-z]+)(\+?=)(.*)$/s);
      if(m) kv[m[1].toLowerCase() + (m[2] === '+=' ? '+' : '')] = m[3].replace(/\\n/g, '\n');
      else pos.push(a);
    }
    const needIssue = (k) => {
      const i = k && this.issue(k);
      if(!i){ fail(k ? `Issue ${k.toUpperCase()} does not exist.` : 'Which issue? e.g. SHOP-3'); return null; }
      return i;
    };

    switch(cmd){
      case '': return res;
      case 'help': return this.help(res);
      case 'clear': res.clear = true; return res;
      case 'whoami': say(`You are logged in as "${USERS[this.me]}" (currentUser() in JQL).`); return res;
      case 'users':
        for(const [id, n] of Object.entries(USERS)) res.lines.push(L([pad(id, 8), 'info'], n));
        return res;

      case 'project': {
        if((pos[0] || '').toLowerCase() !== 'create') {
          if(!this.project) return fail('usage: project create KEY "Project name" scrum|kanban');
          say(`${this.project.name} (${this.project.key}) · ${this.project.type} board · day ${this.day}`); return res;
        }
        const [, key, name, type = 'scrum'] = pos;
        if(!key || !/^[A-Z][A-Z0-9]{1,9}$/.test(key)) return fail('The project key must be 2–10 capital letters, e.g. SHOP');
        if(!['scrum', 'kanban'].includes(type.toLowerCase())) return fail('Board type must be scrum or kanban');
        if(this.project) return fail(`This sandbox already has a project (${this.project.key}). Press ⟲ Reset to start over.`);
        this.project = {key, name: name || key, type: type.toLowerCase()};
        ok(`Created project ${this.project.name} (${key}) with a ${type.toLowerCase()} board.`);
        say(`  Issues in this project will be numbered ${key}-1, ${key}-2, …`, 'dim');
        res.view = 'board';
        return res;
      }

      case 'create': {
        const typeWord = (pos[0] || '').toLowerCase();
        const type = TYPES[typeWord];
        if(!type) return fail('usage: create epic|story|task|bug|subtask "Summary" [field=value …]');
        const summary = pos[1];
        if(!summary) return fail('Every issue needs a summary: create story "Short description"');
        if(type === 'Sub-task' && !kv.parent) return fail('A sub-task needs a parent: create subtask "…" parent=SHOP-3  (or: subtask SHOP-3 "…")');
        return this.create(type, summary, kv, res, say, fail, ok, warn);
      }
      case 'subtask': {
        const p = needIssue(pos[0]); if(!p) return res;
        return this.create('Sub-task', pos[1], {...kv, parent: p.key}, res, say, fail, ok, warn);
      }

      case 'edit': {
        const keys = (pos[0] || '').split(',').filter(Boolean);
        if(!keys.length) return fail('usage: edit SHOP-3 field=value …   (fields: summary, description, priority, points, labels, epic, fixVersion, type)');
        if(!Object.keys(kv).length) return fail('Nothing to change. Example: edit SHOP-3 points=5 priority=High');
        for(const k of keys){
          const i = needIssue(k); if(!i) return res;
          for(const [f, v] of Object.entries(kv)) if(!this.setField(i, f, v, res, fail)) return res;
          ok(`Updated ${i.key}: ${Object.keys(kv).map(f => f.replace(/\+$/, ' (appended)')).join(', ')}`);
          this.selected = i.key;
        }
        res.view = 'issue';
        return res;
      }

      case 'assign': {
        const i = needIssue(pos[0]); if(!i) return res;
        const u = this.user(pos[1] === undefined ? 'me' : pos[1]);
        if(u === undefined) return fail(`Unknown user '${pos[1]}'. Try: ${Object.keys(USERS).join(', ')}, me, none`);
        const from = i.assignee;
        i.assignee = u;
        this.log(i, 'Assignee', from ? USERS[from] : 'Unassigned', u ? USERS[u] : 'Unassigned');
        ok(`${i.key} is now assigned to ${u ? USERS[u] : 'nobody (Unassigned)'}`);
        this.selected = i.key;
        res.view = 'issue';
        return res;
      }
      case 'unassign': return this.exec(`assign ${pos[0] || ''} none`);

      case 'move': case 'transition': {
        const i = needIssue(pos[0]); if(!i) return res;
        const target = pos[1];
        if(!target) return fail(`Move ${i.key} where? Statuses: ${this.workflow.statuses.map(s => s.name).join(', ')}`);
        if(!this.transition(i, target, res, say, fail, warn)) return res;
        this.selected = i.key;
        res.view = this.onBoard(i) ? 'board' : 'issue';
        return res;
      }

      case 'comment': {
        const i = needIssue(pos[0]); if(!i) return res;
        if(!pos[1]) return fail('usage: comment SHOP-3 "Your comment"');
        i.comments.push({by: this.me, text: pos[1], day: this.day});
        this.log(i, 'Comment', '', pos[1]);
        ok(`Comment added to ${i.key}`);
        this.selected = i.key; res.view = 'issue';
        return res;
      }

      case 'link': {
        const a = needIssue(pos[0]); if(!a) return res;
        const raw = pos.slice(1, -1).join(' ').toLowerCase();
        const b = needIssue(pos[pos.length - 1]); if(!b) return res;
        if(a === b) return fail('An issue cannot be linked to itself.');
        const types = {'blocks': 'is blocked by', 'is blocked by': 'blocks', 'relates': 'relates to', 'relates to': 'relates to', 'duplicates': 'is duplicated by', 'is duplicated by': 'duplicates', 'clones': 'is cloned by'};
        if(!types[raw]) return fail('Link type must be: blocks, "is blocked by", relates, duplicates');
        const t = raw === 'relates' ? 'relates to' : raw;
        a.links.push({type: t, key: b.key}); b.links.push({type: types[raw], key: a.key});
        this.log(a, 'Link', '', `${t} ${b.key}`); this.log(b, 'Link', '', `${types[raw]} ${a.key}`);
        ok(`${a.key} ${t} ${b.key}`);
        this.selected = a.key; res.view = 'issue';
        return res;
      }

      case 'rank': {
        const i = needIssue(pos[0]); if(!i) return res;
        const where = (pos[1] || '').toLowerCase();
        const r = this.rank.filter(k => k !== i.key);
        if(where === 'top') r.unshift(i.key);
        else if(where === 'bottom') r.push(i.key);
        else if(where === 'above' || where === 'below'){
          const o = needIssue(pos[2]); if(!o) return res;
          const at = r.indexOf(o.key);
          r.splice(where === 'above' ? at : at + 1, 0, i.key);
        } else return fail('usage: rank SHOP-4 top|bottom|above SHOP-2|below SHOP-2');
        this.rank = r; this.changed.add(i.key);
        ok(`Ranked ${i.key} ${where}${pos[2] ? ' ' + pos[2].toUpperCase() : ''}. Higher on the list = do it sooner.`);
        res.view = this.scrum && !(this.activeSprint() && i.sprint === this.activeSprint().id) ? 'backlog' : 'board';
        return res;
      }

      case 'flag': case 'unflag': {
        const i = needIssue(pos[0]); if(!i) return res;
        i.flagged = cmd === 'flag';
        this.log(i, 'Flagged', cmd === 'flag' ? '' : 'Impediment', cmd === 'flag' ? 'Impediment' : '');
        if(cmd === 'flag') warn(`${i.key} flagged as an impediment: it is blocked and needs attention.`); else ok(`${i.key} unflagged`);
        res.view = 'board';
        return res;
      }

      case 'view': case 'open': {
        const i = needIssue(pos[0]); if(!i) return res;
        this.selected = i.key; res.view = 'issue';
        say(`${i.key} · ${i.type} · ${i.status} · ${i.assignee ? USERS[i.assignee] : 'Unassigned'}`);
        say(`  ${i.summary}`, 'dim');
        return res;
      }

      case 'board': res.view = 'board'; say(this.scrum ? (this.activeSprint() ? `Showing the board for ${this.activeSprint().name}` : 'No active sprint. The board shows the active sprint only.') : 'Showing the Kanban board'); return res;
      case 'backlog': res.view = 'backlog'; say('Showing the backlog'); return res;
      case 'reports': res.view = 'reports'; say('Showing reports'); return res;
      case 'search': res.view = 'search'; return res;

      case 'sprint': return this.cmdSprint(pos, kv, res, say, fail, ok, warn);

      case 'next': case 'day': {
        let n = parseInt(pos.find(p => /^\d+$/.test(p)) || '1', 10);
        if(n < 1 || n > 30) return fail('next day 1..30');
        const s = this.activeSprint();
        for(let k = 0; k < n; k++){ this.day++; if(s) s.burn[this.day] = this.remaining(s); }
        ok(`⏱ Time passes… it is now day ${this.day}.`);
        if(s){
          const left = s.endDay - this.day;
          say(left > 0 ? `  ${s.name}: ${left} day${left === 1 ? '' : 's'} left, ${this.remaining(s)} points remaining.` : `  ${s.name} has reached its end date: time for "sprint complete".`, left > 0 ? 'dim' : 'warn');
        }
        return res;
      }

      case 'filter': return this.cmdFilter(src, pos, res, say, fail, ok);
      case 'filters': return this.cmdFilter('filter list', ['list'], res, say, fail, ok);

      case 'workflow': return this.cmdWorkflow(pos, res, say, fail, ok);

      case 'wip': {
        const col = pos[0], n = parseInt(pos[1], 10);
        const st = col && this.status(col);
        if(!st || isNaN(n)) return fail('usage: wip "In Progress" 3   (0 removes the limit)');
        if(n > 0) this.wip[st.name] = n; else delete this.wip[st.name];
        ok(n > 0 ? `WIP limit for "${st.name}" set to ${n}. The column turns red when more than ${n} issues are in it.` : `WIP limit removed from "${st.name}"`);
        res.view = 'board';
        return res;
      }

      case 'rule': return this.cmdRule(pos, res, say, fail, ok);
      case 'rules': return this.cmdRule(['list'], res, say, fail, ok);

      case 'version': return this.cmdVersion(pos, res, say, fail, ok);
      case 'versions': return this.cmdVersion(['list'], res, say, fail, ok);

      case 'git': return this.cmdGit(argv.slice(1), res, say, fail, ok, warn);

      default:
        return fail(`Unknown command '${cmd0}'. Type "help" for the list.`);
    }
  }

  help(res){
    const rows = [
      ['Project', 'project create KEY "Name" scrum|kanban · users · whoami'],
      ['Issues', 'create story|task|bug|epic "Summary" [points=3 assignee=ada priority=High epic=SHOP-1 labels=a,b]'],
      ['', 'subtask SHOP-3 "Summary" · view SHOP-3 · edit SHOP-3 field=value · edit SHOP-3 description+="more"'],
      ['Work', 'assign SHOP-3 ada|me|none · move SHOP-3 "In Progress" · comment SHOP-3 "text" · flag/unflag SHOP-3'],
      ['Order', 'rank SHOP-3 top|bottom|above SHOP-2 · link SHOP-3 blocks|relates|duplicates SHOP-5'],
      ['Scrum', 'sprint create "Sprint 1" [goal="…"] · sprint add SHOP-3 SHOP-4 · sprint start [days=10] · sprint complete'],
      ['Time', 'next day [n]   (moves the simulated calendar forward)'],
      ['Search', 'jql <query> · filter save "Name" <query> · filter run "Name" · filters'],
      ['Workflow', 'workflow · workflow status add "In Review" inprogress · workflow mode strict|open · workflow transition add "A" "B" · wip "Col" 3'],
      ['Automate', 'rule add subtasks-close-parent | assign-bugs <user> | urgent-flag | done-comment · rules'],
      ['Release', 'version create 1.0 · edit SHOP-3 fixVersion=1.0 · version release 1.0 · versions'],
      ['Dev', 'git branch SHOP-3-login · git commit -m "SHOP-3 #comment text #done"'],
      ['Views', 'board · backlog · reports · search · view SHOP-3 · clear'],
    ];
    for(const [k, v] of rows) res.lines.push(L([pad(k, 10), 'info'], v));
    return res;
  }

  /* ---------- issues ---------- */
  create(type, summary, kv, res, say, fail, ok, warn){
    if(!summary) return fail('Every issue needs a summary.');
    const key = `${this.project.key}-${++this.seq}`;
    const i = {
      key, type, summary, description: '', status: this.workflow.statuses[0].name, assignee: null, reporter: this.me,
      priority: 'Medium', points: null, labels: [], epic: null, parent: null, sprint: null, fixVersion: null,
      created: this.day, updated: this.day, resolved: null, started: null, comments: [], links: [], history: [], flagged: false,
      dev: {branches: [], commits: []},
    };
    this.issues.set(key, i);
    this.rank.push(key);
    for(const [f, v] of Object.entries(kv)){
      if(f === 'parent'){
        const p = this.issue(v);
        if(!p){ this.issues.delete(key); this.rank.pop(); this.seq--; return fail(`Parent ${v} does not exist.`); }
        if(type === 'Sub-task'){ i.parent = p.key; i.sprint = p.sprint; continue; }
        if(p.type !== 'Epic'){ this.issues.delete(key); this.rank.pop(); this.seq--; return fail('Only an Epic can be the parent of a story/task/bug.'); }
        i.epic = p.key; continue;
      }
      if(!this.setField(i, f, v, res, fail, true)){ this.issues.delete(key); this.rank.pop(); this.seq--; return res; }
    }
    i.history = [{day: this.day, by: this.me, field: 'Created', from: '', to: type}];
    this.changed.add(key);
    this.selected = key;
    ok(`Created ${key} · ${type} · "${summary}"`);
    if(type === 'Sub-task') say(`  sub-task of ${i.parent}`, 'dim');
    else if(this.scrum && i.sprint === null && type !== 'Epic') say('  added to the bottom of the backlog', 'dim');
    this.fire('created', i, res);
    res.view = type === 'Sub-task' ? 'issue' : this.scrum ? (this.onBoard(i) ? 'board' : 'backlog') : (type === 'Epic' ? 'backlog' : 'board');
    return res;
  }

  setField(i, f, v, res, fail, silent){
    const field = f.toLowerCase();
    const set = (name, from, to) => { if(!silent) this.log(i, name, from, to); };
    switch(field){
      case 'summary': set('Summary', i.summary, v); i.summary = v; return true;
      case 'description': set('Description', i.description ? '(old text)' : '', v); i.description = v; return true;
      case 'description+': set('Description', '(appended)', v); i.description = (i.description || '') + v; return true;
      case 'priority': {
        const p = PRIORITIES.find(x => x.toLowerCase() === v.toLowerCase());
        if(!p){ fail(`Priority must be one of: ${PRIORITIES.join(', ')}`); return false; }
        set('Priority', i.priority, p); i.priority = p; return true;
      }
      case 'points': case 'storypoints': case 'sp': {
        if(v === '' || v === 'none'){ set('Story Points', i.points ?? '', ''); i.points = null; return true; }
        const n = Number(v);
        if(!Number.isFinite(n) || n < 0){ fail('Story points must be a number, e.g. points=3'); return false; }
        if(i.type === 'Epic' || i.type === 'Sub-task'){ fail(`${i.type}s are not estimated with story points in this board, estimate the stories instead.`); return false; }
        set('Story Points', i.points ?? '', n); i.points = n; return true;
      }
      case 'labels': case 'label': {
        const list = v.split(',').map(s => s.trim()).filter(Boolean);
        set('Labels', i.labels.join(', '), list.join(', ')); i.labels = list; return true;
      }
      case 'labels+': case 'label+': {
        const list = [...new Set([...i.labels, ...v.split(',').map(s => s.trim()).filter(Boolean)])];
        set('Labels', i.labels.join(', '), list.join(', ')); i.labels = list; return true;
      }
      case 'assignee': {
        const u = this.user(v);
        if(u === undefined){ fail(`Unknown user '${v}'`); return false; }
        set('Assignee', i.assignee ? USERS[i.assignee] : 'Unassigned', u ? USERS[u] : 'Unassigned'); i.assignee = u; return true;
      }
      case 'epic': {
        if(v === '' || v.toLowerCase() === 'none'){ set('Epic', i.epic || '', ''); i.epic = null; return true; }
        const e = this.issue(v);
        if(!e || e.type !== 'Epic'){ fail(`${v} is not an Epic.`); return false; }
        if(i.type === 'Epic' || i.type === 'Sub-task'){ fail(`A ${i.type} can't belong to an epic directly.`); return false; }
        set('Epic', i.epic || '', e.key); i.epic = e.key; return true;
      }
      case 'fixversion': case 'version': {
        if(v === '' || v.toLowerCase() === 'none'){ set('Fix Version', i.fixVersion || '', ''); i.fixVersion = null; return true; }
        const ver = this.versions.find(x => x.name === v);
        if(!ver){ fail(`Version ${v} does not exist. Create it first: version create ${v}`); return false; }
        if(ver.released){ fail(`Version ${v} is already released.`); return false; }
        set('Fix Version', i.fixVersion || '', v); i.fixVersion = v; return true;
      }
      case 'sprint': {
        const s = this.sprintByName(v);
        if(!s || s.state === 'closed'){ fail(`Sprint '${v}' does not exist or is closed.`); return false; }
        set('Sprint', '', s.name); i.sprint = s.id; return true;
      }
      case 'type': {
        const t = TYPES[v.toLowerCase()];
        if(!t || t === 'Sub-task' || t === 'Epic' || i.type === 'Epic' || i.type === 'Sub-task'){ fail('Type can be changed between Story, Task and Bug.'); return false; }
        set('Type', i.type, t); i.type = t; return true;
      }
      default: fail(`Unknown field '${f}'. Fields: summary, description, priority, points, labels, assignee, epic, fixVersion, type`); return false;
    }
  }

  onBoard(i){
    if(i.type === 'Epic') return false;
    if(!this.scrum) return true;
    const s = this.activeSprint();
    return !!(s && i.sprint === s.id);
  }

  transition(i, target, res, say, fail, warn, by = this.me, quiet = false){
    const st = this.status(target);
    if(!st){ fail(`Status '${target}' does not exist in this workflow. Available: ${this.workflow.statuses.map(s => s.name).join(', ')}`); return false; }
    if(st.name === i.status){ say(`${i.key} is already in ${st.name}`, 'dim'); return true; }
    if(!this.allowed(i.status, st.name)){
      const nexts = this.workflow.statuses.filter(s => this.allowed(i.status, s.name)).map(s => s.name);
      fail(`Transition not allowed: "${i.status}" → "${st.name}" is not in the workflow.\n  From "${i.status}" you can go to: ${nexts.join(', ') || '(nowhere)'}`);
      return false;
    }
    const from = i.status;
    if(this.cat(i) === 'todo' && st.cat !== 'todo' && this.blockers(i).length)
      warn(`${i.key} is blocked by ${this.blockers(i).map(b => b.key).join(', ')} (not done yet). Jira lets you continue, but check with the team!`);
    i.status = st.name;
    if(st.cat === 'inprogress' && i.started === null) i.started = this.day;
    if(st.cat === 'done'){ i.resolved = this.day; if(i.started === null) i.started = this.day; }
    else i.resolved = null;
    this.log(i, 'Status', from, st.name, by);
    this.last = {key: i.key, from, to: st.name};
    if(!quiet) say(`✔ ${i.key}: ${from} → ${st.name}${st.cat === 'done' ? '  (resolved)' : ''}`, 'ok');
    const limit = this.wip[st.name];
    if(limit){
      const n = this.ranked().filter(x => x.status === st.name && this.onBoard(x)).length;
      if(n > limit) warn(`WIP limit exceeded: "${st.name}" now has ${n} issues (limit ${limit}). Finish something before starting more!`);
    }
    this.fire('transition', i, res, {from, to: st.name});
    return true;
  }

  /* ---------- automation ---------- */
  fire(event, issue, res, extra = {}){
    for(const rule of this.rules){
      const note = (txt) => res.lines.push(L(['⚡ Automation ', 'auto'], [`"${rule.name}"`, 'info'], ': ' + txt));
      if(rule.name === 'subtasks-close-parent' && event === 'transition' && issue.type === 'Sub-task' && this.cat(issue) === 'done'){
        const p = this.issue(issue.parent);
        const subs = this.subtasks(p.key);
        if(p && this.cat(p) !== 'done' && subs.every(s => this.cat(s) === 'done')){
          const done = [...this.workflow.statuses].reverse().find(s => s.cat === 'done');
          if(this.allowed(p.status, done.name) || !this.workflow.transitions){
            note(`all ${subs.length} sub-tasks of ${p.key} are done → moving ${p.key} to ${done.name}`);
            this.transition(p, done.name, res, () => {}, () => {}, () => {}, 'automation', true);
          } else note(`would move ${p.key} to Done, but the workflow has no "${p.status}" → "${done.name}" transition`);
        }
      }
      if(rule.name === 'assign-bugs' && event === 'created' && issue.type === 'Bug'){
        issue.assignee = rule.user;
        issue.labels = [...new Set([...issue.labels, 'triage'])];
        issue.history.push({day: this.day, by: 'automation', field: 'Assignee', from: 'Unassigned', to: USERS[rule.user]});
        note(`${issue.key} assigned to ${USERS[rule.user]} + label "triage"`);
      }
      if(rule.name === 'urgent-flag' && event === 'created' && issue.priority === 'Highest'){
        issue.flagged = true;
        issue.comments.push({by: 'automation', text: '🚨 Highest priority: the on-call engineer has been notified.', day: this.day});
        note(`${issue.key} is Highest priority → flagged + comment added`);
      }
      if(rule.name === 'done-comment' && event === 'transition' && this.cat(issue) === 'done'){
        issue.comments.push({by: 'automation', text: `Resolved on day ${this.day}. Thanks!`, day: this.day});
        note(`commented on ${issue.key}`);
      }
    }
  }
  cmdRule(pos, res, say, fail, ok){
    const action = (pos[0] || 'list').toLowerCase();
    if(action === 'list'){
      if(!this.rules.length){ say('No automation rules yet. Templates:'); for(const [n, d] of Object.entries(RULES)) res.lines.push(L(['  ' + pad(n, 24), 'info'], d.replace('{user}', '<user>'))); return res; }
      for(const r of this.rules) res.lines.push(L(['⚡ ' + pad(r.name, 24), 'auto'], RULES[r.name].replace('{user}', r.user ? USERS[r.user] : '')));
      return res;
    }
    if(action === 'add'){
      const name = (pos[1] || '').toLowerCase();
      if(!RULES[name]) return fail(`Unknown rule template '${pos[1] || ''}'. Templates: ${Object.keys(RULES).join(', ')}`);
      if(this.rules.some(r => r.name === name)) return fail(`Rule ${name} is already enabled.`);
      const rule = {name};
      if(name === 'assign-bugs'){
        const u = this.user(pos[2]);
        if(!u) return fail('Who should get the bugs? e.g. rule add assign-bugs cleo');
        rule.user = u;
      }
      this.rules.push(rule);
      ok(`Automation rule enabled: ${RULES[name].replace('{user}', rule.user ? USERS[rule.user] : '')}`);
      return res;
    }
    if(action === 'remove'){
      const n = (pos[1] || '').toLowerCase();
      if(!this.rules.some(r => r.name === n)) return fail(`No enabled rule named ${n}`);
      this.rules = this.rules.filter(r => r.name !== n); ok(`Rule ${n} disabled`); return res;
    }
    return fail('usage: rule add <template> · rule remove <name> · rules');
  }

  /* ---------- sprints ---------- */
  cmdSprint(pos, kv, res, say, fail, ok, warn){
    if(!this.scrum) return fail('Kanban boards don\'t use sprints: work flows continuously. (This project was created as kanban.)');
    const action = (pos[0] || '').toLowerCase();
    if(action === 'create'){
      const name = pos[1] || `${this.project.key} Sprint ${this.sprints.length + 1}`;
      if(this.sprintByName(name)) return fail(`A sprint called "${name}" already exists.`);
      const s = {id: this.sprints.length + 1, name, goal: kv.goal || '', state: 'future', startDay: null, endDay: null, committed: 0, completed: 0, burn: {}, doneKeys: [], scopeAdded: 0};
      this.sprints.push(s);
      ok(`Created ${name}${s.goal ? ` · goal: "${s.goal}"` : ''}`);
      res.view = 'backlog';
      return res;
    }
    if(action === 'add' || action === 'remove'){
      const keys = pos.slice(1);
      if(!keys.length) return fail(`usage: sprint ${action} SHOP-3 SHOP-4 …`);
      let target = null;
      if(action === 'add'){
        target = kv.to ? this.sprintByName(kv.to) : (this.sprints.find(s => s.state === 'future') || this.activeSprint());
        if(!target || target.state === 'closed') return fail('No open sprint to add to. Create one: sprint create "Sprint 1"');
      }
      for(const k of keys){
        const i = this.issue(k);
        if(!i) return fail(`Issue ${k} does not exist.`);
        if(i.type === 'Epic') return fail(`${i.key} is an Epic. Epics are too big for a sprint; add its stories instead.`);
        if(i.type === 'Sub-task') return fail(`${i.key} is a sub-task; it follows its parent ${i.parent}.`);
        const before = i.sprint;
        i.sprint = target ? target.id : null;
        for(const st of this.subtasks(i.key)) st.sprint = i.sprint;
        this.log(i, 'Sprint', before ? this.sprints[before - 1].name : '', target ? target.name : '');
        if(target && target.state === 'active'){ target.scopeAdded += i.points || 0; }
      }
      if(target){
        ok(`Added ${keys.map(k => k.toUpperCase()).join(', ')} to ${target.name} (${this.sprintPoints(target)} points planned)`);
        if(target.state === 'active') say('  ⚠ Scope change: adding work to a running sprint makes the burndown go UP.', 'warn');
      } else ok(`Moved ${keys.map(k => k.toUpperCase()).join(', ')} back to the backlog`);
      res.view = 'backlog';
      return res;
    }
    if(action === 'start'){
      if(this.activeSprint()) return fail(`${this.activeSprint().name} is still active. Complete it first.`);
      const s = pos[1] ? this.sprintByName(pos[1]) : this.sprints.find(x => x.state === 'future');
      if(!s || s.state !== 'future') return fail('No sprint to start. Create one and add issues to it first.');
      const items = this.ranked().filter(i => i.sprint === s.id);
      if(!items.length) return fail(`${s.name} is empty. Add issues: sprint add SHOP-3 SHOP-4`);
      const days = parseInt(kv.days || '10', 10);
      s.state = 'active'; s.startDay = this.day; s.endDay = this.day + days;
      s.committed = this.sprintPoints(s);
      s.burn = {[this.day]: this.remaining(s)};
      ok(`Started ${s.name}: ${items.length} issues, ${s.committed} points committed, ends on day ${s.endDay} (${days} days).`);
      if(s.goal) say(`  Sprint goal: ${s.goal}`, 'dim');
      const unest = items.filter(i => i.points === null && i.type !== 'Sub-task');
      if(unest.length) say(`  ⚠ ${unest.map(i => i.key).join(', ')} have no estimate, so they add 0 points to the burndown.`, 'warn');
      res.view = 'board';
      return res;
    }
    if(action === 'complete'){
      const s = this.activeSprint();
      if(!s) return fail('There is no active sprint.');
      const items = this.ranked().filter(i => i.sprint === s.id && i.type !== 'Sub-task');
      const done = items.filter(i => this.cat(i) === 'done'), open = items.filter(i => this.cat(i) !== 'done');
      let dest = null;
      if(kv.to){
        dest = kv.to.toLowerCase() === 'next' ? this.sprints.find(x => x.state === 'future') : this.sprintByName(kv.to);
        if(!dest || dest.state !== 'future') return fail(`No future sprint '${kv.to}' to move unfinished work into.`);
      }
      s.state = 'closed'; s.completed = done.reduce((a, i) => a + (i.points || 0), 0); s.doneKeys = done.map(i => i.key); s.closedDay = this.day;
      s.burn[this.day] = this.remaining(s);
      for(const i of open){ i.sprint = dest ? dest.id : null; for(const st of this.subtasks(i.key)) st.sprint = i.sprint; this.log(i, 'Sprint', s.name, dest ? dest.name : 'Backlog'); }
      ok(`Completed ${s.name}: ${done.length} issues done (${s.completed} of ${s.committed + s.scopeAdded} points).`);
      if(open.length) say(`  ${open.length} unfinished issue${open.length > 1 ? 's' : ''} (${open.map(i => i.key).join(', ')}) moved to ${dest ? dest.name : 'the backlog'}.`, 'warn');
      say(`  Velocity recorded: ${s.completed} points. See the Velocity chart in Reports.`, 'dim');
      res.view = 'reports';
      return res;
    }
    return fail('usage: sprint create "Name" · sprint add KEY… · sprint remove KEY… · sprint start [days=10] · sprint complete [to=next]');
  }

  /* ---------- workflow ---------- */
  cmdWorkflow(pos, res, say, fail, ok){
    const wf = this.workflow;
    const a = (pos[0] || '').toLowerCase(), b = (pos[1] || '').toLowerCase();
    res.view = 'workflow';
    if(!a){
      res.lines.push(L(['Statuses: ', 'info'], wf.statuses.map(s => `${s.name} [${CATS[s.cat]}]`).join('  →  ')));
      if(!wf.transitions) say('Transitions: open: any status can move to any other status.', 'dim');
      else for(const t of wf.transitions) say(`  ${t.from === '*' ? '(any status)' : t.from} → ${t.to}`);
      return res;
    }
    if(a === 'status' && b === 'add'){
      const name = pos[2], cat = (pos[3] || 'inprogress').toLowerCase().replace(/[\s_-]/g, '');
      if(!name) return fail('usage: workflow status add "In Review" inprogress');
      if(!CATS[cat]) return fail('Category must be todo, inprogress or done');
      if(this.status(name)) return fail(`Status ${name} already exists.`);
      const order = ['todo', 'inprogress', 'done'];
      let at = wf.statuses.length;
      for(let k = wf.statuses.length - 1; k >= 0; k--) if(order.indexOf(wf.statuses[k].cat) <= order.indexOf(cat)){ at = k + 1; break; }
      if(order.indexOf(cat) < order.indexOf(wf.statuses[0].cat)) at = 0;
      wf.statuses.splice(at, 0, {name, cat});
      ok(`Added status "${name}" (${CATS[cat]} category). It's also a new column on the board.`);
      if(wf.transitions){
        const prev = wf.statuses[at - 1], next = wf.statuses[at + 1];
        say(`  Strict workflow: no transitions lead to "${name}" yet. Add some with: workflow transition add "${prev ? prev.name : '…'}" "${name}"`, 'warn');
      }
      return res;
    }
    if(a === 'mode'){
      if(b === 'open'){ wf.transitions = null; ok('Workflow is open again: any status → any status.'); return res; }
      if(b !== 'strict') return fail('usage: workflow mode strict|open');
      const s = wf.statuses, t = [];
      for(let k = 0; k < s.length - 1; k++) t.push({from: s[k].name, to: s[k + 1].name});
      for(let k = 1; k < s.length; k++) if(s[k].cat === 'inprogress') t.push({from: s[k].name, to: s[k - 1].name});
      wf.transitions = t;
      ok('Workflow is now strict: only the arrows in the diagram are allowed.');
      say('  Default arrows: each status → the next one; In-progress statuses can also step back one.', 'dim');
      return res;
    }
    if(a === 'transition'){
      const [, , from, to] = pos;
      if(!wf.transitions) return fail('The workflow is open (anything → anything). Run  workflow mode strict  first to define explicit transitions.');
      if(!from || !to) return fail('usage: workflow transition add|remove "From" "To"   (From can be "*" = any status)');
      if(from !== '*' && !this.status(from)) return fail(`Unknown status ${from}`);
      if(!this.status(to)) return fail(`Unknown status ${to}`);
      const F = from === '*' ? '*' : this.status(from).name, To = this.status(to).name;
      if(b === 'add'){
        if(wf.transitions.some(t => t.from === F && t.to === To)) return fail('That transition already exists.');
        wf.transitions.push({from: F, to: To});
        ok(`Added transition ${F === '*' ? '(any status)' : F} → ${To}`);
        return res;
      }
      if(b === 'remove'){
        const n = wf.transitions.length;
        wf.transitions = wf.transitions.filter(t => !(t.from === F && t.to === To));
        if(n === wf.transitions.length) return fail('No such transition.');
        ok(`Removed transition ${F} → ${To}`);
        return res;
      }
    }
    return fail('usage: workflow · workflow status add "Name" todo|inprogress|done · workflow mode strict|open · workflow transition add|remove "From" "To"');
  }

  /* ---------- versions ---------- */
  cmdVersion(pos, res, say, fail, ok){
    const a = (pos[0] || 'list').toLowerCase(), name = pos[1];
    res.view = 'reports';
    if(a === 'list'){
      if(!this.versions.length) say('No versions yet: version create 1.0');
      for(const v of this.versions){
        const items = [...this.issues.values()].filter(i => i.fixVersion === v.name);
        const done = items.filter(i => this.cat(i) === 'done').length;
        res.lines.push(L([pad(v.name, 8), 'info'], v.released ? [`released on day ${v.day}`, 'ok'] : `unreleased · ${done}/${items.length} issues done`));
      }
      return res;
    }
    if(a === 'create'){
      if(!name) return fail('usage: version create 1.0');
      if(this.versions.some(v => v.name === name)) return fail(`Version ${name} already exists.`);
      this.versions.push({name, released: false});
      ok(`Created version ${name}. Tag issues with: edit SHOP-3 fixVersion=${name}`);
      return res;
    }
    if(a === 'release'){
      const v = this.versions.find(x => x.name === name);
      if(!v) return fail(`No version ${name}`);
      if(v.released) return fail(`${name} is already released.`);
      const items = [...this.issues.values()].filter(i => i.fixVersion === name);
      const open = items.filter(i => this.cat(i) !== 'done');
      if(open.length) return fail(`Can't release ${name}: ${open.length} issue${open.length > 1 ? 's are' : ' is'} still unresolved: ${open.map(i => i.key).join(', ')}.\n  Finish them, or move them to the next version (edit ${open[0].key} fixVersion=…).`);
      v.released = true; v.day = this.day;
      ok(`🚀 Released version ${name} on day ${this.day}`);
      say(`\nRelease notes · ${this.project.name} ${name}`, 'bold');
      for(const t of ['Story', 'Task', 'Bug']){
        const g = items.filter(i => i.type === t);
        if(!g.length) continue;
        say(`  ${t === 'Bug' ? 'Bug fixes' : t + 's'}`, 'info');
        for(const i of g) say(`    • ${i.key} ${i.summary}`);
      }
      return res;
    }
    return fail('usage: version create 1.0 · version release 1.0 · versions');
  }

  /* ---------- filters ---------- */
  cmdFilter(src, pos, res, say, fail, ok){
    const m = src.match(/^filter\s+save\s+("([^"]+)"|'([^']+)'|(\S+))\s+(.+)$/i);
    if(m){
      const name = m[2] || m[3] || m[4], q = m[5];
      try { parseJql(q); } catch(e){ return fail(e.message); }
      this.filters = this.filters.filter(f => f.name !== name);
      this.filters.push({name, q});
      ok(`Saved filter "${name}": ${q}`);
      say('  Teams put saved filters on dashboards and boards. Run it any time with: filter run "' + name + '"', 'dim');
      return res;
    }
    const a = (pos[0] || 'list').toLowerCase();
    if(a === 'list'){
      if(!this.filters.length) say('No saved filters yet.');
      for(const f of this.filters) res.lines.push(L([pad(f.name, 20), 'info'], f.q));
      return res;
    }
    if(a === 'run'){
      const f = this.filters.find(x => x.name.toLowerCase() === (pos[1] || '').toLowerCase());
      if(!f) return fail(`No saved filter "${pos[1] || ''}"`);
      say(`Running filter "${f.name}"`, 'dim');
      return this.cmdJql(f.q, res, say, fail);
    }
    return fail('usage: filter save "Name" <jql> · filter run "Name" · filters');
  }

  /* ---------- git / smart commits ---------- */
  cmdGit(args, res, say, fail, ok, warn){
    const sub = args[0];
    const keys = s => [...new Set((String(s).toUpperCase().match(new RegExp(`\\b${this.project.key}-\\d+\\b`, 'g')) || []))];
    if(sub === 'branch'){
      const name = args[1];
      if(!name) return fail('usage: git branch SHOP-3-short-description');
      const ks = keys(name).filter(k => this.issue(k));
      say(`Switched to a new branch '${name}'`, 'dim');
      if(!ks.length){ warn(`No issue key in the branch name, so Jira can't link it. Put the key in the name: ${this.project.key}-3-${name}`); return res; }
      for(const k of ks){ const i = this.issue(k); i.dev.branches.push(name); this.log(i, 'Development', '', `branch ${name}`); this.selected = k; }
      ok(`Jira linked branch "${name}" to ${ks.join(', ')} (see the Development panel)`);
      res.view = 'issue';
      return res;
    }
    if(sub === 'commit'){
      const mi = args.indexOf('-m');
      const msg = mi >= 0 ? args[mi + 1] : null;
      if(!msg) return fail('usage: git commit -m "SHOP-3 #comment text #in-progress"');
      const hash = Math.abs([...msg].reduce((h, c) => (h * 31 + c.charCodeAt(0)) | 0, this.day * 7919)).toString(16).padStart(7, '0').slice(0, 7);
      say(`[main ${hash}] ${msg}`, 'dim');
      const ks = keys(msg).filter(k => this.issue(k));
      if(!ks.length){ warn('No issue key in the message, so Jira doesn\'t know which issue this commit belongs to.'); return res; }
      for(const k of ks){
        const i = this.issue(k);
        i.dev.commits.push({hash, msg, day: this.day});
        this.log(i, 'Development', '', `commit ${hash}`);
        this.selected = k;
        res.lines.push(L(['🔗 ', ''], [k, 'info'], ` commit ${hash} linked`));
        // smart commit commands: #comment text, #<transition>
        const cmds = [...msg.matchAll(/#([A-Za-z][\w-]*)\s*([^#]*)/g)];
        for(const [, word, rest] of cmds){
          if(word.toLowerCase() === 'comment'){
            i.comments.push({by: this.me, text: rest.trim(), day: this.day});
            res.lines.push(L(['   #comment ', 'auto'], `added "${rest.trim()}" to ${k}`));
            continue;
          }
          if(word.toLowerCase() === 'time'){ res.lines.push(L(['   #time ', 'auto'], `logged ${rest.trim().split(/\s+/)[0]} of work on ${k}`)); continue; }
          const target = this.workflow.statuses.find(s => s.name.toLowerCase().replace(/\s+/g, '-') === word.toLowerCase());
          if(!target){ res.lines.push(L(['   #' + word, 'warn'], ` is not a status in this workflow, ignored`)); continue; }
          res.lines.push(L(['   #' + word, 'auto'], ` → moving ${k} to ${target.name}`));
          this.transition(i, target.name, res, say, () => {}, warn);
        }
      }
      res.view = 'issue';
      return res;
    }
    return fail('This console only simulates the Jira side of Git: git branch <name> · git commit -m "<message>"  (see the Git Lab for real Git!)');
  }

  /* ---------- JQL ---------- */
  cmdJql(q, res, say, fail){
    res.view = 'search';
    let r;
    try { r = this.query(q); }
    catch(e){
      if(!(e instanceof JqlError)) throw e;
      this.lastSearch = {query: q, keys: [], error: e.message};
      return fail(e.message);
    }
    this.lastSearch = {query: q, keys: r.map(i => i.key), error: null};
    say(`${r.length} issue${r.length === 1 ? '' : 's'} match${r.length === 1 ? 'es' : ''}`, 'info');
    for(const i of r.slice(0, 12)) res.lines.push(L([pad(i.key, 9), 'hash'], pad(i.type, 9), pad(i.status, 13), pad(i.assignee ? USERS[i.assignee].split(' ')[0] : '—', 8), i.summary));
    if(r.length > 12) say(`… and ${r.length - 12} more (see the Search view)`, 'dim');
    return res;
  }

  fieldDef(name){
    const n = String(name).toLowerCase().replace(/[\s_]+/g, ' ').trim();
    const map = {
      'project': 'project', 'type': 'type', 'issuetype': 'type', 'status': 'status', 'statuscategory': 'statuscategory',
      'assignee': 'assignee', 'reporter': 'reporter', 'priority': 'priority', 'labels': 'labels', 'label': 'labels',
      'sprint': 'sprint', 'story points': 'points', 'storypoints': 'points', 'points': 'points', 'story point estimate': 'points',
      'parent': 'parent', 'epic link': 'parent', 'epic': 'parent', 'summary': 'summary', 'description': 'description', 'text': 'text',
      'comment': 'comment', 'created': 'created', 'createddate': 'created', 'updated': 'updated', 'updateddate': 'updated', 'resolved': 'resolved', 'resolutiondate': 'resolved',
      'resolution': 'resolution', 'fixversion': 'fixversion', 'fix version': 'fixversion', 'key': 'key', 'issue': 'key', 'issuekey': 'key', 'id': 'key', 'flagged': 'flagged', 'rank': 'rank',
    };
    if(!map[n]) throw new JqlError(`Field '${name}' does not exist or you do not have permission to view it.`);
    return map[n];
  }
  getVals(i, f){
    switch(f){
      case 'project': return [this.project.key, this.project.name];
      case 'type': return [i.type];
      case 'status': return [i.status];
      case 'statuscategory': return [CATS[this.cat(i)]];
      case 'assignee': return i.assignee ? [i.assignee] : [];
      case 'reporter': return i.reporter ? [i.reporter] : [];
      case 'priority': return [i.priority];
      case 'labels': return i.labels;
      case 'sprint': return i.sprint ? [this.sprints[i.sprint - 1].name] : [];
      case 'points': return i.points !== null ? [i.points] : [];
      case 'parent': return [i.parent, i.epic].filter(Boolean);
      case 'summary': return [i.summary];
      case 'description': return i.description ? [i.description] : [];
      case 'comment': return i.comments.map(c => c.text);
      case 'text': return [i.summary, i.description, ...i.comments.map(c => c.text)].filter(Boolean);
      case 'created': return [i.created];
      case 'updated': return [i.updated];
      case 'resolved': return i.resolved !== null ? [i.resolved] : [];
      case 'resolution': return this.cat(i) === 'done' ? ['Done'] : [];
      case 'fixversion': return i.fixVersion ? [i.fixVersion] : [];
      case 'key': return [i.key];
      case 'flagged': return i.flagged ? ['Impediment'] : [];
      case 'rank': return [this.rank.indexOf(i.key)];
    }
    return [];
  }
  /* turn a parsed JQL value into a comparable value (or a set for functions) */
  normValue(f, val, fieldName){
    if(val.empty) return {empty: true};
    if(val.fn){
      const fn = val.fn;
      if(fn === 'currentuser') return {v: 'you'};
      if(fn === 'opensprints') return {set: this.sprints.filter(s => s.state === 'active').map(s => s.name.toLowerCase())};
      if(fn === 'closedsprints') return {set: this.sprints.filter(s => s.state === 'closed').map(s => s.name.toLowerCase())};
      if(fn === 'futuresprints') return {set: this.sprints.filter(s => s.state === 'future').map(s => s.name.toLowerCase())};
      if(['now', 'startofday', 'endofday'].includes(fn)) return {v: this.day};
      if(fn === 'startofweek') return {v: this.day - ((this.day - 1) % 7)};
      if(fn === 'releasedversions') return {set: this.versions.filter(v => v.released).map(v => v.name.toLowerCase())};
      if(fn === 'unreleasedversions') return {set: this.versions.filter(v => !v.released).map(v => v.name.toLowerCase())};
      throw new JqlError(`Unable to find JQL function '${val.fn}()'.`);
    }
    const s = val.v;
    const bad = () => { throw new JqlError(`The value '${s}' does not exist for the field '${fieldName}'.`); };
    switch(f){
      case 'assignee': case 'reporter': { const u = this.user(s); if(u === undefined || u === null) bad(); return {v: u}; }
      case 'status': { const st = this.status(s); if(!st) bad(); return {v: st.name.toLowerCase()}; }
      case 'statuscategory': { const c = Object.values(CATS).find(c => c.toLowerCase() === s.toLowerCase()); if(!c) bad(); return {v: c.toLowerCase()}; }
      case 'type': { const t = TYPES[s.toLowerCase().replace(/\s/g, '')] || Object.values(TYPES).find(t => t.toLowerCase() === s.toLowerCase()); if(!t) bad(); return {v: t.toLowerCase()}; }
      case 'priority': { const p = PRIORITIES.find(p => p.toLowerCase() === s.toLowerCase()); if(!p) bad(); return {v: p.toLowerCase()}; }
      case 'project': if(![this.project.key.toLowerCase(), this.project.name.toLowerCase()].includes(s.toLowerCase())) bad(); return {v: s.toLowerCase()};
      case 'sprint': { if(/^\d+$/.test(s) && this.sprints[+s - 1]) return {v: this.sprints[+s - 1].name.toLowerCase()}; if(!this.sprintByName(s)) bad(); return {v: s.toLowerCase()}; }
      case 'points': case 'rank': { const n = Number(s); if(!Number.isFinite(n)) bad(); return {v: n}; }
      case 'created': case 'updated': case 'resolved': {
        const m = s.match(/^([+-]?\d+)([dw])$/i);
        if(m) return {v: this.day + (+m[1]) * (m[2].toLowerCase() === 'w' ? 7 : 1)};
        if(/^\d+$/.test(s)) return {v: +s};
        throw new JqlError(`Date value '${s}' for field '${fieldName}' is invalid. In this simulator use a day number (3) or a relative date like -2d.`);
      }
      case 'resolution': if(s.toLowerCase() === 'unresolved') return {unresolved: true}; if(!['done', 'fixed'].includes(s.toLowerCase())) bad(); return {v: 'done'};
      case 'key': case 'parent': { if(!this.issue(s)) throw new JqlError(`An issue with key '${s.toUpperCase()}' does not exist for field '${fieldName}'.`); return {v: s.toLowerCase()}; }
      case 'fixversion': if(!this.versions.some(v => v.name.toLowerCase() === s.toLowerCase())) bad(); return {v: s.toLowerCase()};
      default: return {v: s.toLowerCase()};
    }
  }
  query(q){
    const ast = parseJql(q);
    const PR = p => PRIORITIES.length - PRIORITIES.indexOf(p);
    const keyNum = k => +String(k).split('-')[1];
    const evalNode = (n, i) => {
      if(n.and) return evalNode(n.and[0], i) && evalNode(n.and[1], i);
      if(n.or) return evalNode(n.or[0], i) || evalNode(n.or[1], i);
      if(n.not) return !evalNode(n.not, i);
      const f = this.fieldDef(n.field);
      const vals = this.getVals(i, f);
      const low = vals.map(v => typeof v === 'string' ? v.toLowerCase() : v);
      const textField = ['summary', 'description', 'text', 'comment'].includes(f);
      if(n.op === 'is') return vals.length === 0;
      if(n.op === 'is not') return vals.length > 0;
      const one = (val) => this.normValue(f, val, n.field);
      const eq = (nv) => {
        if(nv.empty) return vals.length === 0;
        if(nv.unresolved) return vals.length === 0;
        if(nv.set) return low.some(v => nv.set.includes(v));
        return low.some(v => v === nv.v || (f === 'project' && false));
      };
      switch(n.op){
        case '=':
          if(textField) throw new JqlError(`The operator '=' is not supported by the '${n.field}' field. Use '~' (contains) for text.`);
          return eq(one(n.value));
        case '!=': {
          if(textField) throw new JqlError(`The operator '!=' is not supported by the '${n.field}' field. Use '!~'.`);
          const nv = one(n.value);
          if(nv.empty || nv.unresolved) return vals.length > 0;
          return vals.length > 0 && !eq(nv);
        }
        case 'in': case 'not in': {
          const list = n.list ? n.list.map(one) : [one(n.value)];
          const hit = list.some(eq);
          return n.op === 'in' ? hit : (vals.length > 0 && !hit);
        }
        case '~': case '!~': {
          if(!textField) throw new JqlError(`The operator '${n.op}' is not supported by the '${n.field}' field. Use it on summary, description, text or comment.`);
          const term = String(n.value.v || '').toLowerCase().replace(/\*/g, '');
          const hit = low.some(v => v.includes(term));
          return n.op === '~' ? hit : !hit;
        }
        case '>': case '>=': case '<': case '<=': {
          if(!['points', 'created', 'updated', 'resolved', 'priority', 'key', 'rank'].includes(f)) throw new JqlError(`The operator '${n.op}' is not supported by the '${n.field}' field.`);
          const nv = one(n.value);
          const conv = v => f === 'priority' ? PR(PRIORITIES.find(p => p.toLowerCase() === v)) : f === 'key' ? keyNum(v) : v;
          const rhs = conv(nv.v);
          return low.some(v => { const x = conv(v); return n.op === '>' ? x > rhs : n.op === '>=' ? x >= rhs : n.op === '<' ? x < rhs : x <= rhs; });
        }
      }
      return false;
    };
    let rows = this.ranked().filter(i => !ast.where || evalNode(ast.where, i));
    if(ast.order.length){
      const keyFn = (i, f) => {
        const d = this.fieldDef(f);
        if(d === 'priority') return PR(i.priority);
        if(d === 'key') return keyNum(i.key);
        if(d === 'status') return this.workflow.statuses.findIndex(s => s.name === i.status);
        const v = this.getVals(i, d)[0];
        return v === undefined ? null : typeof v === 'string' ? v.toLowerCase() : v;
      };
      for(const o of ast.order) this.fieldDef(o.field);
      rows = rows.slice().sort((a, b) => {
        for(const o of ast.order){
          const x = keyFn(a, o.field), y = keyFn(b, o.field);
          if(x === y) continue;
          if(x === null) return 1;
          if(y === null) return -1;
          const c = x < y ? -1 : 1;
          return o.dir === 'desc' ? -c : c;
        }
        return 0;
      });
    }
    return rows;
  }
}

<div class="analogy"><span class="ico">🚦</span><div><b>The daily stand-up</b> is usually done in front of the board: "What did I finish? What am I doing next? What is blocking me?" The board answers all three at a glance.</div></div>
<div class="tip">Try it yourself: <b>drag a card</b> to another column, or open it and change its status.</div>`,

    {cmd: 'move TEAM-5 "In Progress"', note: 'Start it…'},
    {cmd: 'assign TEAM-5 me', note: '…and take ownership so nobody else starts it too.'},

  id: 'good-issues', level: 'Beginner', view: 'issue',
  title: 'Writing good issues',
  sub: 'User stories, acceptance criteria and bug reports',
  html: `
<p class="lead">An issue is a message to your future team. A good one can be picked up by anyone without a meeting.</p>
<h4>User story format</h4>
<pre class="code">As a &lt;type of user&gt;,
I want &lt;some goal&gt;,
so that &lt;some reason&gt;.</pre>
<h4>Acceptance criteria</h4>
<p>A checklist that defines when the story is <b>done</b>. If you can't test it, it isn't a criterion.</p>
<h4>A good bug report</h4>
<ul>
  <li><b>Steps to reproduce</b>: 1, 2, 3…</li>
  <li><b>Expected</b> vs <b>actual</b> result</li>
  <li><b>Environment</b>: device, browser, version</li>
  <li>a screenshot or log, if possible</li>
</ul>
<div class="warn">Bad: "Wishlist broken!!" Good: "Wishlist heart icon missing on mobile Safari (steps inside)".</div>
<div class="tip"><b>INVEST</b> checklist for stories: Independent, Negotiable, Valuable, Estimable, Small, Testable.</div>`,

  steps: [
    {cmd: 'create story "Save items to a wishlist"', note: 'Start with a short, clear summary.'},

    {cmd: 'edit SHOP-1 description+="\\n\\nAcceptance criteria:\\n- A heart icon on every product\\n- A Wishlist page lists saved items\\n- Saved items survive logging out"', note: 'Append <b>acceptance criteria</b>: a testable definition of done.'},

{
  id: 'backlog', level: 'Intermediate', view: 'backlog',
  title: 'The backlog & story points',
  sub: 'Prioritising and estimating work',
  html: `
<p class="lead">The <b>backlog</b> is the ordered list of everything the team <i>might</i> do. The <b>Product Owner</b> keeps it ranked: most valuable at the top.</p>
<h4>Story points</h4>
<p>Teams estimate <b>effort</b> (complexity + uncertainty + amount of work) in relative <b>story points</b>, not hours. They usually use a Fibonacci-like scale:</p>
<div class="flow"><span>1</span><span>2</span><span>3</span><span>5</span><span>8</span><span>13</span><span>21 = too big, split it!</span></div>
<div class="analogy"><span class="ico">🐶</span><div><b>Why relative?</b> People are bad at guessing hours but good at comparing: "This is about twice as big as that one." A 2-point story is roughly twice a 1-pointer, and nobody argues about whether it's 3h or 5h.</div></div>
<p>Teams often estimate together with <b>Planning Poker</b>: everyone reveals a number at once, then the highest and lowest explain their reasoning.</p>
<div class="tip"><b>Backlog refinement</b> (grooming) is a regular meeting to clarify, split, estimate and re-rank the top of the backlog, so the next sprint planning goes fast.</div>`,

  steps: [
    {cmd: 'backlog', note: 'The backlog: stories in rank order, none estimated yet (the points column is empty).'},
    {cmd: 'edit SHOP-3 points=3', note: 'Estimate "Sign up with email": a medium story, <b>3 points</b>.'},
    {cmd: 'edit SHOP-4 points=2', note: '"Log in" is a bit smaller: 2.'},
    {cmd: 'edit SHOP-6 points=5', note: '"Shopping cart" has more unknowns: 5.'},

{
  id: 'sprints', level: 'Intermediate', view: 'backlog',
  title: 'Planning & starting a sprint',
  sub: 'Scrum in Jira',
  html: `
<p class="lead">A <b>sprint</b> is a fixed time-box (often <b>2 weeks</b>) in which the team commits to finishing a set of backlog items.</p>
<h4>The Scrum cycle</h4>
<div class="flow"><span>Sprint planning</span><i>→</i><span>Daily stand-ups</span><i>→</i><span>Sprint review (demo)</span><i>→</i><span>Retrospective</span><i>↺</i></div>
<h4>Sprint planning</h4>
<ol>
  <li>Agree on a <b>sprint goal</b>: one sentence about <i>why</i> this sprint matters.</li>
  <li>Pull items from the top of the backlog until you reach the team's <b>capacity</b> (look at past velocity).</li>
  <li>Start the sprint. The board now shows <b>only this sprint's</b> work.</li>
</ol>
<div class="warn">Don't over-commit. A sprint that always "fails" demotivates the team and makes forecasts useless.</div>`,

<p class="lead">The <b>burndown chart</b> plots the story points <b>remaining</b> in the sprint, day by day.</p>

{
  id: 'kanban-flow', level: 'Intermediate', view: 'board',
  title: 'Kanban: WIP limits & flow',
  sub: 'Stop starting, start finishing',
  html: `
<p class="lead">Kanban has no sprints. Work <b>flows</b> continuously. The key tool is the <b>WIP limit</b> (work in progress): a maximum number of cards allowed in a column.</p>
<div class="analogy"><span class="ico">🚗</span><div><b>Analogy — a highway.</b> Add more cars than the road fits and <i>everyone</i> slows down. Limiting WIP keeps work moving; finishing one thing beats half-doing five.</div></div>
<h4>Flow metrics</h4>
<table class="tbl">
  <tr><td><b>Cycle time</b></td><td>from <i>started</i> (In Progress) to <i>Done</i>: how long work takes once begun</td></tr>
  <tr><td><b>Lead time</b></td><td>from <i>created</i> to <i>Done</i>: how long the requester waits</td></tr>
  <tr><td><b>Throughput</b></td><td>items finished per period</td></tr>
</table>
<div class="tip">When a column hits its limit, help finish something (review, test, pair) instead of starting new work. That's the whole trick.</div>`,
  setup: TEAM('"Reset Ada\'s password" assignee=ada', '"Install printer driver" assignee=ben', '"New starter laptop setup" assignee=cleo', '"Update antivirus" assignee=dan', '"Fix meeting-room screen"'),
  steps: [
    {cmd: 'wip "In Progress" 2', note: 'Set a <b>WIP limit of 2</b> on In Progress. The column header shows 0/2.'},
    {cmd: 'move TEAM-1 "In Progress"', note: 'Start one…'},
    {cmd: 'move TEAM-2 "In Progress"', note: '…and a second: the column is at its limit (2/2).'},
    {cmd: 'move TEAM-3 "In Progress"', note: 'A third start <b>breaks</b> the limit and the column turns red. Jira allows it but warns.'},
    {cmd: 'move TEAM-3 "To Do"', note: 'Respect the limit: put it back.'},
    {cmd: 'next day 2 && move TEAM-1 Done', note: 'Two days later TEAM-1 is finished, which frees a slot…'},
    {cmd: 'move TEAM-3 "In Progress"', note: '…so TEAM-3 can now be <b>pulled</b> in.'},
    {cmd: 'next day && move TEAM-2 Done && next day 2 && move TEAM-3 Done', note: 'Work keeps flowing.'},
    {cmd: 'reports', note: 'Kanban reports: <b>cycle time</b> and <b>lead time</b> per finished issue, plus throughput.'},
  ],
  quiz: {q: 'Your "In Progress" column is at its WIP limit. What do you do?', options: ['Start a new card anyway', 'Help finish an in-progress card', 'Raise the limit'], answer: 1, why: 'The limit exists to make the team finish before starting. Raising it every time defeats the purpose.'}

{
  id: 'jql-basics', level: 'Advanced', view: 'search',
  title: 'JQL basics',
  sub: 'Searching with Jira Query Language',
  html: `
<p class="lead"><b>JQL</b> (Jira Query Language) finds issues with precise questions. Boards, dashboards, reports and filters are all built on it.</p>
<pre class="code">field  operator  value      [AND|OR  field operator value …]
status    =     "In Progress"   AND   assignee = ada</pre>
<table class="tbl">
  <tr><th>Operator</th><th>Example</th></tr>
  <tr><td><code>=</code> <code>!=</code></td><td><code>type = Bug</code></td></tr>
  <tr><td><code>IN (…)</code> <code>NOT IN (…)</code></td><td><code>priority IN (High, Highest)</code></td></tr>
  <tr><td><code>~</code> (contains)</td><td><code>summary ~ "cart"</code></td></tr>
  <tr><td><code>&gt; &gt;= &lt; &lt;=</code></td><td><code>"Story Points" &gt;= 5</code></td></tr>
  <tr><td><code>IS EMPTY</code></td><td><code>assignee IS EMPTY</code></td></tr>
</table>
<div class="tip">Values with spaces need quotes: <code>status = "In Progress"</code>. Field and keyword names are case-insensitive.</div>
<p>Type your own queries in the <b>JQL</b> box of the <b>List</b> tab on the right.</p>`,
  setup: [...SEED(), 'move SHOP-3 "In Progress"', 'move SHOP-4 Done', 'move SHOP-6 "In Progress"', 'move SHOP-8 "In Progress"', 'create bug "Typo on the About page" priority=Low'],
  steps: [
    {cmd: 'jql project = SHOP', note: 'Everything in the project.'},
    {cmd: 'jql type = Bug', note: 'Only bugs.'},
    {cmd: 'jql status = "In Progress"', note: 'What\'s being worked on right now? Quotes are needed because of the space.'},
    {cmd: 'jql assignee = ada AND status != Done', note: '<b>AND</b>: both conditions must match.'},
    {cmd: 'jql type = Bug OR priority = High', note: '<b>OR</b>: either one matches.'},
    {cmd: 'jql priority IN (High, Highest) ORDER BY key DESC', note: '<b>IN</b> is a short form of several ORs. <b>ORDER BY</b> sorts the results.'},
    {cmd: 'jql summary ~ "cart"', note: '<b>~</b> means "contains": text search.'},
    {cmd: 'jql status = Doing', note: 'A wrong value gives a clear error, because JQL validates against real statuses.', expectError: true},
  ],
  quiz: {q: 'Which query finds unassigned bugs?', options: ['type = Bug AND assignee = ""', 'type = Bug AND assignee IS EMPTY', 'type = Bug OR assignee IS EMPTY'], answer: 1, why: 'Use IS EMPTY for missing values, and AND because both must be true.'}

{
  id: 'jql-advanced', level: 'Advanced', view: 'search',
  title: 'Advanced JQL & saved filters',
  sub: 'Functions, dates, the != trap, and filters',
  html: `
<p class="lead">JQL gets powerful with <b>functions</b> and <b>relative dates</b>, and then you save the query as a <b>filter</b>.</p>
<table class="tbl">
  <tr><td><code>currentUser()</code></td><td>whoever is running the query, so one filter works for everyone</td></tr>
  <tr><td><code>openSprints()</code> / <code>closedSprints()</code></td><td>the active / finished sprints</td></tr>
  <tr><td><code>created &gt;= -7d</code></td><td>created in the last 7 days (in this simulator, days are sprint days)</td></tr>
  <tr><td><code>resolution = Unresolved</code></td><td>not finished, whatever the status is called</td></tr>
  <tr><td><code>parent = SHOP-1</code></td><td>children of an issue or epic</td></tr>
</table>
<div class="warn"><b>The != trap:</b> <code>assignee != ada</code> does <b>not</b> return unassigned issues, because empty fields never match <code>!=</code>. Write <code>(assignee != ada OR assignee IS EMPTY)</code>.</div>
<div class="tip">Classic saved filters: "My open work", "Bugs created this week", "Blocked in current sprint". Put them on dashboards.</div>`,
  setup: [...SEED(), 'sprint create "Sprint 1"', 'sprint add SHOP-3 SHOP-4 SHOP-8', 'sprint start', 'move SHOP-4 Done', 'next day 3', 'create bug "Coupon code ignored" priority=Highest', 'create bug "Slow product search" assignee=ada', 'create story "Gift cards" points=8'],
